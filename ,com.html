lbi_p1:{judul:'Bank Sampah di SMA Tunas Bangsa', isi:`<p>Sejak awal tahun ajaran, SMA Tunas Bangsa membuka bank sampah di pojok halaman sekolah. Setiap Jumat, siswa membawa botol plastik, kardus, dan kertas bekas dari rumah. Sampah itu ditimbang, lalu nilainya dicatat di buku tabungan masing-masing siswa. Uangnya baru bisa diambil setiap akhir semester.</p><p>Dalam satu semester, bank sampah ini mengumpulkan 1,2 ton sampah daur ulang. Kepala sekolah mengatakan bahwa tujuan utamanya bukan uang, melainkan kebiasaan memilah sampah. Menurutnya, siswa yang terbiasa memilah sampah di sekolah akan membawa kebiasaan itu ke rumah. Beberapa orang tua memang mengaku anaknya kini menegur mereka kalau membuang botol ke tempat sampah biasa.</p>`},
lbi_p2:{judul:'Minum Air dan Konsentrasi Belajar', isi:`<p>Banyak pelajar mengira rasa lelah dan sulit fokus di siang hari disebabkan oleh kurang tidur. Padahal, penyebabnya sering lebih sederhana: tubuh kekurangan air. Sekitar 60% tubuh manusia terdiri atas air, dan otak termasuk organ yang paling cepat terpengaruh ketika cairan tubuh berkurang.</p><p>Sebuah penelitian kecil di sebuah SMP meminta satu kelompok siswa minum segelas air sebelum tes, sementara kelompok lain tidak. Hasilnya, kelompok yang minum air menyelesaikan tes sekitar 10% lebih cepat dengan jumlah kesalahan yang lebih sedikit. Para guru pun kini membolehkan siswa membawa botol minum ke dalam kelas. Mereka menyarankan siswa minum sedikit-sedikit tetapi sering, bukan sekaligus banyak saat sudah merasa sangat haus.</p>`},
lbi_p3:{judul:'Pasar Tradisional di Tengah Kota', isi:`<p>Pasar Kranggan sudah berdiri sejak 1950-an. Dulu, pasar ini menjadi tempat belanja utama warga. Namun, sejak beberapa pusat perbelanjaan modern dibangun di sekitarnya, pengunjung pasar menurun hampir separuh dalam sepuluh tahun terakhir. Banyak pedagang mengeluh dagangannya sering tidak habis.</p><p>Pemerintah kota kemudian merenovasi pasar: lantai diganti keramik, atap diperbaiki, dan dibuat area parkir yang lebih luas. Selain itu, para pedagang dilatih menerima pembayaran lewat kode QR. Setahun setelah renovasi, jumlah pengunjung naik 30%, terutama anak muda yang datang mencari jajanan tradisional. Meski begitu, sebagian pedagang lansia masih kesulitan menggunakan pembayaran digital dan tetap mengandalkan uang tunai.</p>`},
lbi_p4:{judul:'Kebiasaan Membaca Remaja', isi:`<p>Survei terhadap 2.000 remaja di delapan kota menunjukkan bahwa rata-rata remaja Indonesia membaca buku hanya sekitar 15 menit per hari, sedangkan waktu menonton video pendek mencapai 2,5 jam per hari. Sebanyak 40% responden mengaku tidak menamatkan satu buku pun dalam setahun terakhir.</p><p>Menariknya, bukan berarti remaja tidak suka membaca. Ketika ditanya alasan jarang membaca, jawaban terbanyak adalah "tidak punya buku yang menarik" (35%) dan "tidak ada waktu" (28%). Hanya 12% yang menjawab "tidak suka membaca". Karena itu, sejumlah perpustakaan daerah mulai menyediakan komik, novel remaja, dan buku digital yang bisa dipinjam lewat ponsel. Di salah satu kota, jumlah peminjam remaja naik dua kali lipat setelah layanan itu dibuka.</p>`},
lbi_p5:{judul:'Olahraga Pagi Sebelum Sekolah', isi:`<p>SMA Negeri 3 mewajibkan siswa berolahraga ringan 15 menit setiap pagi sebelum pelajaran dimulai. Kegiatannya sederhana: peregangan, lari kecil mengelilingi lapangan, dan senam bersama. Awalnya banyak siswa mengeluh karena harus datang lebih pagi.</p><p>Setelah tiga bulan, pihak sekolah mencatat perubahan. Jumlah siswa yang tertidur di kelas pada jam pertama turun drastis, dan angka keterlambatan justru berkurang karena siswa harus datang sebelum senam dimulai. Guru olahraga menjelaskan bahwa gerakan ringan di pagi hari melancarkan aliran darah ke otak sehingga siswa lebih siap belajar. Ia menambahkan bahwa olahraga pagi tidak perlu berat; yang penting dilakukan rutin.</p>`},
lbe_p1:{judul:'Bicycles in the City', isi:`<p>More and more people in big cities are choosing bicycles instead of cars for short trips. Bicycles are cheap, they do not need fuel, and they do not get stuck in traffic jams. Many city governments now build special bicycle lanes to keep riders safe.</p><p>However, cycling in the city is not always easy. On hot days, riders arrive at work sweaty, and heavy rain can make the roads slippery. Some people also worry about where to park their bicycles safely. To solve this, several offices have started to provide showers and locked bicycle parking for their workers.</p>`},
lbe_p2:{judul:'The Reading Buddy Program', isi:`<p>At Harapan Elementary School, every student in grade six is paired with a student in grade one. Once a week, the older students read a storybook to their younger "buddies" in the school library. The program is called Reading Buddy, and it has been running for two years.</p><p>Teachers say the program helps both groups. The younger children learn new words and begin to enjoy books, while the older students become more confident and patient. One sixth grader said that reading aloud to her buddy helped her understand the story better than reading alone. The school now plans to invite parents to join the program on Saturdays.</p>`},
lbe_p3:{judul:'Why Teenagers Need More Sleep', isi:`<p>Teenagers need about eight to ten hours of sleep every night, but most of them get much less. One reason is biology: during the teenage years, the body's internal clock shifts, so teenagers naturally feel sleepy later at night and want to wake up later in the morning.</p><p>Early school start times make the problem worse. A study in the United States found that when a high school moved its start time from 7:30 to 8:30, students slept about one hour longer, and their grades and attendance improved. Doctors also advise teenagers to avoid screens before bed, because the light from phones can trick the brain into thinking it is still daytime.</p>`}

{s:'pu',lv:1,t:'Deduktif · Jebakan kategori',q:'Semua ikan hidup di air. Lumba-lumba bukan ikan.<br>Simpulan yang tepat adalah …',o:['Lumba-lumba tidak hidup di air.','Lumba-lumba hidup di air.','Tidak dapat disimpulkan apakah lumba-lumba hidup di air.','Lumba-lumba adalah ikan.','Semua hewan yang hidup di air adalah ikan.'],a:2,b:'Premisnya hanya bicara tentang ikan. Lumba-lumba bukan ikan, jadi aturan "hidup di air" tidak otomatis berlaku, tetapi juga tidak otomatis <i>tidak</i> berlaku. Jawabannya: <b>tidak dapat disimpulkan</b>. (Kenyataannya lumba-lumba hidup di air, tetapi itu bukan dari premis.)'},

{s:'pu',lv:1,t:'Deduktif · Modus tollens',q:'Jika hari Minggu, toko itu tutup. Hari ini toko itu buka.<br>Simpulan yang tepat adalah …',o:['Hari ini hari Minggu.','Hari ini bukan hari Minggu.','Toko itu tutup besok.','Hari ini hari Senin.','Toko itu selalu buka.'],a:1,b:'Toko buka berarti "tutup" tidak terjadi, maka "hari Minggu" juga tidak terjadi: <b>hari ini bukan hari Minggu</b>. Kita tidak tahu persis hari apa (bisa Senin, bisa Sabtu).'},
{s:'pu',lv:1,t:'Deduktif · Negasi',q:'Pernyataan "Semua siswa membawa bekal" bernilai SALAH jika …',o:['semua siswa tidak membawa bekal','ada siswa yang tidak membawa bekal','semua siswa membawa bekal','sebagian siswa membawa bekal','tidak ada bekal di sekolah'],a:1,b:'Untuk membantah "semua", cukup satu pengecualian. Jadi pernyataan itu salah jika <b>ada siswa yang tidak membawa bekal</b>. Tidak perlu semua siswa tidak membawa bekal.'},
{s:'pu',lv:1,t:'Analitik · Posisi duduk',q:'Ali, Budi, dan Citra duduk berjajar di satu bangku. Ali duduk paling kiri. Budi duduk tepat di sebelah kanan Ali.<br>Siapa yang duduk di tengah?',o:['Ali','Budi','Citra','Ali atau Citra','Tidak dapat ditentukan'],a:1,b:'Ali di kiri (posisi 1), Budi tepat di kanannya (posisi 2), sisanya Citra (posisi 3). Yang di tengah: <b>Budi</b>.'},
{s:'pu',lv:1,t:'Kuantitatif · Perbandingan senilai',q:'Harga 2 kg jeruk adalah Rp30.000. Harga 5 kg jeruk yang sama adalah …',o:['Rp60.000','Rp65.000','Rp70.000','Rp75.000','Rp80.000'],a:3,b:'Harga 1 kg = 30.000 ÷ 2 = 15.000. Lima kg = 5 × 15.000 = <b>Rp75.000</b>.'},
{s:'pu',lv:1,t:'Kuantitatif · Rata-rata',tipe:'isian',q:'Rata-rata tiga bilangan adalah 12. Jumlah ketiga bilangan itu adalah …',a:'36',b:'Rata-rata = jumlah ÷ banyak data. Jadi jumlah = rata-rata × banyak data = 12 × 3 = <b>36</b>.'},
{s:'pu',lv:1,t:'Kuantitatif · Perbandingan P & Q',q:'P = setengah dari 40<br>Q = 25% dari 80<br>Hubungan P dan Q yang tepat adalah …',o:PQ,a:2,b:'P = 40 ÷ 2 = 20. Q = 25/100 × 80 = 20. Keduanya sama, jadi <b>P = Q</b>.'},
{s:'pu',lv:1,t:'Kuantitatif · Perbandingan P & Q',q:'P = 2<sup>3</sup><br>Q = 3<sup>2</sup><br>Hubungan P dan Q yang tepat adalah …',o:PQ,a:1,b:'2<sup>3</sup> = 2×2×2 = 8. 3<sup>2</sup> = 3×3 = 9. Jadi <b>P &lt; Q</b>. Hati-hati, 2³ bukan 2×3.'},
{s:'pu',lv:1,t:'Kuantitatif · Kecepatan',q:'Sebuah mobil menempuh 120 km dalam 2 jam. Dengan kecepatan yang sama, jarak yang ditempuh dalam 5 jam adalah …',o:['240 km','250 km','280 km','300 km','360 km'],a:3,b:'Kecepatan = 120 ÷ 2 = 60 km/jam. Dalam 5 jam = 5 × 60 = <b>300 km</b>.'},
{s:'pu',lv:1,t:'Kuantitatif · Diskon',q:'Sebuah buku seharga Rp40.000 didiskon 25%. Harga buku setelah diskon adalah …',o:['Rp10.000','Rp25.000','Rp30.000','Rp35.000','Rp15.000'],a:2,b:'Diskon = 25% × 40.000 = 10.000. Harga akhir = 40.000 − 10.000 = <b>Rp30.000</b>. (10.000 adalah besar diskonnya, bukan harga akhir.)'},
{s:'pu',lv:1,t:'Kuantitatif · Membaca data',q:'Nilai ulangan empat siswa: Ani 80, Budi 70, Cici 90, Dedi 60.<br>Selisih nilai tertinggi dan terendah adalah …',o:['10','20','30','40','150'],a:2,b:'Tertinggi Cici (90), terendah Dedi (60). Selisih = 90 − 60 = <b>30</b>.'},

/* ---------------- PPU Pemula (+15) ---------------- */
{s:'ppu',lv:1,t:'Sinonim',q:'Sinonim kata <b>efisien</b> adalah …',o:['boros','hemat','lambat','mahal','rumit'],a:1,b:'Efisien = tepat guna, tidak membuang-buang waktu atau biaya. Padanannya <b>hemat</b>.'},
{s:'ppu',lv:1,t:'Antonim',q:'Antonim kata <b>mandiri</b> adalah …',o:['bebas','bergantung','kuat','pintar','rajin'],a:1,b:'Mandiri = bisa berdiri sendiri, tidak bergantung pada orang lain. Lawannya <b>bergantung</b>.'},
{s:'ppu',lv:1,t:'Kata baku',q:'"Ia membeli obat di ___ dekat rumah."<br>Kata baku yang tepat adalah …',o:['apotik','apotek','apotiek','apothek','apotick'],a:1,b:'Bentuk bakunya <b>apotek</b>. "Apotik" sering dipakai sehari-hari, tetapi tidak baku.'},
{s:'ppu',lv:1,t:'Makna kata',q:'"Petani itu <b>menuai</b> padi pada bulan Juli."<br>Kata bercetak tebal bermakna …',o:['menanam','memanen','menjual','menyiram','menggiling'],a:1,b:'Menuai = <b>memanen</b>, memotong hasil tanaman yang sudah matang.'},
{s:'ppu',lv:1,t:'Ungkapan',q:'"Hati-hati, anak itu terkenal <b>panjang tangan</b>."<br>Makna ungkapan bercetak tebal adalah …',o:['suka mencuri','suka menolong','tangannya panjang','rajin bekerja','suka memberi'],a:0,b:'Panjang tangan adalah ungkapan untuk orang yang <b>suka mencuri</b>. Jangan diartikan secara harfiah.'},
{s:'ppu',lv:1,t:'Analogi',q:'GURU : SEKOLAH = DOKTER : …',o:['pasien','obat','rumah sakit','suntik','perawat'],a:2,b:'Guru bekerja di sekolah, dokter bekerja di <b>rumah sakit</b>. Hubungannya "orang : tempat kerja".'},
{s:'ppu',lv:1,t:'Analogi',q:'BURUNG : SAYAP = IKAN : …',o:['air','sirip','sisik','laut','insang'],a:1,b:'Burung bergerak dengan sayap, ikan bergerak dengan <b>sirip</b>. Hubungannya "hewan : alat gerak". Insang untuk bernapas, bukan bergerak.'},
{s:'ppu',lv:1,t:'Kata tidak baku',q:'Kata yang penulisannya <b>tidak baku</b> adalah …',o:['jadwal','nasihat','hutang','kualitas','risiko'],a:2,b:'Bentuk baku dari "hutang" adalah <b>utang</b>. Kata lainnya sudah baku.'},
{s:'ppu',lv:1,t:'Makna istilah',q:'Istilah <b>inflasi</b> dalam berita ekonomi berarti …',o:['turunnya harga barang','kenaikan harga barang secara umum dan terus-menerus','bertambahnya jumlah penduduk','naiknya nilai mata uang','berkurangnya lapangan kerja'],a:1,b:'Inflasi = <b>kenaikan harga barang dan jasa secara umum dalam waktu lama</b>. Lawannya deflasi.'},
{s:'ppu',lv:1,t:'Konjungsi',q:'"Dia tidak masuk sekolah ___ sakit."<br>Kata penghubung yang tepat adalah …',o:['tetapi','karena','agar','sehingga','meskipun'],a:1,b:'Sakit adalah alasan (sebab) tidak masuk sekolah. Penghubung sebab: <b>karena</b>.'},
{s:'ppu',lv:1,t:'Sinonim',q:'Sinonim kata <b>primer</b> adalah …',o:['tambahan','utama','kedua','terakhir','langka'],a:1,b:'Primer = yang pertama atau <b>utama</b>, misalnya "kebutuhan primer" = kebutuhan utama.'},
{s:'ppu',lv:1,t:'Antonim',q:'Antonim kata <b>optimis</b> adalah …',o:['pesimis','realistis','ambisius','yakin','berani'],a:0,b:'Optimis = yakin akan berhasil. Lawannya <b>pesimis</b> = cenderung menduga akan gagal.'},
{s:'ppu',lv:1,t:'Peribahasa',q:'Makna peribahasa "Sedikit demi sedikit, lama-lama menjadi bukit" adalah …',o:['pekerjaan kecil tidak ada gunanya','usaha kecil yang dilakukan terus-menerus akhirnya membuahkan hasil besar','mendaki bukit itu melelahkan','orang kaya berasal dari keluarga kaya','jangan menunda pekerjaan'],a:1,b:'Peribahasa ini mengajarkan bahwa <b>hal kecil yang dikumpulkan terus-menerus akan menjadi besar</b>, misalnya menabung atau belajar sedikit tiap hari.'},
{s:'ppu',lv:1,t:'English vocabulary',q:'"The teacher asked the students to be <b>quiet</b> during the test."<br>The word in bold means …',o:['loud','silent','fast','happy','late'],a:1,b:'Quiet = tidak berisik, diam. Padanannya <b>silent</b>.'},
{s:'ppu',lv:1,t:'Makna kata',q:'"Siswa yang melanggar aturan akan mendapat <b>sanksi</b>."<br>Kata bercetak tebal bermakna …',o:['hadiah','hukuman','ragu-ragu','pujian','izin'],a:1,b:'Sanksi = <b>hukuman</b> atas pelanggaran. Jangan tertukar dengan "sangsi" yang berarti ragu-ragu.'},

/* ---------------- PBM Pemula (+15) ---------------- */
{s:'pbm',lv:1,t:'Ejaan · Penulisan judul',q:'Penulisan judul karangan yang tepat adalah …',o:['Cara Menanam Cabai Di Pekarangan Rumah','Cara menanam cabai di pekarangan rumah','Cara Menanam Cabai di Pekarangan Rumah','CARA menanam Cabai di pekarangan Rumah','Cara Menanam cabai Di pekarangan rumah'],a:2,b:'Dalam judul, setiap kata diawali huruf kapital, <b>kecuali kata depan dan kata hubung</b> seperti "di", "ke", "dan", "yang". Jadi: Cara Menanam Cabai <b>di</b> Pekarangan Rumah.'},
{s:'pbm',lv:1,t:'Ejaan · Tanda baca',q:'Penggunaan tanda baca yang tepat terdapat pada kalimat …',o:['Kapan kamu pulang.','Kapan kamu pulang?','Kapan, kamu pulang!','Kapan kamu pulang,','Kapan kamu, pulang?'],a:1,b:'Kalimat tanya diakhiri tanda tanya dan tidak perlu koma di tengahnya: <b>Kapan kamu pulang?</b>'},
{s:'pbm',lv:1,t:'Ide pokok',q:'"Sarapan penting bagi pelajar. Sarapan memberi energi untuk belajar di pagi hari. Pelajar yang sarapan lebih mudah berkonsentrasi. Sebaliknya, yang melewatkan sarapan sering mengantuk di kelas."<br>Ide pokok paragraf tersebut adalah …',o:['Pelajar sering mengantuk di kelas.','Sarapan penting bagi pelajar.','Energi datang dari makanan.','Konsentrasi sulit didapat.','Pelajar harus bangun pagi.'],a:1,b:'Kalimat pertama adalah kalimat utama, dan kalimat lainnya menjelaskan alasannya. Ide pokok: <b>sarapan penting bagi pelajar</b>.'},
{s:'pbm',lv:1,t:'Kalimat sumbang',q:'(1) Kucing adalah hewan peliharaan yang populer. (2) Kucing mudah dirawat dan ramah. (3) Banyak keluarga memelihara kucing di rumah. (4) Harga pakan ayam naik bulan ini. (5) Kucing juga bisa menjadi teman bermain anak.<br>Kalimat yang tidak padu adalah …',o:['(1)','(2)','(3)','(4)','(5)'],a:3,b:'Semua kalimat membahas kucing, kecuali kalimat <b>(4)</b> yang membahas harga pakan ayam.'},
{s:'pbm',lv:1,t:'Urutan kalimat',q:'(1) Gosok kedua telapak tangan dengan sabun. (2) Basahi tangan dengan air mengalir. (3) Bilas hingga bersih, lalu keringkan. (4) Tuang sabun secukupnya.<br>Urutan langkah mencuci tangan yang tepat adalah …',o:['2-4-1-3','4-2-1-3','2-1-4-3','1-2-4-3','2-4-3-1'],a:0,b:'Basahi dulu (2), tuang sabun (4), gosok (1), terakhir bilas dan keringkan (3). Urutannya <b>2-4-1-3</b>.'},
{s:'pbm',lv:1,t:'Kalimat efektif',q:'"Para hadirin sekalian dipersilakan duduk."<br>Perbaikan kalimat tersebut agar efektif adalah …',o:['Para hadirin dipersilakan duduk.','Hadirin dipersilakan duduk.','Hadirin sekalian para dipersilakan duduk.','Para hadirin sekalian silakan duduk.','Hadirin-hadirin dipersilakan duduk.'],a:1,b:'"Hadirin" sudah berarti jamak (orang-orang yang hadir), jadi "para" dan "sekalian" mubazir. Kalimat efektifnya: <b>Hadirin dipersilakan duduk.</b>'},
{s:'pbm',lv:1,t:'Ejaan · Kata depan',q:'Penulisan yang benar adalah …',o:['diantara','di antara','di-antara','dia ntara','diantara-nya'],a:1,b:'"Di" di sini adalah kata depan (menunjukkan tempat), jadi ditulis terpisah: <b>di antara</b>.'},
{s:'pbm',lv:1,t:'Konjungsi',q:'"Ibu memasak di dapur, ___ ayah mencuci mobil di halaman."<br>Kata penghubung yang tepat adalah …',o:['karena','sedangkan','agar','sehingga','jika'],a:1,b:'Dua kegiatan berbeda yang terjadi bersamaan dihubungkan dengan <b>sedangkan</b> (perbandingan).'},
{s:'pbm',lv:1,t:'Ejaan · Tanda koma',q:'Penggunaan tanda koma yang tepat terdapat pada kalimat …',o:['Oleh karena itu kita, harus hemat air.','Oleh karena itu, kita harus hemat air.','Oleh, karena itu kita harus hemat air.','Oleh karena itu kita harus hemat, air.','Oleh karena, itu kita harus hemat air.'],a:1,b:'Setelah kata penghubung antarkalimat seperti "oleh karena itu", "jadi", "namun", selalu dipakai tanda koma: <b>Oleh karena itu, kita harus hemat air.</b>'},
{s:'pbm',lv:1,t:'Kata baku',q:'"Dokter memberi ___ kepada pasien agar rajin berolahraga."<br>Kata baku yang tepat adalah …',o:['nasehat','nasihat','nasiat','nasehad','nasyihat'],a:1,b:'Bentuk bakunya <b>nasihat</b>, bukan "nasehat".'},
{s:'pbm',lv:1,t:'Imbuhan',q:'Bentuk kata yang benar dari <b>me- + sapu</b> adalah …',o:['mesapu','mensapu','menyapu','mengsapu','menyapukan'],a:2,b:'Kata dasar berawalan huruf s luluh dan berubah menjadi "ny" saat diberi awalan me-: <b>menyapu</b>. Contoh lain: me- + sikat = menyikat.'},
{s:'pbm',lv:1,t:'Ejaan · Gelar',q:'Penulisan nama dan gelar yang tepat adalah …',o:['Andi S.Pd','Andi, S.Pd.','Andi. S.Pd','Andi, S,Pd.','Andi S. Pd.'],a:1,b:'Nama dan gelar dipisahkan dengan koma, dan setiap singkatan gelar diakhiri titik: <b>Andi, S.Pd.</b>'},
{s:'pbm',lv:1,t:'Kalimat efektif · Mubazir',q:'"Mereka saling bantu-membantu saat banjir."<br>Kalimat efektifnya adalah …',o:['Mereka saling bantu-membantu saat banjir.','Mereka bantu-membantu saling saat banjir.','Mereka saling membantu saat banjir.','Mereka saling bantu-bantu saat banjir.','Mereka membantu-bantu saat banjir.'],a:2,b:'"Saling" sudah bermakna berbalasan, sama dengan bentuk ulang "bantu-membantu". Pakai salah satu saja: <b>Mereka saling membantu</b> atau "Mereka bantu-membantu".'},
{s:'pbm',lv:1,t:'Simpulan',q:'"Pohon menyerap karbon dioksida dari udara. Akar pohon menahan air hujan sehingga mencegah banjir. Di kota, pohon juga membuat udara lebih sejuk."<br>Simpulan paragraf tersebut adalah …',o:['Pohon hanya berguna di kota.','Pohon memberi banyak manfaat bagi lingkungan.','Banjir disebabkan oleh pohon.','Udara kota selalu panas.','Karbon dioksida berasal dari pohon.'],a:1,b:'Ketiga kalimat menyebut manfaat pohon yang berbeda-beda. Simpulannya: <b>pohon memberi banyak manfaat bagi lingkungan</b>.'},
{s:'pbm',lv:1,t:'Kata ganti',q:'"Rina membeli buku cerita baru. ___ membacanya setiap malam sebelum tidur."<br>Kata ganti yang tepat adalah …',o:['Mereka','Ia','Kami','Kalian','Kita'],a:1,b:'Rina adalah satu orang (orang ketiga tunggal), jadi kata gantinya <b>ia</b> atau "dia".'},

/* ---------------- PK Pemula (+15) ---------------- */
{s:'pk',lv:1,t:'KPK',q:'KPK dari 4 dan 6 adalah …',o:['2','10','12','24','8'],a:2,b:'Kelipatan 4: 4, 8, <b>12</b>, 16… Kelipatan 6: 6, <b>12</b>, 18… Kelipatan persekutuan terkecilnya <b>12</b>.'},
{s:'pk',lv:1,t:'FPB',q:'FPB dari 18 dan 24 adalah …',o:['2','3','6','12','72'],a:2,b:'Faktor 18: 1, 2, 3, 6, 9, 18. Faktor 24: 1, 2, 3, 4, 6, 8, 12, 24. Faktor persekutuan terbesarnya <b>6</b>.'},
{s:'pk',lv:1,t:'Pecahan',q:'3/4 dari 80 adalah …',o:['20','40','60','75','64'],a:2,b:'80 ÷ 4 = 20, lalu 20 × 3 = <b>60</b>.'},
{s:'pk',lv:1,t:'Membandingkan pecahan',q:'Pecahan yang nilainya paling kecil di antara 1/2, 1/3, dan 2/5 adalah …',o:['1/2','1/3','2/5','semuanya sama','1/2 dan 2/5'],a:1,b:'Ubah ke desimal: 1/2 = 0,5; 1/3 ≈ 0,33; 2/5 = 0,4. Yang terkecil <b>1/3</b>.'},
{s:'pk',lv:1,t:'Luas segitiga',q:'Sebuah segitiga memiliki alas 10 cm dan tinggi 6 cm. Luasnya adalah …',o:['16 cm²','30 cm²','60 cm²','32 cm²','20 cm²'],a:1,b:'Luas segitiga = ½ × alas × tinggi = ½ × 10 × 6 = <b>30 cm²</b>. Jangan lupa dibagi 2.'},
{s:'pk',lv:1,t:'Persamaan linear',q:'Jika 2x + 5 = 17, nilai x adalah …',o:['5','6','7','11','12'],a:1,b:'2x = 17 − 5 = 12, jadi x = 12 ÷ 2 = <b>6</b>.'},
{s:'pk',lv:1,t:'Statistika · Modus',q:'Modus dari data 4, 5, 5, 6, 7, 5, 8 adalah …',o:['4','5','6','7','8'],a:1,b:'Modus = nilai yang paling sering muncul. Angka 5 muncul tiga kali, jadi modusnya <b>5</b>.'},
{s:'pk',lv:1,t:'Satuan waktu',q:'1,5 jam sama dengan … menit',o:['60','75','90','105','150'],a:2,b:'1 jam = 60 menit, 0,5 jam = 30 menit. Jadi 1,5 jam = <b>90 menit</b>. Bukan 150, karena 1,5 bukan berarti "1 jam 50 menit".'},
{s:'pk',lv:1,t:'Bilangan bulat',q:'Hasil dari (−3) + 8 − (−2) adalah …',o:['3','5','7','9','−7'],a:2,b:'(−3) + 8 = 5. Lalu 5 − (−2) = 5 + 2 = <b>7</b>. Ingat: mengurangi bilangan negatif sama dengan menambah.'},
{s:'pk',lv:1,t:'Statistika · Rata-rata',q:'Rata-rata dari 6, 8, 10, dan 12 adalah …',o:['8','9','10','11','36'],a:1,b:'Jumlah = 6 + 8 + 10 + 12 = 36. Rata-rata = 36 ÷ 4 = <b>9</b>.'},
{s:'pk',lv:1,t:'Bilangan prima',tipe:'isian',q:'Banyak bilangan prima di antara 10 dan 20 adalah …',a:'4',b:'Bilangan prima antara 10 dan 20: 11, 13, 17, 19. Ada <b>4</b>. (15 bukan prima karena habis dibagi 3 dan 5.)'},
{s:'pk',lv:1,t:'Desimal ke pecahan',q:'Bentuk pecahan paling sederhana dari 0,4 adalah …',o:['4/10','2/5','1/4','4/100','1/40'],a:1,b:'0,4 = 4/10. Disederhanakan (dibagi 2) menjadi <b>2/5</b>.'},
{s:'pk',lv:1,t:'Volume kubus',q:'Volume kubus dengan panjang rusuk 4 cm adalah …',o:['12 cm³','16 cm³','32 cm³','64 cm³','24 cm³'],a:3,b:'Volume kubus = rusuk × rusuk × rusuk = 4 × 4 × 4 = <b>64 cm³</b>.'},
{s:'pk',lv:1,t:'Persen kenaikan',q:'Harga sebuah tas Rp80.000 dinaikkan 10%. Harga barunya adalah …',o:['Rp8.000','Rp72.000','Rp88.000','Rp90.000','Rp96.000'],a:2,b:'Kenaikan = 10% × 80.000 = 8.000. Harga baru = 80.000 + 8.000 = <b>Rp88.000</b>.'},
{s:'pk',lv:1,t:'Sudut segitiga',q:'Dua sudut sebuah segitiga besarnya 50° dan 60°. Sudut ketiganya adalah …',o:['60°','70°','80°','90°','110°'],a:1,b:'Jumlah sudut segitiga selalu 180°. Jadi sudut ketiga = 180 − 50 − 60 = <b>70°</b>.'},

/* ---------------- LBI Pemula (+25) ---------------- */
{s:'lbi',lv:1,p:'lbi_p1',t:'Ide pokok',q:'Ide pokok teks tersebut adalah …',o:['Sekolah membutuhkan uang dari sampah.','Bank sampah sekolah berhasil menumbuhkan kebiasaan memilah sampah.','Botol plastik lebih mahal daripada kardus.','Orang tua tidak peduli pada sampah.','Uang tabungan hanya bisa diambil akhir semester.'],a:1,b:'Teks bercerita tentang bank sampah dan hasil utamanya: kebiasaan memilah sampah, sampai terbawa ke rumah. Opsi lain hanya detail kecil.'},
{s:'lbi',lv:1,p:'lbi_p1',t:'Detail',q:'Berdasarkan teks, pernyataan yang BENAR adalah …',o:['Siswa membawa sampah setiap hari.','Uang tabungan bisa diambil setiap Jumat.','Dalam satu semester terkumpul 1,2 ton sampah.','Bank sampah dibuka di dalam kelas.','Kepala sekolah menolak program ini.'],a:2,b:'Teks menyebut "1,2 ton sampah daur ulang" dalam satu semester. Sampah dibawa setiap Jumat, uang diambil akhir semester, dan lokasinya di pojok halaman.'},
{s:'lbi',lv:1,p:'lbi_p1',t:'Makna kata',q:'Kata <b>memilah</b> dalam teks bermakna …',o:['membuang','memisahkan menurut jenisnya','membakar','menjual','menimbang'],a:1,b:'Memilah = <b>memisah-misahkan menurut jenisnya</b>, misalnya plastik dipisah dari kertas.'},

 <ol class="steps"><li><b>Baca soal sampai habis.</b> Banyak yang salah karena buru-buru.</li><li><b>Tulis angkanya.</b> Untuk pola, tulis selisihnya di atas tiap pasangan angka.</li><li><b>Cek jawabanmu ke soal.</b> Kalau jawabanmu 42, coba masukkan: apakah polanya masih cocok?</li><li><b>Kalau 1 menit belum ketemu, lewati dulu.</b> Beri tanda ragu-ragu, kerjakan yang lain, lalu kembali.</li></ol>
 ${ex('4, 8, 12, 16, … berikutnya?','Selisihnya +4 terus. Jadi 16 + 4 = <b>20</b>.')}
 ${ex('Semua bunga mawar berduri. Ini bunga mawar. Simpulan?','Kalau semua mawar berduri dan ini mawar, maka <b>bunga ini berduri</b>. Tidak perlu mikir "tapi kan ada mawar tanpa duri", karena soal cuma mau tahu apa yang mengikuti premis.')}
 ${tip('Di PU, jawaban yang "pasti" selalu menang dari jawaban yang "mungkin". Kalau sebuah opsi memakai kata "mungkin" padahal premisnya tegas, biasanya itu jebakan.')}
 `}
],
ppu:[
 {id:'ppu-a2',judul:'Kosakata Dasar yang Sering Keluar',lv:1,menit:10,isi:`
 <p>PPU itu 20 soal dalam 15 menit, jadi cuma <b>45 detik per soal</b>. Soalnya pendek-pendek, yang penting kosakatamu cukup. Kabar baiknya: kata-kata yang muncul itu itu-itu saja. Mulai hafalkan dari daftar ini.</p>
 <h3>Sinonim yang sering ditanyakan</h3>
 <table class="dtable"><tr><th>Kata</th><th>Artinya</th><th>Kata</th><th>Artinya</th></tr>
 <tr><td>efisien</td><td>hemat, tepat guna</td><td>kendala</td><td>hambatan</td></tr>
 <tr><td>primer</td><td>utama</td><td>sekunder</td><td>tambahan, kedua</td></tr>
 <tr><td>akurat</td><td>tepat</td><td>relevan</td><td>berkaitan</td></tr>
 <tr><td>signifikan</td><td>berarti, penting</td><td>valid</td><td>sah, benar</td></tr>
 <tr><td>potensi</td><td>kemampuan terpendam</td><td>prioritas</td><td>yang didahulukan</td></tr>
 <tr><td>konsisten</td><td>tetap, tidak berubah-ubah</td><td>fleksibel</td><td>luwes, mudah menyesuaikan</td></tr></table>
 <h3>Pasangan antonim favorit soal</h3>
 <ul><li>optimis ↔ pesimis</li><li>mandiri ↔ bergantung</li><li>sporadis (sesekali) ↔ rutin</li><li>eksplisit (jelas) ↔ implisit (tersirat)</li><li>abstrak ↔ konkret</li><li>mayoritas ↔ minoritas</li></ul>
 <div class="callout"><b>Kata yang mirip tapi beda:</b> <b>sanksi</b> = hukuman, <b>sangsi</b> = ragu. <b>Masa</b> = waktu, <b>massa</b> = berat/kumpulan orang. <b>Bank</b> (lembaga uang), <b>bang</b> (kakak).</div>
 ${ex('Antonim "abstrak"?','Abstrak = tidak berwujud, hanya gagasan. Lawannya <b>konkret</b> = nyata, bisa dilihat/disentuh.')}
 ${tip('Cara paling gampang menambah kosakata: tiap ketemu kata asing di berita, langsung cari artinya, lalu pakai kata itu dalam satu kalimat buatanmu sendiri.')}
 `}
],
pbm:[
 {id:'pbm-a2',judul:'Menemukan Ide Pokok dan Kalimat Sumbang',lv:1,menit:10,isi:`
 <p>Selain ejaan, PBM suka menanyakan paragraf: apa ide pokoknya, kalimat mana yang tidak nyambung, dan bagaimana urutan yang benar. Semuanya bisa dijawab dengan satu kebiasaan: <b>tanya "paragraf ini sebenarnya ngomongin apa?"</b></p>
 <h3>Ide pokok dalam 3 langkah</h3>
 <ol class="steps"><li>Baca kalimat pertama dan kalimat terakhir. Ide pokok biasanya ada di salah satunya.</li><li>Cari kalimat yang paling <b>umum</b>. Kalimat lain biasanya cuma contoh, alasan, atau penjelasan.</li><li>Cek: apakah kalimat-kalimat lain "mendukung" kalimat itu? Kalau iya, itulah ide pokoknya.</li></ol>
 <h3>Kalimat sumbang</h3>
 <p>Kalimat sumbang = kalimat yang <b>topiknya melenceng</b>, walaupun isinya benar. Contoh: paragraf tentang manfaat kucing, tiba-tiba ada kalimat tentang harga pakan ayam. Kalimat itu benar, tetapi tidak nyambung.</p>
 <h3>Mengurutkan kalimat</h3>
 <ul><li>Cari kalimat yang bisa berdiri sendiri (biasanya kalimat pertama). Kalimat pertama <b>tidak</b> mengandung kata "itu", "tersebut", "ia", "mereka" yang merujuk ke kalimat sebelumnya.</li><li>Cari penanda urutan: <i>pertama, lalu, setelah itu, akhirnya</i>.</li></ul>
 ${ex('"(1) Ia lalu menyiramnya setiap pagi. (2) Rina menanam bunga di halaman. (3) Seminggu kemudian, bunga itu tumbuh." Urutan?','Kalimat (2) berdiri sendiri (ada nama "Rina"). Kalimat (1) ada kata "ia" dan "lalu" → setelah (2). Kalimat (3) "seminggu kemudian" → terakhir. Urutan <b>2-1-3</b>.')}
 ${tip('Kalau bingung memilih ide pokok, coret dulu opsi yang terlalu sempit (hanya satu detail) dan yang tidak ada di teks. Biasanya sisa satu.')}
 `}
],
pk:[
 {id:'pk-a2',judul:'Hitung Cepat: KPK, FPB, Rata-rata, Bangun Datar',lv:1,menit:12,isi:`
 <p>Soal PK pemula itu matematika SD–SMP yang dibungkus rapi. Yang bikin salah biasanya bukan tidak bisa, tetapi <b>lupa rumus</b> atau <b>salah baca</b>. Lesson ini merangkum yang paling sering keluar.</p>
 <h3>KPK dan FPB</h3>
 <ul><li><b>KPK</b> (kelipatan persekutuan terkecil): dipakai untuk soal "kapan bertemu lagi / bersamaan lagi". Contoh: lampu A berkedip tiap 4 detik, lampu B tiap 6 detik → berkedip bersamaan tiap <b>12 detik</b>.</li><li><b>FPB</b> (faktor persekutuan terbesar): dipakai untuk soal "dibagi rata paling banyak". Contoh: 18 permen dan 24 cokelat dibagi ke kantong sama rata → paling banyak <b>6 kantong</b>.</li></ul>
 <h3>Statistika dasar</h3>
 <table class="dtable"><tr><th>Istilah</th><th>Artinya</th><th>Contoh (data 4, 5, 5, 6, 10)</th></tr>
 <tr><td>Mean (rata-rata)</td><td>jumlah ÷ banyak data</td><td>30 ÷ 5 = 6</td></tr><tr><td>Median</td><td>nilai tengah setelah diurutkan</td><td>5</td></tr><tr><td>Modus</td><td>yang paling sering muncul</td><td>5</td></tr></table>
 <h3>Rumus bangun yang wajib hafal</h3>
 <ul><li>Persegi: luas = s × s, keliling = 4s</li><li>Persegi panjang: luas = p × l, keliling = 2(p + l)</li><li>Segitiga: luas = ½ × alas × tinggi</li><li>Lingkaran: luas = πr², keliling = 2πr</li><li>Kubus: volume = s³ ; Balok: p × l × t</li><li>Jumlah sudut segitiga = 180°</li></ul>
 <div class="callout warn"><b>Jebakan satuan:</b> 1 jam = 60 menit (jadi 1,5 jam = 90 menit, bukan 150). 1 m = 100 cm, tetapi 1 m² = 10.000 cm². 1 liter = 1.000 mL = 1 dm³.</div>
 ${ex('Luas lingkaran dengan jari-jari 7 cm (π = 22/7)?','Luas = 22/7 × 7 × 7 = 22 × 7 = <b>154 cm²</b>.')}
 ${tip('Kalau soal pilihan ganda dan kamu ragu, coba masukkan opsi ke soal. Untuk 2x + 5 = 17, tes x = 6: 2(6) + 5 = 17. Cocok!')}
 `}
],
lbi:[
 {id:'lbi-a2',judul:'Menjawab Soal Bacaan Tanpa Panik',lv:1,menit:10,isi:`
 <p>Literasi Bahasa Indonesia itu 30 soal dalam 42,5 menit, dan tiap bacaan biasanya dipakai untuk 4–6 soal. Jadi kamu tidak perlu membaca ulang teks untuk setiap soal. Yang penting: <b>tahu jenis pertanyaannya, lalu tahu di mana mencarinya</b>.</p>
 <h3>Lima jenis pertanyaan dan tempat jawabannya</h3>
 <table class="dtable"><tr><th>Pertanyaan</th><th>Cari di mana?</th></tr>
 <tr><td>Ide pokok / gagasan utama</td><td>Kalimat pertama atau terakhir paragraf. Pilih opsi yang paling umum.</td></tr>
 <tr><td>Detail ("pernyataan yang benar", "mengapa…")</td><td>Cari kata kunci dari soal di teks, baca kalimat itu + satu kalimat sesudahnya.</td></tr>
 <tr><td>Makna kata</td><td>Baca kalimat tempat kata itu berada. Ganti dengan opsi, mana yang masih masuk akal?</td></tr>
 <tr><td>Simpulan / inferensi</td><td>Gabungkan 2–3 informasi dari teks. Hindari opsi dengan kata "semua", "pasti", "selalu".</td></tr>
 <tr><td>Tujuan penulis</td><td>Lihat keseluruhan: memberi informasi, mengajak, atau mengkritik?</td></tr></table>
 <h3>Soal angka dalam bacaan</h3>
 <p>Kalau teks menyebut persen dan jumlah orang, siap-siap dihitung: "40% dari 2.000 responden" berarti 40/100 × 2.000 = <b>800</b>. Tulis hitungannya, jangan dikira-kira.</p>
 ${ex('Teks: "Jumlah pengunjung naik 30% setelah renovasi." Jika semula 1.000, berapa sekarang?','30% × 1.000 = 300. Sekarang 1.000 + 300 = <b>1.300</b>. Bukan 300 (itu kenaikannya saja).')}
 ${tip('Opsi jawaban yang memakai kata-kata persis dari teks belum tentu benar. Soal suka menyalin kalimat teks lalu mengubah satu kata kecil, misalnya "Sabtu" jadi "Minggu". Cek sampai ke detail.')}
 `}
],
lbe:[
 {id:'lbe-a2',judul:'Kata Tanya & Kosakata Dasar Teks Inggris',lv:1,menit:10,isi:`
 <p>Teks Literasi Bahasa Inggris level pemula biasanya tentang topik sehari-hari: sekolah, kota, kesehatan, lingkungan. Kamu tidak harus paham semua kata. Yang penting paham <b>pertanyaannya</b> dan bisa menemukan bagian teks yang dimaksud.</p>
 <h3>Kenali bentuk pertanyaannya</h3>
 <table class="dtable"><tr><th>Pertanyaan</th><th>Artinya</th><th>Cara jawab</th></tr>
 <tr><td>What is the text mainly about?</td><td>Teks ini membahas apa?</td><td>Pilih yang mencakup seluruh teks.</td></tr>
 <tr><td>According to the text, …</td><td>Menurut teks…</td><td>Cari kata kuncinya di teks.</td></tr>
 <tr><td>The word "X" is closest in meaning to…</td><td>Kata X paling dekat artinya dengan…</td><td>Baca kalimatnya, tebak dari konteks.</td></tr>
 <tr><td>The word "it/they/this" refers to…</td><td>Kata itu merujuk ke…</td><td>Lihat kata benda terdekat sebelumnya.</td></tr>
 <tr><td>Which is NOT mentioned?</td><td>Mana yang TIDAK disebut?</td><td>Centang yang ada di teks, sisanya jawabannya.</td></tr></table>
 <h3>Kata penghubung yang mengubah arah</h3>
 <ul><li><b>However / But</b> = namun → setelahnya ada hal yang berlawanan.</li><li><b>Because</b> = karena → alasan. <b>So / Therefore</b> = jadi → akibat.</li><li><b>Although</b> = meskipun.</li><li><b>Also / In addition</b> = selain itu → informasi tambahan.</li></ul>
 ${ex('"Bicycles are cheap. However, cycling in the rain is not easy." Kalimat kedua berisi…','Kata <b>however</b> menandakan kebalikan dari kalimat sebelumnya. Kalimat pertama kelebihan, kalimat kedua <b>kekurangan</b>.')}
 ${tip('Kalau ada kata yang tidak kamu tahu, jangan berhenti. Baca sampai akhir kalimat, biasanya artinya bisa ditebak dari kata-kata di sekitarnya.')}
 `}
],
pm:[
 {id:'pm-a2',judul:'Soal Cerita Matematika: Dari Kalimat ke Angka',lv:1,menit:12,isi:`
 <p>Penalaran Matematika (PM) itu matematika yang dibungkus cerita: belanja, perjalanan, tabungan, resep. Kesulitannya bukan di hitungan, tetapi di <b>menerjemahkan cerita jadi angka</b>. Caranya bisa dilatih.</p>
 <h3>Empat langkah menerjemahkan soal cerita</h3>
 <ol class="steps"><li><b>Apa yang ditanya?</b> Garis bawahi. Misalnya "berapa kembaliannya".</li><li><b>Data apa yang ada?</b> Tulis angka-angkanya dalam daftar: buku 25.000, pensil 5.000, tas 60.000, bayar 100.000.</li><li><b>Operasinya apa?</b> Kembalian = bayar − total belanja.</li><li><b>Hitung, lalu cek masuk akal.</b> Kembalian 10.000 masuk akal; kembalian 190.000 jelas salah.</li></ol>
 <h3>Kata-kata kunci dan artinya</h3>
 <table class="dtable"><tr><th>Kata di soal</th><th>Artinya</th></tr>
 <tr><td>sisa, kembalian, selisih, lebih murah</td><td>kurang (−)</td></tr><tr><td>total, jumlah, seluruhnya</td><td>tambah (+)</td></tr><tr><td>per, setiap, masing-masing, kali lipat</td><td>kali (×)</td></tr><tr><td>dibagi rata, rata-rata, per orang</td><td>bagi (÷)</td></tr>
 <tr><td>diskon 25%</td><td>bayar 75%</td></tr><tr><td>naik 10%</td><td>jadi 110%</td></tr></table>
 <h3>Rumus yang sering dipakai</h3>
 <ul><li>Kecepatan = jarak ÷ waktu ; Waktu = jarak ÷ kecepatan</li><li>Jarak sebenarnya = jarak peta × skala</li><li>% untung = untung ÷ harga beli × 100%</li><li>Bunga 1 tahun = tabungan × persen bunga</li><li>Peluang = banyak yang diinginkan ÷ semua kemungkinan</li></ul>
 ${ex('Tarif parkir Rp3.000 jam pertama, lalu Rp2.000 per jam berikutnya. Parkir 4 jam?','Jam pertama 3.000. Sisa 3 jam × 2.000 = 6.000. Total <b>Rp9.000</b>.')}
 ${tip('Soal PM sering menaruh angka yang tidak dipakai, cuma untuk mengecoh. Setelah menulis daftar data, tanya: angka ini perlu tidak untuk menjawab yang ditanya?')}
 `}
]

lbi_m1:{judul:'Kendaraan Listrik dan Udara Kota', isi:`<p>Pemerintah gencar mendorong penggunaan kendaraan listrik untuk mengurangi polusi udara di kota besar. Kendaraan listrik memang tidak mengeluarkan asap dari knalpot. Di jalan raya, keberadaannya bisa langsung mengurangi gas buang yang dihirup warga.</p><p>Namun, para ahli mengingatkan bahwa listrik untuk mengisi baterai sebagian besar masih berasal dari pembangkit berbahan bakar batu bara. Artinya, polusi tidak hilang, melainkan berpindah dari jalan raya ke sekitar pembangkit. Selain itu, sebuah kajian menyebut sekitar 40% polusi udara di kota besar berasal dari sumber lain seperti industri, pembakaran sampah, dan debu konstruksi. Karena itu, kendaraan listrik dinilai baru akan efektif jika disertai peralihan ke pembangkit energi bersih dan pengendalian sumber polusi lainnya.</p>`},
lbi_m2:{judul:'Sistem Zonasi Sekolah', isi:`<p>Sistem zonasi dalam penerimaan siswa baru mengutamakan calon siswa yang tinggal dekat dengan sekolah. Tujuannya adalah pemerataan: sekolah favorit tidak lagi hanya diisi siswa bernilai tinggi dari berbagai penjuru kota, dan siswa tidak perlu menempuh perjalanan jauh setiap hari.</p><p>Di beberapa daerah, kebijakan ini menuai keluhan. Sejumlah orang tua memindahkan alamat dalam kartu keluarga agar anaknya masuk zona sekolah tertentu. Ada pula wilayah yang jumlah sekolah negerinya terlalu sedikit dibandingkan jumlah penduduk usia sekolah, sehingga banyak anak tidak tertampung meskipun tinggal tidak jauh. Pengamat pendidikan menilai bahwa zonasi tidak salah secara konsep, tetapi harus diiringi pemerataan kualitas guru dan penambahan sekolah di daerah yang kekurangan.</p>`},
lbi_m3:{judul:'Sisa Makanan di Meja Makan', isi:`<p>Indonesia termasuk negara penghasil sampah makanan terbesar di dunia. Sebuah kajian pemerintah memperkirakan setiap orang membuang rata-rata 115–184 kilogram makanan per tahun. Sebagian besar terbuang bukan di ladang atau pasar, melainkan di tingkat rumah tangga dan rumah makan.</p><p>Penyebabnya beragam: membeli bahan makanan berlebihan, porsi hidangan yang terlalu besar, hingga kebiasaan menganggap tidak sopan jika piring tamu kosong. Padahal, makanan yang terbuang ke tempat pembuangan akhir akan membusuk dan menghasilkan gas metana yang memperparah pemanasan global. Beberapa komunitas kini menyalurkan makanan berlebih dari hotel dan restoran kepada warga yang membutuhkan, sebelum makanan itu kedaluwarsa.</p>`},
lbi_m4:{judul:'Pelajar yang Bekerja Paruh Waktu', isi:`<p>Semakin banyak pelajar SMA yang bekerja paruh waktu, misalnya menjadi kurir, penjaga toko daring, atau pembuat konten. Bagi sebagian dari mereka, penghasilan tambahan membantu ekonomi keluarga. Bagi yang lain, bekerja menjadi cara belajar mandiri dan mengenal dunia kerja lebih awal.</p><p>Akan tetapi, survei terhadap 600 pelajar yang bekerja menunjukkan bahwa mereka yang bekerja lebih dari 15 jam per minggu cenderung memiliki nilai rapor lebih rendah dan lebih sering mengantuk di kelas. Sebaliknya, pelajar yang bekerja di bawah 10 jam per minggu tidak menunjukkan penurunan nilai yang berarti. Konselor sekolah menyarankan pelajar yang ingin bekerja untuk membatasi jam kerja dan tidak bekerja pada malam sebelum ujian.</p>`},
lbi_m5:{judul:'Hutan Mangrove, Benteng Pantai', isi:`<p>Hutan mangrove tumbuh di wilayah pasang surut di pesisir. Akarnya yang rapat menahan lumpur dan meredam gelombang, sehingga pantai tidak mudah terkikis. Saat tsunami, kawasan yang memiliki sabuk mangrove tebal umumnya mengalami kerusakan lebih ringan dibandingkan pantai terbuka.</p><p>Mangrove juga menjadi tempat berkembang biak ikan, kepiting, dan udang yang menjadi tangkapan nelayan. Selain itu, mangrove menyimpan karbon jauh lebih banyak per hektare dibandingkan hutan daratan. Sayangnya, ribuan hektare mangrove di Indonesia telah berubah menjadi tambak dan permukiman. Ketika mangrove hilang, nelayan setempat sering mengeluhkan hasil tangkapan yang menurun dan abrasi pantai yang makin parah.</p>`},
lbe_m1:{judul:'Banning Plastic Bags', isi:`<p>Many cities have banned single-use plastic bags in supermarkets and shops. Supporters say the ban reduces litter in rivers and oceans, where plastic can harm fish, turtles, and birds. In several cities, the number of plastic bags found during beach cleanups dropped sharply within a year of the ban.</p><p>However, the ban has some unexpected effects. Some shoppers now buy thicker plastic bags to line their trash bins, which use more plastic than the thin bags they replaced. Paper bags, a common alternative, require more energy and water to produce. Researchers therefore argue that the best solution is not simply switching materials but encouraging people to reuse the same bag many times.</p>`},
lbe_m2:{judul:'Learning Online', isi:`<p>Online learning became common during the pandemic, and many schools continue to use it today. It allows students to watch lessons again, study at their own pace, and access materials from anywhere with an internet connection.</p><p>Yet online learning does not suit everyone equally. Students without a stable internet connection or a quiet place to study often fall behind. Teachers also report that it is harder to notice when a student is confused, because many students turn off their cameras. As a result, a growing number of schools have adopted "blended learning", which combines face-to-face classes with online materials, hoping to keep the benefits of both.</p>`},
lbe_m3:{judul:'Why Bees Matter', isi:`<p>Bees are famous for making honey, but their most important job is pollination. When a bee moves from flower to flower to collect nectar, it carries pollen that allows plants to produce fruits and seeds. Scientists estimate that around one third of the food we eat depends on pollinators such as bees.</p><p>In recent decades, bee populations in many countries have declined. Pesticides, the loss of wild flowers, and diseases are considered the main causes. Some farmers have started planting strips of flowers along their fields and using fewer chemicals. These small changes have helped bee numbers recover in some areas, and farmers have also reported better harvests of crops like apples and almonds.</p>`}

{s:'pu',lv:2,t:'Induktif · Selisih naik',q:'Huruf selanjutnya dari pola A, B, D, G, K, … adalah',o:['N','O','P','Q','R'],a:2,b:'Ubah ke angka: 1, 2, 4, 7, 11. Selisihnya +1, +2, +3, +4, lalu +5. Jadi 11 + 5 = 16 = <b>P</b>.'},
{s:'pu',lv:2,t:'Induktif · Pola selang-seling',q:'Bilangan selanjutnya dari barisan 80, 40, 42, 21, 23, … adalah',o:['10','11','11,5','12','25'],a:2,b:'Polanya bergantian ÷2 lalu +2: 80→40→42→21→23. Berikutnya 23 ÷ 2 = <b>11,5</b>.'},
{s:'pu',lv:2,t:'Induktif · Bilangan prima',q:'Bilangan selanjutnya dari barisan 2, 3, 5, 7, 11, 13, … adalah',o:['15','16','17','19','21'],a:2,b:'Ini barisan bilangan prima (hanya habis dibagi 1 dan dirinya sendiri). Setelah 13, bilangan prima berikutnya <b>17</b>. 15 = 3×5 dan 16 = 2×8 bukan prima.'},
{s:'pu',lv:2,t:'Deduktif · Tidak pasti',q:'Semua peserta olimpiade adalah siswa berprestasi. Sebagian siswa berprestasi mendapat beasiswa.<br>Simpulan yang tepat adalah …',o:['Semua peserta olimpiade mendapat beasiswa.','Sebagian peserta olimpiade mendapat beasiswa.','Tidak ada peserta olimpiade yang mendapat beasiswa.','Semua penerima beasiswa adalah peserta olimpiade.','Tidak dapat ditarik simpulan yang pasti tentang peserta olimpiade dan beasiswa.'],a:4,b:'Peserta olimpiade termasuk siswa berprestasi, tetapi yang mendapat beasiswa hanya <i>sebagian</i> siswa berprestasi. Kita tidak tahu apakah bagian itu mengenai peserta olimpiade atau tidak. Jadi <b>tidak ada simpulan yang pasti</b>. Ini jebakan favorit UTBK.'},
{s:'pu',lv:2,t:'Deduktif · Rantai tollens',q:'Jika harga BBM naik, ongkos angkutan naik. Jika ongkos angkutan naik, harga sayur naik. Bulan ini harga sayur tidak naik.<br>Simpulan yang tepat adalah …',o:['Harga BBM naik.','Ongkos angkutan naik.','Harga BBM tidak naik.','Harga sayur akan naik bulan depan.','Ongkos angkutan turun.'],a:2,b:'Gabungkan dulu: BBM naik → sayur naik. Sayur tidak naik, jadi (modus tollens) <b>harga BBM tidak naik</b>. "Ongkos turun" tidak bisa disimpulkan, yang pasti hanya "tidak naik".'},
{s:'pu',lv:2,t:'Deduktif · Negasi',q:'Ingkaran (negasi) dari "Semua siswa lulus ujian" adalah …',o:['Semua siswa tidak lulus ujian.','Tidak ada siswa yang lulus ujian.','Ada siswa yang tidak lulus ujian.','Sebagian siswa lulus ujian.','Semua siswa gagal ujian.'],a:2,b:'Negasi "semua … " adalah "<b>ada/sebagian … tidak …</b>". Untuk membantah "semua lulus", cukup ada satu yang tidak lulus.'},
{s:'pu',lv:2,t:'Deduktif · Kontraposisi',q:'Pernyataan yang setara (ekuivalen) dengan "Jika hujan, saya membawa payung" adalah …',o:['Jika saya membawa payung, maka hujan.','Jika tidak hujan, saya tidak membawa payung.','Jika saya tidak membawa payung, maka tidak hujan.','Hujan dan saya membawa payung.','Tidak hujan atau saya tidak membawa payung.'],a:2,b:'p → q setara dengan kontraposisinya: ~q → ~p. Jadi "<b>Jika saya tidak membawa payung, maka tidak hujan</b>". Membalik tanpa negasi (konvers) atau menegasikan tanpa membalik (invers) <i>tidak</i> setara.'},
{s:'pu',lv:2,t:'Deduktif · Tidak ada',q:'Tidak ada atlet yang merokok. Sebagian pelajar adalah atlet.<br>Simpulan yang tepat adalah …',o:['Semua pelajar tidak merokok.','Sebagian pelajar tidak merokok.','Sebagian pelajar merokok.','Semua atlet adalah pelajar.','Tidak ada pelajar yang merokok.'],a:1,b:'Pelajar yang atlet pasti tidak merokok. Kita hanya tahu tentang <i>sebagian</i> pelajar itu, jadi simpulannya <b>sebagian pelajar tidak merokok</b>. Pelajar yang bukan atlet tidak diketahui.'},
{s:'pu',lv:2,t:'Analitik · Urutan finis',q:'Enam siswa (A, B, C, D, E, F) lomba lari. E finis pertama dan D finis terakhir. A finis sebelum B. C finis tepat setelah A. F finis sebelum B.<br>B finis di urutan ke …',o:['2','3','4','5','Tidak dapat ditentukan'],a:3,b:'E = 1, D = 6. Sisa A, B, C, F di posisi 2–5. Pasangan A-C harus berurutan, dan B harus setelah A (berarti juga setelah C) dan setelah F. Jadi B selalu paling akhir di antara keempatnya: <b>posisi 5</b>.'},
{s:'pu',lv:2,t:'Analitik · Jadwal piket',q:'P, Q, R, S, T masing-masing piket satu hari dari Senin sampai Jumat. Q piket Rabu, T piket Jumat. P piket tepat sehari sebelum S. R tidak piket Senin.<br>Siapa yang piket hari Kamis?',o:['P','Q','R','S','T'],a:2,b:'Hari kosong: Senin, Selasa, Kamis untuk P, R, S. P-S harus berurutan, satu-satunya pasangan hari berurutan adalah Senin-Selasa. Jadi P Senin, S Selasa, dan <b>R Kamis</b> (sesuai syarat R tidak Senin).'},
{s:'pu',lv:2,t:'Deduktif · Silogisme negatif',q:'Semua X adalah Y. Tidak ada Y yang merupakan Z.<br>Simpulan yang tepat adalah …',o:['Semua Z adalah X.','Sebagian X adalah Z.','Tidak ada X yang merupakan Z.','Sebagian Y adalah Z.','Semua Y adalah X.'],a:2,b:'X ada di dalam Y, dan Y tidak bersentuhan dengan Z sama sekali. Jadi X juga tidak mungkin Z: <b>tidak ada X yang merupakan Z</b>.'},
{s:'pu',lv:2,t:'Kuantitatif · P & Q',q:'P = 0,6 × 45<br>Q = 3/5 × 45<br>Hubungan P dan Q yang tepat adalah …',o:PQ,a:2,b:'0,6 = 3/5, jadi keduanya sama: 27. <b>P = Q</b>. Tidak perlu menghitung kalau kamu sadar 0,6 = 3/5.'},
{s:'pu',lv:2,t:'Kuantitatif · P & Q',q:'x = 3<br>P = (x + 2)²<br>Q = x² + 4<br>Hubungan P dan Q yang tepat adalah …',o:PQ,a:0,b:'P = (3+2)² = 25. Q = 9 + 4 = 13. Jadi <b>P &gt; Q</b>. Ingat, (x+2)² ≠ x² + 4, karena (x+2)² = x² + 4x + 4.'},
{s:'pu',lv:2,t:'Kuantitatif · P & Q variabel',q:'x &gt; 0<br>P = x/2<br>Q = 2x<br>Hubungan P dan Q yang tepat adalah …',o:PQ,a:1,b:'Untuk x positif, setengahnya selalu lebih kecil dari dua kalinya. Coba x = 1: P = 0,5, Q = 2. Coba x = 10: P = 5, Q = 20. Selalu <b>P &lt; Q</b>.'},
{s:'pu',lv:2,t:'Kuantitatif · Rata-rata',q:'Rata-rata empat bilangan adalah 15. Setelah ditambah satu bilangan lagi, rata-ratanya menjadi 16. Bilangan yang ditambahkan adalah …',o:['16','18','19','20','21'],a:3,b:'Jumlah awal 4 × 15 = 60. Jumlah baru 5 × 16 = 80. Bilangan tambahan = 80 − 60 = <b>20</b>.'},
{s:'pu',lv:2,t:'Kuantitatif · Perbandingan berbalik',q:'Sebuah pekerjaan dapat diselesaikan 6 orang dalam 12 hari. Jika dikerjakan 9 orang dengan kecepatan sama, pekerjaan itu selesai dalam …',o:['6 hari','8 hari','9 hari','10 hari','18 hari'],a:1,b:'Makin banyak orang, makin cepat (berbalik nilai). Total kerja = 6 × 12 = 72 hari-orang. Dengan 9 orang: 72 ÷ 9 = <b>8 hari</b>.'},
{s:'pu',lv:2,t:'Kuantitatif · Naik lalu turun',q:'Harga sebuah barang Rp100.000 dinaikkan 20%, kemudian diturunkan 20% dari harga baru. Harga akhirnya adalah …',o:['Rp96.000','Rp100.000','Rp104.000','Rp80.000','Rp120.000'],a:0,b:'Naik 20%: 100.000 × 1,2 = 120.000. Turun 20%: 120.000 × 0,8 = <b>Rp96.000</b>. Bukan kembali ke 100.000, karena 20% kedua dihitung dari angka yang lebih besar.'},
{s:'pu',lv:2,t:'Kuantitatif · Perbandingan & selisih',tipe:'isian',q:'Perbandingan kelereng Ali dan Bima adalah 2 : 3. Selisih kelereng mereka 15 butir. Jumlah kelereng mereka berdua adalah …',a:'75',b:'Selisih bagian = 3 − 2 = 1 bagian = 15 butir. Total bagian = 5, jadi jumlah = 5 × 15 = <b>75</b>.'},
{s:'pu',lv:2,t:'Kuantitatif · Pompa air',q:'Tiga pompa yang sama dapat mengisi kolam dalam 6 jam. Jika hanya dua pompa yang bekerja, kolam penuh dalam …',o:['4 jam','8 jam','9 jam','10 jam','12 jam'],a:2,b:'Total kerja = 3 × 6 = 18 jam-pompa. Dua pompa: 18 ÷ 2 = <b>9 jam</b>.'},

/* ---------------- PPU Menengah 1 (+15) ---------------- */
{s:'ppu',lv:2,t:'Sinonim',q:'Sinonim kata <b>ambigu</b> adalah …',o:['jelas','bermakna ganda','tegas','sederhana','berlebihan'],a:1,b:'Ambigu = bisa ditafsirkan lebih dari satu cara, <b>bermakna ganda</b>.'},
{s:'ppu',lv:2,t:'Sinonim',q:'"Sumber berita itu dinilai <b>kredibel</b>."<br>Kata bercetak tebal bermakna …',o:['terkenal','dapat dipercaya','baru','mahal','resmi'],a:1,b:'Kredibel = <b>dapat dipercaya</b>. Kata bendanya kredibilitas.'},
{s:'ppu',lv:2,t:'Antonim',q:'Antonim kata <b>eksplisit</b> adalah …',o:['jelas','tersurat','implisit','terbuka','lugas'],a:2,b:'Eksplisit = dinyatakan terang-terangan (tersurat). Lawannya <b>implisit</b> = tersirat.'},
{s:'ppu',lv:2,t:'Antonim',q:'Antonim kata <b>konvensional</b> adalah …',o:['tradisional','kuno','modern','umum','resmi'],a:2,b:'Konvensional = mengikuti kebiasaan lama yang umum. Lawannya <b>modern</b> atau inovatif.'},
{s:'ppu',lv:2,t:'Analogi',q:'PENULIS : NOVEL = KOMPONIS : …',o:['penyanyi','lagu','panggung','gitar','penonton'],a:1,b:'Penulis menciptakan novel, komponis menciptakan <b>lagu</b>. Hubungannya "pencipta : karya".'},
{s:'ppu',lv:2,t:'Analogi',q:'AIR : HAUS = MAKANAN : …',o:['kenyang','lapar','dapur','piring','gizi'],a:1,b:'Air menghilangkan haus, makanan menghilangkan <b>lapar</b>. Hubungannya "penawar : kebutuhan". Kenyang adalah hasilnya, bukan yang dihilangkan.'},
{s:'ppu',lv:2,t:'Makna dalam konteks',q:'"Harga cabai di pasar sangat <b>fluktuatif</b> menjelang hari raya."<br>Kata bercetak tebal bermakna …',o:['stabil','naik-turun','sangat mahal','sangat murah','langka'],a:1,b:'Fluktuatif = berubah-ubah, <b>naik-turun</b>.'},
{s:'ppu',lv:2,t:'Makna istilah',q:'"Besarnya hadiah dibagikan secara <b>proporsional</b> sesuai kontribusi tiap anggota."<br>Kata bercetak tebal bermakna …',o:['sama rata','sebanding','acak','bertahap','rahasia'],a:1,b:'Proporsional = <b>sebanding</b>. Yang kontribusinya besar mendapat bagian besar. Bedakan dengan "sama rata".'},
{s:'ppu',lv:2,t:'Kata baku',q:'Kelompok kata yang <b>semuanya baku</b> adalah …',o:['objek, kategori, zaman','obyek, katagori, jaman','objek, katagori, zaman','obyek, kategori, zaman','objek, kategori, jaman'],a:0,b:'Bentuk baku: <b>objek</b> (bukan obyek), <b>kategori</b> (bukan katagori), <b>zaman</b> (bukan jaman).'},
{s:'ppu',lv:2,t:'Hipernim',q:'Kata yang menjadi hipernim (kata umum) dari "gitar, biola, piano" adalah …',o:['musik','alat musik','senar','konser','nada'],a:1,b:'Hipernim = kata yang maknanya mencakup kata-kata lain. Gitar, biola, dan piano semuanya termasuk <b>alat musik</b>.'},
{s:'ppu',lv:2,t:'Makna imbuhan',q:'Kata berimbuhan pe-an yang bermakna <b>tempat</b> adalah …',o:['pemandangan','pendidikan','pelabuhan','pembangunan','peraturan'],a:2,b:'<b>Pelabuhan</b> = tempat kapal berlabuh. Pendidikan dan pembangunan bermakna proses, pemandangan bermakna hal yang dipandang, peraturan bermakna hasil mengatur.'},
{s:'ppu',lv:2,t:'English vocabulary',q:'"Because of the storm, the organizers decided to <b>postpone</b> the concert."<br>The word in bold is closest in meaning to …',o:['cancel forever','delay','start','advertise','record'],a:1,b:'Postpone = menunda ke waktu lain, sama dengan <b>delay</b>. Bukan membatalkan selamanya.'},
{s:'ppu',lv:2,t:'English vocabulary',q:'"Scientists need <b>reliable</b> data before making a conclusion."<br>The word in bold means …',o:['cheap','trustworthy','old','large','secret'],a:1,b:'Reliable = dapat diandalkan, <b>trustworthy</b>.'},
{s:'ppu',lv:2,t:'Istilah ilmiah',q:'Dalam penelitian, <b>hipotesis</b> berarti …',o:['kesimpulan akhir','dugaan sementara yang akan diuji','data hasil survei','daftar pustaka','metode penelitian'],a:1,b:'Hipotesis = <b>jawaban atau dugaan sementara</b> yang kebenarannya masih harus diuji lewat penelitian.'},
{s:'ppu',lv:2,t:'Ungkapan',q:'"Sejak videonya viral, penyanyi muda itu sedang <b>naik daun</b>."<br>Makna ungkapan bercetak tebal adalah …',o:['sedang sakit','sedang terkenal','sedang memanjat pohon','sedang bangkrut','sedang berlibur'],a:1,b:'Naik daun = <b>sedang terkenal atau populer</b>.'},

/* ---------------- PBM Menengah 1 (+15) ---------------- */
{s:'pbm',lv:2,t:'Kalimat efektif · Subjek',q:'"Kepada para siswa diharapkan berkumpul di lapangan."<br>Perbaikan kalimat yang tepat adalah …',o:['Kepada siswa diharapkan berkumpul di lapangan.','Para siswa diharapkan berkumpul di lapangan.','Kepada para siswa-siswa diharapkan berkumpul.','Bagi para siswa diharapkan berkumpul di lapangan.','Diharapkan kepada para siswa berkumpul di lapangan.'],a:1,b:'Kata depan "kepada" di awal membuat kalimat tidak bersubjek. Hapus "kepada" agar "para siswa" menjadi subjek: <b>Para siswa diharapkan berkumpul di lapangan.</b>'},
{s:'pbm',lv:2,t:'Kalimat efektif · Kesejajaran',q:'"Kegiatan itu meliputi membaca, menulis, dan berhitungan."<br>Kata yang harus diperbaiki adalah …',o:['kegiatan','meliputi','membaca','menulis','berhitungan'],a:4,b:'Rincian harus sejajar bentuknya. "Membaca" dan "menulis" adalah kata kerja, jadi pasangannya <b>berhitung</b>, bukan "berhitungan".'},
{s:'pbm',lv:2,t:'Diksi · daripada',q:'"Nilai Andi lebih tinggi ___ nilai Budi."<br>Kata yang tepat adalah …',o:['dari','daripada','dengan','kepada','oleh'],a:1,b:'Untuk membandingkan, gunakan <b>daripada</b>. Kata "dari" dipakai untuk asal: "Ia datang dari Bandung."'},
{s:'pbm',lv:2,t:'Ejaan · di',q:'Penulisan "di" yang <b>semuanya</b> tepat terdapat pada kalimat …',o:['Kami dibantu oleh warga di sekitar lokasi.','Kami di bantu oleh warga disekitar lokasi.','Kami dibantu oleh warga disekitar lokasi.','Kami di bantu oleh warga di sekitar lokasi.','Kami di-bantu oleh warga di sekitar lokasi.'],a:0,b:'"Dibantu" = awalan di- pada kata kerja pasif (serangkai). "Di sekitar" = kata depan menunjukkan tempat (terpisah). Jawaban: <b>Kami dibantu oleh warga di sekitar lokasi.</b>'},
{s:'pbm',lv:2,t:'Ejaan · Titik dua',q:'Penggunaan titik dua yang tepat terdapat pada kalimat …',o:['Kami membutuhkan: meja, kursi, dan papan tulis.','Kami membutuhkan perlengkapan berikut: meja, kursi, dan papan tulis.','Kami: membutuhkan meja, kursi, dan papan tulis.','Kami membutuhkan meja: kursi, dan papan tulis.','Kami membutuhkan meja, kursi: dan papan tulis.'],a:1,b:'Titik dua dipakai setelah pernyataan <b>lengkap</b> yang diikuti rincian ("perlengkapan berikut:"). Kalau rincian itu adalah objek langsung dari kata kerja ("membutuhkan meja…"), titik dua tidak dipakai.'},
{s:'pbm',lv:2,t:'Konjungsi antarkalimat',q:'"Membaca buku menambah wawasan. ___, membaca juga melatih konsentrasi."<br>Kata penghubung yang tepat adalah …',o:['Akan tetapi','Selain itu','Oleh karena itu','Sebaliknya','Meskipun demikian'],a:1,b:'Kalimat kedua menambahkan manfaat lain, bukan pertentangan atau akibat. Penghubung penambahan: <b>Selain itu</b>.'},
{s:'pbm',lv:2,t:'Kalimat sumbang',q:'(1) Pembelajaran daring memberi siswa keleluasaan waktu. (2) Siswa dapat memutar ulang video materi kapan saja. (3) Namun, tidak semua siswa memiliki koneksi internet yang stabil. (4) Harga laptop gaming terus naik setiap tahun. (5) Karena itu, sekolah perlu menyediakan pilihan belajar luring.<br>Kalimat yang tidak padu adalah …',o:['(1)','(2)','(3)','(4)','(5)'],a:3,b:'Paragraf membahas kelebihan dan kendala belajar daring. Kalimat <b>(4)</b> tentang harga laptop gaming melenceng dari topik.'},
{s:'pbm',lv:2,t:'Urutan paragraf',q:'(1) Akibatnya, air hujan langsung mengalir ke jalan dan permukiman. (2) Banyak lahan resapan di kota berubah menjadi bangunan. (3) Karena itu, pembuatan sumur resapan perlu digalakkan. (4) Saluran air yang tidak mampu menampung pun meluap menjadi banjir.<br>Urutan yang padu adalah …',o:['2-1-4-3','1-2-4-3','2-4-1-3','3-2-1-4','2-1-3-4'],a:0,b:'Mulai dari sebab (2), lalu "Akibatnya" (1), lanjut dampaknya (4), dan solusi "Karena itu" (3). Urutannya <b>2-1-4-3</b>.'},
{s:'pbm',lv:2,t:'Kata baku · Serapan',q:'"Pemerintah melakukan ___ harga bahan pokok di seluruh provinsi."<br>Bentuk baku yang tepat adalah …',o:['standarisasi','standardisasi','standarnisasi','standarisasikan','standartisasi'],a:1,b:'Kata dasarnya <b>standar</b>, berasal dari "standard". Bentuk bakunya <b>standardisasi</b>, bukan "standarisasi".'},
{s:'pbm',lv:2,t:'Pleonasme',q:'"Pasukan itu mundur ke belakang setelah diserang."<br>Bagian yang sebaiknya dihapus agar kalimat efektif adalah …',o:['pasukan itu','mundur','ke belakang','setelah','diserang'],a:2,b:'"Mundur" sudah berarti bergerak ke belakang. Frasa <b>ke belakang</b> mubazir (pleonasme). Contoh serupa: "naik ke atas", "turun ke bawah".'},
{s:'pbm',lv:2,t:'Ejaan · Gabungan kata',q:'"Kami libur sekolah selama satu minggu pada hari raya ___."<br>Penulisan yang benar adalah …',o:['Idul Fitri','idul fitri','Idulfitri','Idul-Fitri','IdulFitri'],a:2,b:'Menurut KBBI dan EYD, nama hari raya ini ditulis serangkai: <b>Idulfitri</b>, begitu pula Iduladha.'},
{s:'pbm',lv:2,t:'Ejaan · Partikel pun',q:'Penulisan partikel "pun" yang tepat terdapat pada kalimat …',o:['Apapun yang terjadi, kami tetap berangkat.','Apa pun yang terjadi, kami tetap berangkat.','Walau pun hujan, kami tetap berangkat.','Meski pun lelah, kami tetap berangkat.','Siapapun boleh ikut berangkat.'],a:1,b:'"Pun" ditulis terpisah dari kata sebelumnya: <b>apa pun</b>, siapa pun. Kecuali pada kata penghubung yang sudah padu: walaupun, meskipun, adapun.'},
{s:'pbm',lv:2,t:'Ejaan · Bilangan',q:'Penulisan bilangan yang tepat terdapat pada kalimat …',o:['Ibu membeli 2 lusin telur.','Ibu membeli dua lusin telur.','Ibu membeli 2 (dua) lusin telur.','Ibu membeli dua-lusin telur.','Ibu membeli ke-2 lusin telur.'],a:1,b:'Bilangan yang bisa ditulis dengan satu atau dua kata ditulis dengan huruf: <b>dua lusin</b>. Angka dipakai untuk bilangan panjang atau rincian/data.'},
{s:'pbm',lv:2,t:'Kata rujukan',q:'"Pemerintah kota membangun taman di setiap kecamatan. Langkah <b>tersebut</b> diharapkan menambah ruang bermain anak."<br>Kata "tersebut" merujuk pada …',o:['pemerintah kota','pembangunan taman di setiap kecamatan','ruang bermain anak','setiap kecamatan','anak-anak'],a:1,b:'"Langkah tersebut" merujuk pada tindakan di kalimat sebelumnya: <b>membangun taman di setiap kecamatan</b>.'},
{s:'pbm',lv:2,t:'Simpulan',q:'"Siswa yang tidur cukup cenderung lebih mudah mengingat pelajaran. Saat tidur, otak memindahkan informasi dari ingatan jangka pendek ke jangka panjang. Sebaliknya, kurang tidur membuat konsentrasi menurun keesokan harinya."<br>Simpulan yang tepat adalah …',o:['Tidur cukup penting untuk keberhasilan belajar.','Siswa harus tidur sepanjang hari.','Ingatan jangka pendek tidak penting.','Kurang tidur tidak berpengaruh.','Otak tidak bekerja saat tidur.'],a:0,b:'Seluruh paragraf menjelaskan hubungan tidur dengan kemampuan belajar. Simpulannya: <b>tidur cukup penting untuk keberhasilan belajar</b>.'},

/* ---------------- PK Menengah 1 (+15) ---------------- */
{s:'pk',lv:2,t:'Persamaan kuadrat',q:'Akar-akar persamaan x² − 7x + 12 = 0 adalah …',o:['2 dan 6','3 dan 4','−3 dan −4','1 dan 12','−2 dan −6'],a:1,b:'Cari dua bilangan yang hasil kalinya 12 dan jumlahnya 7: 3 dan 4. Jadi (x − 3)(x − 4) = 0, akarnya <b>3 dan 4</b>.'},
{s:'pk',lv:2,t:'Fungsi invers',q:'Diketahui f(x) = 3x − 2. Nilai f⁻¹(10) adalah …',o:['2','3','4','28','8'],a:2,b:'f⁻¹(10) artinya mencari x yang membuat f(x) = 10. 3x − 2 = 10 → 3x = 12 → x = <b>4</b>.'},
{s:'pk',lv:2,t:'Persamaan eksponen',q:'Jika 2<sup>x+1</sup> = 32, nilai x adalah …',o:['3','4','5','6','16'],a:1,b:'32 = 2⁵, jadi x + 1 = 5, maka x = <b>4</b>.'},
{s:'pk',lv:2,t:'SPLDV',q:'Jika 2x + y = 11 dan x + y = 7, nilai x − y adalah …',o:['1','2','3','4','7'],a:0,b:'Kurangkan kedua persamaan: (2x + y) − (x + y) = 11 − 7 → x = 4. Lalu y = 7 − 4 = 3. Jadi x − y = <b>1</b>.'},
{s:'pk',lv:2,t:'Peluang',q:'Dua koin dilempar bersamaan. Peluang muncul <b>paling sedikit satu</b> gambar adalah …',o:['1/4','1/2','2/3','3/4','1'],a:3,b:'Kemungkinan: GG, GA, AG, AA (4 kemungkinan). Yang memuat minimal satu G ada 3. Peluang = <b>3/4</b>. Cara cepat: 1 − P(tidak ada G) = 1 − 1/4.'},
{s:'pk',lv:2,t:'Permutasi unsur sama',q:'Banyak susunan huruf berbeda dari kata "BUKU" adalah …',o:['6','12','16','24','4'],a:1,b:'Ada 4 huruf dengan huruf U muncul 2 kali. Banyak susunan = 4! ÷ 2! = 24 ÷ 2 = <b>12</b>.'},
{s:'pk',lv:2,t:'Rata-rata data frekuensi',q:'Nilai ulangan: nilai 6 diperoleh 3 siswa, nilai 7 diperoleh 5 siswa, nilai 8 diperoleh 2 siswa. Rata-ratanya adalah …',o:['6,8','6,9','7','7,1','7,2'],a:1,b:'Jumlah nilai = 6×3 + 7×5 + 8×2 = 18 + 35 + 16 = 69. Banyak siswa = 10. Rata-rata = 69 ÷ 10 = <b>6,9</b>.'},
{s:'pk',lv:2,t:'Pertidaksamaan linear',q:'Bilangan bulat terkecil yang memenuhi 3x − 5 &gt; 10 adalah …',o:['4','5','6','7','15'],a:2,b:'3x &gt; 15 → x &gt; 5. Karena tanda "lebih dari" (bukan "sama dengan"), 5 tidak termasuk. Bilangan bulat terkecil: <b>6</b>.'},
{s:'pk',lv:2,t:'Kecukupan data',q:'Berapakah luas persegi panjang ABCD?<br>(1) Kelilingnya 20 cm.<br>(2) Selisih panjang dan lebarnya 2 cm.',o:KD,a:2,b:'(1) saja: p + l = 10, banyak kemungkinan. (2) saja: p − l = 2, juga banyak. Digabung: p = 6, l = 4, luas 24 cm². Jadi <b>dua pernyataan bersama-sama cukup</b>.'},
{s:'pk',lv:2,t:'Kecukupan data',q:'Apakah x &gt; y?<br>(1) x = 2y<br>(2) y &gt; 0',o:KD,a:2,b:'(1) saja: kalau y = 3 → x = 6 &gt; y, tetapi kalau y = −3 → x = −6 &lt; y. Belum pasti. (2) saja tidak memuat x. Digabung: y positif dan x = 2y, jadi x pasti lebih besar. <b>Keduanya bersama-sama cukup</b>.'},
{s:'pk',lv:2,t:'Barisan geometri',q:'Suku pertama suatu barisan geometri adalah 3 dengan rasio 2. Suku ke-6 adalah …',o:['48','64','96','192','36'],a:2,b:'Uₙ = a · rⁿ⁻¹. U₆ = 3 × 2⁵ = 3 × 32 = <b>96</b>.'},
{s:'pk',lv:2,t:'Logaritma',q:'Jika log 2 = 0,301, nilai log 8 adalah …',o:['0,602','0,903','2,408','0,301','1,204'],a:1,b:'log 8 = log 2³ = 3 × log 2 = 3 × 0,301 = <b>0,903</b>.'},
{s:'pk',lv:2,t:'Lingkaran',q:'Keliling lingkaran dengan jari-jari 14 cm adalah … (π = 22/7)',o:['44 cm','88 cm','154 cm','616 cm','28 cm'],a:1,b:'Keliling = 2πr = 2 × 22/7 × 14 = <b>88 cm</b>. 616 adalah luasnya (jebakan).'},
{s:'pk',lv:2,t:'Persen terbalik',q:'Jika 30% dari suatu bilangan adalah 45, bilangan itu adalah …',o:['13,5','75','135','150','180'],a:3,b:'0,3 × x = 45 → x = 45 ÷ 0,3 = <b>150</b>.'},
{s:'pk',lv:2,t:'Deret bilangan ganjil',tipe:'isian',q:'Jumlah 10 bilangan ganjil positif pertama (1 + 3 + 5 + … ) adalah …',a:'100',b:'Jumlah n bilangan ganjil pertama selalu n². Jadi 10² = <b>100</b>. Bisa dicek: 1+3 = 4 = 2², 1+3+5 = 9 = 3².'},

/* ---------------- LBI Menengah 1 (+25) ---------------- */
{s:'lbi',lv:2,p:'lbi_m1',t:'Gagasan utama',q:'Gagasan utama teks tersebut adalah …',o:['Kendaraan listrik tidak mengeluarkan asap knalpot.','Kendaraan listrik baru efektif mengurangi polusi jika disertai energi bersih dan pengendalian sumber polusi lain.','Pembangkit batu bara harus ditutup.','Polusi udara kota hanya berasal dari industri.','Pemerintah menolak kendaraan listrik.'],a:1,b:'Paragraf pertama menyebut manfaat, paragraf kedua menyebut batasannya, lalu ditutup dengan simpulan bersyarat. Gagasan utamanya opsi tersebut.'},
{s:'lbi',lv:2,p:'lbi_m1',t:'Makna frasa',q:'Maksud kalimat "polusi tidak hilang, melainkan berpindah" adalah …',o:['polusi lenyap sepenuhnya','sumber polusinya bergeser dari jalan raya ke sekitar pembangkit listrik','polusi pindah ke negara lain','kendaraan listrik lebih berpolusi daripada mobil biasa','udara kota menjadi bersih'],a:1,b:'Konteksnya: listrik berasal dari pembangkit batu bara. Jadi asap tidak keluar dari knalpot, tetapi dari <b>pembangkit</b>.'},
{s:'lbi',lv:2,p:'lbi_m1',t:'Detail',q:'Menurut kajian yang disebut dalam teks, sekitar 40% polusi udara kota besar berasal dari …',o:['kendaraan listrik','pembangkit listrik tenaga surya','industri, pembakaran sampah, dan debu konstruksi','asap knalpot sepeda motor','kebakaran hutan di luar kota'],a:2,b:'Teks menyebut sekitar 40% polusi berasal dari <b>industri, pembakaran sampah, dan debu konstruksi</b>. Ini alasan para ahli bilang mengganti kendaraan saja tidak cukup.'},
{s:'lbi',lv:2,p:'lbi_m1',t:'Sikap penulis',q:'Sikap para ahli dalam teks terhadap kendaraan listrik adalah …',o:['menolak sepenuhnya','mendukung tanpa syarat','mendukung dengan catatan','tidak peduli','meragukan teknologinya'],a:2,b:'Para ahli tidak menolak, tetapi mengingatkan syarat agar efektif. Itu sikap <b>mendukung dengan catatan</b>.'},
{s:'lbi',lv:2,p:'lbi_m1',t:'Memperkuat argumen',q:'Pernyataan yang paling MEMPERKUAT pendapat para ahli adalah …',o:['Penjualan kendaraan listrik naik dua kali lipat.','Kota yang memakai kendaraan listrik tetapi listriknya dari batu bara tidak mengalami perbaikan kualitas udara yang berarti.','Kendaraan listrik lebih senyap.','Harga baterai semakin murah.','Banyak warga menyukai desain kendaraan listrik.'],a:1,b:'Para ahli berpendapat kendaraan listrik saja tidak cukup. Bukti bahwa udara tidak membaik tanpa energi bersih <b>memperkuat</b> pendapat itu.'},
{s:'lbi',lv:2,p:'lbi_m2',t:'Tujuan kebijakan',q:'Menurut teks, tujuan sistem zonasi adalah …',o:['menaikkan nilai ujian nasional','pemerataan dan mengurangi perjalanan jauh siswa','menutup sekolah favorit','memudahkan orang tua pindah rumah','menambah jumlah guru'],a:1,b:'Kalimat kedua paragraf pertama: tujuannya <b>pemerataan</b>, dan siswa tidak perlu menempuh perjalanan jauh.'},
{s:'lbi',lv:2,p:'lbi_m2',t:'Masalah',q:'Berikut ini yang BUKAN masalah zonasi menurut teks adalah …',o:['pemindahan alamat di kartu keluarga','jumlah sekolah negeri yang kurang di beberapa wilayah','anak tidak tertampung meski rumahnya dekat','biaya sekolah negeri yang terlalu mahal','ketimpangan kualitas guru'],a:3,b:'Teks tidak menyebut <b>biaya sekolah</b>. Masalah lainnya disebut langsung atau tersirat (pemerataan kualitas guru).'},
{s:'lbi',lv:2,p:'lbi_m2',t:'Makna kata',q:'Kata <b>menuai</b> pada frasa "menuai keluhan" bermakna …',o:['memanen padi','mendapatkan atau menimbulkan','menolak','menyembunyikan','mengurangi'],a:1,b:'Di sini "menuai" dipakai secara kiasan: kebijakan itu <b>mendapatkan/menimbulkan</b> keluhan.'},
{s:'lbi',lv:2,p:'lbi_m2',t:'Simpulan',q:'Simpulan pengamat pendidikan dalam teks adalah …',o:['Zonasi harus dihapus.','Konsep zonasi benar, tetapi perlu didukung pemerataan kualitas guru dan penambahan sekolah.','Sekolah favorit harus diperbanyak.','Orang tua tidak boleh pindah rumah.','Zonasi hanya cocok untuk kota besar.'],a:1,b:'Kalimat terakhir: zonasi tidak salah secara konsep, tetapi perlu diiringi pemerataan kualitas guru dan penambahan sekolah.'},
{s:'lbi',lv:2,p:'lbi_m2',t:'Inferensi',q:'Mengapa ada orang tua yang memindahkan alamat dalam kartu keluarga?',o:['agar mendapat bantuan pemerintah','agar anaknya masuk zona sekolah yang diinginkan','karena rumahnya dijual','karena diwajibkan sekolah','agar dekat dengan tempat kerja'],a:1,b:'Teks menyebut tujuannya secara langsung: <b>agar anaknya masuk zona sekolah tertentu</b>. Ini menunjukkan sekolah favorit masih diincar.'},
{s:'lbi',lv:2,p:'lbi_m3',t:'Detail',q:'Menurut teks, di mana sebagian besar makanan terbuang?',o:['di ladang','di pasar','di rumah tangga dan rumah makan','di pabrik','di kapal pengangkut'],a:2,b:'Teks: sebagian besar terbuang "bukan di ladang atau pasar, melainkan di tingkat <b>rumah tangga dan rumah makan</b>".'},
{s:'lbi',lv:2,p:'lbi_m3',t:'Sebab',q:'Berikut ini yang disebut sebagai penyebab makanan terbuang, KECUALI …',o:['membeli bahan berlebihan','porsi terlalu besar','anggapan tidak sopan jika piring tamu kosong','harga makanan terlalu murah','kebiasaan menghidangkan banyak makanan'],a:3,b:'Teks tidak menyebut <b>harga yang terlalu murah</b>. Penyebab lain disebut di paragraf kedua.'},
{s:'lbi',lv:2,p:'lbi_m3',t:'Hubungan sebab-akibat',q:'Menurut teks, mengapa makanan yang terbuang berbahaya bagi lingkungan?',o:['karena menarik hewan liar','karena membusuk dan menghasilkan gas metana yang memperparah pemanasan global','karena mencemari air minum','karena memenuhi rumah warga','karena mengeluarkan bau tidak sedap'],a:1,b:'Teks menyebut makanan yang membusuk di tempat pembuangan menghasilkan <b>gas metana</b> yang memperparah pemanasan global.'},
{s:'lbi',lv:2,p:'lbi_m3',t:'Data',q:'Jika satu keluarga terdiri atas 4 orang dan masing-masing membuang makanan sesuai batas bawah perkiraan, berapa kilogram makanan dibuang keluarga itu per tahun?',o:['115 kg','184 kg','460 kg','736 kg','299 kg'],a:2,b:'Batas bawah = 115 kg per orang. 4 × 115 = <b>460 kg</b>.'},
{s:'lbi',lv:2,p:'lbi_m3',t:'Solusi',q:'Upaya komunitas yang disebut di akhir teks bertujuan …',o:['menjual makanan sisa','menyalurkan makanan berlebih kepada yang membutuhkan sebelum kedaluwarsa','membuat pupuk dari sampah makanan','menutup restoran yang boros','menghukum hotel'],a:1,b:'Kalimat terakhir menjelaskan komunitas <b>menyalurkan makanan berlebih</b> dari hotel dan restoran kepada warga yang membutuhkan.'},
{s:'lbi',lv:2,p:'lbi_m4',t:'Gagasan utama',q:'Gagasan utama paragraf kedua adalah …',o:['Bekerja paruh waktu selalu merugikan pelajar.','Dampak kerja paruh waktu pada belajar bergantung pada banyaknya jam kerja.','Pelajar tidak boleh bekerja.','Konselor sekolah melarang pelajar bekerja.','Survei dilakukan pada 600 pelajar.'],a:1,b:'Paragraf membandingkan pelajar yang bekerja lebih dari 15 jam dan di bawah 10 jam per minggu. Intinya: <b>dampaknya bergantung pada jam kerja</b>.'},
{s:'lbi',lv:2,p:'lbi_m4',t:'Detail',q:'Pelajar yang bekerja di bawah 10 jam per minggu …',o:['nilainya turun drastis','tidak menunjukkan penurunan nilai yang berarti','selalu mengantuk di kelas','tidak naik kelas','berhenti sekolah'],a:1,b:'Teks: mereka "tidak menunjukkan penurunan nilai yang berarti".'},
{s:'lbi',lv:2,p:'lbi_m4',t:'Makna kata',q:'Kata <b>cenderung</b> dalam teks bermakna …',o:['pasti','sering atau lebih mungkin','tidak pernah','jarang','dipaksa'],a:1,b:'Cenderung = <b>lebih mungkin/sering</b>, tetapi tidak pasti. Ini bahasa hati-hati yang khas laporan survei.'},
{s:'lbi',lv:2,p:'lbi_m4',t:'Inferensi',q:'Pelajar yang bekerja 12 jam per minggu, berdasarkan teks, …',o:['pasti mengalami penurunan nilai','pasti tidak terpengaruh','tidak dapat dipastikan dampaknya karena berada di antara dua kelompok yang diteliti','harus berhenti bekerja','akan mendapat nilai lebih tinggi'],a:2,b:'Teks hanya membahas "lebih dari 15 jam" dan "di bawah 10 jam". 12 jam berada di antaranya, jadi <b>dampaknya tidak dapat dipastikan</b> dari data yang ada.'},
{s:'lbi',lv:2,p:'lbi_m4',t:'Saran',q:'Saran konselor sekolah dalam teks adalah …',o:['berhenti bekerja sepenuhnya','bekerja hanya saat libur panjang','membatasi jam kerja dan tidak bekerja pada malam sebelum ujian','bekerja di malam hari agar tidak mengganggu sekolah','mencari pekerjaan bergaji tinggi'],a:2,b:'Kalimat terakhir memuat saran itu secara langsung.'},
{s:'lbi',lv:2,p:'lbi_m5',t:'Gagasan utama',q:'Gagasan utama teks tersebut adalah …',o:['Mangrove hanya berguna untuk nelayan.','Mangrove memiliki banyak manfaat, tetapi luasnya terus berkurang.','Tambak udang lebih menguntungkan daripada mangrove.','Tsunami sering terjadi di Indonesia.','Mangrove tumbuh di pegunungan.'],a:1,b:'Teks memaparkan manfaat mangrove (pelindung pantai, tempat ikan berkembang biak, penyimpan karbon), lalu menyebut kerusakannya.'},
{s:'lbi',lv:2,p:'lbi_m5',t:'Detail',q:'Bagaimana mangrove melindungi pantai dari abrasi?',o:['dengan menyerap air laut','dengan akarnya yang rapat menahan lumpur dan meredam gelombang','dengan menurunkan suhu air','dengan menarik ikan','dengan mengeluarkan zat kimia'],a:1,b:'Kalimat kedua paragraf pertama: <b>akarnya yang rapat menahan lumpur dan meredam gelombang</b>.'},
{s:'lbi',lv:2,p:'lbi_m5',t:'Makna kata',q:'Kata <b>abrasi</b> dalam teks bermakna …',o:['pasang air laut','pengikisan pantai oleh gelombang','penanaman pohon','pencemaran air','pendangkalan sungai'],a:1,b:'Abrasi = <b>pengikisan daratan pantai oleh gelombang laut</b>. Petunjuknya ada di paragraf pertama: "pantai tidak mudah terkikis".'},
{s:'lbi',lv:2,p:'lbi_m5',t:'Inferensi',q:'Mengapa hasil tangkapan nelayan menurun ketika mangrove hilang?',o:['karena nelayan malas melaut','karena tempat berkembang biak ikan, kepiting, dan udang ikut hilang','karena laut menjadi lebih dalam','karena harga ikan turun','karena tambak memakan ikan'],a:1,b:'Paragraf kedua menyebut mangrove adalah tempat berkembang biak ikan, kepiting, dan udang. Kalau mangrove hilang, <b>tempat berkembang biaknya hilang</b>.'},
{s:'lbi',lv:2,p:'lbi_m5',t:'Perbandingan',q:'Menurut teks, dibandingkan hutan daratan, mangrove …',o:['menyimpan karbon lebih sedikit','menyimpan karbon jauh lebih banyak per hektare','tidak menyimpan karbon','lebih mudah ditebang','tumbuh lebih lambat'],a:1,b:'Teks: mangrove "menyimpan karbon jauh lebih banyak per hektare dibandingkan hutan daratan".'},

{s:'lbe',lv:2,p:'lbe_m1',t:'Detail',q:'According to the text, why do some shoppers buy thicker plastic bags?',o:['To carry heavy items','To line their trash bins','To sell them again','To protect the environment','Because they are cheaper'],a:1,b:'"Some shoppers now buy thicker plastic bags <b>to line their trash bins</b>."'},

{s:'lbe',lv:2,p:'lbe_m1',t:'Inference',q:'What can be inferred about paper bags?',o:['They have no environmental cost.','They are not automatically better for the environment.','They are banned in many cities.','They are made from plastic.','They are cheaper to produce than plastic bags.'],a:1,b:'Teks menyebut kantong kertas butuh lebih banyak energi dan air. Artinya <b>belum tentu lebih ramah lingkungan</b>.'},
{s:'lbe',lv:2,p:'lbe_m1',t:'Author\'s purpose',q:'The researchers mentioned in the last sentence suggest that …',o:['bans should be cancelled','people should switch to paper bags','people should reuse the same bag many times','plastic should be thicker','shops should give free bags'],a:2,b:'Kalimat terakhir: solusi terbaik adalah <b>encouraging people to reuse the same bag many times</b>.'},

{s:'lbe',lv:2,p:'lbe_m2',t:'Detail · Problem',q:'Why is it harder for teachers to notice confused students online?',o:['Because the lessons are too short','Because many students turn off their cameras','Because teachers are not trained','Because students ask too many questions','Because the internet is too fast'],a:1,b:'"…because many students <b>turn off their cameras</b>."'},

{s:'lbe',lv:2,p:'lbe_m2',t:'Definition',q:'According to the text, "blended learning" is …',o:['learning only at home','learning only at school','a mix of face-to-face classes and online materials','learning with music','a new type of camera'],a:2,b:'Teks mendefinisikannya: <b>combines face-to-face classes with online materials</b>.'},
{s:'lbe',lv:2,p:'lbe_m2',t:'Tone',q:'The author\'s attitude toward online learning is …',o:['completely negative','completely positive','balanced, showing both benefits and problems','angry','uninterested'],a:2,b:'Penulis menyebut kelebihan dan kekurangannya, lalu solusi tengah. Sikapnya <b>seimbang</b>.'},

pu:{id:'pu-b2',judul:'Jebakan Logika: Negasi, Kontraposisi, "Tidak Dapat Disimpulkan"',lv:2,menit:14,isi:`
 <p>Di level Menengah, soal deduktif mulai sering menjebak dengan tiga hal: <b>negasi</b>, <b>pernyataan setara</b>, dan soal yang jawabannya justru <b>"tidak dapat disimpulkan"</b>. Kuasai tiga ini, nilai PU-mu naik drastis.</p>
 <h3>1. Negasi (ingkaran)</h3>
 <table class="dtable"><tr><th>Pernyataan</th><th>Negasinya</th></tr>
 <tr><td>Semua A adalah B</td><td>Ada A yang <b>bukan</b> B</td></tr>
 <tr><td>Ada A yang B</td><td><b>Semua</b> A bukan B (tidak ada A yang B)</td></tr>
 <tr><td>p dan q</td><td>tidak p <b>atau</b> tidak q</td></tr>
 <tr><td>p atau q</td><td>tidak p <b>dan</b> tidak q</td></tr>
 <tr><td>Jika p, maka q</td><td>p <b>dan</b> tidak q</td></tr></table>
 <div class="callout warn">Negasi "Semua siswa lulus" <b>bukan</b> "Semua siswa tidak lulus". Untuk membantah "semua", cukup satu pengecualian.</div>
 <h3>2. Pernyataan yang setara</h3>
 <p>"Jika p, maka q" setara dengan:</p>
 <ul><li><b>Kontraposisi</b>: Jika tidak q, maka tidak p. ✅</li><li>Tidak p atau q. ✅</li></ul>
 <p>Yang <b>tidak setara</b>: konvers (jika q maka p) dan invers (jika tidak p maka tidak q). Ingat contoh: "Jika hujan, jalan basah" tidak sama dengan "Jika jalan basah, hujan", karena jalan bisa basah disiram.</p>
 <h3>3. Kapan jawabannya "tidak dapat disimpulkan"?</h3>
 <p>Kalau kedua premis memakai "sebagian", atau penghubung kedua kelompok tidak pasti. Contoh: "Semua A adalah B. Sebagian B adalah C." Bagian B yang C bisa saja bukan A. Gambar lingkarannya: kalau bisa digambar dua cara dengan hasil berbeda, berarti tidak pasti.</p>
 ${ex('Semua dokter rajin. Sebagian orang rajin suka membaca. Simpulan?','"Sebagian orang rajin" belum tentu dokter. Jadi <b>tidak dapat disimpulkan</b> apakah dokter suka membaca.')}
 ${tip('Gambar diagram lingkaran kecil di kertas buram. Untuk soal "semua/sebagian/tidak ada", 10 detik menggambar lebih cepat daripada 1 menit menebak.')}
 `},

pk:{id:'pk-b2',judul:'Persamaan Kuadrat, Eksponen, dan Kecukupan Data',lv:2,menit:15,isi:`
 <p>Tiga topik ini hampir pasti muncul di PK. Kabar baiknya, polanya bisa dihafal.</p>
 <h3>Persamaan kuadrat: cara faktor</h3>
 <p>Untuk x² + bx + c = 0, cari dua bilangan yang <b>dikali = c</b> dan <b>dijumlah = b</b>.</p>
 <p>Contoh x² − 7x + 12 = 0 → dua bilangan: −3 dan −4 (dikali 12, dijumlah −7) → (x − 3)(x − 4) = 0 → x = 3 atau x = 4.</p>
 <div class="callout"><b>Cara cepat tanpa mencari akar:</b> jumlah akar = −b/a, hasil kali akar = c/a. Untuk x² − 7x + 12: jumlah 7, hasil kali 12.</div>
 <h3>Eksponen</h3>
 <ul><li>Samakan bilangan pokok: 32 = 2⁵, 27 = 3³, 125 = 5³.</li><li>Kalau 2ᵃ = 2ᵇ, maka a = b.</li><li>a⁰ = 1 ; a⁻ⁿ = 1/aⁿ ; √a = a^½</li></ul>
 <h3>Kecukupan data: cara kerja</h3>
 <ol class="steps"><li>Cek pernyataan (1) sendirian. Bisa dapat <b>satu</b> jawaban pasti?</li><li>Cek pernyataan (2) sendirian.</li><li>Kalau dua-duanya gagal, gabungkan.</li><li>Untuk pertanyaan "apakah…?", jawaban pasti "ya" atau pasti "tidak" sama-sama dianggap cukup.</li></ol>
 <div class="callout warn">Jebakan klasik: x = 2y. Apakah x &gt; y? Belum tentu! Kalau y negatif, x malah lebih kecil. Selalu uji angka negatif dan nol.</div>
 ${ex('Apakah n genap? (1) 3n genap (2) n + 1 ganjil','(1) 3n genap → n pasti genap (3 ganjil). Cukup. (2) n + 1 ganjil → n genap. Cukup. Jawaban: <b>masing-masing cukup</b>.')}
 ${tip('Di soal kecukupan data, kamu tidak perlu menghitung jawaban akhirnya. Berhenti begitu kamu yakin jawabannya tunggal. Hemat waktu!')}
