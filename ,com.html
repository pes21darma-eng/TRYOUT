<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23d8f23f'/%3E%3Cpath d='M21 9.5 12 5 3 9.5l9 4.5 9-4.5zM7 11.5v4c2.6 2 7.4 2 10 0v-4' fill='none' stroke='%230f1e16' stroke-width='2' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{
  --forest:#0f2419;--forest2:#143022;--forest3:#1c3d2b;--lime:#d8f23f;--lime2:#c4df2c;
  --ink:#0f1e16;--paper:#fcfdf8;--cream:#f2f4ec;--muted:#5b6a60;--line:#0f1e16;
  --yellow:#ffd23f;--blue:#7cc6ff;--orange:#ff9b5e;--purple:#b9a3ff;--pink:#ff9fd2;--green:#7fe0a5;--teal:#6fdcd2;--red:#ff6b6b;
  --ok:#1f9d55;--bad:#e5484d;
  --sh:4px 4px 0 var(--ink);--sh-lg:6px 6px 0 var(--ink);
  --fd:'Bricolage Grotesque',system-ui,sans-serif;--fb:'Plus Jakarta Sans',system-ui,sans-serif;--fh:'Caveat',cursive;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--fb);color:var(--ink);background:var(--forest);-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font:inherit}
a{color:inherit;text-decoration:none}
svg.ic{width:1em;height:1em;flex:none;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
h1,h2,h3,.fd{font-family:var(--fd);letter-spacing:-.03em}
::selection{background:var(--lime);color:var(--ink)}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:.55em;font-weight:800;border-radius:999px;padding:.85em 1.5em;border:2px solid var(--ink);transition:transform .15s,box-shadow .15s,background .15s;white-space:nowrap;font-size:15px}
.btn-lime{background:var(--lime);color:var(--ink);box-shadow:0 4px 0 var(--ink)}
.btn-lime:hover{transform:translateY(-2px);box-shadow:0 6px 0 var(--ink)}
.btn-lime:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.btn-dark{background:var(--ink);color:var(--lime);box-shadow:0 4px 0 #000}
.btn-dark:hover{transform:translateY(-2px)}
.btn-white{background:#fff;box-shadow:0 4px 0 var(--ink)}
.btn-white:hover{transform:translateY(-2px);box-shadow:0 6px 0 var(--ink)}
.btn-ghost{border-color:transparent;padding:.6em .9em}
.btn-sm{font-size:13px;padding:.55em 1.05em}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn .ic{transition:transform .2s}.btn:hover .ic-arr{transform:translateX(4px)}

/* ---------- LANDING ---------- */
.landing{background:var(--forest);color:#eef5e6;min-height:100vh;position:relative}
.grid-bg{position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(rgba(216,242,63,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(216,242,63,.07) 1px,transparent 1px);background-size:56px 56px;-webkit-mask-image:radial-gradient(ellipse 80% 70% at 30% 40%,#000 30%,transparent 80%);mask-image:radial-gradient(ellipse 80% 70% at 30% 40%,#000 30%,transparent 80%)}
.glow{position:absolute;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,rgba(216,242,63,.16),transparent 65%);filter:blur(10px);pointer-events:none;animation:drift 14s ease-in-out infinite}
@keyframes drift{50%{transform:translate(60px,40px) scale(1.1)}}
.nav{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:16px 6vw;transition:background .3s,backdrop-filter .3s}
.nav.scrolled{background:rgba(15,36,25,.82);backdrop-filter:blur(14px);border-bottom:1px solid rgba(216,242,63,.12)}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--fd);font-weight:800;font-size:22px;letter-spacing:-.04em}
.logo-mark{width:38px;height:38px;border-radius:12px;background:var(--lime);border:2px solid var(--ink);display:grid;place-items:center;color:var(--ink);box-shadow:3px 3px 0 var(--ink);transform:rotate(-6deg);transition:transform .3s}
.logo:hover .logo-mark{transform:rotate(6deg) scale(1.06)}
.logo small{display:block;font-family:var(--fb);font-size:11px;font-weight:700;letter-spacing:0;opacity:.7;margin-top:-3px}
.nav-links{display:flex;gap:34px;font-weight:700;font-size:15px}
.nav-links a{position:relative;opacity:.9}
.nav-links a:after{content:'';position:absolute;left:0;bottom:-6px;height:2px;width:0;background:var(--lime);transition:width .25s}
.nav-links a:hover:after{width:100%}
.nav-r{display:flex;align-items:center;gap:14px;font-weight:700}
.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:#8a5a4a;color:#fff;border:2px solid rgba(255,255,255,.4);font-size:15px;flex:none}

.hero{position:relative;padding:60px 6vw 90px;display:grid;grid-template-columns:1.05fr 1fr;gap:30px;align-items:center;min-height:calc(100vh - 74px)}
.eyebrow{display:inline-flex;align-items:center;gap:12px;color:var(--lime);font-weight:800;font-size:14px}
.eyebrow:after{content:'';width:46px;height:2px;background:var(--lime)}
.hero h1{font-size:clamp(46px,6.2vw,92px);line-height:.92;font-weight:800;margin:22px 0 28px;color:#fff}
.hero h1 .ln{display:block;overflow:hidden}
.hero h1 .ln>span{display:inline-block;transform:translateY(110%);animation:rise .9s cubic-bezier(.2,.8,.2,1) forwards}
.hero h1 .ln:nth-child(2)>span{animation-delay:.12s}.hero h1 .ln:nth-child(3)>span{animation-delay:.24s}
@keyframes rise{to{transform:none}}
.hl{white-space:nowrap;background:var(--lime);color:var(--ink);padding:.02em .22em .1em;border-radius:.16em;box-shadow:7px 7px 0 #07150e;display:inline-block;transform:rotate(-1.5deg)}
.hero p.lead{font-size:clamp(17px,1.5vw,21px);line-height:1.55;color:#c8d6c6;max-width:620px;opacity:0;animation:fade .8s .5s forwards}
@keyframes fade{to{opacity:1}}
.hero-cta{display:flex;align-items:center;gap:30px;margin:36px 0 30px;flex-wrap:wrap;opacity:0;animation:fade .8s .65s forwards}
.hero-cta .btn{font-size:18px;padding:1em 1.8em}
.ulink{font-weight:800;color:#fff;display:inline-flex;gap:8px;align-items:center;font-size:17px}
.ulink span{border-bottom:3px solid var(--lime);padding-bottom:2px}
.hero-meta{font-size:14px;color:#9fb29f;line-height:1.8;opacity:0;animation:fade .8s .8s forwards}
.hero-meta b{color:var(--lime)}

.flow{position:relative;height:620px}
.flow svg.lines{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.flow svg.lines path{stroke:var(--lime);stroke-width:2.5;stroke-dasharray:2 9;stroke-linecap:round;fill:none;opacity:.55;animation:dash 1.4s linear infinite}
@keyframes dash{to{stroke-dashoffset:-22}}
.fcard{position:absolute;width:250px;background:#fff;color:var(--ink);border-radius:20px;padding:16px;border:2px solid var(--ink);box-shadow:6px 6px 0 #07150e;--rot:0deg;transform:rotate(var(--rot));animation:floaty 6s ease-in-out infinite;transition:box-shadow .2s}
.fcard:hover{box-shadow:10px 10px 0 #07150e;z-index:5}
.fcard.lime{background:var(--lime)}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(var(--rot))}50%{transform:translateY(-12px) rotate(var(--rot))}}
.pill-dark{display:inline-flex;background:var(--ink);color:var(--lime);font-weight:800;font-size:12px;padding:6px 12px;border-radius:999px}
.fcard h4{font-family:var(--fd);font-size:17px;margin:12px 0 8px}
.fcard .mini-btn{display:inline-flex;align-items:center;gap:6px;background:var(--ink);color:var(--lime);font-size:12px;font-weight:800;padding:7px 12px;border-radius:999px;box-shadow:2px 3px 0 #0005;margin-top:10px}
.fbar{height:5px;background:#0f1e1622;border-radius:9px;overflow:hidden;margin-top:10px}.fbar i{display:block;height:100%;background:var(--ink);border-radius:9px;width:0;animation:grow 2.4s 1s ease forwards}
@keyframes grow{to{width:var(--w)}}
.chkrow{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:700;padding:7px 0;border-bottom:1px dashed #0002}
.chkrow .ok{width:20px;height:20px;border-radius:50%;background:var(--ink);color:var(--lime);display:grid;place-items:center;font-size:12px}
.timer-big{font-family:var(--fd);font-size:34px;font-weight:800;letter-spacing:-.02em}

.marquee{background:var(--lime);color:var(--ink);border-block:2px solid var(--ink);overflow:hidden;transform:rotate(-1.2deg);margin:0 -2vw;position:relative;z-index:3}
.marquee-in{display:flex;gap:46px;padding:16px 0;width:max-content;animation:mq 34s linear infinite;font-family:var(--fd);font-weight:800;font-size:24px;white-space:nowrap}
.marquee-in span{display:inline-flex;align-items:center;gap:14px}
@keyframes mq{to{transform:translateX(-50%)}}

.sec{padding:110px 6vw;position:relative}
.sec-light{background:var(--cream);color:var(--ink)}
.sec-head{max-width:760px;margin-bottom:56px}
.sec-head .tag{display:inline-flex;gap:8px;align-items:center;background:var(--ink);color:var(--lime);padding:7px 14px;border-radius:999px;font-weight:800;font-size:13px}
.sec-dark .sec-head .tag{background:var(--lime);color:var(--ink)}
.sec-head h2{font-size:clamp(36px,4.6vw,62px);line-height:1;margin:18px 0 14px;font-weight:800}
.sec-head p{font-size:18px;line-height:1.6;color:var(--muted)}
.sec-dark .sec-head p{color:#a9bba8}
.sec-dark h2{color:#fff}

.st-group{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-bottom:22px}
.st-label{grid-column:1/-1;display:flex;align-items:center;gap:12px;font-family:var(--fd);font-weight:800;font-size:22px;margin-top:16px}
.st-label .cnt{font-family:var(--fb);font-size:13px;background:#fff;border:2px solid var(--ink);padding:3px 10px;border-radius:999px}
.st-card{background:#fff;border:2px solid var(--ink);border-radius:22px;padding:22px;box-shadow:var(--sh);transition:transform .2s,box-shadow .2s;position:relative;overflow:hidden}
.st-card:hover{transform:translate(-3px,-3px) rotate(-.6deg);box-shadow:8px 8px 0 var(--ink)}
.st-card .code{position:absolute;right:-6px;top:-14px;font-family:var(--fd);font-size:76px;font-weight:800;opacity:.07}
.st-card h3{font-size:21px;margin:16px 0 6px;line-height:1.1}
.st-card p{font-size:14px;color:var(--muted);line-height:1.5}
.st-meta{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;padding:5px 10px;border-radius:999px;border:2px solid var(--ink);background:#fff}
.itile{width:46px;height:46px;border-radius:14px;border:2px solid var(--ink);display:grid;place-items:center;font-size:22px;box-shadow:2px 2px 0 var(--ink);flex:none}
.itile.sm{width:32px;height:32px;border-radius:10px;font-size:16px;box-shadow:1.5px 1.5px 0 var(--ink)}
.total-strip{display:flex;gap:16px;flex-wrap:wrap;margin-top:28px}
.total-strip .chip{font-size:14px;padding:9px 16px;background:var(--lime)}

.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:26px;position:relative}
.lvl{border-radius:26px;padding:28px;border:2px solid var(--ink);box-shadow:6px 6px 0 #07150e;color:var(--ink);position:relative;transition:transform .25s}
.lvl:hover{transform:translateY(-8px) rotate(-1deg)}
.lvl .num{font-family:var(--fd);font-size:64px;font-weight:800;line-height:1}
.lvl h3{font-size:30px;margin:4px 0 10px}
.lvl ul{list-style:none;margin-top:16px;display:grid;gap:9px;font-weight:600;font-size:15px}
.lvl li{display:flex;gap:10px;align-items:flex-start}
.lvl li .ic{margin-top:3px;flex:none}

.bento{display:grid;grid-template-columns:repeat(6,1fr);gap:20px}
.bx{background:#fff;border:2px solid var(--ink);border-radius:26px;padding:26px;box-shadow:var(--sh);overflow:hidden;position:relative;transition:transform .2s}
.bx:hover{transform:translateY(-4px)}
.bx h3{font-size:24px;margin:14px 0 8px}
.bx p{color:var(--muted);line-height:1.55;font-size:15px}
.bx.c2{grid-column:span 2}.bx.c3{grid-column:span 3}.bx.c4{grid-column:span 4}
.bx.dark{background:var(--forest);color:#fff}.bx.dark p{color:#a9bba8}
.bx.lime{background:var(--lime)}.bx.lime p{color:#2c3a10}

.demo{display:grid;grid-template-columns:1fr 1.1fr;gap:48px;align-items:center}
.demo-card{background:#fff;color:var(--ink);border:2px solid var(--ink);border-radius:26px;padding:28px;box-shadow:8px 8px 0 #07150e}

.faq{max-width:860px}
.faq details{background:#fff;border:2px solid var(--ink);border-radius:18px;margin-bottom:14px;box-shadow:3px 3px 0 var(--ink);overflow:hidden}
.faq summary{list-style:none;padding:20px 24px;font-weight:800;font-size:17px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:12px}
.faq summary::-webkit-details-marker{display:none}
.faq summary .ic{transition:transform .25s;font-size:20px}
.faq details[open] summary .ic{transform:rotate(45deg)}
.faq details p{padding:0 24px 22px;color:var(--muted);line-height:1.65}

.cta-final{background:var(--lime);color:var(--ink);border-radius:36px;border:2px solid var(--ink);padding:70px 6vw;text-align:center;box-shadow:10px 10px 0 #07150e;position:relative;overflow:hidden}
.cta-final h2{font-size:clamp(38px,5vw,70px);line-height:.98;margin-bottom:18px}
footer{padding:40px 6vw;color:#8ea28e;font-size:14px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;border-top:1px solid #ffffff12}

.rv{opacity:0;transform:translateY(34px);transition:opacity .7s cubic-bezier(.2,.8,.2,1),transform .7s cubic-bezier(.2,.8,.2,1)}
.rv.in{opacity:1;transform:none}

/* ---------- MODAL ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(6,16,11,.62);backdrop-filter:blur(6px);z-index:200;display:grid;place-items:center;padding:20px;animation:fade .2s forwards;opacity:0}
.modal{background:var(--paper);color:var(--ink);border:2px solid var(--ink);border-radius:28px;box-shadow:10px 10px 0 #07150e;width:min(460px,100%);padding:30px;position:relative;animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.85) translateY(20px);opacity:0}}
.modal h2{font-size:32px;line-height:1.05}
.modal .x{position:absolute;right:16px;top:16px;width:36px;height:36px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;background:#fff}
.tabs{display:flex;background:var(--cream);border:2px solid var(--ink);border-radius:999px;padding:4px;margin:20px 0}
.tabs button{flex:1;padding:10px;border-radius:999px;font-weight:800;font-size:14px;transition:background .2s}
.tabs button.on{background:var(--ink);color:var(--lime)}
.field{display:block;margin-bottom:14px}
.field span{display:block;font-weight:800;font-size:13px;margin-bottom:6px}
.field input{width:100%;padding:14px 16px;border:2px solid var(--ink);border-radius:14px;background:#fff;font-size:15px;outline:none;transition:box-shadow .2s}
.field input:focus{box-shadow:0 0 0 4px var(--lime)}
.err{background:#ffe1e1;border:2px solid var(--bad);color:#8a1c1c;padding:10px 14px;border-radius:12px;font-weight:700;font-size:13px;margin-bottom:12px}
.note{font-size:12px;color:var(--muted);line-height:1.5;margin-top:14px}

/* ---------- APP SHELL ---------- */
.app{display:flex;min-height:100vh;background:var(--cream);background-image:radial-gradient(#0f1e1614 1px,transparent 1px);background-size:22px 22px}
.side{width:250px;flex:none;background:#f7f8f3;border-right:1px solid #0f1e1614;padding:18px 14px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;z-index:40}
.side .logo{color:var(--ink);font-size:19px;margin:4px 6px 18px}
.side .logo-mark{width:32px;height:32px;border-radius:10px}
.search{position:relative;margin-bottom:14px}
.search input{width:100%;border:1.5px dashed #0f1e1633;border-radius:12px;padding:10px 12px 10px 38px;background:#fff;font-size:14px;outline:none}
.search input:focus{border-style:solid;border-color:var(--ink)}
.search .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.sres{position:absolute;top:110%;left:0;right:0;background:#fff;border:2px solid var(--ink);border-radius:14px;box-shadow:var(--sh);z-index:60;max-height:300px;overflow:auto;padding:6px}
.sres a{display:block;padding:9px 10px;border-radius:9px;font-size:13px;font-weight:700}
.sres a:hover{background:var(--lime)}
.sres small{display:block;color:var(--muted);font-weight:600}
.side-h{font-size:12px;font-weight:700;color:var(--muted);margin:14px 8px 6px}
.side a.it{display:flex;align-items:center;gap:11px;padding:7px 8px;border-radius:12px;font-weight:700;font-size:14px;transition:background .15s,transform .15s;margin-bottom:2px}
.side a.it:hover{background:#0f1e160d;transform:translateX(2px)}
.side a.it.on{background:var(--forest);color:#fff}
.side a.it .itile{width:30px;height:30px;border-radius:9px;font-size:15px;box-shadow:1.5px 1.5px 0 var(--ink)}
.side-user{margin-top:auto;border-top:1px solid #0f1e1614;padding-top:14px;display:flex;align-items:center;gap:10px}
.side-user .nm{font-weight:800;font-size:14px}
.side-user .bdg{display:inline-block;font-size:11px;font-weight:800;border:1.5px dashed var(--ink);border-radius:999px;padding:1px 8px;margin-top:2px}
.side-user button{margin-left:auto;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--muted)}
.side-user button:hover{background:#0f1e160f;color:var(--bad)}
.main{flex:1;min-width:0;padding:34px clamp(18px,4vw,56px) 80px}
.mtop{display:none}
.wrap{max-width:1180px;margin:0 auto}

.page-tag{display:inline-flex;align-items:center;gap:7px;background:var(--forest);color:var(--lime);font-weight:800;font-size:12px;padding:6px 12px;border-radius:999px;box-shadow:2px 2px 0 #0f1e1633}
.ptitle{font-size:clamp(38px,4.6vw,58px);font-weight:800;line-height:1;margin:14px 0 8px}
.hl2{background:var(--lime);padding:0 .14em .04em;border-radius:.14em;box-shadow:4px 4px 0 #0f1e1622;display:inline-block}
.psub{color:var(--muted);font-size:15px;line-height:1.55;max-width:640px}
.head-row{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;flex-wrap:wrap;margin-bottom:28px}

.card{background:var(--paper);border:2px solid var(--ink);border-radius:24px;box-shadow:5px 5px 0 var(--ink)}
.card-soft{background:#fff;border:1.5px solid #0f1e161f;border-radius:22px}
.grid-main{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:24px;align-items:start}
.continue{display:grid;grid-template-columns:240px minmax(0,1fr);overflow:hidden}
.continue .lft{background:#eef1e6;background-image:radial-gradient(#0f1e1633 1.2px,transparent 1.2px);background-size:14px 14px;border-right:2px solid var(--ink);display:grid;place-items:center;position:relative;padding:30px}
.continue .lft .chip{position:absolute;left:14px;top:14px}
.continue .rgt{padding:28px}
.continue h2{font-size:38px;line-height:1.02;margin:6px 0 8px}
.ring{position:relative;width:150px;height:150px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:12}
.ring .bg{stroke:#fff}.ring .fg{stroke:var(--forest);stroke-linecap:round;transition:stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1)}
.ring .val{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--fd);font-weight:800;font-size:32px}
.ring-wrap{background:#fff;border-radius:50%;border:2px solid var(--ink);padding:10px;box-shadow:4px 4px 0 var(--ink)}
.nextbox{display:flex;align-items:center;gap:12px;border:2px solid var(--ink);background:#f5fbd2;border-radius:14px;padding:10px 14px;margin:16px 0;font-weight:800;font-size:14px}
.nextbox .n{width:26px;height:26px;border-radius:8px;border:2px solid var(--ink);display:grid;place-items:center;background:var(--lime);font-size:12px}
.nextbox .r{margin-left:auto;font-size:12px}

.streak{padding:20px;position:relative}
.streak .new{position:absolute;right:14px;top:-12px;background:var(--lime);border:2px solid var(--ink);border-radius:999px;font-size:11px;font-weight:800;padding:3px 10px;transform:rotate(3deg)}
.flame-tile{width:60px;height:60px;border-radius:18px;background:var(--yellow);border:2px solid var(--ink);display:grid;place-items:center;font-size:30px;box-shadow:3px 3px 0 var(--ink);color:#e8590c}
.flame-tile.off{background:#eee;color:#bbb}
.flame-tile .ic{animation:flick 1.6s ease-in-out infinite;transform-origin:50% 90%}
@keyframes flick{0%,100%{transform:scale(1) rotate(-2deg)}50%{transform:scale(1.12) rotate(3deg)}}
.week{display:flex;justify-content:space-between;margin:16px 0 6px}
.week div{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:700;color:var(--muted)}
.week .f{font-size:18px;color:#d5d5cf}
.week .f.on{color:#ff7a1a}
.week .today span{background:var(--lime);color:var(--ink);padding:0 6px;border-radius:6px}
.hand{font-family:var(--fh);font-size:22px;color:var(--ok);line-height:1.1;margin:8px 0}
.segbar{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin:8px 0}
.segbar i{height:7px;border-radius:9px;background:#0f1e161a;border:1.5px solid #0f1e1633}
.segbar i.on{background:var(--orange);border-color:var(--ink)}

.roadmini{padding:20px}
.roadmini .row{display:flex;gap:12px;align-items:center;padding:8px 0}
.roadmini .dot{width:30px;height:30px;border-radius:50%;border:2px solid #0f1e1633;display:grid;place-items:center;font-size:11px;font-weight:800;flex:none;background:#fff}
.roadmini .dot.done{background:var(--forest);color:var(--lime);border-color:var(--ink)}
.roadmini b{font-size:14px;display:block}.roadmini small{font-size:12px;color:var(--muted)}

.mod-row{display:flex;gap:16px;overflow-x:auto;padding:6px 6px 18px;scroll-snap-type:x mandatory}
.mod-row::-webkit-scrollbar{height:8px}.mod-row::-webkit-scrollbar-thumb{background:#0f1e1633;border-radius:9px}
.mcard{flex:none;width:215px;min-height:220px;border-radius:20px;border:2px solid var(--ink);box-shadow:4px 4px 0 var(--ink);padding:16px;display:flex;flex-direction:column;scroll-snap-align:start;transition:transform .2s,box-shadow .2s;position:relative;overflow:hidden}
.mcard:hover{transform:translate(-2px,-4px);box-shadow:6px 8px 0 var(--ink)}
.mcard .num{display:inline-flex;font-weight:800;font-size:12px;border:2px solid var(--ink);border-radius:999px;padding:2px 9px;background:#fff;width:max-content}
.mcard h4{font-family:var(--fd);font-size:20px;line-height:1.08;margin:12px 0 6px}
.mcard .big{position:absolute;right:-8px;bottom:-20px;font-family:var(--fd);font-weight:800;font-size:90px;opacity:.12}
.mcard .bot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:800}
.dots{display:flex;gap:4px}.dots i{width:16px;height:7px;border-radius:9px;border:1.5px solid var(--ink);background:#fff}.dots i.on{background:var(--ink)}

.sec-card{padding:26px;margin-top:28px}
.sec-card .h{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.sec-card .h .n{font-family:var(--fd);font-weight:800;font-size:44px}
.sec-card .h h3{font-size:26px}
.pbar{height:9px;background:#0f1e1612;border-radius:9px;overflow:hidden;border:1.5px solid #0f1e1626}
.pbar i{display:block;height:100%;background:var(--forest);border-radius:9px;transition:width 1s cubic-bezier(.2,.8,.2,1)}

/* Kuis page */
.kbig{display:grid;grid-template-columns:330px 1fr;overflow:hidden;position:relative}
.kbig .lft{background:var(--lime);background-image:radial-gradient(#0f1e1622 1.2px,transparent 1.2px);background-size:14px 14px;border-right:2px solid var(--ink);padding:26px;display:flex;flex-direction:column;align-items:center;gap:16px}
.kbig .rgt{padding:30px}
.kbig h2{font-size:38px;margin:4px 0 12px}
.stk{display:flex;gap:5px;flex-wrap:wrap;justify-content:center}
.stk span{min-width:26px;padding:0 5px;height:26px;border-radius:8px;border:2px solid var(--ink);display:grid;place-items:center;font-size:10px;font-weight:800;background:#ffffff99}
.ribbon{position:absolute;right:20px;top:-1px;background:var(--lime);border:2px solid var(--ink);border-top:none;border-radius:0 0 12px 12px;font-size:12px;font-weight:800;padding:4px 12px}
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:22px}
.kcard{padding:20px;position:relative;transition:transform .2s}
.kcard:hover{transform:translateY(-4px)}
.kcard .stick{position:absolute;right:10px;top:-13px;background:var(--lime);border:2px solid var(--ink);border-radius:999px;font-size:11px;font-weight:800;padding:3px 10px;transform:rotate(5deg)}
.kcard h4{font-family:var(--fd);font-size:19px;line-height:1.1;margin:12px 0 12px}
.lvbtn{display:flex;align-items:center;justify-content:space-between;width:100%;padding:10px 12px;border:2px solid var(--ink);border-radius:13px;margin-top:8px;font-weight:800;font-size:13px;background:#fff;transition:transform .15s,background .15s}
.lvbtn:hover{transform:translateX(3px);background:#f5fbd2}
.lvbtn .sc{display:flex;align-items:center;gap:8px}
.lvbtn .sc i{display:inline-flex;gap:3px}
.lvbtn .sc i b{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--ink);background:#fff}
.lvbtn .sc i b.on{background:var(--ok);border-color:var(--ok)}
.lvbtn.perfect{background:#eaffc0}

/* Runner */
.runner{min-height:100vh;background:var(--cream);background-image:radial-gradient(#0f1e1614 1px,transparent 1px);background-size:22px 22px}
.rtop{position:sticky;top:0;z-index:30;background:var(--forest);color:#fff;display:flex;align-items:center;gap:16px;padding:12px clamp(14px,3vw,34px);border-bottom:2px solid var(--ink)}
.rtop .ttl{font-weight:800;font-size:15px;line-height:1.2}
.rtop .ttl small{display:block;color:var(--lime);font-size:12px}
.timer{margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--lime);color:var(--ink);font-family:var(--fd);font-weight:800;font-size:20px;padding:6px 16px;border-radius:999px;border:2px solid var(--ink);min-width:118px;justify-content:center}
.timer.warn{background:var(--red);color:#fff;animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
.rprog{height:6px;background:#ffffff22}.rprog i{display:block;height:100%;background:var(--lime);transition:width .4s}
.rbody{display:grid;grid-template-columns:1fr 270px;gap:24px;padding:26px clamp(14px,3vw,34px);max-width:1320px;margin:0 auto}
.qwrap{display:grid;gap:20px}
.qwrap.has-p{grid-template-columns:1fr 1fr}
.passage{padding:24px;max-height:calc(100vh - 140px);overflow:auto;position:sticky;top:90px}
.passage h4{font-family:var(--fd);font-size:20px;margin-bottom:10px}
.passage p{line-height:1.75;margin-bottom:12px;font-size:15.5px}
.qcard{padding:28px}
.qhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.qno{font-family:var(--fd);font-weight:800;font-size:15px;background:var(--ink);color:var(--lime);border-radius:10px;padding:4px 11px}
.qtext{font-size:17px;line-height:1.7;margin-bottom:20px}
.qtext b{background:#f5fbd2;padding:0 3px;border-radius:3px}
.opts{display:grid;gap:11px}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:13px 16px;border:2px solid var(--ink);border-radius:16px;background:#fff;font-size:15.5px;font-weight:600;transition:transform .12s,background .15s,box-shadow .15s;box-shadow:0 3px 0 var(--ink);line-height:1.45}
.opt:hover{transform:translateY(-2px);box-shadow:0 5px 0 var(--ink)}
.opt .L{width:32px;height:32px;border-radius:10px;border:2px solid var(--ink);display:grid;place-items:center;font-weight:800;flex:none;background:var(--cream);transition:background .15s}
.opt.sel{background:#f5fbd2}.opt.sel .L{background:var(--ink);color:var(--lime)}
.opt.right{background:#dcfce7;border-color:var(--ok)}.opt.right .L{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.wrong{background:#ffe4e4;border-color:var(--bad);animation:shake .4s}.opt.wrong .L{background:var(--bad);color:#fff;border-color:var(--bad)}
.opt.locked{pointer-events:none}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.isian{display:flex;gap:10px;flex-wrap:wrap}
.isian input{flex:1;min-width:160px;padding:14px 16px;border:2px solid var(--ink);border-radius:14px;font-size:18px;font-weight:700;outline:none}
.isian input:focus{box-shadow:0 0 0 4px var(--lime)}
.qnav{display:flex;justify-content:space-between;gap:10px;margin-top:22px;flex-wrap:wrap}
.side-nav{padding:20px;position:sticky;top:90px;align-self:start}
.side-nav h5{font-family:var(--fd);font-size:16px;margin-bottom:12px}
.ngrid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.ngrid button{aspect-ratio:1;border-radius:10px;border:2px solid var(--ink);font-weight:800;font-size:13px;background:#fff;transition:transform .12s}
.ngrid button:hover{transform:scale(1.08)}
.ngrid button.ans{background:var(--forest);color:var(--lime)}
.ngrid button.rag{background:var(--yellow)}
.ngrid button.cur{outline:3px solid var(--lime);outline-offset:2px}
.ngrid button.r{background:#dcfce7;border-color:var(--ok)}.ngrid button.w{background:#ffe4e4;border-color:var(--bad)}
.legend{display:grid;gap:6px;font-size:12px;font-weight:700;margin-top:14px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:8px}.legend i{width:14px;height:14px;border-radius:4px;border:1.5px solid var(--ink)}
.secs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.secs span{font-size:11px;font-weight:800;border:1.5px solid var(--ink);border-radius:999px;padding:3px 8px;opacity:.45}
.secs span.cur{opacity:1;background:var(--lime)}.secs span.done{opacity:.9;background:#0f1e1610;text-decoration:line-through}
.fb{margin-top:18px;border-radius:16px;padding:16px 18px;border:2px solid;line-height:1.65;font-size:15px;animation:pop .3s}
.fb.ok{background:#ecfdf3;border-color:var(--ok)}.fb.no{background:#fff1f1;border-color:var(--bad)}
.fb h5{font-family:var(--fd);font-size:18px;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.bahas{margin-top:14px;background:#f7f9ef;border:2px dashed #0f1e1640;border-radius:14px;padding:14px 16px;line-height:1.65;font-size:15px}
.bahas h6{font-size:13px;font-weight:800;margin-bottom:4px;display:flex;align-items:center;gap:6px}

/* results */
.res-hero{padding:34px;display:grid;grid-template-columns:auto 1fr;gap:34px;align-items:center;overflow:hidden;position:relative}
.score-big{font-family:var(--fd);font-size:96px;font-weight:800;line-height:.9;letter-spacing:-.05em}
.bars{display:grid;gap:12px}
.bar-row{display:grid;grid-template-columns:200px 1fr 70px;gap:14px;align-items:center;font-weight:700;font-size:14px}
.bar-row .tr{height:26px;background:#0f1e160f;border:2px solid var(--ink);border-radius:999px;overflow:hidden}
.bar-row .tr i{display:block;height:100%;border-right:2px solid var(--ink);width:0;transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
.bar-row b{font-family:var(--fd);font-size:18px;text-align:right}

/* Materi */
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:22px}
.mtile{padding:22px;transition:transform .2s,box-shadow .2s;display:block}
.mtile:hover{transform:translate(-3px,-3px);box-shadow:8px 8px 0 var(--ink)}
.mtile h3{font-size:22px;margin:14px 0 6px;line-height:1.1}
.mtile p{font-size:14px;color:var(--muted);line-height:1.5}
.lesson-list{display:grid;gap:14px}
.lrow{display:flex;align-items:center;gap:16px;padding:18px 20px;transition:transform .15s}
.lrow:hover{transform:translateX(5px)}
.lrow .n{width:44px;height:44px;border-radius:14px;border:2px solid var(--ink);display:grid;place-items:center;font-family:var(--fd);font-weight:800;font-size:18px;flex:none}
.lrow .n.done{background:var(--forest);color:var(--lime)}
.lrow h4{font-family:var(--fd);font-size:19px}
.lrow small{color:var(--muted);font-weight:600}
.lrow .go{margin-left:auto}
.reader{max-width:820px;margin:0 auto}
.reader .body{padding:clamp(22px,4vw,42px);font-size:16.5px;line-height:1.75}
.reader .body p{margin-bottom:14px}
.reader .body h3{font-size:24px;margin:26px 0 10px}
.reader .body ul,.reader .body ol{margin:0 0 16px 22px}
.reader .body li{margin-bottom:6px}
.steps{list-style:none;margin-left:0!important;counter-reset:s}
.steps li{counter-increment:s;position:relative;padding-left:40px;margin-bottom:10px!important}
.steps li:before{content:counter(s);position:absolute;left:0;top:1px;width:27px;height:27px;border-radius:8px;background:var(--lime);border:2px solid var(--ink);display:grid;place-items:center;font-weight:800;font-size:13px}
.callout{background:#f5fbd2;border:2px solid var(--ink);border-radius:16px;padding:14px 18px;margin:16px 0;box-shadow:3px 3px 0 var(--ink)}
.callout.warn{background:#fff1e6}
.dtable{width:100%;border-collapse:separate;border-spacing:0;border:2px solid var(--ink);border-radius:14px;overflow:hidden;margin:12px 0 18px;font-size:14.5px;background:#fff}
.dtable th{background:var(--forest);color:var(--lime);text-align:left;padding:10px 12px;font-weight:800}
.dtable td{padding:9px 12px;border-top:1px solid #0f1e161f}
.dtable tr:nth-child(odd) td{background:#fafbf5}
.tutor{display:flex;gap:14px;align-items:flex-start;margin:22px 0}
.tutor-av{width:62px;height:62px;flex:none;animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px) rotate(-3deg)}}
.tutor-b{background:var(--forest);color:#e8f2df;border-radius:18px 18px 18px 4px;padding:14px 18px;font-size:15px;line-height:1.6;border:2px solid var(--ink);position:relative}
.tutor-b b{color:var(--lime)}
.ex{border:2px solid var(--ink);border-radius:18px;padding:16px 18px;margin:16px 0;background:#fff;box-shadow:3px 3px 0 var(--ink)}
.chip-mini{font-size:11px;font-weight:800;background:var(--purple);border:1.5px solid var(--ink);border-radius:999px;padding:2px 9px}
.ex-q{margin:10px 0;font-weight:700}
.ex summary{cursor:pointer;font-weight:800;color:var(--ok);font-size:14px}
.ex-a{margin-top:8px;background:#f2fbe6;border-radius:10px;padding:10px 14px}

/* Pencapaian */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:18px}
.badge{padding:20px 16px;text-align:center;transition:transform .2s}
.badge:hover{transform:translateY(-4px) rotate(-1deg)}
.badge .bi{width:72px;height:72px;margin:0 auto 12px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-size:32px;box-shadow:3px 3px 0 var(--ink)}
.badge.lock{opacity:.5;filter:grayscale(1)}
.badge h5{font-family:var(--fd);font-size:16px}
.badge p{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.4}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.stat{padding:20px}
.stat .v{font-family:var(--fd);font-size:40px;font-weight:800;line-height:1}
.stat .k{font-size:13px;color:var(--muted);font-weight:700;margin-top:6px}
.heat{display:grid;grid-template-rows:repeat(7,14px);grid-auto-flow:column;grid-auto-columns:14px;gap:4px}
.heat i{border-radius:4px;background:#0f1e1612}
.heat i.on{background:var(--ok)}.heat i.today{outline:2px solid var(--ink)}

/* Tryout list */
.togrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:22px}
.tocard{padding:24px;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden;transition:transform .2s}
.tocard:hover{transform:translateY(-5px)}
.tocard .bg{position:absolute;right:-30px;top:-30px;width:130px;height:130px;border-radius:50%;opacity:.5}
.tocard h3{font-size:24px;line-height:1.05;position:relative}
.tocard .meta{display:flex;gap:8px;flex-wrap:wrap}
.hist{width:100%;border-collapse:collapse;font-size:14px}
.hist th{text-align:left;font-size:12px;color:var(--muted);padding:8px}
.hist td{padding:10px 8px;border-top:1px solid #0f1e161a;font-weight:700}

.toast-wrap{position:fixed;bottom:92px;right:22px;z-index:300;display:grid;gap:10px}
.toast{background:var(--forest);color:#fff;border:2px solid var(--ink);border-radius:16px;padding:14px 18px;box-shadow:5px 5px 0 var(--ink);font-weight:700;display:flex;align-items:center;gap:12px;animation:tin .4s cubic-bezier(.2,1.4,.4,1);max-width:360px}
.toast .ic{color:var(--lime);font-size:22px}
@keyframes tin{from{transform:translateX(120%)}}
.confetti{position:fixed;top:-20px;width:10px;height:14px;z-index:400;pointer-events:none;border:1.5px solid var(--ink);animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.empty{padding:40px;text-align:center;color:var(--muted)}
.owl-float{animation:bob 3s ease-in-out infinite}
.radar text{font-size:11px;font-weight:800;font-family:var(--fb)}

/* Responsive */
@media (max-width:1100px){
  .hero{grid-template-columns:1fr}.flow{height:560px;max-width:620px;margin:0 auto;width:100%}
  .st-group{grid-template-columns:repeat(2,1fr)}.levels{grid-template-columns:1fr}
  .bento{grid-template-columns:1fr 1fr}.bx.c2,.bx.c3,.bx.c4{grid-column:span 2}
  .demo{grid-template-columns:1fr}
  .grid-main{grid-template-columns:minmax(0,1fr)}
  .rbody{grid-template-columns:1fr}.side-nav{position:static}
  .qwrap.has-p{grid-template-columns:1fr}.passage{position:static;max-height:none}
  .stats{grid-template-columns:1fr 1fr}
}
@media (max-width:820px){
  .nav-links{display:none}
  .side{position:fixed;left:0;top:0;transform:translateX(-105%);transition:transform .3s;box-shadow:6px 0 0 #0f1e1622}
  .side.open{transform:none}
  .mtop{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:#f7f8f3;border-bottom:1px solid #0f1e1614;position:sticky;top:0;z-index:35}
  .main{padding-top:20px}
  .continue,.kbig,.res-hero{grid-template-columns:minmax(0,1fr)}
  .nav{padding:12px 5vw}.nav-r .btn-ghost{display:none}.nav .logo{font-size:18px}.nav .btn-lime{padding:.7em 1.1em;font-size:14px}
  .continue .lft{padding:46px 20px 24px}
  .continue .lft,.kbig .lft{border-right:none;border-bottom:2px solid var(--ink)}
  .bar-row{grid-template-columns:110px 1fr 54px;font-size:12px}
  .score-big{font-size:72px}
  .fcard{width:210px;padding:13px}
  .flow{height:600px}
  .st-group{grid-template-columns:1fr}
  .bento{grid-template-columns:1fr}.bx.c2,.bx.c3,.bx.c4{grid-column:span 1}
  .sec{padding:80px 5vw}
}

.owl-eyes{animation:blink 4.5s infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@media (max-width:820px){.hide-sm{display:none}}

/* ---------- Akses: Free / Member / Admin ---------- */
.chip.lockchip,.lockchip{background:var(--ink);color:var(--lime);border-color:var(--ink)}
.lvbtn.locked{background:#f1f2ec;color:#5b6a60}
.side-pill{margin-left:auto;font-size:10px;font-weight:800;background:var(--orange);border:1.5px solid var(--ink);border-radius:999px;padding:1px 7px;color:var(--ink)}
.side a.it.on .side-pill{background:var(--lime)}
.bdg.tier-member,.bdg.tier-admin{background:var(--lime);border-style:solid}

lbi1:{judul:'Perpustakaan Desa Sukamaju', isi:`<p>Perpustakaan Desa Sukamaju dulu hanya berupa satu ruangan sempit di balai desa. Koleksinya pun tak lebih dari 200 buku yang sebagian besar sudah usang. Sejak 2023, sekelompok pemuda desa menggagas program "Satu Rumah Satu Buku": setiap keluarga diajak menyumbangkan satu buku layak baca.</p><p>Dalam dua tahun, koleksi perpustakaan bertambah menjadi lebih dari 1.500 judul. Pengunjung yang semula hanya belasan orang per bulan kini mencapai 300 orang. Para pemuda juga mengadakan kelas mendongeng setiap Sabtu untuk anak-anak. Kepala desa menyebut keberhasilan ini sebagai bukti bahwa perubahan besar bisa dimulai dari langkah kecil.</p>`},
lbi2:{judul:'Ponsel dan Jam Tidur Pelajar', isi:`<p>Sebuah survei terhadap 1.200 pelajar SMA di lima kota menunjukkan bahwa 68% responden menggunakan ponsel dalam satu jam sebelum tidur. Kelompok ini rata-rata tidur 6 jam per malam, sedangkan responden yang tidak menggunakan ponsel sebelum tidur rata-rata tidur 7,5 jam.</p><p>Peneliti menduga cahaya biru dari layar menekan produksi melatonin, hormon yang membantu tubuh merasa mengantuk. Selain itu, konten media sosial yang terus diperbarui membuat otak tetap terjaga. Meski demikian, peneliti mengingatkan bahwa survei ini hanya menunjukkan hubungan, bukan sebab-akibat. Bisa jadi pelajar yang memang sulit tidur lebih cenderung membuka ponsel.</p>`},
lbi3:{judul:'Cukai Minuman Berpemanis', isi:`<p>Pemerintah berencana menerapkan cukai pada minuman berpemanis dalam kemasan (MBDK). Pendukung kebijakan ini berargumen bahwa harga yang lebih mahal akan menurunkan konsumsi gula, sebagaimana terjadi di Meksiko: penjualan minuman berpemanis di sana turun sekitar 7,6% dalam dua tahun setelah cukai diterapkan. Penurunan konsumsi diharapkan menekan angka diabetes tipe 2 yang terus meningkat.</p><p>Di sisi lain, pelaku usaha kecil khawatir cukai akan menggerus omzet mereka. Padahal, sebagian besar minuman manis yang dikonsumsi masyarakat justru dijual tanpa kemasan di warung dan kedai sehingga tidak tersentuh cukai. Karena itu, sejumlah ahli gizi mengusulkan agar cukai disertai edukasi gizi dan label peringatan kadar gula agar dampaknya tidak setengah hati.</p>`},
lbe1:{judul:'Rooftop Gardens', isi:`<p>In many crowded cities, people are turning empty rooftops into small gardens. These rooftop gardens provide fresh vegetables for local residents and help reduce the temperature of buildings during hot days.</p><p>Some schools have also started their own rooftop gardens, where students learn how to plant seeds, water crops, and compost food waste. Teachers say that students who join the program become more interested in science and healthy eating. However, building a rooftop garden is not always easy, because the roof must be strong enough to hold soil and water.</p>`},
lbe2:{judul:'The Four-Day Work Week', isi:`<p>Several companies around the world have experimented with a four-day work week, in which employees work fewer hours without a cut in pay. In a widely reported trial in the United Kingdom, most participating companies chose to continue the policy after six months.</p><p>Employees reported lower stress and better sleep, while many managers said productivity stayed the same or even improved. Critics, however, point out that the trial involved mostly office-based firms that volunteered to take part, so the results may not apply to hospitals, factories, or schools, where work cannot easily be compressed.</p>`},
lbe3:{judul:'Why Rereading Fools Us', isi:`<p>For decades, students have relied on rereading their notes as the main way to prepare for exams. Rereading feels productive because the material becomes familiar, yet familiarity is not the same as understanding.</p><p>Cognitive scientists have repeatedly found that retrieval practice — actively recalling information, for example by answering practice questions — produces far stronger long-term memory than rereading. In one well-known experiment, students who took a practice test remembered substantially more a week later than those who simply studied the passage again, even though the rereading group predicted they would perform better. This mismatch suggests that learners are often poor judges of which strategies actually work.</p>`},
pm4:{judul:'Data Penjualan Koperasi Sekolah', isi:`<p>Tabel berikut menunjukkan jumlah roti yang terjual di koperasi sekolah selama empat bulan.</p><table class="dtable"><tr><th>Bulan</th><th>Jan</th><th>Feb</th><th>Mar</th><th>Apr</th></tr><tr><td>Terjual (bungkus)</td><td>120</td><td>150</td><td>135</td><td>180</td></tr></table>`}

{s:'pu',lv:1,t:'Induktif · Pola bilangan',q:'Bilangan selanjutnya dari barisan 3, 7, 15, 31, 63, … adalah',o:['125','126','127','128','129'],a:2,b:'Polanya ×2 lalu +1: 3→7→15→31→63. Maka 63×2+1 = <b>127</b>.'},
{s:'pu',lv:1,t:'Induktif · Pola huruf',q:'Huruf selanjutnya dari pola A, C, F, J, O, … adalah',o:['S','T','U','V','W'],a:2,b:'Ubah ke angka: A=1, C=3, F=6, J=10, O=15. Selisihnya +2, +3, +4, +5, jadi berikutnya +6 → 21 = <b>U</b>.'},
{s:'pu',lv:1,t:'Deduktif · Silogisme',q:'Semua siswa kelas XII mengikuti try out. Raka adalah siswa kelas XII.<br>Simpulan yang paling tepat adalah …',o:['Raka mungkin mengikuti try out.','Raka tidak mengikuti try out.','Sebagian siswa kelas XII tidak mengikuti try out.','Raka mengikuti try out.','Semua yang mengikuti try out adalah siswa kelas XII.'],a:3,b:'Silogisme kategoris: semua A adalah B, Raka anggota A → Raka pasti B. Jadi <b>Raka mengikuti try out</b> (pasti, bukan "mungkin").'},
{s:'pu',lv:1,t:'Deduktif · Modus tollens',q:'Jika hujan turun, jalan di depan sekolah basah. Pagi ini jalan di depan sekolah tidak basah.<br>Simpulan yang tepat adalah …',o:['Hujan turun pagi ini.','Pagi ini tidak hujan.','Jalan basah karena hal lain.','Hujan turun tetapi jalan tidak basah.','Tidak dapat disimpulkan.'],a:1,b:'Pola p → q, ~q, maka ~p (modus tollens). Jalan tidak basah → <b>tidak hujan</b>.'},
{s:'pu',lv:1,t:'Kuantitatif · Perbandingan senilai',q:'Harga 3 buku tulis adalah Rp18.000. Berapakah harga 5 buku tulis yang sama?',o:['Rp25.000','Rp27.000','Rp30.000','Rp32.000','Rp36.000'],a:2,b:'Harga satu buku = 18.000 ÷ 3 = 6.000. Lima buku = 5 × 6.000 = <b>Rp30.000</b>.'},
{s:'pu',lv:1,t:'Kuantitatif · Perbandingan P & Q',q:'P = 25% dari 80<br>Q = 20<br>Hubungan P dan Q yang tepat adalah …',o:PQ,a:2,b:'P = 0,25 × 80 = 20, sama dengan Q. Jadi <b>P = Q</b>.'},
{s:'pu',lv:2,t:'Induktif · Selisih bertingkat',q:'Bilangan selanjutnya dari barisan 2, 3, 5, 9, 17, 33, … adalah',o:['49','57','63','65','66'],a:3,b:'Selisihnya 1, 2, 4, 8, 16 (dikali 2). Selisih berikutnya 32, maka 33 + 32 = <b>65</b>.'},
{s:'pu',lv:2,t:'Induktif · Pola selang-seling',q:'Dua bilangan selanjutnya dari barisan 4, 9, 7, 12, 10, 15, … adalah',o:['13, 18','12, 17','13, 17','14, 19','17, 13'],a:0,b:'Polanya bergantian +5 lalu −2: 4→9→7→12→10→15→<b>13</b>→<b>18</b>.'},
{s:'pu',lv:2,t:'Deduktif · Kuantor',q:'Semua peserta yang lolos memiliki skor di atas 600. Sebagian peserta dari SMA Harapan lolos.<br>Simpulan yang tepat adalah …',o:['Semua peserta SMA Harapan memiliki skor di atas 600.','Sebagian peserta SMA Harapan memiliki skor di atas 600.','Peserta yang skornya di atas 600 pasti lolos.','Tidak ada peserta SMA Harapan yang skornya di bawah 600.','Sebagian peserta SMA Harapan tidak lolos.'],a:1,b:'Sebagian peserta SMA Harapan termasuk kelompok "lolos", dan semua yang lolos skornya > 600. Jadi <b>sebagian peserta SMA Harapan skornya di atas 600</b>. Opsi E belum tentu benar (bisa jadi semuanya lolos).'},
{s:'pu',lv:2,t:'Analitik · Penataan posisi',q:'Lima orang (P, Q, R, S, T) mengantre. P berada di posisi pertama. R tepat di belakang Q. T berada di posisi terakhir. S tidak berada di posisi kedua.<br>Siapa yang berada di posisi kedua?',o:['P','Q','R','S','T'],a:1,b:'P = 1, T = 5. Q, R, S mengisi posisi 2–4 dengan R tepat di belakang Q. Kemungkinan: Q-R-S atau S-Q-R. Karena S tidak boleh di posisi 2, urutannya P-Q-R-S-T. Posisi kedua: <b>Q</b>.'},
{s:'pu',lv:2,t:'Kuantitatif · Rata-rata',q:'Rata-rata nilai 5 siswa adalah 70. Jika satu siswa yang bernilai 90 keluar dari kelompok, rata-rata nilai 4 siswa yang tersisa adalah …',o:['60','62,5','65','67,5','70'],a:2,b:'Jumlah awal = 5 × 70 = 350. Setelah dikurangi 90 → 260. Rata-rata baru = 260 ÷ 4 = <b>65</b>.'},
{s:'pu',lv:2,t:'Kuantitatif · Diskon bertingkat',tipe:'isian',q:'Sebuah toko memberi diskon 20%, lalu diskon tambahan 10% dari harga setelah diskon pertama. Jika harga awal Rp200.000, berapa harga akhirnya (dalam ribu rupiah)?',a:'144',b:'200 × 0,8 = 160, lalu 160 × 0,9 = <b>144</b> ribu. Ingat: diskon 20% + 10% bertingkat ≠ diskon 30%.'},
{s:'pu',lv:3,t:'Induktif · Pola angka & huruf',q:'Suku selanjutnya dari pola 2B, 4D, 8H, 16P, … adalah',o:['32F','32Z','30F','32E','64F'],a:0,b:'Angkanya dikali 2 → 32. Hurufnya mengikuti urutan alfabet sesuai angka: B=2, D=4, H=8, P=16. Urutan ke-32 = 32 − 26 = 6 → F. Jawaban <b>32F</b>.'},
{s:'pu',lv:3,t:'Induktif · Pola matriks',q:'Perhatikan pola tiga bilangan berikut:<br>(2, 5, 8) · (3, 7, 18) · (4, 9, ?)<br>Bilangan pengganti tanda tanya adalah …',o:['30','32','34','36','40'],a:1,b:'Bilangan ketiga = (pertama × kedua) − pertama. 2×5−2 = 8; 3×7−3 = 18; maka 4×9−4 = <b>32</b>.'},
{s:'pu',lv:3,t:'Deduktif · Rantai implikasi',q:'Jika Dina belajar rutin, ia lulus UTBK. Jika Dina lulus UTBK, ia kuliah di PTN. Ternyata Dina tidak kuliah di PTN.<br>Simpulan yang tepat adalah …',o:['Dina lulus UTBK tetapi tidak belajar rutin.','Dina belajar rutin tetapi tidak lulus UTBK.','Dina tidak belajar rutin.','Dina kuliah di PTS.','Dina belajar rutin.'],a:2,b:'Silogisme: belajar rutin → kuliah PTN. Lalu modus tollens: tidak kuliah PTN → <b>tidak belajar rutin</b>. Opsi D tidak ada dasarnya di premis.'},
{s:'pu',lv:3,t:'Analitik · Penataan rak',q:'Enam buku (K, L, M, N, O, P) disusun dari kiri ke kanan pada posisi 1–6. Aturannya: K paling kiri; M tepat di sebelah kanan L; N tidak bersebelahan dengan K; P di posisi ke-4.<br>Jika O berada di posisi ke-6, maka N berada di posisi …',o:['2','3','5','6','Tidak dapat ditentukan'],a:2,b:'K=1, P=4, O=6. Sisa L, M, N mengisi 2, 3, 5. Pasangan L-M harus bersebelahan → hanya (2,3). Jadi N = <b>5</b>, dan posisi 5 memang tidak bersebelahan dengan K.'},
{s:'pu',lv:3,t:'Kuantitatif · Perbandingan berantai',q:'Perbandingan uang A dan B adalah 3 : 5, sedangkan perbandingan uang B dan C adalah 2 : 3. Jika jumlah uang ketiganya Rp155.000, uang C adalah …',o:['Rp45.000','Rp50.000','Rp60.000','Rp75.000','Rp80.000'],a:3,b:'Samakan B: A:B = 6:10, B:C = 10:15 → A:B:C = 6:10:15 (total 31 bagian). Satu bagian = 155.000 ÷ 31 = 5.000. C = 15 × 5.000 = <b>Rp75.000</b>.'},
{s:'pu',lv:3,t:'Kuantitatif · Perbandingan P & Q',q:'P = jumlah semua bilangan bulat positif kelipatan 3 yang kurang dari 20<br>Q = 2<sup>6</sup><br>Hubungan P dan Q yang tepat adalah …',o:PQ,a:1,b:'P = 3+6+9+12+15+18 = 63. Q = 64. Jadi <b>P &lt; Q</b>.'},

{s:'ppu',lv:3,t:'English vocabulary',q:'"Despite the overwhelming evidence, the minister remained <b>adamant</b> that the policy had worked."<br>The word in bold means …',o:['uncertain','unshakable in opinion','apologetic','indifferent','confused'],a:1,b:'Adamant = tetap pada pendirian, tidak mau berubah meski ada bukti. Jawaban <b>unshakable in opinion</b>. Petunjuk: kata "Despite" menunjukkan sikap yang bertahan.'},

{s:'pbm',lv:1,t:'Ide pokok',q:'"Sampah plastik membutuhkan ratusan tahun untuk terurai. Selama itu, plastik dapat pecah menjadi mikroplastik yang mencemari tanah dan air. Mikroplastik bahkan telah ditemukan dalam tubuh ikan yang dikonsumsi manusia. Oleh karena itu, pengurangan penggunaan plastik sekali pakai menjadi sangat penting."<br>Ide pokok paragraf tersebut adalah …',o:['Plastik terurai dalam waktu singkat.','Ikan mengandung banyak gizi.','Pentingnya mengurangi plastik sekali pakai karena dampaknya.','Mikroplastik hanya mencemari air.','Cara mendaur ulang sampah plastik.'],a:2,b:'Paragraf deduktif-induktif dengan kalimat utama di akhir ("Oleh karena itu…"). Ide pokoknya: <b>pentingnya mengurangi plastik sekali pakai</b>.'},
{s:'pbm',lv:1,t:'Ejaan · Kata depan "di"',q:'Penulisan kata "di" yang tepat terdapat pada kalimat …',o:['Ia tinggal dirumah nenek.','Surat itu di kirim kemarin.','Buku itu diletakkan di atas meja.','Kami menunggu diluar gedung.','Pesan itu di baca oleh semua siswa.'],a:2,b:'"di" sebagai kata depan (menunjuk tempat) ditulis terpisah: di atas. "di-" sebagai awalan (kata kerja pasif) ditulis serangkai: diletakkan. Jawaban <b>C</b>.'},
{s:'pbm',lv:1,t:'Perbaikan kata',q:'"Dia mengatakan bahwa jadwal ujian akan <u>di umumkan</u> besok."<br>Bagian kalimat yang salah adalah …',o:['Dia','mengatakan','bahwa','di umumkan','besok'],a:3,b:'"di-" pada kata kerja pasif ditulis serangkai: <b>diumumkan</b>.'},
{s:'pbm',lv:2,t:'Kalimat sumbang',q:'(1) Literasi digital adalah kemampuan menggunakan teknologi secara bijak. (2) Kemampuan ini mencakup cara mencari, menilai, dan menyebarkan informasi. (3) Tanpa literasi digital, seseorang mudah termakan hoaks. (4) Harga paket data di Indonesia tergolong murah dibanding negara tetangga. (5) Karena itu, literasi digital perlu diajarkan sejak sekolah.<br>Kalimat yang tidak padu (sumbang) adalah …',o:['(1)','(2)','(3)','(4)','(5)'],a:3,b:'Semua kalimat membahas literasi digital, kecuali <b>(4)</b> yang membahas harga paket data.'},
{s:'pbm',lv:2,t:'Konjungsi',q:'"___ hujan turun sangat deras, pertandingan tetap dilanjutkan."<br>Kata penghubung yang tepat adalah …',o:['Karena','Meskipun','Sehingga','Apabila','Agar'],a:1,b:'Hubungan pertentangan/konsesif (hujan deras tetapi tetap dilanjutkan) → <b>Meskipun</b>.'},
{s:'pbm',lv:2,t:'Kalimat efektif · Subjek',q:'"Dalam rapat itu membahas anggaran sekolah."<br>Perbaikan kalimat tersebut yang paling tepat adalah …',o:['Dalam rapat itu dibahaskan anggaran sekolah.','Rapat itu membahas anggaran sekolah.','Di dalam rapat itu membahas tentang anggaran sekolah.','Dalam rapat itu, membahas anggaran sekolah.','Rapat itu, membahas mengenai anggaran sekolah.'],a:1,b:'Kalimat awal tidak bersubjek karena diawali kata depan "dalam". Hilangkan "dalam" agar "rapat itu" menjadi subjek: <b>Rapat itu membahas anggaran sekolah.</b>'},
{s:'pbm',lv:2,t:'Urutan kalimat',q:'(1) Setelah itu, adonan dimasukkan ke loyang. (2) Pertama, campurkan tepung, gula, dan telur. (3) Terakhir, panggang selama 30 menit. (4) Aduk hingga adonan rata.<br>Urutan yang padu adalah …',o:['2-4-1-3','2-1-4-3','4-2-1-3','2-4-3-1','1-2-4-3'],a:0,b:'Ikuti penanda urutan: "Pertama" (2) → aduk (4) → "Setelah itu" (1) → "Terakhir" (3). Jawaban <b>2-4-1-3</b>.'},
{s:'pbm',lv:2,t:'Ejaan · Penulisan angka',q:'Penulisan bilangan yang tepat terdapat pada kalimat …',o:['5 orang siswa terlambat hari ini.','Lima orang siswa terlambat hari ini.','Ada sekitar lima-ratus peserta.','Jarak rumahnya 2 kilo meter.','Pada abad ke 21 teknologi berkembang pesat.'],a:1,b:'Bilangan di awal kalimat ditulis dengan huruf: <b>Lima orang…</b> C → lima ratus. D → 2 kilometer. E → abad ke-21.'},
{s:'pbm',lv:3,t:'Kata tidak baku',q:'"Pemerintah berupaya menekan angka stunting. Upaya tersebut diwujudkan melalui pemberian makanan bergizi yang dilaksanakan secara masif. Namun, efektifitas program masih perlu dievaluasi."<br>Kata yang tidak baku adalah …',o:['menekan','diwujudkan','masif','efektifitas','dievaluasi'],a:3,b:'Bentuk bakunya <b>efektivitas</b> (dari "efektif" + "-itas", f berubah menjadi v). Polanya sama dengan aktif → aktivitas, kreatif → kreativitas.'},
{s:'pbm',lv:3,t:'Simpulan paragraf',q:'"Sejak pandemi, banyak perusahaan menerapkan kerja jarak jauh. Karyawan menghemat waktu perjalanan dan bisa mengatur jadwal lebih fleksibel. Namun, sebagian karyawan mengaku kesulitan memisahkan urusan kantor dan rumah, sementara kolaborasi spontan antartim berkurang."<br>Simpulan yang paling tepat adalah …',o:['Kerja jarak jauh harus dihapuskan.','Kerja jarak jauh memiliki keuntungan sekaligus tantangan.','Semua karyawan lebih produktif di rumah.','Kolaborasi tim tidak penting lagi.','Pandemi membuat perusahaan bangkrut.'],a:1,b:'Paragraf menyajikan sisi positif (hemat waktu, fleksibel) dan sisi negatif (batas kerja-rumah kabur, kolaborasi berkurang). Simpulan seimbangnya: <b>B</b>.'},
{s:'pbm',lv:3,t:'Konjungsi antarkalimat',q:'"Penelitian ini menunjukkan bahwa tidur kurang dari enam jam menurunkan konsentrasi. ___, responden yang tidur cukup mampu menyelesaikan tes 20% lebih cepat."<br>Kata penghubung yang paling tepat adalah …',o:['Akibatnya','Sebaliknya','Oleh karena itu','Dengan demikian','Bahkan'],a:1,b:'Kalimat kedua membahas kelompok yang berlawanan (tidur cukup vs kurang tidur). Penghubung kontras: <b>Sebaliknya</b>. "Akibatnya" salah karena tidur cukup bukan akibat dari kalimat pertama.'},
{s:'pbm',lv:3,t:'Kalimat rumpang',q:'"Banyak siswa menganggap belajar semalam suntuk sebelum ujian adalah strategi terbaik. ___ Otak membutuhkan waktu untuk mengonsolidasikan informasi baru, terutama saat tidur. Karena itu, belajar sedikit demi sedikit secara rutin lebih efektif."<br>Kalimat yang tepat untuk mengisi bagian rumpang adalah …',o:['Belajar semalam suntuk sangat dianjurkan oleh para ahli.','Padahal, cara tersebut justru kurang efektif untuk mengingat materi dalam jangka panjang.','Siswa juga perlu makan makanan bergizi.','Oleh sebab itu, semua siswa harus begadang.','Ujian biasanya dilaksanakan pada pagi hari.'],a:1,b:'Kalimat rumpang harus menjembatani anggapan siswa (kalimat 1) dengan bantahan ilmiah (kalimat 3). Kata "Padahal" menandai pertentangan itu. Jawaban <b>B</b>.'},
{s:'pbm',lv:3,t:'Ejaan · Gabungan kata',q:'Kelompok kata yang <b>semuanya</b> ditulis dengan benar adalah …',o:['antarkota, nonformal, pascapanen','antar kota, non formal, pasca panen','antarkota, non-formal, pasca panen','antar-kota, nonformal, pascapanen','antarkota, nonformal, pasca-panen'],a:0,b:'Unsur terikat (antar-, non-, pasca-) ditulis serangkai dengan kata yang mengikutinya: <b>antarkota, nonformal, pascapanen</b>. Tanda hubung hanya dipakai jika kata dasarnya berhuruf kapital, misalnya non-Indonesia.'},

{s:'pk',lv:1,t:'Pecahan',q:'Hasil dari 2/5 + 3/10 adalah …',o:['5/15','1/2','7/10','5/10','3/5'],a:2,b:'Samakan penyebut: 2/5 = 4/10. Jadi 4/10 + 3/10 = <b>7/10</b>.'},
{s:'pk',lv:1,t:'Persen',q:'15% dari 240 adalah …',o:['24','30','36','40','48'],a:2,b:'10% dari 240 = 24, 5% = 12. Jadi 15% = 24 + 12 = <b>36</b>.'},
{s:'pk',lv:1,t:'Persamaan linear',q:'Jika 3x − 7 = 11, maka nilai x adalah …',o:['4','5','6','7','8'],a:2,b:'3x = 11 + 7 = 18, sehingga x = <b>6</b>.'},
{s:'pk',lv:1,t:'Geometri dasar',q:'Sebuah persegi panjang memiliki panjang 12 cm dan lebar 5 cm. Kelilingnya adalah …',o:['17 cm','34 cm','60 cm','30 cm','24 cm'],a:1,b:'Keliling = 2 × (p + l) = 2 × 17 = <b>34 cm</b>. 60 adalah luasnya (jebakan).'},
{s:'pk',lv:1,t:'Perpangkatan',tipe:'isian',q:'Nilai dari 2<sup>5</sup> − 3<sup>2</sup> adalah …',a:'23',b:'2<sup>5</sup> = 32 dan 3<sup>2</sup> = 9. Jadi 32 − 9 = <b>23</b>.'},
{s:'pk',lv:2,t:'SPLDV',q:'Jika x + y = 10 dan x − y = 4, maka nilai xy adalah …',o:['21','24','16','30','12'],a:0,b:'Jumlahkan kedua persamaan: 2x = 14 → x = 7, lalu y = 3. Jadi xy = <b>21</b>.'},
{s:'pk',lv:2,t:'Peluang',q:'Sebuah dadu dilempar sekali. Peluang muncul mata dadu bilangan prima adalah …',o:['1/6','1/3','1/2','2/3','5/6'],a:2,b:'Bilangan prima pada dadu: 2, 3, 5 (ada 3). Peluangnya 3/6 = <b>1/2</b>. Ingat, 1 bukan bilangan prima.'},
{s:'pk',lv:2,t:'Fungsi komposisi',q:'Diketahui f(x) = 2x + 3. Nilai f(f(1)) adalah …',o:['7','10','13','15','11'],a:2,b:'f(1) = 5, lalu f(5) = 2(5) + 3 = <b>13</b>.'},
{s:'pk',lv:2,t:'Kecukupan data',q:'Berapakah nilai x?<br>(1) 2x + y = 12<br>(2) y = 4',o:KD,a:2,b:'(1) saja punya dua variabel, belum cukup. (2) saja tidak memuat x. Digabung: 2x + 4 = 12 → x = 4. Jadi <b>kedua pernyataan bersama-sama cukup</b>.'},
{s:'pk',lv:2,t:'Statistika · Median',tipe:'isian',q:'Median dari data 7, 3, 9, 5, 4, 8 adalah …',a:'6',b:'Urutkan dulu: 3, 4, 5, 7, 8, 9. Banyak data genap, jadi median = (5 + 7) ÷ 2 = <b>6</b>.'},
{s:'pk',lv:3,t:'Barisan aritmetika',q:'Pada suatu barisan aritmetika, U<sub>3</sub> = 11 dan U<sub>7</sub> = 23. Nilai U<sub>20</sub> adalah …',o:['59','60','62','65','68'],a:2,b:'U<sub>7</sub> − U<sub>3</sub> = 4b = 12 → b = 3. Lalu a = 11 − 2(3) = 5. U<sub>20</sub> = 5 + 19(3) = <b>62</b>.'},
{s:'pk',lv:3,t:'Pertidaksamaan kuadrat',q:'Himpunan penyelesaian dari x² − 5x + 6 &lt; 0 adalah …',o:['x &lt; 2 atau x &gt; 3','2 &lt; x &lt; 3','x &lt; −3 atau x &gt; −2','−3 &lt; x &lt; −2','x &gt; 3'],a:1,b:'Faktorkan: (x − 2)(x − 3) &lt; 0. Untuk tanda "&lt; 0", ambil daerah di antara akar: <b>2 &lt; x &lt; 3</b>.'},
{s:'pk',lv:3,t:'Kombinasi',q:'Dari 6 siswa akan dipilih 3 orang untuk tim olimpiade. Banyak cara memilih tim adalah …',o:['18','20','120','216','36'],a:1,b:'Urutan tidak diperhatikan, jadi pakai kombinasi: C(6,3) = 6!/(3!·3!) = <b>20</b>. 120 adalah permutasi (jebakan).'},
{s:'pk',lv:3,t:'Logaritma',q:'Nilai dari ²log 8 + ³log 9 − ⁵log 1 adalah …',o:['3','4','5','6','10'],a:2,b:'²log 8 = 3, ³log 9 = 2, ⁵log 1 = 0. Jadi 3 + 2 − 0 = <b>5</b>.'},
{s:'pk',lv:3,t:'Kecukupan data',q:'Apakah bilangan bulat n merupakan bilangan genap?<br>(1) n² adalah bilangan genap<br>(2) n + 3 adalah bilangan ganjil',o:KD,a:3,b:'(1) Jika n² genap, n pasti genap (kuadrat bilangan ganjil selalu ganjil) → cukup. (2) n + 3 ganjil → n genap → cukup. Jadi <b>masing-masing pernyataan saja sudah cukup</b>.'},

{s:'lbi',lv:1,p:'lbi1',t:'Ide pokok',q:'Ide pokok teks tersebut adalah …',o:['Kepala desa membangun perpustakaan baru.','Perpustakaan desa berkembang pesat berkat program sumbangan buku dari pemuda.','Anak-anak desa gemar mendengarkan dongeng.','Koleksi buku perpustakaan desa sudah usang.','Balai desa terlalu sempit untuk perpustakaan.'],a:1,b:'Seluruh teks menceritakan perubahan perpustakaan setelah program "Satu Rumah Satu Buku" yang digagas pemuda. Opsi lain hanya detail atau tidak sesuai teks.'},
{s:'lbi',lv:1,p:'lbi1',t:'Detail teks',q:'Berdasarkan teks, pernyataan yang BENAR adalah …',o:['Program dimulai oleh kepala desa pada 2023.','Koleksi bertambah tepat 1.500 buku.','Jumlah pengunjung meningkat lebih dari sepuluh kali lipat.','Kelas mendongeng diadakan setiap Minggu.','Perpustakaan pindah ke gedung baru.'],a:2,b:'Pengunjung semula belasan (paling banyak 19), kini 300. 19 × 10 = 190 &lt; 300, jadi naik <b>lebih dari sepuluh kali lipat</b>. Program digagas pemuda, koleksi menjadi lebih dari 1.500 (bukan bertambah 1.500), dan kelas mendongeng diadakan hari Sabtu.'},
{s:'lbi',lv:1,p:'lbi1',t:'Makna kata',q:'Kata <b>menggagas</b> dalam teks bermakna …',o:['menolak','mencetuskan ide','membiayai','mengawasi','meniru'],a:1,b:'Menggagas = memunculkan atau <b>mencetuskan gagasan/ide</b>.'},
{s:'lbi',lv:1,p:'lbi1',t:'Makna kalimat',q:'Kalimat "perubahan besar bisa dimulai dari langkah kecil" dalam teks merujuk pada …',o:['pembangunan gedung perpustakaan','sumbangan satu buku dari tiap keluarga','bantuan dana dari pemerintah','kunjungan 300 orang per bulan','koleksi awal 200 buku'],a:1,b:'"Langkah kecil" yang dimaksud adalah tindakan sederhana tiap keluarga: <b>menyumbang satu buku</b>. Tindakan kecil itu berujung pada hasil besar.'},
{s:'lbi',lv:1,p:'lbi1',t:'Tujuan penulis',q:'Tujuan penulis menulis teks tersebut adalah …',o:['membujuk pembaca membeli buku','mengkritik kinerja kepala desa','menginformasikan keberhasilan program literasi berbasis partisipasi warga','menjelaskan cara mendongeng','membandingkan perpustakaan desa dan kota'],a:2,b:'Teks bersifat informatif: memaparkan program dan hasilnya. Jawaban <b>C</b>.'},
{s:'lbi',lv:2,p:'lbi2',t:'Simpulan',q:'Simpulan yang paling tepat berdasarkan teks adalah …',o:['Ponsel pasti menyebabkan pelajar kurang tidur.','Penggunaan ponsel sebelum tidur berhubungan dengan durasi tidur lebih pendek, tetapi belum terbukti menjadi penyebabnya.','Pelajar yang tidur 7,5 jam tidak pernah memakai ponsel.','Melatonin membuat pelajar sulit tidur.','Survei membuktikan media sosial berbahaya.'],a:1,b:'Teks secara eksplisit menyebut survei "hanya menunjukkan hubungan, bukan sebab-akibat". Simpulan yang tidak berlebihan: <b>B</b>.'},
{s:'lbi',lv:2,p:'lbi2',t:'Data dalam teks',q:'Berapa banyak responden yang TIDAK menggunakan ponsel dalam satu jam sebelum tidur?',o:['320','384','400','816','432'],a:1,b:'100% − 68% = 32%. 32% × 1.200 = <b>384</b> orang. 816 adalah jumlah yang menggunakan ponsel (jebakan).'},
{s:'lbi',lv:2,p:'lbi2',t:'Fungsi kalimat',q:'Fungsi kalimat terakhir paragraf kedua adalah …',o:['menegaskan bahwa ponsel penyebab utama kurang tidur','memberikan penjelasan alternatif atas hubungan yang ditemukan','menyajikan data tambahan','menyimpulkan bahwa survei tidak valid','mengajak pembaca berhenti memakai ponsel'],a:1,b:'Kalimat "Bisa jadi pelajar yang memang sulit tidur lebih cenderung membuka ponsel" membalik arah sebab-akibat. Fungsinya memberi <b>penjelasan alternatif</b>.'},
{s:'lbi',lv:2,p:'lbi2',t:'Melemahkan argumen',q:'Pernyataan berikut yang paling MELEMAHKAN dugaan peneliti tentang cahaya biru adalah …',o:['Pelajar yang memakai filter cahaya biru tetap memiliki durasi tidur yang sama pendeknya.','Cahaya biru juga dipancarkan oleh matahari.','Sebagian besar pelajar memakai ponsel untuk media sosial.','Melatonin diproduksi di kelenjar pineal.','Pelajar SMA membutuhkan tidur 8–10 jam.'],a:0,b:'Jika cahaya biru penyebabnya, menyaring cahaya biru seharusnya memperbaiki tidur. Fakta bahwa durasi tidur <b>tetap pendek meski cahaya biru disaring</b> melemahkan dugaan itu.'},
{s:'lbi',lv:2,p:'lbi2',t:'Sikap penulis',q:'Sikap peneliti terhadap hasil surveinya dapat digambarkan sebagai …',o:['emosional','berhati-hati','meremehkan','pesimistis','acuh tak acuh'],a:1,b:'Peneliti mengingatkan keterbatasan surveinya (korelasi ≠ kausalitas). Itu sikap ilmiah yang <b>berhati-hati</b>.'},
{s:'lbi',lv:3,p:'lbi3',t:'Masalah utama',q:'Masalah utama yang dibahas dalam teks adalah …',o:['tingginya angka diabetes di Meksiko','efektivitas dan dampak rencana cukai minuman berpemanis','cara membuat minuman rendah gula','kerugian warung dan kedai','pentingnya label kemasan'],a:1,b:'Teks memuat argumen pendukung, kekhawatiran, dan usulan perbaikan seputar rencana cukai MBDK. Inti bahasannya <b>efektivitas dan dampak kebijakan cukai</b>.'},
{s:'lbi',lv:3,p:'lbi3',t:'Kelemahan argumen',q:'Menurut teks, kelemahan kebijakan cukai MBDK adalah …',o:['cukai terlalu murah','tidak menjangkau minuman manis tanpa kemasan yang banyak dikonsumsi','menyebabkan diabetes meningkat','tidak didukung ahli gizi','hanya berlaku di Meksiko'],a:1,b:'Kalimat kunci: sebagian besar minuman manis dijual <b>tanpa kemasan</b> sehingga tidak tersentuh cukai.'},
{s:'lbi',lv:3,p:'lbi3',t:'Makna frasa',q:'Frasa <b>setengah hati</b> pada kalimat terakhir bermakna …',o:['penuh semangat','tidak sepenuhnya atau kurang maksimal','separuh harga','dilakukan dua kali','sangat tegas'],a:1,b:'Setengah hati = dilakukan <b>tidak sungguh-sungguh/tidak maksimal</b>. Ahli gizi ingin cukai didukung langkah lain agar dampaknya penuh.'},
{s:'lbi',lv:3,p:'lbi3',t:'Inferensi',q:'Berdasarkan teks, kemungkinan yang terjadi jika cukai diterapkan TANPA langkah pendukung lain adalah …',o:['Konsumsi gula masyarakat pasti turun drastis.','Sebagian konsumen beralih ke minuman manis tanpa kemasan.','Warung dan kedai akan tutup.','Angka diabetes langsung turun dalam setahun.','Harga minuman tanpa kemasan ikut naik karena cukai.'],a:1,b:'Minuman tanpa kemasan tidak terkena cukai sehingga lebih murah secara relatif. Inferensi logisnya, sebagian konsumen <b>beralih</b> ke sana. Opsi A dan D terlalu pasti, opsi E bertentangan dengan teks.'},
{s:'lbi',lv:3,p:'lbi3',t:'Fungsi data',q:'Data tentang Meksiko dalam teks berfungsi untuk …',o:['membantah argumen pendukung cukai','mendukung argumen bahwa cukai dapat menurunkan konsumsi','menunjukkan bahwa diabetes sudah menurun','membandingkan ekonomi dua negara','menjelaskan kekhawatiran pelaku usaha'],a:1,b:'Data penurunan penjualan 7,6% dipakai pendukung kebijakan sebagai <b>bukti bahwa cukai efektif menurunkan konsumsi</b>.'},

{s:'lbe',lv:1,p:'lbe1',t:'Vocabulary in context',q:'The word <b>hold</b> in the last sentence is closest in meaning to …',o:['grab','support','own','delay','hug'],a:1,b:'Atap harus cukup kuat untuk <b>menopang (support)</b> berat tanah dan air.'},
{s:'lbe',lv:1,p:'lbe1',t:'Detail · Challenge',q:'What challenge of building a rooftop garden is mentioned?',o:['Lack of seeds','Students are not interested','The roof must be strong enough','Vegetables grow slowly','Teachers refuse to help'],a:2,b:'"...the roof must be strong enough to hold soil and water." Jawaban <b>C</b>.'},

{s:'lbe',lv:2,p:'lbe2',t:'Purpose',q:'The main purpose of the text is to …',o:['persuade all companies to adopt a four-day week','describe an experiment and point out its limitations','criticize UK workers','explain how hospitals schedule shifts','compare salaries in different countries'],a:1,b:'Paragraf 1–2 memaparkan uji coba dan hasilnya, lalu kalimat terakhir menyajikan kritik. Tujuannya <b>menggambarkan eksperimen beserta keterbatasannya</b>.'},
{s:'lbe',lv:2,p:'lbe2',t:'Vocabulary in context',q:'The word <b>compressed</b> in the last sentence most likely means …',o:['made heavier','fitted into less time','paid more','cancelled','shared online'],a:1,b:'Dalam konteks jam kerja, compressed = <b>dipadatkan ke waktu yang lebih singkat</b>.'},
{s:'lbe',lv:2,p:'lbe2',t:'Argument',q:'What is the critics\' main concern about the trial?',o:['Employees were paid less.','Productivity fell sharply.','The participating firms may not represent all types of workplaces.','The trial lasted too long.','Managers did not report results.'],a:2,b:'Kritikus menyoroti bahwa peserta sebagian besar firma kantor yang mendaftar sukarela, jadi <b>sampelnya tidak representatif</b>.'},

 <p>Penalaran induktif adalah menarik aturan umum dari contoh-contoh khusus. Di SNBT, bentuknya hampir selalu <b>barisan bilangan, huruf, atau gambar</b>, dan tugasmu menemukan aturannya.</p>

 {id:'pu-b',judul:'Penalaran Deduktif: Logika Anti-Jebakan',lv:2,menit:15,isi:`
 <p>Deduktif berarti dari premis umum ke simpulan khusus yang <b>pasti benar</b>. Jika premisnya benar, simpulannya wajib benar.</p>
 <h3>Tiga pola wajib hafal</h3>
 <table class="dtable"><tr><th>Nama</th><th>Premis</th><th>Simpulan</th></tr>
 <tr><td>Modus ponens</td><td>p → q, p</td><td>q</td></tr>
 <tr><td>Modus tollens</td><td>p → q, ~q</td><td>~p</td></tr>
 <tr><td>Silogisme</td><td>p → q, q → r</td><td>p → r</td></tr></table>
 <div class="callout warn"><b>Jebakan klasik:</b> dari p → q dan q, kamu <u>tidak bisa</u> menyimpulkan p. Contohnya, "jika hujan, jalan basah" dan "jalan basah" belum tentu berarti hujan, karena bisa saja jalannya disiram.</div>
 <h3>Negasi kuantor</h3>
 <ul><li>~(Semua A adalah B) ≡ <b>Ada/Sebagian</b> A yang bukan B</li><li>~(Ada A yang B) ≡ <b>Semua</b> A bukan B</li><li>p → q ≡ ~q → ~p ≡ ~p ∨ q</li></ul>
 ${ex('Semua atlet rajin berlatih. Sebagian pelajar adalah atlet. Simpulan?','Sebagian pelajar (yang atlet) pasti rajin berlatih → <b>Sebagian pelajar rajin berlatih</b>.')}
 ${tip('Di soal deduktif, coret dulu opsi yang memakai kata "mungkin" atau yang menambah info di luar premis.')}
 `},
 {id:'pu-c',judul:'Analitik & Kuantitatif: Tabel, Posisi, P vs Q',lv:3,menit:15,isi:`
 <p>Soal penataan posisi (antrean, rak, jadwal) paling cepat diselesaikan dengan <b>menggambar slot</b>.</p>
 <ol class="steps"><li>Gambar slot kosong: _ _ _ _ _</li><li>Isi dulu syarat yang <b>pasti</b> (posisi tetap).</li><li>Tempatkan pasangan yang harus bersebelahan.</li><li>Uji sisa kemungkinan dan coret yang melanggar syarat.</li></ol>
 <h3>Soal P vs Q</h3>
 <p>Hitung P dan Q masing-masing, lalu bandingkan. Pilih "tidak dapat ditentukan" hanya jika nilai P atau Q bisa berubah-ubah, misalnya bergantung pada variabel tanpa batasan.</p>

 `}

pbm:[
 {id:'pbm-a',judul:'EYD V: Kapital, Tanda Baca, di/ke',lv:1,menit:14,isi:`
 <h3>Huruf kapital</h3><ul><li>Nama hari, bulan, dan geografi: <b>Senin</b>, <b>Pulau Bali</b>. Tetapi "pergi ke pulau" ditulis kecil karena tidak diikuti nama.</li><li>Nama lembaga lengkap: <b>Fakultas Hukum Universitas Indonesia</b>.</li><li>Jenis/nama umum dari nama geografi ditulis kecil: <b>kopi Toraja</b>, <b>pisang ambon</b>.</li></ul>
 <h3>di/ke/dari</h3><p>Sebagai <b>kata depan</b> (tempat atau arah) ditulis terpisah: <i>di rumah, ke pasar</i>. Sebagai <b>awalan</b> kata kerja pasif ditulis serangkai: <i>dibaca, diumumkan</i>.</p>
 <div class="callout"><b>Tes cepat:</b> kalau bisa diganti "ke" atau "dari", berarti kata depan, jadi pisahkan. <i>di rumah</i> → <i>ke rumah</i> ✓</div>
 <h3>Angka</h3><ul><li>Di awal kalimat, angka ditulis dengan huruf: <b>Lima siswa…</b></li><li>ke- + angka memakai tanda hubung: <b>abad ke-21</b>.</li></ul>
 ${tip('Soal EYD itu soal "poin gratis". Hafalkan aturannya sekali, lalu kerjakan cepat agar waktumu tersisa untuk soal paragraf.')}
 `},
 {id:'pbm-b',judul:'Kalimat Efektif',lv:2,menit:12,isi:`
 <p>Kalimat efektif = <b>hemat, padu, logis, sejajar, dan bersubjek jelas</b>.</p>
 <table class="dtable"><tr><th>Masalah</th><th>Contoh salah</th><th>Perbaikan</th></tr>
 <tr><td>Subjek hilang</td><td>Dalam rapat itu membahas…</td><td>Rapat itu membahas…</td></tr>
 <tr><td>Mubazir</td><td>para siswa-siswa; demi untuk</td><td>para siswa; demi</td></tr>
 <tr><td>Tidak sejajar</td><td>membaca, menulis, dan berhitungan</td><td>membaca, menulis, dan berhitung</td></tr>
 <tr><td>Tidak logis</td><td>Waktu dan tempat kami persilakan.</td><td>Bapak kami persilakan.</td></tr></table>
 ${ex('Perbaiki: "Bagi siswa yang belum membayar harap segera melunasi."','Hilangkan "bagi" agar ada subjek: <b>Siswa yang belum membayar harap segera melunasi.</b>')}
 `},
 {id:'pbm-c',judul:'Paragraf Padu: Ide Pokok, Sumbang, Rumpang',lv:3,menit:14,isi:`
 <ul><li><b>Ide pokok</b> biasanya di kalimat pertama (deduktif) atau terakhir (induktif). Cari kalimat yang paling umum.</li><li><b>Kalimat sumbang</b>: kalimat yang topiknya keluar jalur, meskipun isinya benar.</li><li><b>Kalimat rumpang</b>: baca kalimat sebelum dan sesudahnya. Jawaban harus menjembatani keduanya, perhatikan kata "padahal", "karena itu".</li><li><b>Urutan</b>: cari penanda waktu (pertama, setelah itu, terakhir) dan kata rujukan (hal itu, tersebut).</li></ul>
 ${tip('Kata rujukan seperti "hal tersebut" dan "ini" tidak mungkin ada di kalimat pertama paragraf. Ini trik eliminasi yang ampuh!')}

 <table class="dtable"><tr><th>Sifat</th><th>Rumus</th></tr><tr><td>Eksponen</td><td>aᵐ·aⁿ = aᵐ⁺ⁿ ; (aᵐ)ⁿ = aᵐⁿ ; a⁰ = 1</td></tr><tr><td>Logaritma</td><td>ᵃlog b = c ⇔ aᶜ = b ; ᵃlog 1 = 0 ; ᵃlog a = 1</td></tr><tr><td></td><td>log(bc) = log b + log c</td></tr></table>

 {id:'pk-c',judul:'Statistika, Peluang, Kecukupan Data',lv:3,menit:16,isi:`
 <ul><li><b>Median</b>: urutkan dulu! Data genap → rata-rata dua nilai tengah.</li><li><b>Permutasi</b> (urutan penting): P(n,r) = n!/(n−r)!. <b>Kombinasi</b> (urutan tidak penting): C(n,r) = n!/(r!(n−r)!).</li><li><b>Peluang</b> = banyak kejadian ÷ banyak ruang sampel.</li></ul>
 <h3>Kecukupan data, urutan cek</h3><ol class="steps"><li>Apakah (1) saja cukup?</li><li>Apakah (2) saja cukup?</li><li>Jika keduanya tidak, apakah digabung cukup?</li></ol>
 <div class="callout warn">Kamu <b>tidak perlu menghitung jawaban akhirnya</b>. Cukup pastikan nilainya bisa ditentukan secara unik.</div>
 ${ex('Ketua & wakil dipilih dari 5 orang. Banyak cara?','Jabatan berbeda → urutan penting → P(5,2) = <b>20</b>.')}
 `}
],
lbi:[
 {id:'lbi-a',judul:'Membaca Strategis: Skimming & Scanning',lv:1,menit:10,isi:`
 <p>Waktu LBI sekitar 85 detik per soal. Kamu tidak sempat membaca semua teks pelan-pelan.</p>
 <ol class="steps"><li><b>Baca pertanyaannya dulu</b> agar tahu yang dicari.</li><li><b>Skimming</b>: baca kalimat pertama tiap paragraf untuk menangkap gambaran besar.</li><li><b>Scanning</b>: cari kata kunci, angka, atau nama untuk soal detail.</li></ol>
 <div class="callout"><b>Ide pokok</b> = jawaban atas pertanyaan "teks ini secara keseluruhan membahas apa?". Opsi yang hanya memuat satu detail biasanya jebakan.</div>
 ${tip('Untuk soal "pernyataan yang BENAR", cek setiap opsi ke teks. Satu kata saja yang tidak cocok (misalnya "Sabtu" jadi "Minggu") sudah membuat opsi itu salah.')}
 `},
 {id:'lbi-b',judul:'Inferensi, Simpulan & Evaluasi Argumen',lv:2,menit:14,isi:`
 <ul><li><b>Inferensi</b>: kesimpulan logis yang <i>tidak tertulis</i> tetapi didukung teks.</li><li><b>Hindari opsi absolut</b>: pasti, selalu, semua, tidak pernah. Biasanya terlalu kuat.</li><li><b>Korelasi ≠ kausalitas</b>: "berhubungan dengan" tidak sama dengan "menyebabkan".</li></ul>
 <h3>Memperkuat / melemahkan</h3><p>Cari dulu <b>klaim inti</b> penulis. Pernyataan yang <b>melemahkan</b> menunjukkan bahwa penyebab yang diklaim tidak berpengaruh atau ada penyebab lain. Pernyataan yang <b>memperkuat</b> menutup kemungkinan penyebab lain.</p>
 ${tip('Untuk soal "melemahkan", bayangkan dirimu pengacara lawan. Bukti apa yang paling membuat klaim itu runtuh?')}
 `},
 {id:'lbi-c',judul:'Makna Kontekstual & Sikap Penulis',lv:3,menit:10,isi:`
 <ul><li>Makna kata atau frasa ditentukan oleh kalimat di sekitarnya. Baca satu kalimat sebelum dan sesudahnya.</li><li><b>Sikap penulis</b>: objektif, kritis, berhati-hati, mendukung, menolak. Lihat pilihan kata (bias, emosional, atau netral).</li><li><b>Fungsi kalimat/data</b>: apakah untuk mendukung, membantah, mencontohkan, atau memberi alternatif?</li></ul>
 `}
],
lbe:[
 {id:'lbe-a',judul:'Main Idea & Purpose',lv:1,menit:10,isi:`
 <p>Pertanyaan yang sering muncul: <i>What is the main idea…? The purpose of the text is to…</i></p>
 <table class="dtable"><tr><th>Kata kerja tujuan</th><th>Artinya</th></tr><tr><td>inform / describe</td><td>memberi informasi</td></tr><tr><td>persuade / convince</td><td>membujuk</td></tr><tr><td>criticize</td><td>mengkritik</td></tr><tr><td>compare</td><td>membandingkan</td></tr><tr><td>explain</td><td>menjelaskan proses/sebab</td></tr></table>
 ${tip('Perhatikan kata "However", "Yet", "Critics". Biasanya bagian setelahnya membawa poin penting atau tujuan teks.')}
 `},
 {id:'lbe-b',judul:'Vocabulary in Context & Reference',lv:2,menit:10,isi:`
 <ul><li>Ganti kata yang ditanya dengan opsi jawaban, lalu baca ulang kalimatnya. Apakah maknanya masih masuk akal?</li><li>Pronoun reference (it, they, their, this): cari kata benda <b>terdekat sebelumnya</b> yang cocok jumlahnya (tunggal atau jamak).</li></ul>
 ${ex('"The roof must be strong enough to <b>hold</b> soil." hold = ?','Atap menahan beban → <b>support</b>, bukan "grab" (memegang dengan tangan).')}
 `},
 {id:'lbe-c',judul:'Inference, Tone & NOT-Mentioned',lv:3,menit:12,isi:`
 <ul><li><b>Inference</b>: "It can be inferred that…" → jawabannya tersirat tapi harus didukung bukti.</li><li><b>Tone</b>: informative, critical, optimistic, skeptical, neutral, sarcastic.</li><li><b>NOT mentioned / EXCEPT</b>: centang opsi yang ada di teks. Opsi yang tersisa adalah jawabannya.</li></ul>
 ${tip('Hati-hati dengan opsi yang memakai kata dari teks tetapi maknanya dibelokkan. Contohnya, teks bilang "without a cut in pay" lalu opsinya "higher salaries".')}
 `}
],
pm:[
 {id:'pm-a',judul:'Aritmetika Sosial, Kecepatan, Skala',lv:1,menit:12,isi:`
 <table class="dtable"><tr><th>Konsep</th><th>Rumus</th></tr><tr><td>Persentase perubahan</td><td>(baru − lama) ÷ lama × 100%</td></tr><tr><td>Diskon bertingkat</td><td>harga × (1 − d₁) × (1 − d₂)</td></tr><tr><td>Bunga tunggal</td><td>M × r × t</td></tr><tr><td>Kecepatan</td><td>v = s ÷ t (samakan satuan!)</td></tr><tr><td>Skala</td><td>jarak peta × skala = jarak asli</td></tr></table>
 ${tip('Satuan adalah jebakan favorit soal PM. Ubah menit ke jam dan cm ke km sebelum menghitung.')}
 `},
 {id:'pm-b',judul:'Barisan, Pertumbuhan, Geometri Kontekstual',lv:2,menit:14,isi:`
 <ul><li>Aritmetika: Uₙ = a + (n−1)b ; Sₙ = n/2 (2a + (n−1)b)</li><li>Geometri: Uₙ = a·rⁿ⁻¹. Contohnya pertumbuhan bakteri atau investasi.</li><li>Pythagoras: tripel 3-4-5, 5-12-13, 8-15-17, 7-24-25</li><li>Volume: balok p·l·t ; tabung πr²t ; kerucut ⅓πr²t ; bola 4/3 πr³</li><li>1 m³ = 1.000 liter ; 1 dm³ = 1 liter</li></ul>
 ${ex('Investasi Rp1 juta tumbuh 10% per tahun (majemuk). Nilai setelah 2 tahun?','1.000.000 × 1,1² = <b>Rp1.210.000</b>.')}
 `},
 {id:'pm-c',judul:'Membaca Data & Program Linear',lv:3,menit:14,isi:`
 <ul><li>Untuk tabel atau grafik, baca judul, satuan, dan keterangan dulu.</li><li>Bedakan <b>selisih absolut</b> dari <b>persentase</b>.</li><li>Rata-rata gabungan = (n₁x̄₁ + n₂x̄₂) ÷ (n₁ + n₂)</li></ul>
 <h3>Program linear, 4 langkah</h3><ol class="steps"><li>Tentukan variabel (x, y).</li><li>Tulis kendala (modal, tempat, waktu).</li><li>Cari titik pojok daerah penyelesaian.</li><li>Uji fungsi tujuan di setiap titik pojok.</li></ol>
 `}
]
