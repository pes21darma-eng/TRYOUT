lbi:{id:'lbi-b2',judul:'Teks Argumentasi: Klaim, Bukti, dan Data',lv:2,menit:13,isi:`
 <p>Bacaan Literasi level Menengah biasanya teks argumentasi: ada <b>klaim</b> (pendapat), <b>bukti</b> (data, contoh, penelitian), dan sering ada <b>pandangan lain</b> yang membantah.</p>
 <h3>Peta teks argumentasi</h3>
 <table class="dtable"><tr><th>Bagian</th><th>Penanda</th></tr><tr><td>Klaim/pendapat</td><td>menurut, dinilai, seharusnya, perlu</td></tr><tr><td>Bukti</td><td>data, survei, penelitian, angka persen</td></tr><tr><td>Pandangan lain</td><td>namun, akan tetapi, di sisi lain, para ahli mengingatkan</td></tr><tr><td>Simpulan</td><td>karena itu, oleh sebab itu, dengan demikian</td></tr></table>
 <h3>Soal angka di teks</h3>
 <ul><li><b>Persen dari total</b>: 32% × 1.200 = 384.</li><li><b>Kebalikan persen</b>: kalau 68% memakai ponsel, yang tidak = 32%.</li><li><b>Kali lipat</b>: dari 150 menit dan 15 menit, video = 10 kali lipat membaca.</li></ul>
 <h3>"Tidak dapat dipastikan"</h3>
 <p>Kalau teks hanya membahas kelompok "lebih dari 15 jam" dan "kurang dari 10 jam", maka kelompok 12 jam <b>tidak bisa disimpulkan</b>. Jangan menebak di luar data.</p>
 ${ex('Teks: "Siswa yang sarapan cenderung lebih fokus." Simpulan yang tepat?','Kata "cenderung" berarti kemungkinan, bukan kepastian. Simpulan yang aman: <b>sarapan berhubungan dengan fokus yang lebih baik</b>, bukan "semua yang sarapan pasti fokus".')}

 `},
lbe:{id:'lbe-b2',judul:'Problem–Solution Texts & Inference',lv:2,menit:12,isi:`
 <p>Teks Inggris level Menengah banyak berpola <b>masalah → penyebab → solusi</b>, atau <b>kelebihan → kekurangan → jalan tengah</b>. Kalau kamu mengenali polanya, soal main idea dan purpose jadi mudah.</p>
 <h3>Penanda pola</h3>
 <table class="dtable"><tr><th>Fungsi</th><th>Kata penanda</th></tr><tr><td>Masalah</td><td>problem, decline, however, yet, unfortunately</td></tr><tr><td>Penyebab</td><td>because, due to, caused by, the main causes</td></tr><tr><td>Solusi</td><td>to solve this, therefore, as a result, the best solution</td></tr><tr><td>Kontras</td><td>however, yet, although, on the other hand</td></tr></table>
 <h3>Inference: aman vs berlebihan</h3>
 <p>Jawaban inference harus <b>didukung teks</b> tetapi <b>tidak tertulis persis</b>. Tolak opsi yang terlalu kuat (always, never, all, completely).</p>
 ${ex('Text: "Paper bags require more energy and water to produce." Inference?','Aman: <b>paper bags are not automatically better for the environment</b>. Berlebihan: "paper bags are worse than plastic in every way".')}
 <h3>Kosakata akademik yang sering muncul</h3>
 <p><i>decline</i> (menurun), <i>estimate</i> (memperkirakan), <i>reliable</i> (dapat diandalkan), <i>significant</i> (berarti), <i>alternative</i> (pilihan lain), <i>benefit</i> (manfaat), <i>adopt</i> (menerapkan), <i>recover</i> (pulih).</p>
 ${tip('Untuk soal NOT mentioned, jangan andalkan ingatan. Kembali ke teks dan centang satu per satu, karena opsi pengecoh sering terdengar masuk akal.')}

pm:{id:'pm-b2',judul:'Soal Cerita Menengah: Rata-rata Pulang-Pergi, Kerja Bersama, Bunga Majemuk',lv:2,menit:15,isi:`
 <p>Level Menengah suka soal yang <b>kelihatan gampang tapi punya jebakan</b>. Ini empat jebakan yang paling sering.</p>
 <h3>1. Kecepatan rata-rata ≠ rata-rata kecepatan</h3>
 <p>Pergi 60 km/jam, pulang 40 km/jam, jarak 120 km. Rata-ratanya <b>bukan</b> 50! Hitung: total jarak ÷ total waktu = 240 ÷ (2 + 3) = <b>48 km/jam</b>.</p>
 <h3>2. Kerja bersama</h3>
 <p>Ubah ke "bagian per jam". A selesai 6 jam → 1/6 per jam. B selesai 3 jam → 1/3 per jam. Bersama: 1/6 + 1/3 = 1/2 per jam → <b>2 jam</b>.</p>
 <div class="callout">Rumus cepat untuk dua orang: waktu bersama = (a × b) ÷ (a + b) = (6 × 3) ÷ 9 = 2.</div>
 <h3>3. Naik lalu turun dengan persen yang sama</h3>
 <p>Naik 20% lalu turun 20% <b>tidak kembali</b> ke harga awal: 100 → 120 → 96. Selalu kalikan berurutan.</p>
 <h3>4. Bunga tunggal vs majemuk</h3>
 <table class="dtable"><tr><th>Jenis</th><th>Rumus</th><th>1 juta, 10%, 2 tahun</th></tr><tr><td>Tunggal</td><td>M × (1 + r × t)</td><td>1.200.000</td></tr><tr><td>Majemuk</td><td>M × (1 + r)ᵗ</td><td>1.210.000</td></tr></table>
 ${ex('Diskon 25% lalu pajak 10% untuk barang Rp200.000?','200.000 × 0,75 = 150.000, lalu × 1,1 = <b>Rp165.000</b>. Persen kedua dihitung dari harga setelah diskon.')}

 `}

  const N = x => { if (typeof x === 'string') return x; const neg = x < 0; x = Math.abs(x); let s = Number.isInteger(x) ? String(x) : String(Math.round(x * 1000) / 1000); let [i, d] = s.split('.'); i = i.replace(/\B(?=(\d{3})+(?!\d))/g, '.'); return (neg ? '−' : '') + i + (d ? ',' + d : ''); };
  const RP = x => 'Rp' + N(x);
  const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a; };
  const FR = (p, q) => { const g = gcd(p, q); p /= g; q /= g; return q === 1 ? String(p) : `${p}/${q}`; };
  const L = n => String.fromCharCode(64 + ((n - 1) % 26 + 26) % 26 + 1);
  const C = (n, k) => { let r = 1; for (let i = 0; i < k; i++) r = r * (n - i) / (i + 1); return Math.round(r); };
  function opts(ans, cands, f = N, step) {
    const out = [f(ans)], seen = new Set(out);
    for (const c of cands) { if (out.length >= 5) break; if (c === undefined || c === null || (typeof c === 'number' && !isFinite(c))) continue; const s = f(c); if (!seen.has(s)) { seen.add(s); out.push(s); } }

    return {o: out, a: 0};
  }
  const PQi = {gt: 0, lt: 1, eq: 2, nd: 4};

  /* ---------------- PU: INDUKTIF ---------------- */
  const IND = [
    d => { const a0 = ri(2, 15), d0 = ri(1, 5), dd = ri(2, d >= 5 ? 6 : 4); const t = [a0]; for (let i = 0; i < 5; i++) t.push(t[i] + d0 + i * dd); const nx = t[5] + d0 + 5 * dd; const diffs = t.slice(1).map((x, i) => x - t[i]);

      return {t: 'Induktif · Pola huruf', q: `Huruf selanjutnya dari pola ${pos.map(L).join(', ')}, … adalah`, ...opts(ans, [L(nxp + 1), L(nxp - 1), L(nxp + 2), L(nxp - 2), L(nxp + 3)], x => x), b: `Ubah ke angka urutan alfabet: ${pos.map(p => ((p - 1) % 26) + 1).join(', ')}. Lompatannya ${pos.slice(1).map((x, i) => x - pos[i]).join(', ')} (naik ${inc}). Lompatan berikutnya ${j0 + 4 * inc}, jadi urutan ke-${((nxp - 1) % 26) + 1} = <b>${ans}</b>.${nxp > 26 ? ' (Lewat Z, kurangi 26 lalu mulai lagi dari A.)' : ''}`}; },
    d => { const tri = d >= 5; const t = tri ? [ri(1, 3), ri(1, 4), ri(2, 5)] : [ri(1, 5), ri(2, 7)]; while (t.length < 7) t.push(tri ? t[t.length - 1] + t[t.length - 2] + t[t.length - 3] : t[t.length - 1] + t[t.length - 2]); const nx = tri ? t[6] + t[5] + t[4] : t[6] + t[5];
      return {t: tri ? 'Induktif · Jumlah tiga suku' : 'Induktif · Jumlah dua suku', q: `Bilangan selanjutnya dari barisan ${t.join(', ')}, … adalah`, ...opts(nx, [t[6] + t[5], t[6] + t[4], nx + 1, 2 * t[6], nx - t[4]]), b: tri ? `Setiap suku = jumlah <b>tiga</b> suku sebelumnya. Contoh: ${t[0]} + ${t[1]} + ${t[2]} = ${t[3]}. Maka ${t[4]} + ${t[5]} + ${t[6]} = <b>${N(nx)}</b>.` : `Setiap suku = jumlah dua suku sebelumnya. Maka ${t[5]} + ${t[6]} = <b>${N(nx)}</b>.`}; },
    d => { const cube = d >= 6 && R() < .6, k = ri(-3, 4), n0 = ri(1, 3); const f = n => cube ? n * n * n - n : n * n + k; const t = [0, 1, 2, 3, 4].map(i => f(n0 + i)); const nx = f(n0 + 5);
      return {t: cube ? 'Induktif · Pangkat tiga' : 'Induktif · Bilangan kuadrat', q: `Bilangan selanjutnya dari barisan ${t.map(N).join(', ')}, … adalah`, ...opts(nx, [nx + 1, nx - 1, f(n0 + 6), nx + (n0 + 5), t[4] + (t[4] - t[3])]), b: cube ? `Polanya n³ − n: ${n0}³−${n0} = ${N(t[0])}, … Suku berikutnya ${n0 + 5}³ − ${n0 + 5} = <b>${N(nx)}</b>.` : `Polanya n² ${k >= 0 ? '+ ' + k : '− ' + (-k)}: ${n0}²${k >= 0 ? '+' : '−'}${Math.abs(k)} = ${t[0]}, dan seterusnya. Berikutnya ${n0 + 5}² ${k >= 0 ? '+' : '−'} ${Math.abs(k)} = <b>${N(nx)}</b>.`}; },
    d => { const rules = [[(a, b) => a * b - a, 'bilangan ketiga = (pertama × kedua) − pertama'], [(a, b) => a * a + b, 'bilangan ketiga = pertama² + kedua'], [(a, b) => (a + b) * 2, 'bilangan ketiga = (pertama + kedua) × 2'], [(a, b) => a * b + b, 'bilangan ketiga = (pertama × kedua) + kedua'], [(a, b) => b * b - a, 'bilangan ketiga = kedua² − pertama']]; const ri0 = d >= 6 ? ri(0, 4) : ri(0, 3); const [f, txt] = rules[ri0]; const pr = [[ri(2, 4), ri(3, 6)], [ri(3, 5), ri(4, 8)], [ri(4, 7), ri(5, 9)]]; const tr = pr.map(([a, b]) => [a, b, f(a, b)]); const ans = tr[2][2]; const alt = rules.filter((_, i) => i !== ri0).map(([g]) => g(pr[2][0], pr[2][1]));

  ];

  /* ---------------- PU: KUANTITATIF ---------------- */
  const KUA = [
    d => { const pcts = [10, 15, 20, 25, 30, 40, 50, 60, 75]; let P, Q, p, A, fr, B; do { p = pick(pcts); A = ri(2, 20) * 20; fr = pick([[1, 2], [1, 4], [3, 4], [2, 5], [3, 5], [1, 3], [2, 3]]); B = ri(2, 20) * 12 * fr[1] / gcd(12, fr[1]); P = p * A / 100; Q = fr[0] * B / fr[1]; } while (!Number.isInteger(P) || !Number.isInteger(Q) || P === 2 * Q);
      const rel = P > Q ? 'gt' : P < Q ? 'lt' : 'eq';
      return {t: 'Kuantitatif · Perbandingan P & Q', q: `P = ${p}% dari ${N(A)}<br>Q = ${fr[0]}/${fr[1]} dari ${N(B)}<br>Hubungan P dan Q yang tepat adalah …`, o: PQ, a: PQi[rel], b: `P = ${p}/100 × ${N(A)} = ${N(P)}. Q = ${fr[0]}/${fr[1]} × ${N(B)} = ${N(Q)}. Jadi <b>${PQ[PQi[rel]]}</b>.`}; },
    d => { const cases = [
        ['x &gt; 1', 'x²', 'x', 'gt', 'Untuk x lebih dari 1, mengkuadratkan membuat bilangan makin besar (contoh x = 2: P = 4, Q = 2).'],
        ['0 &lt; x &lt; 1', 'x²', 'x', 'lt', 'Untuk pecahan antara 0 dan 1, kuadratnya justru lebih kecil (contoh x = 0,5: P = 0,25, Q = 0,5).'],

    d => { const n = ri(4, 8), m = ri(12, 30), v = ri(m - 10, m + 15), add = R() < .5; const tot = n * m; const nn = add ? n + 1 : n - 1, nt = add ? tot + v : tot - v; if (nt % nn) return KUA[2](d); const nm = nt / nn;
      return {t: 'Kuantitatif · Rata-rata berubah', q: `Rata-rata ${n} bilangan adalah ${m}. Jika bilangan ${N(v)} ${add ? 'ditambahkan ke' : 'dikeluarkan dari'} kelompok itu, rata-rata yang baru adalah …`, ...opts(nm, [m + (add ? 1 : -1), (tot + (add ? v : -v)) / n, nm + 1, nm - 1, m]), b: `Jumlah awal = ${n} × ${m} = ${tot}. Setelah ${add ? 'ditambah' : 'dikurangi'} ${v}: ${nt}, banyak data ${nn}. Rata-rata baru = ${nt} ÷ ${nn} = <b>${N(nm)}</b>.`}; },
    d => { let w, days, x, y, rem; do { w = ri(4, 12); days = ri(6, 20); x = d >= 5 ? ri(1, days - 3) : 0; y = ri(1, 6); rem = (w * (days - x)) / (w + y); } while (!Number.isInteger(rem) || rem <= 0);
      return d >= 5 ? {t: 'Kuantitatif · Tambahan pekerja', q: `Sebuah proyek dapat diselesaikan ${w} pekerja dalam ${days} hari. Setelah ${x} hari bekerja, ditambah ${y} pekerja lagi. Sisa proyek selesai dalam …`, ...opts(rem, [days - x, rem + 1, rem - 1, (w * days) / (w + y), days - x - y]), b: `Total kerja = ${w} × ${days} = ${w * days} hari-orang. Sudah dikerjakan ${w} × ${x} = ${w * x}. Sisa ${w * (days - x)} hari-orang dikerjakan ${w + y} orang: ${w * (days - x)} ÷ ${w + y} = <b>${N(rem)} hari</b>.`, o2: 1} : (() => { const nd = (w * days) / (w + y); if (!Number.isInteger(nd)) return KUA[3](d); return {t: 'Kuantitatif · Perbandingan berbalik', q: `${w} pekerja dapat menyelesaikan pekerjaan dalam ${days} hari. Jika ada ${w + y} pekerja dengan kecepatan sama, pekerjaan selesai dalam …`, ...opts(nd, [days - y, nd + 1, nd - 1, (days * (w + y)) / w, days]), b: `Makin banyak pekerja, makin cepat (berbalik nilai). ${w} × ${days} = ${w * days}, dibagi ${w + y} = <b>${N(nd)} hari</b>.`}; })(); },
    d => { const a = pick([10, 20, 25, 30, 40, 50]), b2 = pick([10, 20, 25, 30, 40]); const net = (1 + a / 100) * (1 - b2 / 100); const pct = Math.round((net - 1) * 10000) / 100;

    d => { const n = ri(6, d >= 6 ? 20 : 12), ans = C(n, 2);

    d => { const days = ['Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu', 'Minggu']; const s = ri(0, 6), n = ri(30, d >= 6 ? 400 : 120); const ans = days[(s + n) % 7];
      return {t: 'Kuantitatif · Sisa pembagian (hari)', q: `Hari ini hari ${days[s]}. ${n} hari lagi adalah hari …`, ...opts(ans, days.filter(x => x !== ans), x => x), b: `Hari berulang setiap 7. ${n} ÷ 7 = ${Math.floor(n / 7)} sisa ${n % 7}. Jadi cukup maju ${n % 7} hari dari ${days[s]}: <b>${ans}</b>.`}; }
  ];

  /* ---------------- PK ---------------- */
  const PKG = [

m2i1:{judul:'Detoks Digital', isi:`<p>Istilah detoks digital merujuk pada upaya mengurangi atau menghentikan sementara penggunaan gawai untuk memulihkan konsentrasi dan kesehatan mental. Sejumlah sekolah di Jawa Tengah mencoba program "Sabtu Tanpa Gawai": selama satu hari, siswa yang tinggal di asrama menitipkan ponselnya kepada pengasuh.</p><p>Hasil evaluasi tiga bulan menunjukkan bahwa siswa peserta program lebih banyak berolahraga dan membaca. Namun, sebagian siswa mengaku cemas karena takut ketinggalan kabar, terutama di jam-jam awal. Psikolog yang mendampingi program menyebut kecemasan itu wajar dan biasanya mereda setelah beberapa pekan. Ia menekankan bahwa tujuan detoks digital bukan memusuhi teknologi, melainkan melatih kendali diri agar gawai dipakai secara sadar, bukan secara otomatis.</p>`},
m2i2:{judul:'Bahasa Daerah yang Kian Sepi Penutur', isi:`<p>Indonesia memiliki lebih dari 700 bahasa daerah, tetapi banyak di antaranya terancam punah. Ancaman terbesar bukan larangan, melainkan berhentinya pewarisan: orang tua tidak lagi berbicara dalam bahasa daerah kepada anak-anaknya. Ketika satu generasi berhenti menggunakannya, bahasa itu dapat lenyap dalam waktu singkat.</p><p>Beberapa komunitas melawan arus dengan cara kreatif. Ada yang membuat kamus daring, lagu anak, hingga konten video pendek berbahasa daerah. Ahli bahasa menilai upaya ini penting, tetapi tidak cukup jika bahasa daerah hanya hadir di media. Menurut mereka, bahasa bertahan bila tetap dipakai dalam kehidupan sehari-hari, seperti di rumah, pasar, dan tempat ibadah.</p>`},
m2i3:{judul:'Kopi dari Kebun Petani Muda', isi:`<p>Dalam sepuluh tahun terakhir, minat anak muda menjadi petani kopi meningkat di beberapa daerah pegunungan. Mereka tidak hanya menanam, tetapi juga mengolah biji kopi sendiri, mengemasnya, lalu menjualnya langsung ke kedai di kota. Dengan memotong rantai perantara, harga jual kopi bisa dua sampai tiga kali lipat dibandingkan menjual biji mentah kepada tengkulak.</p><p>Meski demikian, jalan ini tidak mudah. Pengolahan pascapanen membutuhkan alat dan keterampilan, sementara kualitas rasa sangat dipengaruhi cuaca. Musim hujan yang terlalu panjang dapat membuat biji kopi sulit dijemur dan berjamur. Karena itu, sejumlah kelompok tani mulai membangun rumah jemur beratap plastik transparan agar proses pengeringan tidak bergantung pada cuaca.</p>`},
m2i4:{judul:'Sampah Elektronik', isi:`<p>Ponsel lama, kabel, dan baterai bekas sering disimpan di laci atau dibuang bersama sampah rumah tangga. Padahal, sampah elektronik mengandung logam berat seperti timbal dan merkuri yang dapat mencemari tanah dan air. Di sisi lain, sampah elektronik juga menyimpan logam berharga seperti emas, perak, dan tembaga yang bisa didaur ulang.</p><p>Masalahnya, daur ulang yang aman membutuhkan fasilitas khusus. Di banyak tempat, pemulung membakar kabel untuk mengambil tembaganya, sehingga asap beracun terhirup oleh pekerja dan warga sekitar. Sejumlah pemerintah daerah kini menyediakan dropbox sampah elektronik di kantor kecamatan dan pusat perbelanjaan. Barang yang terkumpul dikirim ke pengolah berizin agar logamnya dapat dipulihkan tanpa merusak lingkungan.</p>`},
m2i5:{judul:'Kebun Sayur di Atap Kota', isi:`<p>Keterbatasan lahan membuat sebagian warga kota beralih ke hidroponik, yaitu menanam tanpa tanah dengan memanfaatkan air bernutrisi. Sistem ini cocok untuk atap rumah dan balkon karena ringan dan hemat air. Sayuran seperti selada, kangkung, dan sawi bisa dipanen dalam 30–40 hari.</p><p>Seorang warga di Bekasi bercerita bahwa awalnya ia hanya menanam untuk kebutuhan keluarga. Setelah tetangga tertarik, ia membuka kelas pelatihan dan menjual paket instalasi. Meski begitu, ia mengingatkan bahwa hidroponik membutuhkan perhatian rutin: kadar nutrisi dan keasaman air harus dicek berkala, dan pompa air tidak boleh mati terlalu lama. "Hidroponik itu hemat lahan, tetapi tidak hemat perhatian," katanya.</p>`},
m2i6:{judul:'Jalan Kaki ke Sekolah', isi:`<p>Dua dekade lalu, sebagian besar siswa SD di kota kecil berjalan kaki atau bersepeda ke sekolah. Kini, sebagian besar diantar dengan kendaraan bermotor. Perubahan ini membuat jalan di depan sekolah macet setiap pagi dan siang.</p><p>Sebuah kota di Jawa Timur mencoba program "rute aman ke sekolah". Trotoar diperbaiki, zebra cross ditambah, dan relawan orang tua berjaga di persimpangan. Setelah setahun, jumlah siswa yang berjalan kaki naik dari 15% menjadi 35%. Kemacetan di depan sekolah berkurang, dan guru melaporkan siswa tampak lebih segar saat tiba. Namun, program ini sulit diterapkan di sekolah yang sebagian besar siswanya tinggal lebih dari 2 kilometer.</p>`},
m2e1:{judul:'Volunteering', isi:`<p>Volunteering means giving your time to help others without being paid. Many young people volunteer at animal shelters, libraries, or community kitchens. Besides helping the community, volunteers often learn practical skills such as teamwork, communication, and problem solving.</p><p>Research also suggests that volunteering can improve well-being. People who volunteer regularly report feeling less lonely and more satisfied with their lives. However, experts warn that volunteering should not become a burden. Taking on too many tasks can lead to stress, especially for students who also need time to study.</p>`},
m2e2:{judul:'Fast Fashion', isi:`<p>Fast fashion refers to clothes that are designed, produced, and sold very quickly at low prices. New styles appear in shops every few weeks, encouraging people to buy more often. This business model has made fashion affordable for millions of people.</p><p>However, it has a hidden cost. Producing clothes uses large amounts of water and energy, and many cheap garments are thrown away after being worn only a few times. Some brands have started recycling programs, but critics say these programs are too small to make a real difference. Instead, they suggest buying fewer but better-quality clothes and repairing them when possible.</p>`},
m2e3:{judul:'Coral Reefs in Danger', isi:`<p>Coral reefs cover less than one percent of the ocean floor, yet they are home to about a quarter of all marine species. Corals get much of their food from tiny algae that live inside them. These algae also give corals their bright colors.</p><p>When the water becomes too warm, corals push the algae out and turn white. This is called coral bleaching. Bleached corals are not dead yet, but they are weak and may die if the water stays hot for too long. Scientists are now testing ways to help reefs recover, such as growing young corals in underwater nurseries and replanting them on damaged reefs.</p>`},
m2e4:{judul:'Learning a Second Language', isi:`<p>Many people believe that children learn languages more easily than adults. Children do have an advantage in pronunciation: those who start early often sound like native speakers. However, adults usually learn grammar and vocabulary faster at the beginning, because they can use study strategies and connect new words to what they already know.</p><p>The most important factor, researchers say, is not age but exposure. Learners who hear and use the language every day, for example by watching films, talking with friends, or reading, make faster progress than those who only study from textbooks once a week.</p>`}

{s:'pu',lv:3,t:'Deduktif · Silogisme bersyarat',q:'Semua siswa yang lolos seleksi mengikuti pelatihan. Siswa yang mengikuti pelatihan mendapat sertifikat. Raka tidak mendapat sertifikat.<br>Simpulan yang tepat adalah …',o:['Raka lolos seleksi.','Raka tidak lolos seleksi.','Raka mengikuti pelatihan.','Raka mungkin lolos seleksi.','Semua siswa mendapat sertifikat.'],a:1,b:'Rantainya: lolos → pelatihan → sertifikat. Raka tidak dapat sertifikat, jadi (mundur) ia tidak ikut pelatihan, dan <b>tidak lolos seleksi</b>.'},
{s:'pu',lv:3,t:'Deduktif · Negasi majemuk',q:'Negasi dari pernyataan "Andi rajin belajar dan Budi rajin berolahraga" adalah …',o:['Andi tidak rajin belajar dan Budi tidak rajin berolahraga.','Andi tidak rajin belajar atau Budi tidak rajin berolahraga.','Andi rajin belajar atau Budi rajin berolahraga.','Jika Andi rajin belajar, Budi rajin berolahraga.','Andi tidak rajin belajar, tetapi Budi rajin berolahraga.'],a:1,b:'Negasi "p dan q" adalah "tidak p <b>atau</b> tidak q". Cukup salah satu yang tidak terjadi agar pernyataan "dan" menjadi salah.'},
{s:'pu',lv:3,t:'Deduktif · Implikasi ekuivalen',q:'Pernyataan yang setara dengan "Jika harga naik, permintaan turun" adalah …',o:['Jika permintaan turun, harga naik.','Jika harga tidak naik, permintaan tidak turun.','Harga tidak naik atau permintaan turun.','Harga naik dan permintaan tidak turun.','Permintaan turun hanya jika harga naik.'],a:2,b:'p → q setara dengan ~p ∨ q: <b>harga tidak naik atau permintaan turun</b>. Bentuk setara lain adalah kontraposisinya: jika permintaan tidak turun, harga tidak naik.'},
{s:'pu',lv:3,t:'Deduktif · Tidak pasti',q:'Sebagian pegawai kantor itu bekerja dari rumah. Semua yang bekerja dari rumah mengikuti rapat daring.<br>Simpulan yang tepat adalah …',o:['Semua pegawai mengikuti rapat daring.','Sebagian pegawai mengikuti rapat daring.','Tidak ada pegawai yang rapat di kantor.','Semua yang mengikuti rapat daring bekerja dari rumah.','Sebagian pegawai tidak mengikuti rapat daring.'],a:1,b:'Pegawai yang bekerja dari rumah (sebagian) pasti ikut rapat daring. Jadi <b>sebagian pegawai mengikuti rapat daring</b>. Opsi "sebagian tidak ikut" belum tentu benar, karena pegawai di kantor pun mungkin ikut.'},
{s:'pu',lv:3,t:'Analitik · Urutan tinggi badan',q:'Lima siswa (K, L, M, N, O) diurutkan dari yang tertinggi. K lebih tinggi dari L. M lebih pendek dari N tetapi lebih tinggi dari K. O paling pendek.<br>Siapa yang paling tinggi?',o:['K','L','M','N','O'],a:3,b:'Dari syarat: N &gt; M &gt; K &gt; L, dan O paling pendek. Urutannya N, M, K, L, O. Yang tertinggi <b>N</b>.'},
{s:'pu',lv:3,t:'Analitik · Duduk melingkar',q:'Empat sahabat (P, Q, R, S) duduk mengelilingi meja persegi, satu orang di setiap sisi. P duduk berhadapan dengan R. Q duduk di sebelah kanan P.<br>Siapa yang duduk di sebelah kiri P?',o:['Q','R','S','Tidak ada','Tidak dapat ditentukan'],a:2,b:'Di meja empat sisi, setiap orang punya satu teman di kanan, satu di kiri, dan satu di depan. Depan P adalah R, kanan P adalah Q, jadi kiri P pasti <b>S</b>.'},
{s:'pu',lv:3,t:'Analitik · Jadwal les',q:'Dina les Matematika, Fisika, Kimia, dan Biologi pada hari Senin–Kamis, satu mata pelajaran per hari. Fisika tidak pada hari Senin. Kimia tepat sehari setelah Matematika. Biologi pada hari Kamis.<br>Fisika dijadwalkan pada hari …',o:['Senin','Selasa','Rabu','Kamis','Tidak dapat ditentukan'],a:2,b:'Biologi Kamis. Sisa Senin–Rabu untuk Matematika, Kimia, Fisika. Matematika-Kimia harus berurutan: (Senin, Selasa) atau (Selasa, Rabu). Kalau (Selasa, Rabu), Fisika jatuh hari Senin, padahal dilarang. Jadi Matematika Senin, Kimia Selasa, Fisika <b>Rabu</b>.'},
{s:'pu',lv:3,t:'Deduktif · Modus ponens berantai',q:'Jika sungai meluap, desa kebanjiran. Jika desa kebanjiran, sekolah diliburkan. Hari ini sungai meluap.<br>Simpulan yang tepat adalah …',o:['Sekolah tidak diliburkan.','Sekolah diliburkan.','Desa tidak kebanjiran.','Sungai akan surut besok.','Sekolah mungkin diliburkan.'],a:1,b:'Sungai meluap → desa kebanjiran → sekolah diliburkan. Semua langkah pasti, jadi <b>sekolah diliburkan</b>.'},
{s:'pu',lv:3,t:'Deduktif · Kuantor',q:'Tidak ada buku di rak A yang berbahasa Inggris. Semua kamus berbahasa Inggris.<br>Simpulan yang tepat adalah …',o:['Semua kamus ada di rak A.','Tidak ada kamus di rak A.','Sebagian kamus ada di rak A.','Semua buku di rak A adalah kamus.','Sebagian buku di rak A berbahasa Inggris.'],a:1,b:'Kamus selalu berbahasa Inggris, sedangkan buku di rak A tidak ada yang berbahasa Inggris. Jadi <b>tidak ada kamus di rak A</b>.'},
{s:'pu',lv:3,t:'Analitik · Peringkat lomba',q:'Dalam lomba cerdas cermat, tim Merah mendapat nilai lebih tinggi dari tim Biru. Tim Hijau mendapat nilai lebih rendah dari tim Kuning. Tim Biru mendapat nilai lebih tinggi dari tim Kuning.<br>Tim yang mendapat nilai terendah adalah …',o:['Merah','Biru','Hijau','Kuning','Tidak dapat ditentukan'],a:2,b:'Rangkaikan: Merah &gt; Biru &gt; Kuning &gt; Hijau. Terendah <b>Hijau</b>.'},
/* PPU (20) */
{s:'ppu',lv:3,t:'Sinonim',q:'Sinonim kata <b>akurat</b> adalah …',o:['cepat','tepat','lengkap','rumit','baru'],a:1,b:'Akurat = cermat, <b>tepat</b>, tidak salah.'},
{s:'ppu',lv:3,t:'Sinonim',q:'Sinonim kata <b>esensial</b> adalah …',o:['tambahan','mendasar','mewah','sementara','umum'],a:1,b:'Esensial = sangat penting, pokok, <b>mendasar</b>.'},
{s:'ppu',lv:3,t:'Antonim',q:'Antonim kata <b>abstrak</b> adalah …',o:['khayal','konkret','rumit','indah','samar'],a:1,b:'Abstrak = tidak berwujud. Lawannya <b>konkret</b> = nyata, berwujud.'},
{s:'ppu',lv:3,t:'Antonim',q:'Antonim kata <b>mayoritas</b> adalah …',o:['minoritas','sebagian','seluruh','kebanyakan','kelompok'],a:0,b:'Mayoritas = bagian terbesar. Lawannya <b>minoritas</b> = bagian terkecil.'},
{s:'ppu',lv:3,t:'Analogi',q:'DOKTER : STETOSKOP = FOTOGRAFER : …',o:['foto','kamera','model','studio','album'],a:1,b:'Stetoskop adalah alat kerja dokter; <b>kamera</b> adalah alat kerja fotografer. Foto adalah hasilnya, bukan alatnya.'},
{s:'ppu',lv:3,t:'Analogi',q:'BENIH : POHON = TELUR : …',o:['sarang','ayam','kuning telur','cangkang','induk'],a:1,b:'Benih tumbuh menjadi pohon; telur menetas menjadi <b>ayam</b>. Hubungannya "asal : hasil pertumbuhan".'},
{s:'ppu',lv:3,t:'Makna kontekstual',q:'"Usulan itu <b>mentah</b> di tengah rapat karena tidak didukung data."<br>Kata bercetak tebal bermakna …',o:['belum matang dimasak','ditolak atau gagal','sangat baik','belum dibaca','disetujui'],a:1,b:'Di sini "mentah" bermakna kiasan: usulannya <b>ditolak/gagal</b>. Bukan makna asli "belum dimasak".'},
{s:'ppu',lv:3,t:'Makna istilah',q:'Istilah <b>defisit</b> dalam anggaran berarti …',o:['pemasukan lebih besar daripada pengeluaran','pengeluaran lebih besar daripada pemasukan','anggaran seimbang','anggaran disimpan','anggaran dibagi rata'],a:1,b:'Defisit = <b>pengeluaran melebihi pemasukan</b>. Kebalikannya surplus.'},
{s:'ppu',lv:3,t:'Makna istilah',q:'Istilah <b>ekspor</b> berarti …',o:['membeli barang dari luar negeri','menjual barang ke luar negeri','menyimpan barang di gudang','menukar barang di pasar','memproduksi barang'],a:1,b:'Ekspor = <b>mengirim/menjual barang ke luar negeri</b>. Membeli dari luar negeri disebut impor.'},
{s:'ppu',lv:3,t:'Kata baku',q:'Kata yang penulisannya <b>tidak baku</b> adalah …',o:['ijazah','imbau','sekadar','ramadhan','kedaluwarsa'],a:3,b:'Bentuk bakunya <b>Ramadan</b>. Ijazah, imbau, sekadar, dan kedaluwarsa sudah baku.'},
{s:'ppu',lv:3,t:'Kata baku',q:'"Produk itu sudah ___, jadi tidak boleh dijual lagi."<br>Kata baku yang tepat adalah …',o:['kadaluarsa','kadaluwarsa','kedaluwarsa','kedaluarsa','kadarluwarsa'],a:2,b:'Bentuk baku menurut KBBI: <b>kedaluwarsa</b>.'},
{s:'ppu',lv:3,t:'Hubungan makna',q:'Kata yang termasuk hiponim dari "kendaraan umum" adalah …',o:['sepeda','bus','mobil pribadi','motor dinas','kereta dorong'],a:1,b:'Hiponim adalah anggota dari kelompok yang lebih umum. <b>Bus</b> adalah salah satu kendaraan umum. Kendaraan pribadi dan dinas tidak termasuk.'},
{s:'ppu',lv:3,t:'Konjungsi',q:'"Ia tidak hanya pandai menyanyi, ___ juga mahir bermain piano."<br>Kata penghubung yang tepat adalah …',o:['melainkan','tetapi','sedangkan','sehingga','bahkan'],a:1,b:'Pasangan yang benar: "tidak hanya …, <b>tetapi</b> juga …". "Melainkan" berpasangan dengan "bukan": "bukan …, melainkan …".'},
{s:'ppu',lv:3,t:'Peribahasa',q:'Makna peribahasa "Air beriak tanda tak dalam" adalah …',o:['orang yang banyak bicara biasanya kurang ilmunya','air sungai yang dangkal','orang pendiam itu sombong','orang pintar banyak bicara','sungai yang tenang berbahaya'],a:0,b:'Air yang beriak (berbunyi) biasanya dangkal. Maknanya: <b>orang yang banyak omong biasanya ilmunya dangkal</b>.'},
{s:'ppu',lv:3,t:'Ungkapan',q:'"Setelah gagal dua kali, ia <b>banting setir</b> menjadi pengusaha."<br>Makna ungkapan bercetak tebal adalah …',o:['mengalami kecelakaan','beralih ke bidang lain','membeli mobil baru','menyerah','bekerja keras'],a:1,b:'Banting setir = <b>beralih ke pekerjaan atau bidang lain</b> secara tiba-tiba.'},
{s:'ppu',lv:3,t:'English vocabulary',q:'"The new law will <b>benefit</b> small businesses."<br>The word in bold is closest in meaning to …',o:['harm','help','close','tax','ignore'],a:1,b:'Benefit = memberi manfaat, <b>help</b>.'},
{s:'ppu',lv:3,t:'English vocabulary',q:'"The museum is <b>accessible</b> to wheelchair users."<br>The word in bold means …',o:['expensive','easy to enter or use','far away','closed','dangerous'],a:1,b:'Accessible = mudah dimasuki atau dijangkau, <b>easy to enter or use</b>.'},
{s:'ppu',lv:3,t:'English vocabulary',q:'"Prices have <b>risen</b> sharply this year."<br>The opposite of the word in bold is …',o:['increased','grown','fallen','stayed','doubled'],a:2,b:'Risen = naik. Lawannya <b>fallen</b> = turun.'},
{s:'ppu',lv:3,t:'Imbuhan',q:'Kata <b>ketinggian</b> yang bermakna "terlalu tinggi" terdapat pada kalimat …',o:['Ketinggian gedung itu 120 meter.','Rak itu ketinggian, adik tidak bisa mengambil buku.','Pesawat terbang pada ketinggian 10.000 meter.','Ketinggian air sungai diukur setiap jam.','Ia takut pada ketinggian.'],a:1,b:'Pada kalimat itu, "ketinggian" berarti <b>terlalu tinggi</b> sehingga adik tidak bisa menjangkau. Pada kalimat lain, "ketinggian" berarti ukuran tinggi atau tempat yang tinggi.'},
{s:'ppu',lv:3,t:'Kalimat efektif',q:'Kalimat yang paling efektif adalah …',o:['Agar supaya sehat, kita harus rajin berolahraga.','Kita harus rajin berolahraga agar sehat.','Kita harus rajin berolahraga agar supaya sehat.','Demi untuk kesehatan, kita harus rajin berolahraga.','Kita harus rajin berolahraga supaya agar sehat.'],a:1,b:'"Agar" dan "supaya" bermakna sama, jadi cukup pakai salah satu. Begitu juga "demi untuk". Kalimat efektif: <b>Kita harus rajin berolahraga agar sehat.</b>'},
/* PBM (20) */
{s:'pbm',lv:3,t:'Ejaan · Kapital',q:'Penulisan huruf kapital yang tepat terdapat pada kalimat …',o:['Kami berlibur ke Danau toba.','Kami berlibur ke danau Toba.','Kami berlibur ke Danau Toba.','Kami Berlibur ke Danau Toba.','kami berlibur ke Danau Toba.'],a:2,b:'Nama geografi diikuti nama diri ditulis kapital semua unsurnya: <b>Danau Toba</b>.'},
{s:'pbm',lv:3,t:'Ejaan · Singkatan',q:'Penulisan singkatan yang tepat adalah …',o:['Rapat dimulai pukul 09.00 W.I.B.','Rapat dimulai pukul 09.00 WIB.','Rapat dimulai pukul 09.00 Wib.','Rapat dimulai pukul 09.00 wib.','Rapat dimulai pukul 09.00 W.IB.'],a:1,b:'Singkatan yang terdiri atas huruf awal kata dan bukan nama diri ditulis kapital tanpa titik: <b>WIB</b>.'},
{s:'pbm',lv:3,t:'Ejaan · Tanda petik',q:'Penggunaan tanda petik yang tepat terdapat pada kalimat …',o:['"Saya akan datang besok", kata Rina.','"Saya akan datang besok," kata Rina.','"Saya akan datang besok" kata Rina.','Saya akan datang besok," kata Rina.','"Saya akan datang besok". Kata Rina.'],a:1,b:'Dalam kalimat langsung, koma diletakkan <b>sebelum</b> tanda petik penutup: "…besok," kata Rina.'},
{s:'pbm',lv:3,t:'Kalimat efektif · Logika',q:'Kalimat yang logis adalah …',o:['Waktu dan tempat kami persilakan.','Untuk mempersingkat waktu, acara segera dimulai.','Bapak Kepala Sekolah kami persilakan memberi sambutan.','Kepada Bapak Camat waktu dipersilakan.','Mobil itu berlari kencang.'],a:2,b:'"Waktu dan tempat" tidak bisa dipersilakan, waktu tidak bisa "dipersingkat", dan mobil tidak "berlari". Yang logis: <b>Bapak Kepala Sekolah kami persilakan memberi sambutan.</b>'},
{s:'pbm',lv:3,t:'Kalimat efektif · Kesejajaran',q:'Kalimat yang memiliki bentuk rincian sejajar adalah …',o:['Tugas kami adalah mencatat, menghitung, dan pelaporan.','Tugas kami adalah pencatatan, menghitung, dan pelaporan.','Tugas kami adalah mencatat, menghitung, dan melaporkan.','Tugas kami adalah catatan, menghitung, dan melapor.','Tugas kami adalah mencatat, perhitungan, dan melaporkan.'],a:2,b:'Rincian harus satu bentuk. <b>Mencatat, menghitung, dan melaporkan</b> semuanya kata kerja berawalan me-.'},
{s:'pbm',lv:3,t:'Diksi',q:'"Kita harus ___ waktu dengan baik agar tugas selesai."<br>Kata yang paling tepat adalah …',o:['mengatur','mengurusi','memberesi','merapikan','menyusuni'],a:0,b:'Kolokasi yang lazim adalah <b>mengatur waktu</b>.'},
{s:'pbm',lv:3,t:'Konjungsi',q:'"___ sudah berlatih keras, tim itu tetap kalah di final."<br>Kata penghubung yang tepat adalah …',o:['Karena','Walaupun','Supaya','Sehingga','Apabila'],a:1,b:'Kalimat berisi pertentangan (berlatih keras tetapi kalah). Penghubung yang tepat: <b>Walaupun</b>.'},
{s:'pbm',lv:3,t:'Kalimat sumbang',q:'(1) Membaca nyaring membantu anak mengenal kata baru. (2) Anak juga belajar intonasi dan cara bertanya. (3) Banyak toko buku memberi diskon akhir tahun. (4) Selain itu, membaca bersama mempererat hubungan orang tua dan anak. (5) Karena itu, orang tua disarankan membacakan buku setiap malam.<br>Kalimat yang tidak padu adalah …',o:['(1)','(2)','(3)','(4)','(5)'],a:2,b:'Paragraf membahas manfaat membaca nyaring untuk anak. Kalimat <b>(3)</b> tentang diskon toko buku melenceng.'},
{s:'pbm',lv:3,t:'Urutan kalimat',q:'(1) Setelah itu, panitia mengumumkan pemenang di aula. (2) Lomba dimulai pukul 08.00 dengan babak penyisihan. (3) Peserta yang lolos lalu mengikuti babak final. (4) Acara ditutup dengan foto bersama.<br>Urutan yang padu adalah …',o:['2-3-1-4','2-1-3-4','3-2-1-4','2-3-4-1','1-2-3-4'],a:0,b:'Awal (2) penyisihan, lalu (3) final, "setelah itu" (1) pengumuman, terakhir (4) penutup. <b>2-3-1-4</b>.'},
{s:'pbm',lv:3,t:'Kalimat rumpang',q:'"Banyak orang mengira menghemat listrik berarti mematikan semua lampu. ___ Mengganti lampu lama dengan lampu LED, misalnya, bisa memangkas pemakaian listrik untuk penerangan hingga lebih dari setengahnya."<br>Kalimat yang tepat untuk mengisi bagian rumpang adalah …',o:['Lampu sebaiknya selalu dinyalakan.','Padahal, ada cara lain yang tidak mengorbankan kenyamanan.','Listrik di Indonesia sangat mahal.','Karena itu, semua lampu harus dimatikan.','Lampu LED mudah rusak.'],a:1,b:'Kalimat sesudahnya memberi contoh cara lain (lampu LED). Jembatannya harus mengoreksi anggapan awal: <b>Padahal, ada cara lain yang tidak mengorbankan kenyamanan.</b>'},
{s:'pbm',lv:3,t:'Ide pokok',q:'"Siswa sering menunda tugas karena merasa tugasnya terlalu besar. Cara mengatasinya adalah memecah tugas menjadi langkah-langkah kecil. Misalnya, menulis makalah dibagi menjadi mencari sumber, membuat kerangka, lalu menulis per bagian. Langkah kecil terasa lebih ringan sehingga lebih mudah dimulai."<br>Ide pokok paragraf tersebut adalah …',o:['Siswa malas mengerjakan tugas.','Memecah tugas besar menjadi langkah kecil membantu mengatasi penundaan.','Makalah harus memiliki kerangka.','Mencari sumber itu sulit.','Tugas sekolah terlalu banyak.'],a:1,b:'Kalimat pertama memaparkan masalah, kalimat kedua memberi solusi yang dijelaskan sampai akhir. Ide pokoknya solusi itu.'},
{s:'pbm',lv:3,t:'Ejaan · Angka',q:'Penulisan angka yang tepat terdapat pada kalimat …',o:['Ia lahir pada tanggal 17-Agustus-2008.','Ia lahir pada tanggal 17 Agustus 2008.','Ia lahir pada tanggal tujuh belas Agustus 2008.','Ia lahir pada tanggal 17 Agustus, 2008.','Ia lahir pada tanggal 17/Agustus/2008.'],a:1,b:'Tanggal ditulis dengan angka tanpa tanda hubung atau koma di antara bulan dan tahun: <b>17 Agustus 2008</b>.'},
{s:'pbm',lv:3,t:'Ejaan · Gabungan kata',q:'Penulisan gabungan kata yang tepat adalah …',o:['tanggungjawab','tanggung jawab','tanggung-jawab','pertanggung jawaban','bertanggungjawab'],a:1,b:'Gabungan kata dasar ditulis terpisah: <b>tanggung jawab</b>. Kalau mendapat awalan dan akhiran sekaligus, ditulis serangkai: pertanggungjawaban.'},
{s:'pbm',lv:3,t:'Ejaan · Gabungan kata berimbuhan',q:'Penulisan yang benar adalah …',o:['pertanggung jawaban','pertanggungjawaban','pertanggung-jawaban','per tanggung jawaban','pertanggungjawab an'],a:1,b:'Gabungan kata yang mendapat awalan dan akhiran sekaligus ditulis serangkai: <b>pertanggungjawaban</b>. Contoh lain: dilipatgandakan, menyebarluaskan.'},
{s:'pbm',lv:3,t:'Kata rujukan',q:'"Para petani mulai menanam padi varietas baru. Varietas <b>ini</b> diklaim tahan kekeringan."<br>Kata "ini" merujuk pada …',o:['para petani','padi varietas baru','kekeringan','musim tanam','sawah'],a:1,b:'"Varietas ini" merujuk pada <b>padi varietas baru</b> yang disebut di kalimat sebelumnya.'},
{s:'pbm',lv:3,t:'Kalimat efektif · Subjek ganda',q:'"Buku itu saya sudah baca kemarin."<br>Perbaikan kalimat yang tepat adalah …',o:['Buku itu sudah saya baca kemarin.','Buku itu saya sudah membaca kemarin.','Saya buku itu sudah baca kemarin.','Kemarin buku itu saya sudah baca.','Buku itu sudah dibaca saya kemarin.'],a:0,b:'Dalam kalimat pasif dengan pelaku kata ganti, urutannya: keterangan aspek + pelaku + kata kerja. <b>Buku itu sudah saya baca kemarin.</b>'},
{s:'pbm',lv:3,t:'Simpulan',q:'"Kota yang memiliki banyak taman cenderung memiliki suhu lebih rendah. Pepohonan menaungi jalan dan menguapkan air dari daunnya. Selain itu, taman memberi ruang bagi warga untuk berolahraga dan bersosialisasi."<br>Simpulan paragraf tersebut adalah …',o:['Taman kota memberi manfaat lingkungan dan sosial.','Kota tanpa taman pasti panas.','Warga hanya berolahraga di taman.','Pepohonan menghasilkan air.','Taman membuat kota macet.'],a:0,b:'Paragraf menyebut manfaat lingkungan (suhu lebih rendah) dan sosial (olahraga, bersosialisasi). Opsi "pasti panas" terlalu mutlak.'},
{s:'pbm',lv:3,t:'Diksi · Bersinonim',q:'"Kebijakan itu ___ banyak pihak, terutama pedagang kecil."<br>Kata yang paling tepat adalah …',o:['merugikan','merugi','kerugian','dirugikan','rugi-rugian'],a:0,b:'Butuh kata kerja aktif transitif dengan objek "banyak pihak": <b>merugikan</b>.'},
{s:'pbm',lv:3,t:'Ejaan · Kata ulang',q:'Penulisan kata ulang yang tepat adalah …',o:['sayur mayur','sayur-mayur','sayurmayur','sayur2','sayur-sayur mayur'],a:1,b:'Kata ulang berubah bunyi ditulis dengan tanda hubung: <b>sayur-mayur</b>, bolak-balik, lauk-pauk.'},
{s:'pbm',lv:3,t:'Paragraf · Kalimat utama',q:'"(1) Air bersih semakin sulit didapat di beberapa desa. (2) Sumur warga mengering saat kemarau. (3) Sungai tercemar limbah pabrik. (4) Warga terpaksa membeli air dari truk tangki dengan harga mahal."<br>Kalimat utama paragraf tersebut adalah …',o:['(1)','(2)','(3)','(4)','(2) dan (3)'],a:0,b:'Kalimat (1) bersifat umum, sedangkan (2), (3), dan (4) adalah rincian penyebab dan akibatnya. Kalimat utamanya <b>(1)</b>.'},

{s:'lbi',lv:3,p:'m2i1',t:'Ide pokok',q:'Gagasan utama teks tersebut adalah …',o:['Gawai harus dilarang di sekolah.','Program detoks digital membawa dampak positif dan bertujuan melatih kendali diri.','Siswa asrama tidak suka membaca.','Psikolog menolak teknologi.','Program hanya berlangsung tiga bulan.'],a:1,b:'Teks memaparkan program, hasilnya, tantangannya, dan menegaskan tujuannya: melatih kendali diri, bukan memusuhi teknologi.'},

{s:'lbi',lv:3,p:'m2i1',t:'Makna frasa',q:'Frasa "dipakai secara sadar, bukan secara otomatis" bermakna …',o:['gawai hanya dipakai saat tidur','gawai digunakan karena keperluan yang disengaja, bukan karena kebiasaan tanpa berpikir','gawai harus diatur otomatis','gawai dipakai sesuai jadwal sekolah','gawai tidak boleh dipakai'],a:1,b:'"Sadar" lawan "otomatis": menggunakan gawai dengan niat yang jelas, bukan refleks membuka ponsel tanpa alasan.'},
{s:'lbi',lv:3,p:'m2i1',t:'Inferensi',q:'Kecemasan di jam-jam awal program kemungkinan besar terjadi karena …',o:['siswa kelelahan berolahraga','siswa terbiasa terus terhubung dan takut ketinggalan kabar','pengasuh terlalu galak','buku bacaan kurang menarik','sekolah melarang siswa pulang'],a:1,b:'Teks menyebut siswa "takut ketinggalan kabar". Ini menunjukkan mereka sudah terbiasa terus terhubung.'},
{s:'lbi',lv:3,p:'m2i1',t:'Sikap',q:'Sikap psikolog terhadap teknologi digital dapat digambarkan sebagai …',o:['menolak','netral dan mendorong penggunaan yang terkendali','sangat antusias','takut','tidak peduli'],a:1,b:'Ia menegaskan detoks bukan untuk memusuhi teknologi, melainkan agar penggunaannya terkendali.'},
{s:'lbi',lv:3,p:'m2i2',t:'Ide pokok',q:'Menurut teks, ancaman terbesar bagi bahasa daerah adalah …',o:['larangan pemerintah','berhentinya pewarisan dari orang tua ke anak','kurangnya kamus','jumlah bahasa yang terlalu banyak','media sosial'],a:1,b:'Teks menyebutnya secara langsung: ancaman terbesar adalah <b>berhentinya pewarisan</b>, bukan larangan.'},

{s:'lbi',lv:3,p:'m2i2',t:'Pendapat ahli',q:'Menurut ahli bahasa, bahasa daerah dapat bertahan jika …',o:['banyak dibuat konten media','tetap digunakan dalam kehidupan sehari-hari','dimasukkan ke ujian nasional','diterjemahkan ke bahasa Inggris','dipelajari di universitas'],a:1,b:'Kalimat terakhir: bahasa bertahan bila <b>tetap dipakai sehari-hari</b>, misalnya di rumah dan pasar.'},
{s:'lbi',lv:3,p:'m2i2',t:'Makna frasa',q:'Frasa <b>melawan arus</b> dalam teks bermakna …',o:['berenang di sungai','berusaha berbeda dari kecenderungan umum','menolak aturan pemerintah','bertengkar dengan warga','bekerja di laut'],a:1,b:'Melawan arus = <b>bertindak berbeda dari kecenderungan umum</b>. Di sini kecenderungannya adalah meninggalkan bahasa daerah.'},
{s:'lbi',lv:3,p:'m2i2',t:'Inferensi',q:'Pernyataan yang sesuai dengan isi teks adalah …',o:['Konten media saja sudah cukup menyelamatkan bahasa daerah.','Keluarga memegang peran penting dalam kelangsungan bahasa daerah.','Bahasa daerah dilarang di sekolah.','Semua bahasa daerah akan punah.','Kamus daring tidak bermanfaat.'],a:1,b:'Pewarisan dari orang tua ke anak disebut kunci, dan rumah disebut sebagai tempat pemakaian. Jadi <b>keluarga memegang peran penting</b>.'},

{s:'lbi',lv:3,p:'m2i3',t:'Makna istilah',q:'Istilah <b>tengkulak</b> dalam teks berarti …',o:['pemilik kedai kopi','pedagang perantara yang membeli hasil panen dari petani','pemerintah daerah','petani kopi','konsumen'],a:1,b:'Tengkulak = <b>pedagang perantara</b>. Petunjuknya ada di frasa "memotong rantai perantara".'},

{s:'lbi',lv:3,p:'m2i3',t:'Solusi',q:'Tujuan pembangunan rumah jemur beratap plastik transparan adalah …',o:['menyimpan kopi lebih lama','agar pengeringan tidak bergantung pada cuaca','menghemat listrik','menarik wisatawan','mempercepat panen'],a:1,b:'Kalimat terakhir: agar proses pengeringan <b>tidak bergantung pada cuaca</b>.'},
{s:'lbi',lv:3,p:'m2i3',t:'Inferensi',q:'Jika seorang petani menjual biji mentah ke tengkulak seharga Rp30.000/kg, maka menurut teks, dengan menjual kopi olahan langsung ke kedai ia bisa memperoleh sekitar …',o:['Rp15.000–Rp30.000/kg','Rp30.000–Rp45.000/kg','Rp60.000–Rp90.000/kg','Rp150.000/kg','Rp300.000/kg'],a:2,b:'Teks menyebut harga bisa 2–3 kali lipat. 2 × 30.000 = 60.000 dan 3 × 30.000 = 90.000.'},

m3i1:{judul:'Kecerdasan Buatan di Ruang Kelas', isi:`<p>Kehadiran aplikasi kecerdasan buatan (AI) yang dapat menulis esai dalam hitungan detik memicu perdebatan di kalangan pendidik. Sebagian guru khawatir siswa akan menyerahkan seluruh tugas menulis kepada mesin sehingga kemampuan berpikir kritis mereka tumpul. Beberapa sekolah bahkan sempat melarang penggunaannya.</p><p>Namun, guru lain berpendapat bahwa larangan total tidak realistis karena siswa tetap dapat mengaksesnya di luar sekolah. Mereka memilih mengubah bentuk tugas: siswa diminta membandingkan jawaban AI dengan sumber lain, menemukan kesalahannya, lalu memperbaikinya. Dengan cara itu, AI menjadi bahan latihan berpikir, bukan jalan pintas. Para pendukung pendekatan ini mengakui bahwa guru membutuhkan pelatihan agar dapat merancang tugas semacam itu.</p>`},
m3i2:{judul:'Mengapa Transportasi Umum Sepi?', isi:`<p>Pemerintah kota telah membangun jalur bus baru dengan halte modern, tetapi jumlah penumpangnya belum sesuai harapan. Survei kepada 1.000 warga menunjukkan bahwa alasan utama mereka tetap memakai kendaraan pribadi adalah sulitnya mencapai halte dari rumah (42%), waktu tunggu yang tidak pasti (31%), dan tarif (12%).</p><p>Temuan ini menunjukkan bahwa masalahnya bukan pada kualitas bus, melainkan pada perjalanan "kilometer pertama dan terakhir", yaitu jarak antara rumah dan halte. Para perencana kota mengusulkan penyediaan angkutan pengumpan, trotoar yang nyaman, serta informasi jadwal waktu nyata di ponsel. Mereka memperingatkan bahwa menurunkan tarif tanpa memperbaiki akses hanya akan berdampak kecil.</p>`},
m3i3:{judul:'Seribu Hari Pertama Kehidupan', isi:`<p>Stunting adalah kondisi tubuh anak yang lebih pendek dibandingkan standar usianya akibat kekurangan gizi kronis. Dampaknya tidak hanya pada tinggi badan, tetapi juga pada perkembangan otak, yang dapat memengaruhi kemampuan belajar dan produktivitas di masa dewasa.</p><p>Para ahli menekankan pentingnya seribu hari pertama kehidupan, dihitung sejak masa kehamilan hingga anak berusia dua tahun. Pada periode ini, otak berkembang sangat pesat sehingga kekurangan gizi sulit dipulihkan sepenuhnya di kemudian hari. Karena itu, upaya pencegahan tidak cukup dengan memberi makanan tambahan pada balita. Ibu hamil juga perlu mendapat gizi cukup, air bersih harus tersedia, dan sanitasi lingkungan harus baik, sebab infeksi berulang dapat menghambat penyerapan gizi.</p>`},
m3i4:{judul:'Gagasan Kota 15 Menit', isi:`<p>Konsep kota 15 menit membayangkan kota tempat warga dapat memenuhi kebutuhan sehari-hari, seperti sekolah, pasar, puskesmas, dan taman, cukup dengan berjalan kaki atau bersepeda selama 15 menit dari rumah. Pendukungnya menilai konsep ini dapat mengurangi kemacetan, polusi, dan waktu yang terbuang di jalan.</p><p>Kritik datang dari dua arah. Sebagian warga khawatir konsep ini akan membatasi pergerakan mereka, padahal tujuannya justru menambah pilihan, bukan melarang bepergian jauh. Kritik lain lebih praktis: banyak kota sudah terlanjur tumbuh dengan permukiman yang jauh dari pusat layanan, sehingga mewujudkan kota 15 menit memerlukan perubahan tata ruang besar dan waktu puluhan tahun.</p>`},
m3i5:{judul:'Karya Digital dan Hak Cipta', isi:`<p>Media sosial memudahkan siapa saja membagikan karya: foto, musik, ilustrasi, atau video. Kemudahan ini juga memudahkan pelanggaran hak cipta. Banyak pengguna mengunggah ulang karya orang lain tanpa izin dengan anggapan bahwa mencantumkan nama pembuatnya sudah cukup.</p><p>Padahal, menurut undang-undang, mencantumkan nama pencipta tidak otomatis membuat penggunaan menjadi sah. Pemilik hak cipta berhak menentukan apakah karyanya boleh digunakan, oleh siapa, dan untuk keperluan apa. Ada pengecualian terbatas, misalnya untuk keperluan pendidikan, kritik, atau penelitian, dengan syarat sumbernya disebutkan dan tidak merugikan kepentingan wajar pencipta. Para kreator menyarankan cara sederhana: tanyakan izin terlebih dahulu, atau gunakan karya berlisensi terbuka.</p>`},
m3i6:{judul:'Remaja dan Pinjaman Daring', isi:`<p>Fitur "beli sekarang, bayar nanti" kini mudah ditemukan di aplikasi belanja. Bagi sebagian remaja dan mahasiswa, fitur ini terasa seperti tambahan uang saku. Masalah muncul ketika cicilan dari beberapa aplikasi menumpuk, sementara pemasukan tidak bertambah.</p><p>Otoritas keuangan mencatat bahwa keterlambatan pembayaran dapat tercatat dalam riwayat kredit dan menyulitkan seseorang mengajukan pinjaman resmi di masa depan, misalnya untuk rumah atau usaha. Perencana keuangan menyarankan aturan sederhana: jangan menggunakan cicilan untuk barang yang nilainya akan cepat turun, dan pastikan total cicilan bulanan tidak lebih dari sepertiga pemasukan. Mereka juga mengingatkan untuk hanya menggunakan layanan yang terdaftar dan diawasi otoritas resmi.</p>`},
m3e1:{judul:'Urban Heat Islands', isi:`<p>Cities are often several degrees warmer than the surrounding countryside, a phenomenon known as the urban heat island effect. Roads, roofs, and concrete buildings absorb sunlight during the day and release the heat slowly at night. At the same time, cities have fewer trees and plants, which normally cool the air by providing shade and releasing water vapor.</p><p>The extra heat is more than just uncomfortable. It increases the use of air conditioners, which raises electricity demand and can even make the problem worse by pumping hot air outside. Some cities are responding by painting roofs white to reflect sunlight, planting street trees, and creating small parks between buildings.</p>`},
m3e2:{judul:'Microplastics Everywhere', isi:`<p>Microplastics are tiny pieces of plastic smaller than five millimeters. Some are made intentionally small, such as beads once used in face scrubs, while most come from larger plastic items that break down over time. Washing synthetic clothes also releases thousands of tiny fibers into wastewater.</p><p>Scientists have found microplastics in oceans, soil, drinking water, and even in the air. Their effect on human health is still being studied, and researchers caution against drawing firm conclusions too early. However, many experts agree that reducing plastic waste is a sensible step while the research continues.</p>`},
m3e3:{judul:'The Gig Economy', isi:`<p>The gig economy refers to work arranged through apps, where people take short-term tasks such as delivering food, driving passengers, or designing logos. Supporters say it offers flexibility: workers can choose when and how much they work, which suits students and parents.</p><p>Critics, however, point out that gig workers usually do not receive benefits such as health insurance or paid leave, and their income can change suddenly when an app adjusts its rates. Several countries are now debating whether gig workers should be classified as employees, which would give them more protection but might reduce the flexibility that many of them value.</p>`},
m3e4:{judul:'Is Homework Useful?', isi:`<p>Homework has long been a normal part of school life, but its value is still debated. Studies suggest that for older students, a moderate amount of homework is linked to better test results. For young children, however, the benefits appear much smaller.</p><p>Researchers also note that the quality of homework matters more than the quantity. Tasks that ask students to practice what they learned in class, or to apply it to a real situation, tend to be more useful than repetitive worksheets. Too much homework, on the other hand, can reduce sleep and free time, which are also important for learning.</p>`}

{s:'pu',lv:4,t:'Deduktif · Ekuivalensi',q:'Pernyataan "Jika siswa terlambat, ia tidak boleh mengikuti ujian" setara dengan …',o:['Jika siswa boleh mengikuti ujian, ia tidak terlambat.','Jika siswa tidak terlambat, ia boleh mengikuti ujian.','Siswa terlambat dan tidak boleh mengikuti ujian.','Jika siswa tidak boleh mengikuti ujian, ia terlambat.','Siswa tidak terlambat dan boleh mengikuti ujian.'],a:0,b:'Kontraposisi p → ~q adalah q → ~p: <b>jika boleh ikut ujian, ia tidak terlambat</b>. Opsi "tidak terlambat → boleh ikut" adalah invers, tidak setara (bisa saja ada alasan lain tidak boleh ikut).'},
{s:'pu',lv:4,t:'Deduktif · Negasi implikasi',q:'Negasi dari "Jika hujan turun, pertandingan ditunda" adalah …',o:['Jika hujan tidak turun, pertandingan tidak ditunda.','Hujan turun dan pertandingan tidak ditunda.','Hujan tidak turun dan pertandingan ditunda.','Jika pertandingan ditunda, hujan turun.','Hujan tidak turun atau pertandingan ditunda.'],a:1,b:'Negasi p → q adalah <b>p dan tidak q</b>: hujan turun, tetapi pertandingan tidak ditunda. Hanya kondisi itu yang membuat janji "jika… maka…" menjadi salah.'},
{s:'pu',lv:4,t:'Deduktif · Silogisme campuran',q:'Semua anggota klub robotik pandai matematika. Sebagian anggota klub robotik adalah siswa kelas XI. Tidak ada siswa kelas XI yang mengikuti klub teater.<br>Simpulan yang pasti benar adalah …',o:['Semua siswa kelas XI pandai matematika.','Sebagian siswa yang pandai matematika tidak mengikuti klub teater.','Tidak ada anggota klub teater yang pandai matematika.','Semua anggota klub robotik tidak mengikuti klub teater.','Sebagian anggota klub teater adalah anggota klub robotik.'],a:1,b:'Ada anggota robotik yang kelas XI. Mereka pandai matematika (premis 1) dan tidak ikut teater (premis 3). Jadi pasti <b>ada (sebagian) siswa pandai matematika yang tidak ikut teater</b>. Opsi lain terlalu luas.'},
{s:'pu',lv:4,t:'Analitik · Penataan rak',q:'Lima buku (A, B, C, D, E) disusun dari kiri ke kanan pada posisi 1–5. B berada di posisi tengah. A tidak bersebelahan dengan B. D berada tepat di sebelah kanan C. E tidak berada di ujung. C tidak berada di ujung kiri.<br>Buku yang berada di posisi paling kanan adalah …',o:['A','B','C','D','E'],a:3,b:'B = 3. A tidak boleh di 2 atau 4, jadi A di 1 atau 5. E bukan di ujung, jadi E di 2 atau 4. Kalau A = 5, pasangan C-D harus di (1,2), padahal C tidak boleh di ujung kiri. Jadi A = 1. Lalu E = 2 (kalau E = 4, posisi kosong 2 dan 5 tidak berurutan untuk C-D). Maka C = 4, D = 5. Urutan: A, E, B, C, D. Paling kanan <b>D</b>.'},
{s:'pu',lv:4,t:'Analitik · Kelompok belajar',q:'Enam siswa (F, G, H, I, J, K) dibagi menjadi dua kelompok sama besar. F dan G harus satu kelompok. H tidak boleh satu kelompok dengan F. I satu kelompok dengan H.<br>Jika J satu kelompok dengan F, maka anggota kelompok H adalah …',o:['H, I, K','H, I, J','H, G, K','H, I, F','H, J, K'],a:0,b:'Kelompok F berisi F, G, J (3 orang, penuh). H tidak bersama F, jadi H di kelompok lain bersama I dan sisa satu orang, K. Kelompok H: <b>H, I, K</b>.'},
{s:'pu',lv:4,t:'Deduktif · Modus tollens + disjungsi',q:'Andi pergi ke perpustakaan atau ke laboratorium. Jika Andi ke laboratorium, ia membawa jas lab. Andi tidak membawa jas lab.<br>Simpulan yang tepat adalah …',o:['Andi ke laboratorium.','Andi ke perpustakaan.','Andi tidak ke mana-mana.','Andi ke laboratorium tanpa jas.','Andi ke perpustakaan dan laboratorium.'],a:1,b:'Tidak membawa jas lab → tidak ke laboratorium (modus tollens). Karena pilihannya hanya perpustakaan atau laboratorium, maka <b>Andi ke perpustakaan</b>.'},
{s:'pu',lv:4,t:'Analitik · Urutan kedatangan',q:'Lima teman (L, M, N, O, P) tiba di kafe satu per satu. L tiba sebelum M tetapi setelah N. O tiba tepat setelah M. P tiba pertama.<br>Siapa yang tiba keempat?',o:['L','M','N','O','P'],a:1,b:'P pertama. Urutan N &lt; L &lt; M, dan O tepat setelah M. Satu-satunya susunan: P, N, L, M, O. Yang keempat <b>M</b>.'},
{s:'pu',lv:4,t:'Deduktif · Kuantor ganda',q:'Semua peneliti di lembaga itu menulis jurnal. Sebagian penulis jurnal adalah dosen. Tidak ada dosen yang bekerja paruh waktu.<br>Simpulan yang PASTI benar adalah …',o:['Sebagian peneliti adalah dosen.','Tidak ada peneliti yang bekerja paruh waktu.','Sebagian penulis jurnal tidak bekerja paruh waktu.','Semua dosen adalah peneliti.','Semua penulis jurnal bekerja penuh waktu.'],a:2,b:'Penulis jurnal yang dosen (sebagian) pasti tidak bekerja paruh waktu. Jadi <b>sebagian penulis jurnal tidak bekerja paruh waktu</b>. Hubungan peneliti dengan dosen tidak pasti.'},
{s:'pu',lv:4,t:'Analitik · Jadwal presentasi',q:'Empat kelompok (W, X, Y, Z) presentasi berurutan dari pertama sampai keempat. X tampil sebelum Y. W tidak tampil pertama maupun terakhir. Z tampil tepat setelah W.<br>Kelompok yang tampil pertama adalah …',o:['W','X','Y','Z','Tidak dapat ditentukan'],a:1,b:'W hanya bisa di posisi 2 atau 3. Kalau W = 3, Z = 4, dan X, Y di 1-2 dengan X sebelum Y: X=1, Y=2 ✓. Kalau W = 2, Z = 3, lalu X dan Y menempati 1 dan 4, X harus sebelum Y: X=1, Y=4 ✓. Di kedua kemungkinan, yang pertama selalu <b>X</b>.'},
{s:'pu',lv:4,t:'Deduktif · Penarikan simpulan',q:'Setiap peserta yang lulus tes tulis mengikuti wawancara. Semua yang mengikuti wawancara diumumkan Jumat. Rina tidak diumumkan Jumat. Sinta mengikuti wawancara.<br>Pernyataan yang pasti benar adalah …',o:['Rina lulus tes tulis.','Sinta lulus tes tulis.','Rina tidak lulus tes tulis dan Sinta diumumkan Jumat.','Sinta tidak diumumkan Jumat.','Rina mengikuti wawancara.'],a:2,b:'Rina tidak diumumkan Jumat → tidak wawancara → tidak lulus tes tulis. Sinta ikut wawancara → diumumkan Jumat. Belum tentu Sinta lulus tes tulis (bisa jadi ada jalur wawancara lain). Jawaban: <b>Rina tidak lulus tes tulis dan Sinta diumumkan Jumat</b>.'},

{s:'pbm',lv:4,t:'Kalimat efektif',q:'Kalimat yang efektif adalah …',o:['Dengan adanya program ini membuat warga terbantu.','Program ini membuat warga terbantu.','Dengan adanya program ini, membuat warga terbantu.','Adanya program ini sehingga warga terbantu.','Karena program ini maka warga terbantu.'],a:1,b:'Kalimat yang diawali "dengan adanya" lalu diikuti predikat "membuat" kehilangan subjek. "Karena… maka…" juga berlebihan. Yang efektif: <b>Program ini membuat warga terbantu.</b>'},
{s:'pbm',lv:4,t:'Kalimat efektif · Penalaran',q:'"Meskipun hujan deras, sehingga pertandingan tetap dilanjutkan."<br>Perbaikan kalimat tersebut yang tepat adalah …',o:['Meskipun hujan deras, pertandingan tetap dilanjutkan.','Hujan deras sehingga pertandingan tetap dilanjutkan.','Meskipun hujan deras, sehingga pertandingan dilanjutkan.','Karena hujan deras, pertandingan tetap dilanjutkan.','Hujan deras, meskipun pertandingan tetap dilanjutkan.'],a:0,b:'"Meskipun" tidak boleh dipasangkan dengan "sehingga". Hapus "sehingga": <b>Meskipun hujan deras, pertandingan tetap dilanjutkan.</b>'},
{s:'pbm',lv:4,t:'Ejaan · Tanda koma',q:'Penggunaan tanda koma yang tepat terdapat pada kalimat …',o:['Jika kamu lelah, beristirahatlah sejenak.','Jika kamu lelah beristirahatlah, sejenak.','Beristirahatlah sejenak, jika kamu lelah.','Jika, kamu lelah beristirahatlah sejenak.','Jika kamu, lelah beristirahatlah sejenak.'],a:0,b:'Koma dipakai setelah anak kalimat yang mendahului induk kalimat: <b>Jika kamu lelah, beristirahatlah sejenak.</b> Kalau anak kalimat di belakang, koma tidak dipakai.'},
{s:'pbm',lv:4,t:'Ejaan · Huruf miring',q:'Penulisan yang tepat untuk istilah asing dalam kalimat adalah …',o:['Rapat dilakukan secara <i>online</i>.','Rapat dilakukan secara "online".','Rapat dilakukan secara ONLINE.','Rapat dilakukan secara Online.','Rapat dilakukan secara (online).'],a:0,b:'Kata asing yang belum diserap ditulis dengan <b>huruf miring</b>. Padanan bakunya: <i>daring</i>.'},
{s:'pbm',lv:4,t:'Diksi · Kata bermakna tepat',q:'"Hasil survei itu ___ bahwa minat baca remaja meningkat."<br>Kata yang paling tepat adalah …',o:['menunjukkan','memamerkan','memperlihatkankan','menampakkan diri','menunjuk'],a:0,b:'Kolokasi yang tepat untuk hasil survei: <b>menunjukkan</b>.'},
{s:'pbm',lv:4,t:'Kalimat rumpang',q:'"Banyak orang menganggap sampah organik tidak berbahaya karena mudah terurai. ___ Di tempat pembuangan akhir, sampah organik yang tertimbun tanpa oksigen menghasilkan gas metana."<br>Kalimat yang tepat untuk mengisi bagian rumpang adalah …',o:['Sampah organik memang mudah terurai.','Anggapan itu tidak sepenuhnya benar.','Karena itu, sampah organik aman dibuang ke mana saja.','Sampah plastik lebih berbahaya.','Gas metana tidak berbahaya.'],a:1,b:'Kalimat sesudahnya membantah anggapan pada kalimat pertama. Jembatan yang tepat: <b>Anggapan itu tidak sepenuhnya benar.</b>'},
{s:'pbm',lv:4,t:'Kalimat sumbang',q:'(1) Bersepeda ke sekolah memberi banyak manfaat. (2) Siswa menjadi lebih bugar karena berolahraga setiap hari. (3) Polusi kendaraan juga berkurang. (4) Sepeda pertama kali diciptakan di Eropa pada abad ke-19. (5) Selain itu, siswa dapat menghemat ongkos transportasi.<br>Kalimat yang tidak padu adalah …',o:['(1)','(2)','(3)','(4)','(5)'],a:3,b:'Paragraf membahas manfaat bersepeda ke sekolah. Kalimat <b>(4)</b> tentang sejarah sepeda tidak mendukung gagasan itu.'},
{s:'pbm',lv:4,t:'Urutan paragraf',q:'(1) Akibatnya, banyak siswa kesulitan memahami bacaan panjang. (2) Kebiasaan membaca teks pendek di media sosial membuat rentang perhatian menyempit. (3) Untuk mengatasinya, sekolah menerapkan program membaca 15 menit sebelum pelajaran. (4) Program itu kini mulai menunjukkan hasil.<br>Urutan yang padu adalah …',o:['2-1-3-4','1-2-3-4','2-3-1-4','3-2-1-4','2-1-4-3'],a:0,b:'Sebab (2) → akibat (1) → solusi (3) → hasil (4): <b>2-1-3-4</b>.'},
{s:'pbm',lv:4,t:'Ejaan · Kapital nama lembaga',q:'Penulisan nama lembaga yang tepat adalah …',o:['Ia bekerja di Kementerian pendidikan.','Ia bekerja di kementerian Pendidikan.','Ia bekerja di Kementerian Pendidikan, Kebudayaan, Riset, dan Teknologi.','Ia bekerja di Kementerian Pendidikan, kebudayaan, riset, dan teknologi.','Ia bekerja di kementerian pendidikan, kebudayaan, riset dan teknologi.'],a:2,b:'Setiap kata dalam nama lembaga resmi ditulis kapital, kecuali kata tugas seperti "dan". Jawaban: opsi dengan semua unsur nama berhuruf kapital.'},
{s:'pbm',lv:4,t:'Kata baku dalam teks',q:'"Pemerintah mengeluarkan himbauan agar warga mengurangi penggunaan plastik. Imbauan itu disampaikan melalui media sosial dan baliho."<br>Kata yang tidak baku dalam teks tersebut adalah …',o:['mengeluarkan','himbauan','imbauan','penggunaan','baliho'],a:1,b:'Bentuk bakunya <b>imbauan</b> (dari imbau), bukan "himbauan". Kalimat kedua sudah memakai bentuk yang benar.'},
{s:'pbm',lv:4,t:'Simpulan',q:'"Di desa itu, jumlah pemuda yang merantau ke kota terus bertambah. Lahan pertanian banyak yang tidak tergarap. Para petani yang tersisa kebanyakan berusia di atas 50 tahun."<br>Simpulan yang tepat adalah …',o:['Desa itu menghadapi kekurangan tenaga kerja muda di sektor pertanian.','Pemuda desa tidak suka bertani karena malas.','Kota menjadi lebih sepi.','Lahan pertanian di desa itu tidak subur.','Petani tua lebih produktif daripada petani muda.'],a:0,b:'Tiga fakta (pemuda merantau, lahan terbengkalai, petani tua) bermuara pada <b>kekurangan tenaga muda di pertanian</b>. Opsi "malas" adalah dugaan tanpa dasar.'},
{s:'pbm',lv:4,t:'Konjungsi korelatif',q:'"Program itu ___ membantu siswa berprestasi, ___ juga siswa yang kurang mampu."<br>Pasangan kata yang tepat adalah …',o:['bukan … melainkan','tidak hanya … tetapi','baik … maupun','entah … entah','jangankan … pun'],a:1,b:'Pola "tidak hanya …, tetapi juga …" menambahkan sasaran kedua. <b>Tidak hanya … tetapi</b>.'},
{s:'pbm',lv:4,t:'Ejaan · Tanda hubung',q:'Penggunaan tanda hubung yang tepat terdapat pada …',o:['se-Indonesia','se-kota','ke-dua','anti-korupsi','pasca-sarjana'],a:0,b:'Tanda hubung dipakai antara awalan dan kata berhuruf kapital: <b>se-Indonesia</b>. Lainnya ditulis serangkai: sekota, kedua, antikorupsi, pascasarjana.'},
{s:'pbm',lv:4,t:'Kalimat efektif · Pasif',q:'Kalimat pasif yang benar adalah …',o:['Surat itu sudah dikirimkan oleh saya.','Surat itu sudah saya kirimkan.','Surat itu saya sudah kirimkan.','Surat itu sudah dikirimkan saya.','Surat itu oleh saya sudah dikirimkan.'],a:1,b:'Pelaku kata ganti orang pertama/kedua ditulis langsung sebelum kata kerja tanpa "di-" dan tanpa "oleh": <b>sudah saya kirimkan</b>.'},
{s:'pbm',lv:4,t:'Kata rujukan',q:'"Para ilmuwan meneliti dua jenis padi. Jenis pertama tahan banjir, sedangkan jenis kedua tahan kekeringan. Yang <b>terakhir</b> cocok untuk daerah timur yang curah hujannya rendah."<br>Kata "terakhir" merujuk pada …',o:['para ilmuwan','padi jenis pertama','padi jenis kedua','daerah timur','curah hujan'],a:2,b:'"Yang terakhir" merujuk pada hal yang disebut paling akhir: <b>padi jenis kedua</b> (tahan kekeringan), cocok untuk daerah bercurah hujan rendah.'},
{s:'pbm',lv:4,t:'Ide pokok',q:'"Membuat catatan dengan tulisan tangan ternyata membantu siswa memahami pelajaran lebih baik daripada mengetik. Saat menulis tangan, siswa tidak bisa mencatat semua kata, sehingga mereka harus meringkas dengan kalimat sendiri. Proses meringkas inilah yang membuat otak mengolah informasi lebih dalam."<br>Ide pokok paragraf tersebut adalah …',o:['Mengetik lebih cepat daripada menulis tangan.','Mencatat dengan tangan membantu pemahaman karena memaksa siswa meringkas.','Siswa harus mencatat semua kata guru.','Otak tidak mengolah informasi saat mengetik.','Kertas lebih murah daripada laptop.'],a:1,b:'Kalimat pertama adalah klaim, kalimat berikutnya menjelaskan alasannya (meringkas). Ide pokok menggabungkan keduanya.'},
{s:'pbm',lv:4,t:'Ejaan · Penulisan kata',q:'Penulisan kata yang benar adalah …',o:['di samping itu','disamping itu','di-samping itu','disamping-itu','di sampingitu'],a:0,b:'"Di" adalah kata depan yang menunjukkan tempat/posisi, ditulis terpisah: <b>di samping itu</b>.'},
{s:'pbm',lv:4,t:'Kalimat efektif · Kehematan',q:'"Ia menceritakan tentang pengalamannya selama di luar negeri."<br>Kata yang sebaiknya dihilangkan agar kalimat efektif adalah …',o:['ia','menceritakan','tentang','pengalamannya','negeri'],a:2,b:'Kata kerja "menceritakan" sudah transitif dan langsung diikuti objek. Kata <b>tentang</b> mubazir. Bandingkan: "bercerita tentang" (benar) vs "menceritakan pengalamannya" (benar).'},
{s:'pbm',lv:4,t:'Paragraf · Kalimat penjelas',q:'"Teknologi pengenalan wajah semakin banyak digunakan. ___"<br>Kalimat penjelas yang paling tepat untuk melanjutkan paragraf adalah …',o:['Wajah setiap orang berbeda-beda.','Teknologi ini dipakai untuk membuka ponsel, absensi kantor, hingga pemeriksaan di bandara.','Kamera ponsel semakin murah.','Banyak orang suka berfoto.','Bandara selalu ramai saat liburan.'],a:1,b:'Kalimat penjelas harus merinci kalimat utama ("semakin banyak digunakan"). Opsi itu memberi contoh penggunaannya.'},
{s:'pbm',lv:4,t:'Diksi · daripada',q:'Penggunaan kata "daripada" yang tepat terdapat pada kalimat …',o:['Daripada itu, kita harus segera berangkat.','Tujuan daripada program ini adalah pemerataan.','Belajar lebih baik daripada bermain gim seharian.','Sebagian daripada siswa sudah pulang.','Pidato daripada kepala sekolah sangat inspiratif.'],a:2,b:'"Daripada" hanya untuk membandingkan: <b>lebih baik daripada</b>. Penggunaan lain (tujuan daripada, sebagian daripada) tidak baku.'},
/* LBI (30) */
{s:'lbi',lv:4,p:'m3i1',t:'Pokok masalah',q:'Masalah utama yang dibahas dalam teks adalah …',o:['harga aplikasi AI yang mahal','perbedaan cara pendidik menyikapi AI dalam tugas sekolah','larangan menggunakan ponsel di sekolah','pelatihan guru matematika','cara menulis esai yang baik'],a:1,b:'Teks memaparkan dua sikap guru: melarang vs mengubah bentuk tugas.'},
{s:'lbi',lv:4,p:'m3i1',t:'Argumen',q:'Alasan sebagian guru menganggap larangan total tidak realistis adalah …',o:['AI tidak berbahaya','siswa tetap dapat mengakses AI di luar sekolah','sekolah tidak punya internet','guru juga memakai AI','orang tua menolak larangan'],a:1,b:'Teks: larangan total tidak realistis karena siswa tetap bisa mengaksesnya di luar sekolah.'},
{s:'lbi',lv:4,p:'m3i1',t:'Makna frasa',q:'Frasa "bahan latihan berpikir, bukan jalan pintas" bermakna AI digunakan untuk …',o:['menggantikan guru','melatih siswa menganalisis dan memperbaiki jawaban, bukan untuk menyelesaikan tugas tanpa usaha','mempercepat ujian','menghafal jawaban','mengurangi jam belajar'],a:1,b:'Tugas yang dirancang meminta siswa membandingkan, menemukan kesalahan, dan memperbaiki. Itulah "latihan berpikir".'},
{s:'lbi',lv:4,p:'m3i1',t:'Syarat',q:'Menurut pendukung pendekatan kedua, apa yang dibutuhkan agar pendekatan itu berhasil?',o:['aplikasi AI yang lebih canggih','pelatihan guru untuk merancang tugas','larangan di rumah','ujian yang lebih sulit','buku pelajaran baru'],a:1,b:'Kalimat terakhir: guru membutuhkan <b>pelatihan</b> untuk merancang tugas semacam itu.'},
{s:'lbi',lv:4,p:'m3i1',t:'Melemahkan',q:'Pernyataan yang paling MELEMAHKAN kekhawatiran bahwa AI membuat kemampuan berpikir kritis siswa tumpul adalah …',o:['Banyak siswa menyalin jawaban AI tanpa membaca.','Siswa yang dilatih mengoreksi jawaban AI menunjukkan peningkatan nilai berpikir kritis.','Aplikasi AI semakin populer.','Guru tidak menyukai AI.','AI bisa menulis esai dalam hitungan detik.'],a:1,b:'Kalau terbukti siswa yang mengoreksi AI justru meningkat kemampuan berpikir kritisnya, kekhawatiran itu melemah.'},
{s:'lbi',lv:4,p:'m3i2',t:'Data',q:'Dari 1.000 warga yang disurvei, berapa orang yang beralasan sulit mencapai halte?',o:['120','310','420','730','42'],a:2,b:'42% × 1.000 = <b>420 orang</b>.'},
{s:'lbi',lv:4,p:'m3i2',t:'Inferensi',q:'Berdasarkan data survei, berapa persen warga yang alasannya tidak termasuk dalam tiga alasan yang disebut?',o:['5%','10%','15%','25%','85%'],a:2,b:'42% + 31% + 12% = 85%. Sisanya 100% − 85% = <b>15%</b>.'},
{s:'lbi',lv:4,p:'m3i2',t:'Makna istilah',q:'Istilah "kilometer pertama dan terakhir" dalam teks merujuk pada …',o:['jarak terjauh rute bus','jarak antara rumah dan halte','kilometer pertama jalan tol','jarak antarhalte','panjang trotoar kota'],a:1,b:'Teks menjelaskannya langsung: <b>jarak antara rumah dan halte</b>.'},
{s:'lbi',lv:4,p:'m3i2',t:'Simpulan',q:'Simpulan para perencana kota adalah …',o:['Bus harus diganti dengan kereta.','Memperbaiki akses ke halte lebih penting daripada sekadar menurunkan tarif.','Tarif bus harus digratiskan.','Warga tidak mau naik bus karena busnya jelek.','Halte modern tidak diperlukan.'],a:1,b:'Mereka memperingatkan bahwa menurunkan tarif tanpa memperbaiki akses berdampak kecil. Data juga menunjukkan tarif hanya 12%.'},
{s:'lbi',lv:4,p:'m3i2',t:'Hubungan data-argumen',q:'Data bahwa tarif hanya menjadi alasan bagi 12% warga digunakan penulis untuk …',o:['menunjukkan bahwa tarif bus terlalu mahal','mendukung argumen bahwa penurunan tarif saja tidak akan banyak berpengaruh','membuktikan bahwa bus berkualitas buruk','menyarankan kenaikan tarif','menunjukkan warga tidak peduli harga'],a:1,b:'Angka kecil itu memperkuat peringatan bahwa menurunkan tarif tanpa memperbaiki akses berdampak kecil.'},
{s:'lbi',lv:4,p:'m3i3',t:'Definisi',q:'Menurut teks, stunting adalah …',o:['penyakit menular pada balita','kondisi anak lebih pendek dari standar usianya akibat kekurangan gizi kronis','kekurangan berat badan sementara','kelainan genetik','kecerdasan di bawah rata-rata'],a:1,b:'Kalimat pertama mendefinisikannya secara lengkap.'},
{s:'lbi',lv:4,p:'m3i3',t:'Detail',q:'Seribu hari pertama kehidupan dihitung sejak …',o:['bayi lahir hingga usia tiga tahun','masa kehamilan hingga anak berusia dua tahun','anak masuk TK','usia satu tahun hingga tiga tahun','masa remaja'],a:1,b:'Teks: sejak <b>masa kehamilan hingga anak berusia dua tahun</b>.'},
{s:'lbi',lv:4,p:'m3i3',t:'Sebab-akibat',q:'Mengapa infeksi berulang disebut dalam teks?',o:['karena infeksi menyebabkan tubuh tinggi','karena infeksi dapat menghambat penyerapan gizi','karena infeksi hanya terjadi pada ibu hamil','karena infeksi menular lewat makanan tambahan','karena infeksi membuat anak malas makan permen'],a:1,b:'Kalimat terakhir: infeksi berulang dapat <b>menghambat penyerapan gizi</b>, sehingga sanitasi penting.'},
{s:'lbi',lv:4,p:'m3i3',t:'Inferensi',q:'Pernyataan yang sesuai dengan isi teks adalah …',o:['Stunting cukup dicegah dengan makanan tambahan untuk balita.','Pencegahan stunting membutuhkan upaya dari berbagai sisi, termasuk gizi ibu hamil dan sanitasi.','Stunting hanya memengaruhi tinggi badan.','Kekurangan gizi pada usia dua tahun mudah dipulihkan.','Air bersih tidak berkaitan dengan stunting.'],a:1,b:'Teks menyebut makanan tambahan saja tidak cukup; gizi ibu hamil, air bersih, dan sanitasi juga perlu.'},
{s:'lbi',lv:4,p:'m3i3',t:'Makna kata',q:'Kata <b>kronis</b> dalam teks bermakna …',o:['mendadak','berlangsung lama','ringan','menular','sementara'],a:1,b:'Kronis = <b>berlangsung lama/menahun</b>. Lawannya akut (mendadak).'},
{s:'lbi',lv:4,p:'m3i4',t:'Definisi',q:'Inti konsep kota 15 menit adalah …',o:['semua warga wajib bekerja 15 menit dari rumah','kebutuhan sehari-hari dapat dijangkau dengan berjalan kaki atau bersepeda dalam 15 menit','kendaraan dibatasi 15 menit di jalan','kota dibagi menjadi 15 wilayah','jam kerja dikurangi 15 menit'],a:1,b:'Kalimat pertama menjelaskan konsep itu.'},
{s:'lbi',lv:4,p:'m3i4',t:'Kritik',q:'Menurut teks, kekhawatiran sebagian warga tentang kota 15 menit didasari oleh …',o:['biaya pembangunan yang mahal','anggapan bahwa konsep itu akan membatasi pergerakan','kurangnya taman kota','kemacetan yang bertambah','polusi udara'],a:1,b:'Teks menyebut sebagian warga khawatir konsep ini <b>membatasi pergerakan</b>.'},
{s:'lbi',lv:4,p:'m3i4',t:'Sikap penulis',q:'Bagaimana penulis menanggapi kekhawatiran pembatasan pergerakan?',o:['menyetujuinya','meluruskannya dengan menyebut tujuan konsep justru menambah pilihan','mengabaikannya','menganggapnya lucu','menyebutnya sebagai satu-satunya kritik yang benar'],a:1,b:'Penulis menambahkan "padahal tujuannya justru menambah pilihan, bukan melarang bepergian jauh". Itu upaya <b>meluruskan</b>.'},
{s:'lbi',lv:4,p:'m3i4',t:'Kritik praktis',q:'Kritik praktis terhadap kota 15 menit adalah …',o:['warga tidak suka berjalan kaki','banyak kota sudah tumbuh dengan permukiman jauh dari layanan, sehingga perubahan butuh waktu lama','taman tidak penting','sepeda terlalu mahal','sekolah sudah cukup banyak'],a:1,b:'Kalimat terakhir menyebut kritik praktis ini.'},
{s:'lbi',lv:4,p:'m3i4',t:'Struktur teks',q:'Teks tersebut disusun dengan pola …',o:['kronologis dari masa lalu ke sekarang','gagasan, manfaat, lalu kritik','masalah, lalu solusi teknis','perbandingan dua kota','cerita pengalaman pribadi'],a:1,b:'Paragraf 1: gagasan dan manfaat menurut pendukung. Paragraf 2: dua kritik.'},
{s:'lbi',lv:4,p:'m3i5',t:'Miskonsepsi',q:'Anggapan keliru yang dibahas dalam teks adalah …',o:['karya digital tidak punya hak cipta','mencantumkan nama pembuat sudah cukup untuk menggunakan karya orang lain','semua karya boleh dipakai untuk pendidikan','foto tidak termasuk karya','lisensi terbuka itu ilegal'],a:1,b:'Teks membahas anggapan bahwa menyebut nama pembuat sudah cukup, lalu membantahnya.'},
{s:'lbi',lv:4,p:'m3i5',t:'Detail',q:'Keperluan yang termasuk pengecualian penggunaan karya menurut teks adalah …',o:['iklan komersial','penjualan kaus bergambar karya tersebut','penelitian','sampul album musik','konten bersponsor'],a:2,b:'Teks menyebut pengecualian terbatas untuk pendidikan, kritik, dan <b>penelitian</b>. Semua opsi lain bersifat komersial.'},
{s:'lbi',lv:4,p:'m3i5',t:'Syarat',q:'Syarat penggunaan karya dalam pengecualian terbatas adalah …',o:['membayar royalti','menyebut sumber dan tidak merugikan kepentingan wajar pencipta','mengubah karya sepenuhnya','mendapat izin pemerintah','hanya dipakai satu kali'],a:1,b:'Teks menyebut dua syarat itu.'},

{s:'lbi',lv:4,p:'m3i5',t:'Makna istilah',q:'Istilah <b>lisensi terbuka</b> dalam teks paling mungkin berarti …',o:['karya yang dijual mahal','karya yang pemiliknya sudah mengizinkan penggunaan dengan syarat tertentu','karya yang dicuri','karya yang tidak punya pencipta','karya pemerintah'],a:1,b:'Disebut sebagai alternatif dari meminta izin, artinya karya yang <b>sudah diizinkan untuk dipakai</b> (dengan syarat tertentu).'},
