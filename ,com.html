a3i1:{judul:'Menyunting Gen, Menyunting Masa Depan?', isi:`<p>Teknologi penyuntingan gen memungkinkan ilmuwan mengubah urutan DNA dengan ketelitian yang belum pernah ada sebelumnya. Di bidang kesehatan, teknologi ini membuka harapan bagi penderita penyakit genetik seperti talasemia, yang selama ini hanya dapat dikelola seumur hidup. Uji klinis awal menunjukkan sebagian pasien tidak lagi memerlukan transfusi darah rutin.</p><p>Perdebatan menajam ketika teknologi yang sama dapat diterapkan pada embrio, sehingga perubahan genetik diwariskan ke generasi berikutnya. Para pendukung berargumen bahwa mencegah penyakit sebelum lahir adalah kewajiban moral. Para penentang tidak menolak terapi bagi pasien yang sudah hidup, tetapi mempersoalkan dua hal: risiko efek samping yang baru tampak setelah beberapa generasi, dan kemungkinan teknologi itu bergeser dari pengobatan menjadi "peningkatan" sifat, seperti tinggi badan atau kecerdasan, yang hanya terjangkau oleh kalangan mampu. Sebagian besar negara kini mengizinkan penelitian pada sel tubuh, tetapi melarang perubahan yang dapat diwariskan.</p>`},
a3i2:{judul:'Pendapatan Dasar untuk Semua?', isi:`<p>Gagasan pendapatan dasar universal mengusulkan agar setiap warga menerima uang tunai secara rutin tanpa syarat, terlepas dari status pekerjaannya. Pendukungnya menilai skema ini lebih sederhana daripada program bantuan bersyarat yang sering salah sasaran dan memerlukan biaya administrasi besar. Mereka juga menganggapnya sebagai jaring pengaman di tengah perubahan teknologi yang dapat menghapus jenis pekerjaan tertentu.</p><p>Pengkritik mengajukan dua keberatan. Pertama, biayanya sangat besar jika diberikan kepada semua orang, termasuk yang tidak membutuhkan. Kedua, mereka khawatir uang tanpa syarat akan mengurangi dorongan untuk bekerja. Sejumlah uji coba di berbagai negara memberikan gambaran yang lebih bernuansa: penerima umumnya tidak berhenti bekerja, dan sebagian menggunakan uang itu untuk mencari pekerjaan yang lebih sesuai atau mengikuti pelatihan. Namun, uji coba tersebut berskala kecil dan berjangka waktu terbatas, sehingga belum dapat memastikan dampaknya bila diterapkan secara nasional dan permanen.</p>`},
a3i3:{judul:'Museum dan Ingatan Bersama', isi:`<p>Museum sering dianggap sebagai tempat penyimpanan benda-benda lama yang netral. Padahal, setiap museum membuat pilihan: benda mana yang dipamerkan, cerita mana yang ditonjolkan, dan suara siapa yang didengarkan. Pilihan-pilihan itu membentuk ingatan bersama suatu bangsa tentang masa lalunya.</p><p>Dalam beberapa dekade terakhir, sejumlah museum di dunia mulai meninjau ulang koleksinya, termasuk benda-benda yang diperoleh pada masa kolonial. Ada yang mengembalikan benda tersebut ke negara asalnya, ada pula yang menambahkan keterangan tentang cara benda itu diperoleh. Sebagian kurator berpendapat bahwa museum tidak perlu berpura-pura netral; yang lebih penting adalah transparan tentang sudut pandangnya dan membuka ruang bagi tafsir yang berbeda. Kritikus menanggapi bahwa tanpa standar yang jelas, upaya itu berisiko menggantikan satu narasi tunggal dengan narasi tunggal lain.</p>`},
a3i4:{judul:'Algoritma dan Gelembung Kita', isi:`<p>Platform digital menampilkan konten berdasarkan perilaku pengguna sebelumnya. Semakin sering seseorang menyukai jenis konten tertentu, semakin banyak konten serupa yang muncul. Sebagian pengamat khawatir mekanisme ini menciptakan "gelembung filter", yaitu kondisi ketika pengguna hanya terpapar pandangan yang sejalan dengan keyakinannya sehingga masyarakat makin terpolarisasi.</p><p>Penelitian empiris, bagaimanapun, menunjukkan gambaran yang lebih rumit. Beberapa studi menemukan bahwa pengguna media sosial justru terpapar sumber berita yang lebih beragam dibandingkan mereka yang tidak menggunakannya. Masalahnya mungkin bukan ketiadaan paparan, melainkan cara orang menanggapi pandangan berbeda: ketika bertemu opini yang bertentangan, sebagian orang malah semakin teguh pada pendiriannya. Jika demikian, solusi yang hanya mengubah algoritma agar lebih beragam belum tentu menurunkan polarisasi.</p>`},
a3i5:{judul:'Ekonomi Biru', isi:`<p>Dengan wilayah laut yang lebih luas daripada daratannya, Indonesia kerap disebut memiliki masa depan di laut. Konsep ekonomi biru menawarkan cara memanfaatkan sumber daya laut, seperti perikanan, pariwisata bahari, dan energi gelombang, sambil menjaga kesehatan ekosistemnya.</p><p>Tantangannya terletak pada pengukuran. Nilai ekonomi ikan yang ditangkap mudah dihitung, tetapi nilai terumbu karang yang melindungi pantai dari abrasi atau padang lamun yang menyimpan karbon tidak tercatat dalam neraca ekonomi. Akibatnya, keputusan pembangunan cenderung meremehkan kerugian lingkungan. Sejumlah ekonom mengusulkan "akuntansi modal alam" yang memasukkan nilai jasa ekosistem ke dalam perhitungan pembangunan. Usulan ini menuai keberatan karena metode penilaiannya masih diperdebatkan dan dapat menghasilkan angka yang sangat berbeda bergantung pada asumsi yang dipakai.</p>`},
a3i6:{judul:'Meritokrasi dan Keberuntungan', isi:`<p>Meritokrasi adalah gagasan bahwa kedudukan seseorang seharusnya ditentukan oleh kemampuan dan usahanya, bukan oleh asal-usul keluarga. Gagasan ini lahir sebagai kritik terhadap sistem aristokrasi yang mewariskan jabatan berdasarkan keturunan, dan hingga kini menjadi dasar banyak sistem seleksi pendidikan dan pekerjaan.</p><p>Namun, sejumlah pemikir mengingatkan sisi gelap meritokrasi. Kemampuan dan usaha tidak tumbuh di ruang hampa: anak yang lahir di keluarga berpendidikan, mendapat gizi cukup, dan bersekolah di tempat yang baik memiliki peluang lebih besar untuk "berprestasi". Ketika keberhasilan dianggap murni hasil jerih payah sendiri, mereka yang berhasil cenderung merendahkan yang gagal, dan yang gagal cenderung menyalahkan diri sendiri. Para pemikir itu tidak menolak penghargaan atas prestasi, tetapi mengajak masyarakat mengakui peran keberuntungan dan memperluas kesempatan sejak dini.</p>`},
a3e1:{judul:'Survivorship Bias', isi:`<p>During World War II, analysts studied bombers returning from missions and mapped where they had been hit by enemy fire. The obvious suggestion was to add armor to the areas with the most bullet holes. A statistician named Abraham Wald pointed out a flaw: the planes being studied were the ones that had survived. The areas without holes were likely where hits were fatal, since planes struck there never returned.</p><p>This error, known as survivorship bias, appears far beyond warfare. Business books often study successful companies to find the secrets of success, ignoring the many failed companies that followed the same strategies. Without examining both the survivors and the failures, we may mistake luck or common features for causes.</p>`},
a3e2:{judul:'The Hidden Cost of Every Choice', isi:`<p>Economists use the term opportunity cost to describe the value of the next-best alternative that is given up when a choice is made. If a student spends an evening at a concert, the opportunity cost is not just the ticket price but also the hours that could have been spent studying or resting.</p><p>The concept is simple, yet people often ignore it. Studies show that consumers who are reminded of what else they could buy with their money are more likely to skip unnecessary purchases. Governments face the same logic on a larger scale: money spent building a new stadium cannot be spent on schools or hospitals. Recognizing opportunity costs does not tell us which option is right, but it ensures that the trade-offs are visible.</p>`},
a3e3:{judul:'Does Language Shape Thought?', isi:`<p>The idea that the language we speak shapes how we think has been debated for nearly a century. Strong versions of this idea, claiming that people cannot think about concepts their language lacks words for, have largely been rejected. Speakers of languages without a word for a particular color can still see and distinguish that color.</p><p>However, weaker versions have found support. Some languages describe locations using compass directions, saying "the cup is to the north of the plate" rather than "to the left". Speakers of such languages tend to keep track of direction remarkably well, even indoors. Researchers interpret this not as language limiting thought, but as language encouraging certain habits of attention.</p>`},
a3e4:{judul:'Citizen Science', isi:`<p>Citizen science invites members of the public to take part in scientific research. Volunteers count birds in their gardens, photograph insects, or classify galaxies in online images. Because thousands of people can collect data across wide areas, such projects can answer questions that small research teams could never tackle alone.</p><p>Critics have questioned the quality of data collected by non-experts. In response, many projects use training sessions, simple standardized methods, and statistical checks to filter out errors. Studies comparing volunteer data with expert data have found that, with these safeguards, the results are often similarly reliable. Beyond producing data, organizers note, citizen science also builds public trust in science by letting people see how knowledge is actually made.</p>`}

{s:'pu',lv:7,t:'Deduktif · Negasi kompleks',q:'Negasi dari "Jika semua siswa hadir, rapat dimulai tepat waktu" adalah …',o:['Jika ada siswa yang tidak hadir, rapat tidak dimulai tepat waktu.','Semua siswa hadir dan rapat tidak dimulai tepat waktu.','Ada siswa yang tidak hadir dan rapat dimulai tepat waktu.','Semua siswa tidak hadir atau rapat dimulai tepat waktu.','Jika rapat tidak dimulai tepat waktu, ada siswa yang tidak hadir.'],a:1,b:'Negasi p → q adalah p ∧ ¬q. Di sini p = "semua siswa hadir", jadi negasinya: <b>semua siswa hadir dan rapat tidak dimulai tepat waktu</b>. Opsi terakhir adalah kontraposisi (setara, bukan negasi).'},
{s:'pu',lv:7,t:'Deduktif · Konsistensi premis',q:'Tiga pernyataan berikut diketahui benar:<br>(1) Jika A lulus, B juga lulus.<br>(2) B lulus atau C lulus, tetapi tidak keduanya.<br>(3) C lulus.<br>Simpulan yang pasti benar adalah …',o:['A lulus.','B lulus.','A tidak lulus.','A dan C lulus.','Tidak ada yang lulus kecuali C.'],a:2,b:'Dari (3) dan (2): C lulus, jadi B tidak lulus. Dari (1) dengan modus tollens: B tidak lulus → <b>A tidak lulus</b>. Opsi terakhir terlalu jauh karena premis tidak membahas orang lain.'},
{s:'pu',lv:7,t:'Analitik · Jadwal bersyarat',q:'Enam presentasi (P, Q, R, S, T, U) dijadwalkan pada slot 1–6. Q tepat setelah P. S sebelum T, dan S tidak bersebelahan dengan T. U di slot 6. R tidak di slot 1.<br>Jika P di slot 3, maka R berada di slot …',o:['1','2','4','5','Tidak dapat ditentukan'],a:1,b:'P = 3, Q = 4, U = 6. Sisa slot 1, 2, 5 untuk R, S, T. S sebelum T dan tidak bersebelahan: (S, T) = (1, 5) atau (2, 5). Kalau (2, 5), R = 1, padahal dilarang. Jadi S = 1, T = 5, dan R di slot <b>2</b>.'},
{s:'pu',lv:7,t:'Analitik · Grup diskusi',q:'Tujuh siswa (A–G) dibagi ke dalam dua grup: Grup 1 berisi 4 orang dan Grup 2 berisi 3 orang. A dan B tidak boleh satu grup. C harus satu grup dengan D. E berada di Grup 2. Jika B berada di Grup 2, F tidak boleh di Grup 2.<br>Jika C berada di Grup 1, pernyataan yang PASTI benar adalah …',o:['A berada di Grup 1.','F berada di Grup 1.','E dan C berada di grup yang berbeda.','B berada di Grup 2.','G berada di Grup 2.'],a:2,b:'C di Grup 1, sedangkan E di Grup 2, jadi <b>E dan C pasti berbeda grup</b>. Opsi lain belum pasti: A atau B bisa di Grup 1, dan F atau G bisa bergantian. Contoh sah: Grup 1 = C, D, A, F; Grup 2 = E, B, G. Contoh lain: Grup 1 = C, D, B, G; Grup 2 = E, A, F.'},
{s:'pu',lv:7,t:'Deduktif · Silogisme ganda',q:'Tidak ada peneliti yang tidak teliti. Sebagian orang teliti adalah perfeksionis. Semua perfeksionis mudah cemas.<br>Simpulan yang PASTI benar adalah …',o:['Semua peneliti mudah cemas.','Sebagian peneliti perfeksionis.','Sebagian orang teliti mudah cemas.','Tidak ada peneliti yang mudah cemas.','Semua orang teliti adalah peneliti.'],a:2,b:'"Tidak ada peneliti yang tidak teliti" = semua peneliti teliti. Orang teliti yang perfeksionis (sebagian) pasti mudah cemas. Jadi <b>sebagian orang teliti mudah cemas</b>. Hubungan peneliti dengan perfeksionis tidak pasti.'},
{s:'pu',lv:7,t:'Deduktif · Kontraposisi berantai',q:'Jika proyek disetujui, dana cair. Jika dana cair, pembangunan dimulai bulan Juni. Jika pembangunan dimulai bulan Juni, jembatan selesai sebelum musim hujan. Ternyata jembatan tidak selesai sebelum musim hujan.<br>Manakah yang PASTI benar?',o:['Proyek disetujui tetapi dana tidak cair.','Dana cair tetapi pembangunan terlambat.','Proyek tidak disetujui.','Pembangunan dimulai bulan Juni.','Musim hujan datang lebih awal.'],a:2,b:'Rantai: disetujui → dana cair → mulai Juni → selesai sebelum hujan. Akhir rantai tidak terjadi, maka setiap langkah sebelumnya juga tidak terjadi, sampai ke awal: <b>proyek tidak disetujui</b>.'},
{s:'pu',lv:7,t:'Analitik · Kebohongan',q:'Satu dari tiga siswa (Andi, Budi, Caca) memecahkan vas. Hanya satu dari mereka yang berkata jujur.<br>Andi: "Budi yang memecahkan."<br>Budi: "Bukan saya."<br>Caca: "Bukan saya."<br>Siapa yang memecahkan vas?',o:['Andi','Budi','Caca','Tidak ada','Tidak dapat ditentukan'],a:2,b:'Uji tiap kemungkinan. Jika Budi pelakunya: Andi jujur, Budi bohong, Caca jujur → dua jujur ✗. Jika Andi pelakunya: Andi bohong, Budi jujur, Caca jujur → dua jujur ✗. Jika Caca pelakunya: Andi bohong, Budi jujur, Caca bohong → tepat satu jujur ✓. Pelakunya <b>Caca</b>.'},
{s:'pu',lv:7,t:'Analitik · Rumah berderet',q:'Empat rumah berderet dari kiri ke kanan dicat merah, biru, hijau, dan kuning (tidak berurutan). Rumah hijau tepat di kiri rumah kuning. Rumah merah tidak di ujung. Rumah biru di ujung kanan.<br>Warna rumah paling kiri adalah …',o:['Merah','Biru','Hijau','Kuning','Tidak dapat ditentukan'],a:2,b:'Biru = 4. Merah bukan ujung → merah di 2 atau 3. Hijau-kuning berurutan di posisi tersisa: kalau merah = 2, hijau-kuning harus (3, 4) tetapi 4 biru ✗. Jadi merah = 3, hijau-kuning = (1, 2). Paling kiri: <b>hijau</b>.'},
{s:'pu',lv:7,t:'Deduktif · Evaluasi argumen',q:'"Semua negara dengan pendapatan tinggi memiliki tingkat literasi tinggi. Negara Z memiliki tingkat literasi tinggi. Jadi, negara Z berpendapatan tinggi."<br>Penilaian yang tepat terhadap argumen tersebut adalah …',o:['Sahih, karena premisnya benar.','Tidak sahih, karena menegaskan konsekuen: literasi tinggi tidak hanya dimiliki negara berpendapatan tinggi.','Sahih, karena negara Z disebut namanya.','Tidak sahih, karena premis pertama pasti salah.','Sahih jika negara Z berada di Eropa.'],a:1,b:'Pola "jika p maka q; q; jadi p" adalah kesalahan menegaskan konsekuen. Literasi tinggi bisa dimiliki negara berpendapatan sedang juga.'},
{s:'pu',lv:7,t:'Analitik · Pembagian tugas',q:'Lima relawan (V, W, X, Y, Z) dibagi ke tiga pos: A, B, dan C. Pos A diisi 2 orang, pos B 2 orang, pos C 1 orang. V dan W harus di pos yang sama. X tidak boleh di pos C. Y dan Z tidak boleh di pos yang sama. Z di pos B.<br>Siapa yang berada di pos C?',o:['V','W','X','Y','Tidak dapat ditentukan'],a:3,b:'Z di B. V-W harus satu pos berisi 2 orang: pos A (pos B tinggal 1 tempat). Sisa X dan Y untuk satu tempat di B dan satu di C. X tidak boleh di C → X di B, Y di <b>C</b>. Cek: Y dan Z berbeda pos ✓.'},

{s:'ppu',lv:7,t:'English vocabulary',q:'"The committee reached a <b>tentative</b> agreement, pending further review."<br>The word in bold means …',o:['final','not yet certain','illegal','unanimous','secret'],a:1,b:'Tentative = belum final, <b>not yet certain</b>. Petunjuk: "pending further review".'},
{s:'ppu',lv:7,t:'English vocabulary',q:'"His explanation was <b>plausible</b>, but no evidence supported it."<br>The word in bold is closest in meaning to …',o:['proven','believable','ridiculous','complicated','false'],a:1,b:'Plausible = masuk akal, <b>believable</b>. Bukan berarti terbukti.'},

{s:'ppu',lv:7,t:'English vocabulary',q:'"The speaker made a <b>subtle</b> reference to the scandal."<br>The word in bold is closest in meaning to …',o:['obvious','indirect and not easily noticed','loud','angry','long'],a:1,b:'Subtle = halus, tidak terang-terangan.'},
{s:'ppu',lv:7,t:'Makna afiks',q:'Kata <b>keberterimaan</b> bermakna …',o:['orang yang menerima','hal dapat diterima','tindakan menerima secara paksa','tempat menerima tamu','hasil penerimaan pajak'],a:1,b:'Ke-an + berterima bermakna <b>hal/keadaan dapat diterima</b>, misalnya "keberterimaan kebijakan di masyarakat".'},
{s:'ppu',lv:7,t:'Kalimat efektif',q:'Kalimat yang paling efektif adalah …',o:['Mengenai masalah itu sudah kami bahas kemarin.','Masalah itu sudah kami bahas kemarin.','Tentang masalah itu sudah dibahas oleh kami kemarin.','Mengenai daripada masalah itu sudah kami bahas.','Masalah itu sudah dibahaskan oleh kami kemarin.'],a:1,b:'"Mengenai/tentang" di awal menghilangkan subjek. "Dibahas oleh kami" tidak baku untuk pelaku kata ganti. Efektif: <b>Masalah itu sudah kami bahas kemarin.</b>'},
{s:'ppu',lv:7,t:'Hipernim',q:'Kata yang merupakan hipernim dari "konglomerasi, monopoli, oligopoli" adalah …',o:['perusahaan','struktur pasar dan penguasaan usaha','koperasi','pajak','perdagangan bebas'],a:1,b:'Ketiganya adalah bentuk <b>struktur pasar/penguasaan usaha</b>.'},
/* PBM (20) */
{s:'pbm',lv:7,t:'Penyuntingan · Paragraf',q:'"(1) Pemerintah meluncurkan program beasiswa bagi siswa berprestasi dari keluarga kurang mampu. (2) Program ini diharapkan dapat memutus rantai kemiskinan. (3) Namun, persyaratan administrasi yang rumit membuat banyak calon penerima gagal mendaftar. (4) Akibatnya, sebagian kuota beasiswa tidak terserap. (5) Beasiswa luar negeri juga semakin diminati lulusan SMA."<br>Penyuntingan yang paling tepat adalah …',o:['menghapus kalimat (2)','menghapus kalimat (5)','menukar kalimat (3) dan (4)','menghapus kalimat (1)','menggabungkan kalimat (1) dan (5)'],a:1,b:'Kalimat (1)–(4) membahas program beasiswa dalam negeri dan kendalanya. Kalimat (5) tentang minat beasiswa luar negeri keluar dari topik.'},
{s:'pbm',lv:7,t:'Kalimat efektif · Penalaran kausal',q:'Kalimat yang hubungan sebab-akibatnya logis adalah …',o:['Karena hujan deras, sehingga jalan banjir.','Hujan deras sehingga jalan banjir.','Jalan banjir sehingga hujan deras.','Karena jalan banjir, maka hujan deras.','Hujan deras karena jalan banjir.'],a:1,b:'Sebab (hujan) harus mendahului akibat (banjir), dan "karena … sehingga" tidak boleh dipakai bersamaan. Benar: <b>Hujan deras sehingga jalan banjir.</b>'},
{s:'pbm',lv:7,t:'Ejaan · Komprehensif',q:'Kalimat yang seluruh penulisannya sesuai EYD adalah …',o:['Menurut data Badan Pusat Statistik (BPS), angka pengangguran turun 0,5 persen.','Menurut data Badan pusat statistik (BPS) angka pengangguran turun 0,5%persen.','Menurut data Badan Pusat Statistik (B.P.S.), angka pengangguran turun 0.5 persen.','menurut data Badan Pusat Statistik (BPS), angka pengangguran turun 0,5 persen.','Menurut data Badan Pusat Statistik, (BPS) angka pengangguran turun 0,5 persen.'],a:0,b:'Nama lembaga kapital tiap unsur, singkatan tanpa titik dalam kurung, koma setelah keterangan pembuka, dan desimal memakai koma: <b>0,5 persen</b>.'},
{s:'pbm',lv:7,t:'Kalimat rumpang · Argumen',q:'"Banyak orang percaya bahwa multitasking membuat pekerjaan lebih cepat selesai. ___ Otak sebenarnya berpindah-pindah dengan cepat di antara tugas, dan setiap perpindahan memakan waktu serta meningkatkan risiko kesalahan."<br>Kalimat yang paling tepat untuk mengisi bagian rumpang adalah …',o:['Multitasking adalah keterampilan wajib di era modern.','Penelitian ilmu kognitif menunjukkan sebaliknya.','Karena itu, setiap orang sebaiknya multitasking.','Komputer juga dapat menjalankan banyak program.','Pekerjaan kantor semakin banyak.'],a:1,b:'Kalimat sesudahnya adalah penjelasan ilmiah yang membantah anggapan awal. Jembatan yang tepat: <b>Penelitian ilmu kognitif menunjukkan sebaliknya.</b>'},
{s:'pbm',lv:7,t:'Penalaran · Generalisasi',q:'"Tiga siswa dari SMA X yang saya kenal sangat pandai matematika. Jadi, siswa SMA X pandai matematika."<br>Kelemahan penalaran tersebut adalah …',o:['Tidak menyebut nama siswa','Generalisasi terburu-buru dari sampel yang terlalu kecil','Matematika bukan mata pelajaran penting','Kalimatnya tidak baku','SMA X tidak ada'],a:1,b:'Tiga orang tidak mewakili seluruh siswa SMA X. Ini <b>generalisasi terburu-buru</b>.'},
{s:'pbm',lv:7,t:'Ambiguitas · Struktur',q:'"Pelatih tim nasional yang baru itu berasal dari Brasil."<br>Kalimat tersebut dapat bermakna ganda karena …',o:['kata "Brasil" tidak baku','tidak jelas apakah yang baru adalah pelatihnya atau tim nasionalnya','tidak ada predikat','kata "itu" berlebihan','kalimatnya terlalu panjang'],a:1,b:'Frasa "yang baru itu" bisa menerangkan "pelatih" atau "tim nasional". Perbaikan: "Pelatih baru tim nasional itu berasal dari Brasil."'},
{s:'pbm',lv:7,t:'Urutan paragraf',q:'(1) Dengan demikian, kebijakan itu justru memperlebar kesenjangan yang ingin dipersempitnya. (2) Pemerintah memberikan subsidi bahan bakar untuk membantu masyarakat miskin. (3) Akan tetapi, data menunjukkan sebagian besar subsidi dinikmati pemilik kendaraan pribadi. (4) Mereka umumnya berasal dari kelompok berpenghasilan menengah ke atas.<br>Urutan yang padu adalah …',o:['2-3-4-1','2-4-3-1','3-2-4-1','2-3-1-4','1-2-3-4'],a:0,b:'Tujuan kebijakan (2) → "Akan tetapi" fakta (3) → penjelasan "mereka" (4) → simpulan "Dengan demikian" (1): <b>2-3-4-1</b>.'},
{s:'pbm',lv:7,t:'Diksi · Nuansa makna',q:'"Laporan itu ___ bahwa tingkat polusi meningkat dua kali lipat, meski datanya belum diverifikasi."<br>Kata yang paling tepat untuk menunjukkan kehati-hatian penulis adalah …',o:['membuktikan','menyiratkan','menegaskan secara pasti','memastikan','menjamin'],a:1,b:'Data belum diverifikasi, sehingga kata yang tepat bernada hati-hati: <b>menyiratkan</b>. Kata lain terlalu pasti.'},
{s:'pbm',lv:7,t:'Kohesi · Penanda wacana',q:'"Kebijakan A menurunkan emisi 10%, ___ kebijakan B hanya 3%. ___, kebijakan A membutuhkan biaya lima kali lipat."<br>Pasangan penghubung yang paling tepat adalah …',o:['karena … Oleh karena itu','sedangkan … Akan tetapi','sehingga … Selain itu','dan … Jadi','agar … Dengan demikian'],a:1,b:'Bagian pertama membandingkan (sedangkan). Bagian kedua memberi sisi berlawanan dari keunggulan A (akan tetapi).'},
{s:'pbm',lv:7,t:'Kalimat efektif · Paralelisme',q:'Kalimat yang strukturnya paling paralel adalah …',o:['Peserta diminta untuk membaca soal, memahami instruksi, dan pengisian jawaban.','Peserta diminta membaca soal, memahami instruksi, dan mengisi jawaban.','Peserta diminta pembacaan soal, memahami instruksi, dan mengisi jawaban.','Peserta diminta membaca soal, pemahaman instruksi, dan isian jawaban.','Peserta diminta agar membaca soal, instruksi dipahami, dan jawaban diisi.'],a:1,b:'Tiga unsur sama-sama kata kerja + objek: <b>membaca soal, memahami instruksi, mengisi jawaban</b>.'},
{s:'pbm',lv:7,t:'Ejaan · Tanda baca kutipan',q:'Penulisan kutipan tidak langsung yang tepat adalah …',o:['Ia berkata bahwa, "Ia akan datang besok."','Ia berkata bahwa ia akan datang besok.','Ia berkata, bahwa ia akan datang besok.','Ia berkata bahwa "ia akan datang besok".','Ia berkata: bahwa ia akan datang besok.'],a:1,b:'Kalimat tidak langsung tidak memakai tanda petik, koma, atau titik dua sebelum "bahwa": <b>Ia berkata bahwa ia akan datang besok.</b>'},
{s:'pbm',lv:7,t:'Simpulan · Argumen kompleks',q:'"Kota B menurunkan batas kecepatan di pusat kota dari 50 menjadi 30 km/jam. Dalam setahun, kecelakaan fatal turun 40%. Waktu tempuh rata-rata hanya bertambah satu menit, karena kemacetan di persimpangan menjadi faktor utama lamanya perjalanan, bukan kecepatan maksimum."<br>Simpulan yang paling didukung paragraf adalah …',o:['Batas kecepatan rendah membuat perjalanan jauh lebih lama.','Penurunan batas kecepatan di pusat kota meningkatkan keselamatan dengan dampak kecil pada waktu tempuh.','Kecelakaan fatal tidak berkaitan dengan kecepatan.','Kemacetan disebabkan oleh batas kecepatan baru.','Kota B harus menaikkan batas kecepatan lagi.'],a:1,b:'Data: kecelakaan fatal turun 40%, waktu tempuh hanya bertambah 1 menit. Simpulan harus memuat keduanya.'},
{s:'pbm',lv:7,t:'Kata rujukan · Jarak jauh',q:'"Peneliti membandingkan dua kelompok petani. Kelompok pertama memakai pupuk kimia, sedangkan kelompok kedua memakai pupuk organik. Dalam tiga tahun, hasil panen kelompok pertama lebih tinggi. Akan tetapi, kesuburan tanah <b>mereka</b> menurun, sementara tanah kelompok kedua justru membaik."<br>Kata "mereka" merujuk pada …',o:['peneliti','kelompok petani pertama','kelompok petani kedua','kedua kelompok','pupuk organik'],a:1,b:'Konteksnya membandingkan: tanah "mereka" menurun, sementara tanah kelompok kedua membaik. Jadi "mereka" adalah <b>kelompok pertama</b>.'},
{s:'pbm',lv:7,t:'Penalaran · Analogi keliru',q:'"Perusahaan itu seperti keluarga. Karena anggota keluarga tidak pernah dipecat, perusahaan juga tidak boleh memecat karyawan."<br>Kelemahan penalaran tersebut adalah …',o:['Perusahaan tidak punya karyawan.','Menyamakan dua hal yang berbeda dalam aspek penting yang menjadi dasar kesimpulan.','Kata "keluarga" tidak baku.','Kalimatnya terlalu panjang.','Tidak ada data statistik.'],a:1,b:'Ini analogi keliru: perusahaan dan keluarga mungkin mirip dalam keakraban, tetapi berbeda dalam tujuan dan hubungan hukum, yang justru menjadi dasar kesimpulan.'},
{s:'pbm',lv:7,t:'Ejaan · Unsur serapan',q:'Kelompok kata yang semuanya baku adalah …',o:['kuantitas, kualifikasi, frekuensi','kwantitas, kwalifikasi, frekwensi','kuantitas, kwalifikasi, frekuensi','kwantitas, kualifikasi, frekwensi','kuantitas, kualifikasi, frekwensi'],a:0,b:'Gugus "qu/kw" diserap menjadi <b>ku</b>: kuantitas, kualifikasi, frekuensi.'},
{s:'pbm',lv:7,t:'Kalimat rumpang · Penutup',q:'"Literasi digital tidak cukup dimaknai sebagai kemampuan mengoperasikan perangkat. Seseorang yang mahir membuat konten belum tentu mampu menilai kebenaran informasi. Ia juga belum tentu memahami cara data pribadinya digunakan. ___"<br>Kalimat penutup yang paling tepat adalah …',o:['Karena itu, literasi digital perlu mencakup kemampuan berpikir kritis dan kesadaran akan privasi, bukan sekadar keterampilan teknis.','Perangkat digital semakin murah.','Konten kreator banyak yang terkenal.','Data pribadi tidak penting.','Oleh karena itu, semua orang harus membuat konten.'],a:0,b:'Paragraf membangun argumen bahwa keterampilan teknis tidak cukup. Penutup yang tepat menyimpulkan cakupan literasi digital yang lebih luas.'},
{s:'pbm',lv:7,t:'Kalimat efektif · Pasif',q:'Kalimat pasif yang benar dan efektif adalah …',o:['Gedung itu sedang direnovasi oleh pemerintah daerah.','Gedung itu sedang pemerintah daerah renovasi.','Gedung itu oleh pemerintah daerah sedang direnovasikan.','Gedung itu sedang direnovasi oleh mereka pemerintah daerah.','Gedung itu direnovasi sedang oleh pemerintah daerah.'],a:0,b:'Pelaku orang ketiga/lembaga memakai bentuk di- + oleh: <b>sedang direnovasi oleh pemerintah daerah</b>.'},
{s:'pbm',lv:7,t:'Ide pokok · Implisit',q:'"Ketika mesin cetak ditemukan, sebagian orang khawatir buku akan membuat manusia malas mengingat. Ketika kalkulator masuk sekolah, guru khawatir siswa tidak bisa berhitung. Kini, kekhawatiran serupa muncul terhadap kecerdasan buatan."<br>Gagasan yang tersirat dalam paragraf tersebut adalah …',o:['Teknologi baru selalu merusak kemampuan manusia.','Kekhawatiran terhadap teknologi baru adalah pola yang berulang dalam sejarah.','Kalkulator dilarang di sekolah.','Mesin cetak tidak bermanfaat.','Kecerdasan buatan pasti aman.'],a:1,b:'Paragraf menyusun tiga contoh dengan pola sama. Gagasan tersiratnya: kekhawatiran terhadap teknologi baru adalah <b>pola yang berulang</b>. Paragraf tidak menyimpulkan apakah kekhawatiran itu benar atau salah.'},
{s:'pbm',lv:7,t:'Ejaan · Huruf kapital & miring',q:'Penulisan judul dan istilah yang tepat adalah …',o:['Ia membaca novel <i>Bumi Manusia</i> karya Pramoedya Ananta Toer.','Ia membaca novel "bumi manusia" karya Pramoedya Ananta Toer.','Ia membaca Novel <i>bumi Manusia</i> karya pramoedya ananta toer.','Ia membaca novel BUMI MANUSIA karya Pramoedya Ananta Toer.','Ia membaca novel Bumi manusia karya Pramoedya ananta Toer.'],a:0,b:'Judul buku ditulis miring dengan huruf awal kapital tiap kata, dan nama pengarang ditulis kapital tiap unsur.'},
{s:'pbm',lv:7,t:'Koherensi · Kalimat yang tidak mendukung',q:'(1) Hutan kota berfungsi sebagai paru-paru kota. (2) Pepohonan menyerap polutan dan menghasilkan oksigen. (3) Hutan kota juga menjadi habitat burung dan serangga. (4) Selain itu, hutan kota menurunkan suhu di sekitarnya. (5) Namun, pembangunan hutan kota memerlukan lahan yang luas di tengah harga tanah yang mahal.<br>Jika paragraf bertujuan menguraikan manfaat hutan kota, kalimat yang tidak mendukung tujuan itu adalah …',o:['(1)','(2)','(3)','(4)','(5)'],a:4,b:'Kalimat (1)–(4) menguraikan manfaat. Kalimat <b>(5)</b> membahas kendala, sehingga tidak mendukung tujuan paragraf yang ditetapkan.'},
/* LBI (30) */
{s:'lbi',lv:7,p:'a3i1',t:'Pokok perdebatan',q:'Inti perdebatan yang diuraikan dalam teks adalah …',o:['apakah penyuntingan gen dapat menyembuhkan talasemia','apakah penyuntingan gen boleh diterapkan pada embrio sehingga perubahannya diwariskan','apakah transfusi darah masih diperlukan','apakah ilmuwan boleh meneliti DNA','apakah semua negara harus melarang penelitian'],a:1,b:'Paragraf kedua: perdebatan menajam ketika teknologi diterapkan pada embrio sehingga diwariskan.'},
{s:'lbi',lv:7,p:'a3i1',t:'Posisi penentang',q:'Pernyataan yang TEPAT tentang posisi para penentang adalah …',o:['Mereka menolak semua bentuk penyuntingan gen.','Mereka tidak menolak terapi bagi pasien yang sudah hidup, tetapi mempersoalkan perubahan yang diwariskan.','Mereka mendukung peningkatan sifat seperti kecerdasan.','Mereka menganggap talasemia tidak perlu diobati.','Mereka hanya mempersoalkan biaya.'],a:1,b:'Teks menegaskan para penentang "tidak menolak terapi bagi pasien yang sudah hidup".'},
{s:'lbi',lv:7,p:'a3i1',t:'Inferensi etis',q:'Kekhawatiran bahwa "peningkatan" sifat hanya terjangkau kalangan mampu berkaitan dengan isu …',o:['keamanan teknis','ketidakadilan sosial','kekurangan tenaga ahli','larangan agama','kesulitan bahasa'],a:1,b:'Jika hanya kalangan mampu yang bisa "meningkatkan" anaknya, kesenjangan sosial bertambah. Itu isu <b>keadilan sosial</b>.'},
{s:'lbi',lv:7,p:'a3i1',t:'Makna istilah',q:'Dalam konteks teks, perbedaan "pengobatan" dan "peningkatan" adalah …',o:['pengobatan untuk hewan, peningkatan untuk manusia','pengobatan mengatasi penyakit, peningkatan mengubah sifat normal agar "lebih baik"','pengobatan murah, peningkatan gratis','pengobatan hanya di rumah sakit','tidak ada perbedaan'],a:1,b:'Teks memberi contoh peningkatan: tinggi badan atau kecerdasan, yaitu sifat yang bukan penyakit.'},
{s:'lbi',lv:7,p:'a3i1',t:'Konsistensi kebijakan',q:'Kebijakan "mengizinkan penelitian pada sel tubuh, tetapi melarang perubahan yang dapat diwariskan" paling sesuai dengan pandangan …',o:['para pendukung penyuntingan embrio','para penentang yang mempersoalkan perubahan yang diwariskan','pihak yang menolak semua penelitian gen','pasien talasemia','perusahaan farmasi'],a:1,b:'Kebijakan itu mengizinkan terapi (yang tidak ditolak penentang) dan melarang perubahan yang diwariskan (yang dipersoalkan penentang).'},
{s:'lbi',lv:7,p:'a3i2',t:'Argumen pendukung',q:'Alasan pendukung pendapatan dasar universal menurut teks adalah, KECUALI …',o:['lebih sederhana daripada bantuan bersyarat','mengurangi biaya administrasi','menjadi jaring pengaman di tengah perubahan teknologi','dijamin meningkatkan pertumbuhan ekonomi nasional','mengurangi masalah salah sasaran'],a:3,b:'Teks tidak menyebut jaminan peningkatan pertumbuhan ekonomi nasional.'},
{s:'lbi',lv:7,p:'a3i2',t:'Evaluasi bukti',q:'Temuan uji coba bahwa penerima umumnya tidak berhenti bekerja paling tepat dipandang sebagai …',o:['bukti pasti bahwa skema nasional tidak akan mengurangi minat kerja','bukti awal yang melemahkan keberatan kedua, tetapi belum meyakinkan untuk skala nasional dan permanen','bukti bahwa biayanya kecil','bukti bahwa pengkritik benar','tidak relevan dengan perdebatan'],a:1,b:'Teks sendiri mengingatkan uji coba berskala kecil dan terbatas waktu, sehingga temuannya belum bisa dipastikan berlaku secara nasional.'},
{s:'lbi',lv:7,p:'a3i2',t:'Makna frasa',q:'Frasa "gambaran yang lebih bernuansa" dalam teks bermakna …',o:['gambaran yang sepenuhnya mendukung pengkritik','gambaran yang lebih rumit dan tidak hitam-putih','gambaran yang penuh warna','gambaran yang salah','gambaran yang sederhana'],a:1,b:'Bernuansa = memiliki perbedaan halus, <b>tidak hitam-putih</b>.'},
{s:'lbi',lv:7,p:'a3i2',t:'Sikap penulis',q:'Sikap penulis teks terhadap pendapatan dasar universal adalah …',o:['mendukung tanpa syarat','menolak keras','menyajikan argumen kedua pihak secara berimbang dan berhati-hati menyimpulkan','menertawakan gagasan itu','tidak memahami gagasan itu'],a:2,b:'Penulis memaparkan pendukung, pengkritik, dan bukti uji coba beserta keterbatasannya.'},
{s:'lbi',lv:7,p:'a3i2',t:'Melemahkan',q:'Temuan yang paling MELEMAHKAN keberatan pertama para pengkritik adalah …',o:['Penerima menggunakan uang untuk pelatihan.','Studi menunjukkan biaya pendapatan dasar dapat ditutup sebagian besar dengan menghapus program bantuan yang tumpang tindih dan pajak progresif.','Uji coba dilakukan di banyak negara.','Teknologi menghapus pekerjaan.','Bantuan bersyarat sering salah sasaran.'],a:1,b:'Keberatan pertama adalah soal biaya. Bukti bahwa biaya bisa ditutup melemahkan keberatan itu secara langsung.'},
{s:'lbi',lv:7,p:'a3i3',t:'Tesis',q:'Tesis paragraf pertama adalah …',o:['Museum adalah tempat menyimpan benda lama.','Museum tidak netral karena pilihan kuratorialnya membentuk ingatan bersama.','Museum harus ditutup.','Semua benda museum berasal dari masa kolonial.','Museum tidak memengaruhi masyarakat.'],a:1,b:'Kalimat "Padahal, setiap museum membuat pilihan…" adalah bantahan terhadap anggapan netral.'},
{s:'lbi',lv:7,p:'a3i3',t:'Detail',q:'Respons museum terhadap benda dari masa kolonial yang disebut dalam teks adalah …',o:['menjual benda tersebut','mengembalikan ke negara asal atau menambahkan keterangan cara perolehannya','menyembunyikan benda tersebut','memindahkannya ke gudang','membuat replika'],a:1,b:'Teks menyebut dua respons itu.'},
{s:'lbi',lv:7,p:'a3i3',t:'Pandangan kurator',q:'Menurut sebagian kurator, hal yang lebih penting daripada berpura-pura netral adalah …',o:['menambah jumlah koleksi','transparan tentang sudut pandang dan membuka ruang bagi tafsir berbeda','menarik lebih banyak pengunjung','memamerkan benda paling mahal','mengikuti selera pemerintah'],a:1,b:'Teks menyebut pandangan itu secara langsung.'},
{s:'lbi',lv:7,p:'a3i3',t:'Kritik',q:'Kekhawatiran kritikus dalam teks adalah …',o:['museum akan kehilangan pengunjung','tanpa standar yang jelas, satu narasi tunggal hanya diganti dengan narasi tunggal lain','benda akan rusak saat dikembalikan','kurator akan kehilangan pekerjaan','museum akan menjadi terlalu mahal'],a:1,b:'Kalimat terakhir menyebut kekhawatiran itu.'},

const QUIZ_N = 5;
const bankOf = (s, lv) => BANK.filter(q => q.s === s && q.lv === lv);
const qTotal = (s, lv) => Math.min(QUIZ_N, bankOf(s, lv).length);
const tierReady = lv => lv === 0 || SUBTESTS.every(s => bankOf(s.id, lv).length >= 5);
const tierFull = lv => lv === 0 || SUBTESTS.every(s => bankOf(s.id, lv).length >= s.soal);

const grpLevels = g => LEVELS.filter(l => l.grup === g && tierReady(l.lv));
const grpProg = (u, g) => { const ls = grpLevels(g); let n = 0; ls.forEach(l => SUBTESTS.forEach(s => { if (passed(u, s.id, l.lv)) n++; })); return [n, ls.length * 7]; };
function passed(u, s, lv) { const r = u.quiz[quizKey(s, lv)]; return r && r.best / qTotal(s, lv) >= 0.6; }
function progressPct(u) {
  const les = u.lessons.length / ALL_LESSONS.length;
  const RL = READY(); let qz = 0; SUBTESTS.forEach(s => RL.forEach(l => { if (passed(u, s.id, l.lv)) qz++; })); qz /= (7 * RL.length);
  const to = Math.min(RL.length, new Set(u.tryouts.filter(t => t.pkg !== 'to0').map(t => t.pkg)).size) / RL.length;
  return Math.round((les * .3 + qz * .45 + to * .25) * 100);
}

const CAP = {1:650, 2:720, 3:780, 4:840, 5:900, 6:960, 7:1000}, W = {1:1, 2:1.3, 3:1.5, 4:1.7, 5:2, 6:2.3, 7:2.6};
function isRight(q, ans) {
  if (ans === undefined || ans === null || ans === '') return false;
  if (q.tipe === 'isian') { const n = s => String(s).trim().replace(',', '.').toLowerCase(); return n(ans) === n(q.a) || (!isNaN(parseFloat(n(ans))) && Math.abs(parseFloat(n(ans)) - parseFloat(n(q.a))) < 1e-9); }
  return ans === q.a;
}
function secScore(items) { let w = 0, got = 0, cap = 0; items.forEach(({q, ans}) => { w += W[q.lv]; cap += CAP[q.lv]; if (isRight(q, ans)) got += W[q.lv]; }); if (!items.length) return 0; return Math.round(200 + (got / w) * (cap / items.length - 200)); }

}

    <div class="card rv" style="padding:28px;margin:12px 0 26px;display:flex;gap:22px;align-items:center;flex-wrap:wrap;background:${s.warna}"><div class="itile" style="width:76px;height:76px;font-size:36px;border-radius:22px;background:#fff">${I(s.icon)}</div><div style="flex:1;min-width:240px"><span class="pill-dark">${s.grup === 'TPS' ? 'Tes Potensi Skolastik' : 'Tes Literasi'}</span><h1 class="ptitle" style="font-size:42px;margin:8px 0 6px">${s.nama}</h1><p style="font-weight:600;line-height:1.5">${s.desk}</p><div class="st-meta"><span class="chip">${I('quiz')} UTBK: ${s.soal} soal</span><span class="chip">${I('timer')} ${String(s.menit).replace('.', ',')} menit</span><span class="chip">${I('target')} ${s.uji}</span></div></div></div>

    <h3 class="fd" style="font-size:24px;margin:30px 0 14px">Kuis checkpoint</h3><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px">${LEVELS.map(lv => quizBtn(u, s.id, lv)).join('')}</div>`); }
  shell('materi', `<div class="head-row"><div><span class="page-tag">${I('book')} Pustaka</span><h1 class="ptitle">Materi <span class="hl2">SNBT</span></h1><p class="psub">Belajar seperti les privat bersama Kak Aji. Konsep dijelaskan dari dasar, jebakan soal dibongkar, dan setiap lesson punya contoh soal.</p></div></div>
  <div class="mgrid">${SUBTESTS.map(s => { const d = LESSONS[s.id].filter(l => u.lessons.includes(l.id)).length; return `<a class="card mtile rv" href="#/materi/${s.id}"><div style="display:flex;justify-content:space-between"><div class="itile" style="background:${s.warna}">${I(s.icon)}</div><span class="chip">${s.kode}</span></div><h3>${s.nama}</h3><p>${s.uji}</p><div class="pbar" style="margin-top:16px"><i data-w="${d / 3 * 100}%" style="width:0"></i></div><small style="display:block;margin-top:8px;font-weight:800">${d}/3 lesson</small></a>`; }).join('')}</div>`);

function quizBtn(u, sid, lv) { const r = u.quiz[quizKey(sid, lv.lv)], n = qTotal(sid, lv.lv), perf = r && r.best === n && n > 0, lock = !canLv(lv.lv), soon = !tierReady(lv.lv); return `<button class="lvbtn ${perf ? 'perfect' : ''} ${lock || soon ? 'locked' : ''}" data-a="startQuiz" data-s="${sid}" data-lv="${lv.lv}"><span style="display:flex;align-items:center;gap:8px"><span style="width:12px;height:12px;border-radius:50%;background:${lv.warna};border:2px solid var(--ink)"></span>${lv.nama}</span>${soon ? `<span class="chip">Segera</span>` : lock ? `<span class="chip lockchip">${I('lock')} Member</span>` : `<span class="sc"><i>${Array.from({length: n}, (_, k) => `<b class="${r && k < r.best ? 'on' : ''}"></b>`).join('')}</i>${I('arr')}</span>`}</button>`; }

/* ---------- KUIS ---------- */
function pKuis() {
  const u = me(), RL = READY(), TOT = RL.length * 7; let tried = 0; SUBTESTS.forEach(s => RL.forEach(l => { if (u.quiz[quizKey(s.id, l.lv)]) tried++; }));
  let rec = null; for (const lv of RL.filter(l => canLv(l.lv))) { for (const s of SUBTESTS) { if (!passed(u, s.id, lv.lv)) { rec = {s, lv}; break; } } if (rec) break; }
  if (!rec) rec = {s: SUBTESTS[0], lv: RL[RL.length - 1]};
  const n = qTotal(rec.s.id, rec.lv.lv);
  shell('kuis', `<span class="page-tag">${I('quiz')} Kuis</span><h1 class="ptitle">Cek <span class="hl2">Pemahaman</span></h1><p class="psub" style="margin-bottom:28px">Checkpoint 5 soal acak per subtes dan per tingkat, dengan pembahasan langsung setelah kamu menjawab. Soalnya diacak ulang setiap kali, jadi boleh diulang kapan saja.</p>
  <div class="card kbig rv"><span class="ribbon">Lanjut di Sini</span><div class="lft"><span class="chip" style="align-self:flex-start">Koleksi kuis</span><div class="ring-wrap">${ring(tried, TOT)}</div><div class="stk">${SUBTESTS.map(s => { const any = LEVELS.some(l => u.quiz[quizKey(s.id, l.lv)]); return `<span style="${any ? `background:${s.warna}` : 'border-style:dashed'}">${s.kode}</span>`; }).join('')}</div><b style="font-size:13px">${tried} dari ${TOT} checkpoint dicoba</b></div>
  <div class="rgt"><small style="font-weight:700;color:var(--muted)">Rekomendasi · ${rec.s.kode}</small><h2>Checkpoint ${rec.s.nama} · ${rec.lv.nama}</h2><div class="st-meta" style="margin:0 0 14px"><span class="chip">${I('quiz')} ${n} soal</span><span class="chip">${I('timer')} ±${Math.ceil(n * .9)} menit</span></div><p style="color:var(--muted);line-height:1.6;max-width:520px">${n} pertanyaan untuk menguji pemahamanmu tentang ${rec.s.uji.toLowerCase()} di level ${rec.lv.nama.toLowerCase()}.</p><button class="btn btn-lime" style="margin-top:18px" data-a="startQuiz" data-s="${rec.s.id}" data-lv="${rec.lv.lv}">Mulai kuis ${I('arr','ic-arr')}</button><p style="font-size:12px;color:var(--muted);margin-top:14px">Satu stiker per subtes. Yang berwarna sudah pernah kamu coba.</p></div></div>
  <div style="display:flex;justify-content:space-between;align-items:end;gap:20px;flex-wrap:wrap;margin:40px 0 20px"><h2 class="fd" style="font-size:34px">Per subtes <span class="chip" style="font-size:12px;vertical-align:middle">7 subtes · 7 tingkat · 5 soal acak</span></h2><p style="font-size:13px;color:var(--muted);max-width:360px">Checkpoint tidak menentukan kelulusan. Pakai hasilnya untuk melihat konsep yang perlu kamu ulang.</p></div>
  <div class="kgrid">${SUBTESTS.map((s, i) => { const perf = RL.every(l => { const r = u.quiz[quizKey(s.id, l.lv)]; return r && r.best === qTotal(s.id, l.lv); }); return `<div class="card kcard rv">${perf ? '<span class="stick">Sempurna</span>' : ''}<div style="display:flex;justify-content:space-between;align-items:start"><div class="itile" style="background:${s.warna};font-family:var(--fd);font-weight:800;font-size:20px">${String(i + 1).padStart(2,'0')}</div><span class="chip">${I('timer')} ±5 menit</span></div><small style="display:block;margin-top:12px;font-weight:700;color:var(--muted)">Subtes ${s.kode}</small><h4 style="margin-top:2px">${s.nama}</h4>${LEVELS.map(lv => quizBtn(u, s.id, lv)).join('')}</div>`; }).join('')}</div>`);
}

/* ---------- RUNNER: QUIZ (feedback langsung) ---------- */
function startQuiz(sid, lv) { if (!tierReady(lv)) return toast('spark', `Tingkat ${LV(lv).nama} sedang disiapkan. Sabar ya!`); if (!canLv(lv)) return lockModal(`Kuis ${LV(lv).nama} khusus Member`); const qs = shuffle(bankOf(sid, lv)).slice(0, QUIZ_N); RUN = {mode: 'quiz', title: `${ST(sid).nama} · ${LV(lv).nama}`, s: sid, lv, qs, qi: 0, pick: null, checked: false, score: 0, end: false}; go('#/run'); }
function pRun() { if (!RUN) return go('#/beranda'); RUN.mode === 'quiz' ? renderQuiz() : renderExam(); }
function qBody(q, pick, locked, showRes, noSave) {
  const pas = q.p ? PASSAGES[q.p] : null;
  const opts = q.tipe === 'isian' ? `<div class="isian"><input id="isian" inputmode="decimal" placeholder="Ketik jawabanmu…" value="${pick ?? ''}" ${locked ? 'disabled' : ''}>${!locked && !noSave ? `<button class="btn btn-dark btn-sm" data-a="saveIsian">Simpan</button>` : ''}</div>${showRes ? `<p style="margin-top:10px;font-weight:800">Kunci jawaban: <span style="color:var(--ok)">${q.a}</span></p>` : ''}`
    : `<div class="opts">${q.o.map((o, i) => { let c = ''; if (showRes) { if (i === q.a) c = 'right'; else if (i === pick) c = 'wrong'; } else if (i === pick) c = 'sel'; return `<button class="opt ${c} ${locked ? 'locked' : ''}" data-a="pick" data-i="${i}"><span class="L">${L[i]}</span><span>${o}</span></button>`; }).join('')}</div>`;
  return {pas, html: `<div class="qtext">${q.q}</div>${opts}`};
}
function renderQuiz() {
  const R = RUN, s = ST(R.s);
  if (R.end) {
    const n = R.qs.length, pct = R.score / n, msg = endText(R, pct, n);
    const nextLv = R.lv < 7 && pct >= .6 && tierReady(R.lv + 1) && canLv(R.lv + 1) ? R.lv + 1 : null;
    root().innerHTML = `<div class="runner"><div class="rtop"><span class="logo-mark" style="width:32px;height:32px;border-radius:10px">${I('cap')}</span><div class="ttl">${esc(R.title)}<small>Hasil kuis</small></div></div><div style="max-width:640px;margin:40px auto;padding:0 18px"><div class="card" style="padding:36px;text-align:center"><div class="owl-float" style="display:inline-block">${OWL(90)}</div><h1 class="ptitle">${msg[0]}</h1><p class="psub" style="margin:0 auto 22px">${msg[1]}</p><div class="ring-wrap" style="display:inline-block">${ring(R.score, n)}</div><div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:28px">${nextLv && !R.gen ? `<button class="btn btn-lime" data-a="startQuiz" data-s="${R.s}" data-lv="${nextLv}">Lanjut ${LV(nextLv).nama} ${I('arr','ic-arr')}</button>` : ''}${!R.gen ? `<button class="btn btn-white" data-a="startQuiz" data-s="${R.s}" data-lv="${R.lv}">${I('refresh')} Ulangi</button>` : ''}${R.gen ? `<button class="btn btn-white" data-a="startLatihan">${I('zap')} Paket baru</button>` : ''}<a class="btn btn-white" href="#/${R.gen ? 'latihan' : 'kuis'}">Kembali</a></div>${!R.gen ? `<a href="#/materi/${R.s}" style="display:inline-block;margin-top:18px;font-weight:800;border-bottom:2px solid var(--lime)">Baca materi ${s.nama}</a>` : ''}</div></div></div>`;
    animate(); if (pct === 1) confetti(); return;
  }
  const q = R.qs[R.qi], b = qBody(q, R.pick, R.checked, R.checked, true), ok = R.checked && isRight(q, R.pick);
  root().innerHTML = `<div class="runner"><div class="rtop"><span class="logo-mark" style="width:32px;height:32px;border-radius:10px">${I('cap')}</span><div class="ttl">${esc(R.title)}<small>Soal ${R.qi + 1} dari ${R.qs.length} · Skor ${R.score}</small></div><button class="btn btn-sm" style="margin-left:auto;color:#fff;border-color:#ffffff55" data-a="exitRun">${I('x')} Keluar</button></div><div class="rprog"><i style="width:${(R.qi + (R.checked ? 1 : 0)) / R.qs.length * 100}%"></i></div>
  <div style="max-width:${b.pas ? 1200 : 780}px;margin:30px auto;padding:0 18px"><div class="qwrap ${b.pas ? 'has-p' : ''}">${b.pas ? `<div class="card passage"><span class="chip" style="margin-bottom:10px">${I('bookopen')} Bacaan</span><h4>${b.pas.judul}</h4>${b.pas.isi}</div>` : ''}<div class="card qcard"><div class="qhead"><span class="qno">${R.qi + 1}</span><span class="chip" style="background:${s.warna}">${I(s.icon)} ${s.kode}</span><span class="chip">${q.t}</span></div>${b.html}
  ${R.checked ? `<div class="fb ${ok ? 'ok' : 'no'}"><h5>${I(ok ? 'check' : 'x')} ${R.fbMsg || ''}</h5>${q.b}${!ok ? `<div style="margin-top:12px"><button class="btn btn-white btn-sm" data-a="quizRetry">${I('refresh')} Ulang soal ini</button></div>` : ''}</div>` : ''}
  <div class="qnav"><span></span>${R.checked ? `<button class="btn btn-lime" data-a="quizNext">${R.qi === R.qs.length - 1 ? 'Lihat hasil' : 'Soal berikutnya'} ${I('arr','ic-arr')}</button>` : `<button class="btn btn-dark" data-a="quizCheck" ${q.tipe !== 'isian' && R.pick === null ? 'disabled' : ''}>Cek jawaban ${I('check')}</button>`}</div></div></div></div></div>`;
}

/* ---------- TRY OUT ---------- */
const TO_DESK = {1:'160 soal persis format UTBK, tanpa timer. Fokus paham dulu, kecepatan belakangan.',2:'160 soal setara UTBK dengan timer asli tiap subtes. Mulai terasa seperti ujian sungguhan.',3:'Soal lebih tajam: analitik, kecukupan data, inferensi teks.',4:'Tingkat terakhir Menengah. Lulus ini, kamu siap tempur.',5:'Soal HOTS penuh jebakan. Untuk kamu yang mengincar skor 700+.',6:'Lebih sulit dari UTBK rata-rata. Latihan supaya ujian asli terasa ringan.',7:'Puncak. Semua subtes di level tersulit, dengan dukungan penuh dari Kak Aji.'};
const PAKET = LEVELS.map(l => ({id: 'to' + l.lv, nama: `Try Out ${l.lv} · ${l.nama}`, lv: l.lv, warna: l.warna, desk: TO_DESK[l.lv], timer: l.timer})).concat([{id:'to0', nama:'Try Out Acak · Campuran', lv:0, warna:'var(--purple)', desk:'160 soal campuran dari semua tingkat yang tersedia, diacak ulang setiap kali dikerjakan. Bertimer.', timer:true}]);
function buildSections(p) {
  return SUBTESTS.map(s => {
    let qs = p.lv ? bankOf(s.id, p.lv) : BANK.filter(q => q.s === s.id && tierReady(q.lv));
    if (!p.lv) { const byP = {}; shuffle(qs).forEach(q => { (byP[q.p || q.id] = byP[q.p || q.id] || []).push(q); }); qs = []; Object.values(byP).forEach(g => { if (qs.length < s.soal) qs.push(...g); }); qs = qs.slice(0, s.soal); }
    qs = qs.slice().sort((a, b) => (a.p || '').localeCompare(b.p || '') || 0);
    return {sid: s.id, qs: qs.map(q => q.id), secs: p.timer ? Math.round(qs.length * s.menit * 60 / s.soal) : 0};
  });
}
function pTryout() {

function finishExam() {
  const R = RUN, u = me(); if (TICK) { clearInterval(TICK); TICK = null; }

  const full = items.map(it => ({q: QB(it.id), ans: it.ans}));

  if (R.mode === 'diag') {
    const per = {}; SUBTESTS.forEach(s => { const f = full.filter(x => x.q.s === s.id); per[s.id] = [f.filter(x => isRight(x.q, x.ans)).length, f.length]; });
    const pct = benar / items.length; u.diag = {date: Date.now(), per, benar, n: items.length, rec: pct < .45 ? 1 : pct < .8 ? 2 : 5};

  }

/* ---------- DIAGNOSTIK ---------- */
function radar(per) {
  const n = SUBTESTS.length, cx = 150, cy = 140, R = 100, pt = (i, r) => [cx + r * Math.sin(2 * Math.PI * i / n), cy - r * Math.cos(2 * Math.PI * i / n)];

  const poly = SUBTESTS.map((s, i) => pt(i, R * Math.max(.08, per[s.id][0] / per[s.id][1])).join(',')).join(' ');
  return `<svg class="radar" viewBox="0 0 300 290" style="width:100%;max-width:380px">${rings}${SUBTESTS.map((s, i) => { const [x, y] = pt(i, R), [lx, ly] = pt(i, R + 22); return `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#0f1e1618"/><text x="${lx}" y="${ly + 4}" text-anchor="middle">${s.kode}</text>`; }).join('')}<polygon points="${poly}" fill="#d8f23faa" stroke="#0f1e16" stroke-width="2.5"/>${SUBTESTS.map((s, i) => { const [x, y] = pt(i, R * Math.max(.08, per[s.id][0] / per[s.id][1])); return `<circle cx="${x}" cy="${y}" r="5" fill="${getComputedStyle(document.documentElement).getPropertyValue(s.warna.slice(4, -1))}" stroke="#0f1e16" stroke-width="2"/>`; }).join('')}</svg>`;
}
function pDiag(p) {

    return shell('diagnostik', `<span class="page-tag">${I('target')} Hasil Diagnostik</span><h1 class="ptitle">Level awalmu: <span class="hl2">${rec.nama}</span></h1><p class="psub">Kamu menjawab benar <b>${d.benar} dari ${d.n}</b> soal. Ini petamu di 7 subtes:</p>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:24px;margin-top:24px"><div class="card rv" style="padding:24px;display:grid;place-items:center">${radar(d.per)}</div>
    <div class="card rv" style="padding:26px"><div style="display:flex;gap:14px;align-items:center">${OWL(64)}<b style="font-size:17px">Rencana belajar dari Kak Aji</b></div><ol class="steps" style="margin-top:18px;line-height:1.6">
    <li>Mulai dari <b>materi level ${rec.nama}</b> di setiap subtes.</li>${weak.length ? `<li>Fokus dulu ke: <b>${weak.slice(0, 3).map(s => s.nama).join(', ')}</b>.</li>` : '<li>Semua subtes aman. Langsung tantang level berikutnya!</li>'}<li>Kerjakan kuis checkpoint ${rec.nama} sampai minimal 60% benar.</li><li>Tutup dengan <b>${(PAKET.find(p => p.lv === d.rec) || PAKET[0]).nama}</b>.</li></ol>
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:18px"><a class="btn btn-lime" href="#/materi/${(weak[0] || SUBTESTS[0]).id}">Mulai belajar ${I('arr','ic-arr')}</a><button class="btn btn-white" data-a="startDiag">${I('refresh')} Tes ulang</button></div></div></div>`);

/* ---------- LATIHAN KILAT (generator) ---------- */
function mkOpts(ans, gen) { const set = new Set([ans]); let g = 0; while (set.size < 5 && g < 60) { const v = Math.round(gen() * 100) / 100; if (v > 0 && Number.isFinite(v)) set.add(v); g++; } let k = 1; while (set.size < 5) set.add(ans + k++ * 3); const o = shuffle([...set]); return {o: o.map(x => String(x).replace('.', ',')), a: o.indexOf(ans)}; }
const GENS = [
  () => { const a = rnd(2, 20), d = rnd(3, 12), t = [0,1,2,3,4].map(i => a + i * d), ans = a + 5 * d; return {t: 'Deret aritmetika', q: `Bilangan selanjutnya dari ${t.join(', ')}, … adalah`, ...mkOpts(ans, () => ans + [d, -d, 1, -1, 2 * d, d + 1, -2][rnd(0, 6)]), b: `Selisih tetap +${d}. Jadi ${t[4]} + ${d} = <b>${ans}</b>.`}; },
  () => { const a = rnd(1, 5), r = rnd(2, 3), t = [0,1,2,3].map(i => a * r ** i), ans = a * r ** 4; return {t: 'Deret geometri', q: `Bilangan selanjutnya dari ${t.join(', ')}, … adalah`, ...mkOpts(ans, () => ans + rnd(-4, 4) * a * r), b: `Setiap suku dikali ${r}. Jadi ${t[3]} × ${r} = <b>${ans}</b>.`}; },
  () => { const p = [5,10,15,20,25,30,40,60,75][rnd(0, 8)], n = rnd(2, 30) * 20, ans = p * n / 100; return {t: 'Persen', q: `${p}% dari ${n} adalah …`, ...mkOpts(ans, () => ans + rnd(-5, 5) * (n / 100) * (rnd(1, 2))), b: `${p}/100 × ${n} = <b>${ans}</b>.`}; },
  () => { const a = rnd(1, 6), b = rnd(1, 6), k = rnd(2, 12), tot = (a + b) * k, ans = b * k; return {t: 'Perbandingan', q: `Uang Ani dan Budi berbanding ${a} : ${b}. Jika jumlah uang mereka Rp${tot}.000, uang Budi adalah … ribu rupiah`, ...mkOpts(ans, () => [a * k, ans + k, ans - k, tot - a, ans + 2 * k][rnd(0, 4)]), b: `Total bagian ${a + b}. Satu bagian = ${tot} ÷ ${a + b} = ${k} ribu. Budi = ${b} × ${k} = <b>${ans}</b> ribu.`}; },
  () => { const x = rnd(2, 15), y = rnd(1, 12), s = x + y, d = x - y; return {t: 'SPLDV', q: `Jika x + y = ${s} dan x − y = ${d}, maka nilai x adalah …`, ...mkOpts(x, () => [y, s, x + 1, x - 1, x + 2, Math.abs(d)][rnd(0, 5)]), b: `Jumlahkan: 2x = ${s} + (${d}) = ${2 * x}, jadi x = <b>${x}</b>.`}; },
  () => { const v = [12,15,18,20,24,30,36,40,45,48,60][rnd(0, 10)], m = [10,15,20,30,40,45][rnd(0, 5)]; const s = v * m / 60; if (s % 1) return GENS[5](); return {t: 'Kecepatan', q: `Sebuah motor menempuh ${s} km dalam ${m} menit. Kecepatan rata-ratanya adalah … km/jam`, ...mkOpts(v, () => v + rnd(-4, 4) * 3), b: `${m} menit = ${m}/60 jam. v = ${s} ÷ ${m}/60 = <b>${v} km/jam</b>.`}; }
];
function startLatihan() { const qs = Array.from({length: 10}, (_, i) => ({s: 'pk', lv: 2, tipe: 'pg', ...GENS[i % GENS.length]()})); RUN = {mode: 'quiz', gen: true, title: 'Latihan Kilat · 10 soal', s: 'pk', lv: 2, qs: shuffle(qs), qi: 0, pick: null, checked: false, score: 0, end: false}; go('#/run'); }

/* ---------- Efek suara (Web Audio, tanpa file) ---------- */
let AC = null;
function sfx(kind) {
  if (!PREFS.sound) return;
  try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); } catch (e) { return; }
  const seq = {tap: [[660, .05]], ok: [[660, .09], [990, .14]], no: [[220, .12], [180, .18]], win: [[523, .1], [659, .1], [784, .1], [1047, .22]], toggle: [[880, .05]]}[kind] || [];
  let t = AC.currentTime;
  seq.forEach(([f, d]) => { const o = AC.createOscillator(), g = AC.createGain(); o.type = kind === 'no' ? 'square' : 'sine'; o.frequency.value = f; g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(kind === 'no' ? .05 : .12, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + d); o.connect(g).connect(AC.destination); o.start(t); o.stop(t + d + .02); t += d * .85; });
}
const _confetti = confetti;
confetti = function () { sfx('win'); if (PREFS.anim && !PREFS.calm) _confetti(); };

  const b = Array.from(new TextEncoder().encode(str)), l = b.length * 8; b.push(0x80); while (b.length % 64 !== 56) b.push(0);
  for (let i = 7; i >= 0; i--) b.push(i > 3 ? 0 : (l >>> (i * 8)) & 255);

    for (let i = 16; i < 64; i++) { const s0 = r(w[i-15], 7) ^ r(w[i-15], 18) ^ (w[i-15] >>> 3), s1 = r(w[i-2], 17) ^ r(w[i-2], 19) ^ (w[i-2] >>> 10); w[i] = (w[i-16] + s0 + w[i-7] + s1) | 0; }

/* ---------- Bank soal salah ---------- */
const wrongIds = u => {
  const last = {}; const mark = (id, ts) => { if (id && QB(id) && (!last[id] || ts > last[id])) last[id] = ts; };
  u.tryouts.forEach(t => (t.items || []).forEach(it => { const q = QB(it.id); if (q && !isRight(q, it.ans)) mark(it.id, t.date); }));
  Object.entries(u.wq || {}).forEach(([id, ts]) => mark(id, ts));
  const fx = u.fixed || {};
  return Object.keys(last).filter(id => last[id] > (fx[id] || 0));
};
const _qc5 = ACT.quizCheck;
ACT.quizCheck = (...a) => {
  const R = RUN, q = R && R.qs[R.qi], wasRetry = R && R.retry; _qc5(...a);
  if (!R || !R.checked || !q || !q.id || !QB(q.id)) return;
  const u = me(), ok = isRight(q, R.pick);
  if (!ok) { u.wq = u.wq || {}; u.wq[q.id] = Date.now(); }
  else if (R.review && !wasRetry) { u.fixed = u.fixed || {}; u.fixed[q.id] = Date.now(); R.fixedN = (R.fixedN || 0) + 1; }
  save();
};
const _qn5 = ACT.quizNext;
ACT.quizNext = (...a) => { const R = RUN; const before = me().latihan; _qn5(...a); if (R && R.review && R.end) { me().latihan = before; save(); } };
/* header chip & level galak mengikuti soal yang sedang tampil */
const _rq5 = renderQuiz;
renderQuiz = function () { const R = RUN; if (R && R.review && !R.end) { const q = R.qs[R.qi]; R.s = q.s; R.lv = q.lv; } _rq5(); if (R && R.review && R.end) { const box = document.querySelector('.runner .card p.psub'); if (box) box.insertAdjacentHTML('afterend', `<p style="font-weight:800;margin:-8px 0 14px">${I('check')} ${R.fixedN || 0} soal berhasil kamu perbaiki dan keluar dari daftar.</p><a class="btn btn-white btn-sm" href="#/ulang" style="margin-bottom:6px">Kembali ke daftar soal salah</a>`); } };

function startUlang(sid) {
  const u = me(); let ids = wrongIds(u).filter(id => !sid || QB(id).s === sid);
  if (!ids.length) return toast('check', 'Tidak ada soal salah di bagian ini. Mantap!');
  const qs = shuffle(ids).slice(0, 10).map(QB);
  RUN = {mode: 'quiz', gen: true, review: true, title: `Ulang yang Salah${sid ? ' · ' + ST(sid).kode : ''} · ${qs.length} soal`, s: qs[0].s, lv: qs[0].lv, qs, qi: 0, pick: null, checked: false, score: 0, end: false};
  go('#/run');
}
ACT.startUlang = t => startUlang(t.dataset.s || '');

function pUlang() {
  const u = me(), ids = wrongIds(u), fixedN = Object.keys(u.fixed || {}).length;
  const per = SUBTESTS.map(s => [s, ids.filter(id => QB(id).s === s.id).length]);
  shell('ulang', `<span class="page-tag">${I('refresh')} Praktik</span><h1 class="ptitle">Ulang yang <span class="hl2">salah</span></h1>
  <p class="psub" style="margin-bottom:24px">Semua soal yang pernah kamu jawab salah di kuis dan try out dikumpulkan di sini. Jawab benar di percobaan pertama, soalnya keluar dari daftar. Kalau salah lagi, soalnya tetap tinggal.</p>
  <div class="card rv" style="padding:24px;display:flex;gap:22px;align-items:center;flex-wrap:wrap;margin-bottom:22px">
    <div><b class="fd" style="font-size:46px;line-height:1">${ids.length}</b><br><small style="font-weight:800">soal menunggu diulang</small></div>
    <div><b class="fd" style="font-size:46px;line-height:1;color:var(--ok)">${fixedN}</b><br><small style="font-weight:800">sudah diperbaiki</small></div>
    <button class="btn btn-lime" style="margin-left:auto" data-a="startUlang" ${ids.length ? '' : 'disabled'}>${I('play')} Ulang 10 soal acak</button>
  </div>
  ${ids.length ? `<div class="grid3" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px">${per.map(([s, n]) => `<div class="card rv" style="padding:18px"><span class="chip" style="background:${s.warna}">${I(s.icon)} ${s.kode}</span><h3 style="margin:10px 0 4px;font-size:18px">${s.nama}</h3><p style="color:var(--muted);font-weight:700;margin-bottom:12px">${n} soal salah</p><button class="btn btn-white btn-sm" data-a="startUlang" data-s="${s.id}" ${n ? '' : 'disabled'}>${n ? 'Ulang bagian ini' : 'Bersih ✓'}</button></div>`).join('')}</div>`
  : `<div class="card" style="padding:30px;text-align:center"><div class="owl-float" style="display:inline-block">${OWL(80)}</div><h3 style="margin-top:10px">Belum ada soal salah</h3><p class="psub" style="margin:6px auto 16px">Kerjakan kuis atau try out dulu. Soal yang salah otomatis masuk ke sini.</p><a class="btn btn-lime" href="#/kuis">Ke Kuis ${I('arr','ic-arr')}</a></div>`}`);
}

/* ---------- Ranking ---------- */
const lbKey = n => encodeURIComponent(nameKey(n)).replace(/\./g, '%2E');
const myBests = u => { const b = {}; u.tryouts.forEach(t => { if (/^to\d$/.test(t.pkg)) b[t.pkg] = Math.max(b[t.pkg] || 0, t.total); }); return b; };
const lbEntry = u => { const b = myBests(u); return {n: u.name, b, best: Math.max(0, ...Object.values(b)), s: streak(u), m: isMember() ? 1 : 0, t: Date.now()}; };
async function lbPush() {
  const u = me(); if (!CONFIG.LB_URL || !u || !u.tryouts.length || u.noRank) return;
  const url = `${CONFIG.LB_URL.replace(/\/$/, '')}/lb/${lbKey(u.name)}.json`;
  try {
    const old = await (await fetch(url)).json(); const e = lbEntry(u);
    if (old && old.b) Object.entries(old.b).forEach(([k, v]) => { e.b[k] = Math.max(e.b[k] || 0, +v || 0); });
    e.best = Math.max(0, ...Object.values(e.b));
    await fetch(url, {method: 'PUT', body: JSON.stringify(e)});
  } catch (err) {}
}
let LB_CACHE = null, LB_TAB = 'best';
async function lbLoad() {
  if (!CONFIG.LB_URL) return {online: false, rows: Object.values(DB.users).filter(x => x.tryouts && x.tryouts.length).map(x => ({n: x.name, b: myBests(x), s: streak(x)}))};
  try { const r = await fetch(`${CONFIG.LB_URL.replace(/\/$/, '')}/lb.json`); if (!r.ok) throw 0; const d = await r.json() || {}; return {online: true, rows: Object.values(d).filter(x => x && x.n && x.b)}; }
  catch (e) { return {online: false, err: true, rows: []}; }
}
const _fe5 = finishExam;
finishExam = function () { _fe5(); lbPush(); };
function pRanking() {
  shell('ranking', `<span class="page-tag">${I('medal')} Praktik</span><h1 class="ptitle">Ranking <span class="hl2">siswa</span></h1><p class="psub" style="margin-bottom:22px">Diurutkan dari skor try out terbaik. Kerjakan try out untuk masuk daftar.</p><div id="lbBox"><div class="card" style="padding:30px;text-align:center;font-weight:800">Memuat ranking…</div></div>`);
  lbLoad().then(d => { LB_CACHE = d; renderLB(); });
}
function renderLB() {
  const box = $('#lbBox'); if (!box || !LB_CACHE) return; const u = me(), d = LB_CACHE;
  const val = r => LB_TAB === 'best' ? Math.max(0, ...Object.values(r.b || {}).map(Number)) : +((r.b || {})[LB_TAB] || 0);
  const rows = d.rows.map(r => ({...r, v: val(r)})).filter(r => r.v > 0).sort((a, b) => b.v - a.v);
  const myI = rows.findIndex(r => nameKey(r.n) === nameKey(u.name));
  const tabs = [['best', 'Skor terbaik']].concat(LEVELS.map(l => ['to' + l.lv, l.nama]));
  const medal = i => i < 3 ? `<span style="display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;border:2px solid var(--ink);background:${['#ffd23f', '#dfe6e1', '#ff9b5e'][i]};font-weight:900">${i + 1}</span>` : `<b style="display:inline-block;width:30px;text-align:center">${i + 1}</b>`;
  box.innerHTML = `${!d.online ? `<div class="card" style="padding:14px 18px;margin-bottom:16px;background:var(--yellow)"><b>${d.err ? 'Ranking online sedang tidak bisa dimuat.' : 'Mode lokal:'}</b> ${d.err ? 'Cek koneksi internetmu, lalu coba lagi.' : 'ranking ini hanya berisi akun di perangkat ini. Ranking online antarsiswa aktif setelah admin memasang database (lihat README).'}</div>` : ''}
  <div class="st-meta" style="margin-bottom:16px;flex-wrap:wrap">${tabs.map(t => `<button class="chip ${LB_TAB === t[0] ? 'on' : ''}" style="cursor:pointer;${LB_TAB === t[0] ? 'background:var(--ink);color:#fff' : ''}" data-a="lbTab" data-t="${t[0]}">${t[1]}</button>`).join('')}</div>
  ${myI >= 0 ? `<div class="card" style="padding:16px 20px;margin-bottom:16px;display:flex;align-items:center;gap:14px;background:var(--lime)"><b class="fd" style="font-size:34px">#${myI + 1}</b><div><b>${esc(u.name)}</b> (kamu)<br><small style="font-weight:700">dari ${rows.length} siswa · skor ${rows[myI].v}</small></div></div>` : `<div class="card" style="padding:16px 20px;margin-bottom:16px"><b>Namamu belum ada di ranking ini.</b> <a href="#/tryout" style="font-weight:800">Kerjakan try out</a> untuk masuk daftar.</div>`}
  <div class="card" style="padding:8px 14px;overflow-x:auto">${rows.length ? `<table class="hist"><tr><th>#</th><th>Nama</th><th>Skor</th><th>Streak</th></tr>${rows.slice(0, 100).map((r, i) => `<tr style="${i === myI ? 'background:#d8f23f55' : ''}"><td>${medal(i)}</td><td>${esc(r.n)}${r.m ? ` <span class="bdg" title="Member">${I('star')}</span>` : ''}</td><td><b>${r.v}</b></td><td>${I('flame')} ${r.s || 0}</td></tr>`).join('')}</table>` : '<p class="empty" style="padding:20px">Belum ada skor di kategori ini.</p>'}</div>
  ${d.online ? `<p style="margin-top:12px;font-size:13px;color:var(--muted);font-weight:700">Skor dikirim otomatis setiap kamu selesai try out. ${u.noRank ? 'Kamu memilih tidak tampil di ranking.' : ''} <a href="#/profil">Atur di Profil</a></p>` : ''}`;
}
ACT.lbTab = t => { LB_TAB = t.dataset.t; renderLB(); };

/* ---------- Backup / pindah perangkat & privasi ranking ---------- */
const _pp5 = pProfil;
pProfil = function () {
  _pp5(); const u = me(), w = $('.main .wrap'); if (!w) return;
  w.insertAdjacentHTML('beforeend', `<div class="card rv" style="padding:24px;margin-top:22px"><h3 style="margin-bottom:6px">${I('refresh')} Pindah HP / cadangan progres</h3><p style="color:var(--muted);font-weight:600;margin-bottom:14px">Progres tersimpan di perangkat ini saja. Unduh file cadangan, lalu buka di HP/laptop baru dan pilih "Pulihkan".</p><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn btn-lime btn-sm" data-a="bkSave">Unduh cadangan</button><label class="btn btn-white btn-sm" style="cursor:pointer">Pulihkan dari file<input type="file" accept=".json,application/json" id="bkFile" hidden></label></div></div>
  <div class="card rv" style="padding:24px;margin-top:16px"><h3 style="margin-bottom:6px">${I('medal')} Ranking</h3><label style="display:flex;gap:10px;align-items:center;font-weight:700;cursor:pointer"><input type="checkbox" id="noRank" ${u.noRank ? '' : 'checked'}> Tampilkan nama dan skorku di ranking siswa</label></div>`);
  animate();
};
ACT.bkSave = () => { const u = me(); const blob = new Blob([JSON.stringify({app: 'tryout-snbt', v: 1, user: u})], {type: 'application/json'}); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `cadangan-tryout-${nameKey(u.name).replace(/\s+/g, '-')}.json`; document.body.appendChild(a); a.click(); a.remove(); toast('check', 'File cadangan diunduh.'); };
document.addEventListener('change', e => {
  if (e.target.id === 'noRank') { const u = me(); u.noRank = !e.target.checked; save(); toast('check', u.noRank ? 'Namamu disembunyikan dari skor berikutnya.' : 'Namamu tampil di ranking.'); if (!u.noRank) lbPush(); }
  if (e.target.id === 'bkFile' && e.target.files[0]) { const fr = new FileReader(); fr.onload = () => { try { const d = JSON.parse(fr.result); if (d.app !== 'tryout-snbt' || !d.user || !d.user.name) throw 0; const k = nameKey(d.user.name); DB.users[k] = d.user; DB.session = k; save(); toast('check', `Progres ${esc(d.user.name)} berhasil dipulihkan.`); go('#/beranda'); } catch (err) { toast('x', 'File cadangan tidak valid.'); } }; fr.readAsText(e.target.files[0]); }
});

/* ---------- Catatan skor perkiraan ---------- */
const _ph5 = pHasil;
pHasil = function (p) { _ph5(p); const w = $('.main .wrap'); if (w && !w.querySelector('.est-note')) w.insertAdjacentHTML('beforeend', `<p class="est-note" style="margin-top:20px;font-size:13px;color:var(--muted);font-weight:700">${I('help')} Skor di sini adalah perkiraan berbobot tingkat kesulitan, bukan skor IRT resmi UTBK. Gunakan untuk memantau perkembangan, bukan sebagai prediksi pasti.</p>`); };

/* ---------- Route ---------- */
const _route5 = route;
route = function () { const h = (location.hash.replace(/^#/, '') || '/').split('/').filter(Boolean)[0]; const pg = {ulang: pUlang, ranking: pRanking}[h]; if (pg) { if (TICK) { clearInterval(TICK); TICK = null; } window.scrollTo(0, 0); if (!me()) { renderLanding(); return openAuth('daftar', location.hash); } return pg(); } _route5(); };
window.removeEventListener('hashchange', _route5); window.addEventListener('hashchange', route);

initChat();
refreshMember().then(() => route());

</script>
</body>
