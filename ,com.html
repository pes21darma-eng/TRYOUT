a1i1:{judul:'Ketika Wisatawan Terlalu Banyak', isi:`<p>Pariwisata sering dianggap sebagai jalan cepat menggerakkan ekonomi daerah. Namun, beberapa destinasi populer kini menghadapi fenomena overtourism, yaitu jumlah wisatawan melebihi daya dukung lingkungan dan sosial setempat. Gejalanya beragam: antrean panjang di objek wisata, sampah menumpuk, harga sewa rumah melonjak karena banyak hunian dialihkan menjadi penginapan, hingga warga lokal merasa tersisih dari kampungnya sendiri.</p><p>Sejumlah daerah merespons dengan membatasi kuota pengunjung harian, menaikkan tarif masuk, atau mewajibkan pemesanan daring. Kebijakan semacam ini menuai pro dan kontra. Pelaku usaha kecil khawatir pendapatan mereka turun, sedangkan pegiat lingkungan menilai pembatasan justru menjaga agar destinasi tetap layak dikunjungi dalam jangka panjang. Para peneliti pariwisata mengusulkan jalan tengah: menyebarkan kunjungan ke destinasi alternatif dan musim sepi, sehingga manfaat ekonomi tetap mengalir tanpa membebani satu titik saja.</p>`},
a1i2:{judul:'Sagu, Pangan yang Terlupakan', isi:`<p>Selama puluhan tahun, kebijakan pangan nasional bertumpu pada beras. Akibatnya, masyarakat di wilayah yang secara tradisional mengonsumsi sagu, jagung, atau umbi-umbian perlahan beralih ke beras, meski tanahnya tidak selalu cocok untuk sawah. Ketergantungan pada satu komoditas membuat pasokan rentan ketika panen gagal atau harga beras naik.</p><p>Sagu menawarkan alternatif menarik. Pohon sagu tumbuh alami di lahan rawa, tidak memerlukan pupuk, dan satu batang dapat menghasilkan ratusan kilogram pati. Kendalanya ada pada citra dan pengolahan: sagu kerap dianggap makanan kelas dua, dan produk olahannya belum beragam. Beberapa peneliti pangan menilai bahwa diversifikasi pangan tidak akan berhasil hanya dengan imbauan. Diperlukan inovasi produk, seperti mi atau roti berbahan sagu, serta kebijakan pengadaan yang tidak hanya membeli beras.</p>`},
a1i3:{judul:'Hoaks Kesehatan di Grup Percakapan', isi:`<p>Informasi kesehatan palsu menyebar paling cepat bukan di situs berita, melainkan di grup percakapan keluarga. Sebuah studi terhadap pesan berantai menemukan bahwa hoaks kesehatan cenderung memiliki pola yang mirip: judul yang memancing emosi, klaim "dokter terkenal" tanpa nama jelas, serta ajakan untuk segera menyebarkan.</p><p>Menariknya, penyebar hoaks umumnya tidak berniat jahat. Mereka meneruskan pesan karena peduli dan ingin melindungi orang terdekat. Karena itu, para peneliti menyarankan agar klarifikasi tidak disampaikan dengan nada menyalahkan. Pendekatan yang lebih efektif adalah menghargai niat baik pengirim, lalu memberikan sumber tepercaya sebagai pembanding. Mereka juga menemukan bahwa koreksi dari anggota keluarga sendiri lebih dipercaya daripada koreksi dari lembaga resmi.</p>`},
a1i4:{judul:'Panas Bumi di Bawah Kaki Kita', isi:`<p>Indonesia berada di jalur cincin api, sehingga memiliki potensi panas bumi yang sangat besar. Pembangkit listrik tenaga panas bumi memanfaatkan uap dari dalam bumi untuk memutar turbin. Berbeda dengan tenaga surya dan angin, panas bumi dapat menghasilkan listrik sepanjang waktu tanpa bergantung pada cuaca.</p><p>Meski demikian, pemanfaatannya masih jauh dari potensi. Biaya eksplorasi sangat tinggi dan berisiko: pengeboran sumur uji belum tentu menemukan cadangan yang cukup. Selain itu, banyak lokasi potensial berada di kawasan hutan lindung atau dekat permukiman, sehingga proyek kerap menghadapi penolakan warga yang khawatir terhadap dampak lingkungan dan sumber air. Para ahli menilai keterbukaan informasi dan pelibatan warga sejak awal menjadi kunci agar proyek dapat diterima.</p>`},
a1i5:{judul:'Data Pribadi dan Persetujuan', isi:`<p>Setiap kali mengunduh aplikasi, pengguna diminta menyetujui syarat dan ketentuan. Faktanya, hampir tidak ada yang membacanya. Dokumen itu umumnya panjang, penuh istilah hukum, dan ditampilkan saat pengguna ingin segera memakai aplikasi. Akibatnya, persetujuan yang diberikan lebih menyerupai formalitas daripada pilihan sadar.</p><p>Undang-undang pelindungan data pribadi mengatur bahwa persetujuan harus diberikan secara jelas dan untuk tujuan tertentu. Sebagian pakar menilai aturan itu belum cukup jika beban memahami tetap diletakkan pada pengguna. Mereka mengusulkan agar perusahaan menyajikan ringkasan satu halaman dengan bahasa sederhana, serta membiarkan fitur dasar aplikasi tetap dapat digunakan meski pengguna menolak pengumpulan data yang tidak diperlukan.</p>`},
a1e1:{judul:'The Placebo Effect', isi:`<p>A placebo is a treatment with no active ingredient, such as a sugar pill. Surprisingly, patients who receive placebos sometimes report real improvements, especially for symptoms like pain and nausea. This is known as the placebo effect, and it is the reason why new medicines are usually tested against a placebo rather than against no treatment at all.</p><p>Researchers believe the effect is linked to expectation: when people believe they are being treated, the brain may release natural chemicals that reduce pain. Interestingly, some studies found that placebos worked even when patients were told they were taking a placebo. However, scientists stress that placebos cannot shrink tumors or cure infections, and they should never replace proven treatments.</p>`},
a1e2:{judul:'Will Robots Take Our Jobs?', isi:`<p>Every major wave of technology has raised fears of mass unemployment. When machines entered factories, many workers lost their jobs, yet new types of work eventually appeared. Economists note that automation tends to replace specific tasks rather than entire occupations.</p><p>Today's artificial intelligence may be different, however, because it can perform cognitive tasks such as writing, translating, and analyzing data, not just physical ones. Some researchers argue that the key question is not whether jobs will disappear but how quickly workers can adapt. They recommend lifelong learning programs so that people can move into new roles, while warning that workers with fewer opportunities to retrain may be left behind.</p>`},
a1e3:{judul:'Rewilding', isi:`<p>Rewilding is an approach to conservation that aims to restore natural processes rather than manage every detail of an ecosystem. Instead of planting trees in neat rows, rewilding projects might remove dams, reintroduce missing animals, and then let nature take its course.</p><p>A famous example is the return of wolves to Yellowstone National Park in the United States. With wolves hunting them, deer stopped grazing in the same places for too long, which allowed young trees along rivers to grow again. Critics warn, however, that rewilding can create conflict with farmers, especially when predators attack livestock, and that results in one place cannot always be repeated elsewhere.</p>`}

{s:'pu',lv:5,t:'Analitik · Jadwal piket 6 orang',q:'Enam siswa (A, B, C, D, E, F) piket Senin–Sabtu, satu orang per hari. C piket hari Rabu. A piket sebelum B, dan di antara keduanya ada tepat dua hari. D piket sehari setelah E. F tidak piket hari Senin.<br>Siapa yang piket hari Sabtu?',o:['A','B','D','E','F'],a:2,b:'A dan B berjarak 3 hari: (Sen, Kam), (Sel, Jum), atau (Kam, Min-tidak ada). (Rab, Sab) tidak mungkin karena Rabu milik C. <br>• A=Sen, B=Kam: sisa Sel, Jum, Sab untuk D, E, F. E-D berurutan → (Jum, Sab). F = Sel. ✓<br>• A=Sel, B=Jum: sisa Sen, Kam, Sab. E-D berurutan tidak mungkin. ✗<br>Jadi E Jumat, D <b>Sabtu</b>.'},
{s:'pu',lv:5,t:'Analitik · Pasangan bersyarat',q:'Lima pelajar (P, Q, R, S, T) akan dipilih tiga orang untuk lomba. Jika P dipilih, Q juga dipilih. R dan S tidak boleh dipilih bersama. T pasti dipilih.<br>Jika R dipilih, maka tim yang mungkin adalah …',o:['P, R, T','Q, R, T','R, S, T','P, Q, R','P, Q, T'],a:1,b:'T pasti ada, R dipilih, jadi butuh satu orang lagi. S tidak boleh (bersama R). P tidak boleh tanpa Q, dan kalau P dan Q sama-sama masuk, jumlahnya jadi 4. Sisa pilihan: Q. Tim: <b>Q, R, T</b>.'},
{s:'pu',lv:5,t:'Deduktif · Evaluasi pernyataan',q:'Semua karyawan yang lembur mendapat uang makan. Sebagian karyawan bagian gudang lembur. Tidak ada karyawan bagian keuangan yang mendapat uang makan.<br>Pernyataan yang PASTI SALAH adalah …',o:['Sebagian karyawan gudang mendapat uang makan.','Ada karyawan keuangan yang lembur.','Tidak ada karyawan keuangan yang lembur.','Sebagian karyawan gudang tidak lembur.','Semua karyawan gudang mendapat uang makan.'],a:1,b:'Lembur → dapat uang makan. Karyawan keuangan tidak ada yang dapat uang makan, jadi tidak ada karyawan keuangan yang lembur. Pernyataan "<b>ada karyawan keuangan yang lembur</b>" pasti salah. Opsi lain benar atau mungkin benar.'},

{s:'pu',lv:5,t:'Deduktif · Kecukupan premis',q:'Pernyataan: "Semua peserta yang menang mendapat beasiswa." Agar dapat disimpulkan dengan pasti bahwa "Lina mendapat beasiswa", premis tambahan yang diperlukan adalah …',o:['Lina adalah peserta.','Lina menang.','Sebagian peserta menang.','Lina rajin belajar.','Beasiswa diberikan kepada semua peserta.'],a:1,b:'Pola "semua A adalah B" butuh fakta "Lina adalah A" (menang). Premis <b>Lina menang</b> sudah cukup. Opsi "beasiswa untuk semua peserta" juga mengarah ke sana, tetapi itu mengubah premis awal, bukan premis tambahan bagi Lina.'},
{s:'pu',lv:5,t:'Analitik · Posisi melingkar',q:'Enam orang (A, B, C, D, E, F) duduk mengelilingi meja bundar dengan jarak sama dan menghadap ke tengah. A berhadapan dengan D. B duduk tepat di sebelah kanan A. C duduk berhadapan dengan B.<br>Siapa yang duduk tepat di sebelah kanan D?',o:['B','C','E','F','Tidak dapat ditentukan'],a:1,b:'Beri nomor kursi 1–6 berurutan searah "kanan". A = 1, maka D = 4 (berhadapan). B di kanan A = kursi 2. Kursi di depan kursi 2 adalah kursi 5, jadi C = 5. Kanan D (kursi 4) adalah kursi 5, yaitu <b>C</b>. Kiri D (kursi 3) tidak bisa dipastikan, bisa E atau F.'},

{s:'ppu',lv:5,t:'Antonim',q:'Antonim kata <b>inklusif</b> adalah …',o:['terbuka','eksklusif','merata','beragam','ramah'],a:1,b:'Inklusif = melibatkan semua pihak. Lawannya <b>eksklusif</b> = terbatas untuk kalangan tertentu.'},
{s:'ppu',lv:5,t:'Analogi',q:'HIPOTESIS : PENELITIAN = RANCANGAN : …',o:['arsitek','bangunan','kertas','gambar','tukang'],a:1,b:'Hipotesis adalah dugaan awal yang diuji lewat penelitian; rancangan adalah gambaran awal yang diwujudkan menjadi <b>bangunan</b>. Hubungannya "rencana awal : hasil akhir".'},
{s:'ppu',lv:5,t:'Analogi',q:'VAKSIN : KEKEBALAN = PUPUK : …',o:['tanah','kesuburan','petani','sawah','air'],a:1,b:'Vaksin menghasilkan kekebalan; pupuk menghasilkan <b>kesuburan</b>. Hubungannya "pemberi : efek yang dihasilkan".'},
{s:'ppu',lv:5,t:'Makna istilah',q:'"Penurunan harga minyak berdampak <b>signifikan</b> terhadap penerimaan negara."<br>Kata bercetak tebal bermakna …',o:['kecil','berarti/cukup besar','negatif','langsung','sementara'],a:1,b:'Signifikan = <b>berarti, cukup besar sehingga diperhitungkan</b>.'},
{s:'ppu',lv:5,t:'Makna istilah',q:'Dalam teks ekonomi, istilah <b>resesi</b> berarti …',o:['kenaikan harga barang','penurunan kegiatan ekonomi yang berlangsung cukup lama','kelebihan produksi','penambahan lapangan kerja','pertumbuhan ekspor'],a:1,b:'Resesi = <b>kemunduran ekonomi</b> yang ditandai turunnya produksi, pendapatan, dan lapangan kerja dalam waktu cukup lama.'},
{s:'ppu',lv:5,t:'Makna kontekstual',q:'"Penjelasan dosen itu sangat <b>lugas</b> sehingga mudah dipahami."<br>Kata bercetak tebal paling dekat maknanya dengan …',o:['berbelit-belit','langsung dan apa adanya','panjang','puitis','ragu-ragu'],a:1,b:'Lugas = <b>langsung ke inti, tidak berbelit-belit</b>.'},
{s:'ppu',lv:5,t:'Hubungan antarkalimat',q:'"Produksi padi tahun ini melimpah. ___, harga gabah di tingkat petani justru anjlok."<br>Kata penghubung yang paling tepat adalah …',o:['Oleh karena itu','Ironisnya','Selain itu','Dengan kata lain','Misalnya'],a:1,b:'Hasil melimpah seharusnya menguntungkan petani, tetapi yang terjadi sebaliknya. Penghubung yang menandai kenyataan bertolak belakang dengan harapan: <b>Ironisnya</b>.'},
{s:'ppu',lv:5,t:'Kata baku',q:'Kalimat yang seluruh katanya baku adalah …',o:['Ia mengkoordinir kegiatan itu dengan baik.','Ia mengoordinasi kegiatan itu dengan baik.','Ia mengkordinasi kegiatan itu dengan baik.','Ia mengkoordinasikan kegiatan itu dengan baik.','Ia mengordinir kegiatan itu dengan baik.'],a:1,b:'Kata dasar "koordinasi" diberi me- menjadi <b>mengoordinasi(kan)</b>, karena huruf k luluh. "Mengkoordinir" tidak baku.'},
{s:'ppu',lv:5,t:'English vocabulary',q:'"The evidence was <b>insufficient</b> to support the claim."<br>The word in bold means …',o:['more than enough','not enough','clear','false','new'],a:1,b:'Insufficient = <b>not enough</b>, tidak cukup.'},
{s:'ppu',lv:5,t:'English vocabulary',q:'"The policy had several <b>unintended</b> consequences."<br>The word in bold is closest in meaning to …',o:['planned','not expected','positive','legal','immediate'],a:1,b:'Unintended = tidak dimaksudkan, <b>not expected</b>.'},
{s:'ppu',lv:5,t:'English vocabulary',q:'"Scientists remain <b>skeptical</b> about the new treatment."<br>The word in bold means …',o:['excited','doubtful','certain','angry','satisfied'],a:1,b:'Skeptical = ragu, <b>doubtful</b>.'},
{s:'ppu',lv:5,t:'Makna peribahasa',q:'Makna peribahasa "Bagai katak dalam tempurung" adalah …',o:['orang yang pandai menyembunyikan diri','orang yang wawasannya sempit karena tidak pernah melihat dunia luar','orang yang suka melompat-lompat','orang yang sabar','orang yang kaya raya'],a:1,b:'Katak di bawah tempurung mengira dunia hanya seluas tempurung: <b>berwawasan sempit</b>.'},
/* PBM (15) */
{s:'pbm',lv:5,t:'Kalimat efektif · Ambiguitas',q:'Kalimat berikut yang TIDAK bermakna ganda adalah …',o:['Istri dokter yang cantik itu datang.','Istri dokter yang cantik itu datang kemarin.','Istri sang dokter, yang cantik itu, datang kemarin.','Lukisan Rina sangat indah.','Ibu membeli dua kilogram daging sapi dan ayam.'],a:2,b:'"Istri dokter yang cantik" bisa berarti istrinya cantik atau dokternya cantik. Dengan koma pengapit, keterangan "yang cantik itu" jelas merujuk ke istri. "Lukisan Rina" bisa berarti dilukis Rina atau milik Rina; "daging sapi dan ayam" bisa ambigu jumlahnya.'},
{s:'pbm',lv:5,t:'Kalimat efektif · Logika',q:'Kalimat yang logis adalah …',o:['Penderita sakit gigi itu sudah sembuh tiga hari lalu dan masih sakit.','Karena tidak lulus ujian, ia diterima di universitas negeri.','Korban yang meninggal dunia itu dilarikan ke rumah sakit dan diobati.','Untuk mempersingkat waktu, acara kita mulai sekarang.','Hadirin yang kami hormati, acara segera dimulai.'],a:4,b:'Opsi lain mengandung pertentangan logika: sembuh tetapi masih sakit, tidak lulus tetapi diterima, korban meninggal diobati, waktu tidak dapat dipersingkat. Yang logis: <b>Hadirin yang kami hormati, acara segera dimulai.</b>'},
{s:'pbm',lv:5,t:'Ejaan · Kombinasi',q:'Kalimat yang penulisannya sepenuhnya sesuai EYD adalah …',o:['Menurut Kepala BMKG, cuaca ekstrem diperkirakan berlangsung hingga akhir bulan.','Menurut kepala BMKG cuaca ekstrim diperkirakan berlangsung hingga akhir bulan.','Menurut Kepala B.M.K.G., cuaca ekstrim diperkirakan berlangsung hingga akhir Bulan.','menurut Kepala BMKG, cuaca ekstrem diperkirakan berlangsung hingga akhir bulan.','Menurut Kepala BMKG cuaca ekstrem, diperkirakan berlangsung hingga akhir bulan.'],a:0,b:'Kapital pada jabatan diikuti nama lembaga, singkatan lembaga tanpa titik, koma setelah keterangan pembuka, dan kata baku <b>ekstrem</b> (bukan ekstrim).'},
{s:'pbm',lv:5,t:'Kalimat rumpang',q:'"Selama ini, keberhasilan sekolah sering diukur dari nilai ujian. ___ Kemampuan bekerja sama, berkomunikasi, dan memecahkan masalah juga menentukan keberhasilan siswa di masa depan."<br>Kalimat yang tepat untuk mengisi bagian rumpang adalah …',o:['Nilai ujian adalah satu-satunya ukuran yang adil.','Padahal, nilai ujian hanya menggambarkan sebagian kecil kemampuan siswa.','Karena itu, ujian harus diperbanyak.','Siswa tidak suka ujian.','Guru sering kesulitan membuat soal.'],a:1,b:'Kalimat sesudahnya menyebut kemampuan lain di luar nilai ujian. Jembatan yang tepat mengoreksi kalimat pertama: <b>Padahal, nilai ujian hanya menggambarkan sebagian kecil kemampuan siswa.</b>'},
{s:'pbm',lv:5,t:'Penyuntingan paragraf',q:'(1) Banyak kota di Indonesia mengalami penurunan muka tanah. (2) Penyebab utamanya adalah pengambilan air tanah secara berlebihan. (3) Ketika air tanah disedot, rongga di bawah permukaan memadat dan tanah turun. (4) Akibatnya, kawasan pesisir semakin rentan terhadap banjir rob. (5) Banjir rob sering terjadi saat bulan purnama.<br>Kalimat yang sebaiknya dihapus agar paragraf lebih padu adalah …',o:['(1)','(2)','(3)','(4)','(5)'],a:4,b:'Paragraf membahas penurunan muka tanah, penyebab, mekanisme, dan akibatnya. Kalimat <b>(5)</b> beralih ke waktu terjadinya rob, keluar dari alur sebab-akibat.'},
{s:'pbm',lv:5,t:'Kalimat efektif · Kesejajaran',q:'Kalimat yang strukturnya sejajar adalah …',o:['Program ini bertujuan meningkatkan literasi, pengembangan kreativitas, dan agar siswa mandiri.','Program ini bertujuan meningkatkan literasi, mengembangkan kreativitas, dan membentuk kemandirian siswa.','Program ini bertujuan peningkatan literasi, mengembangkan kreativitas, dan kemandirian.','Program ini bertujuan untuk literasi meningkat, kreativitas dikembangkan, dan mandiri.','Program ini bertujuan meningkatkan literasi, kreativitas berkembang, dan siswa mandiri.'],a:1,b:'Ketiga tujuan memakai pola sama, kata kerja me- + objek: <b>meningkatkan …, mengembangkan …, membentuk …</b>.'},
{s:'pbm',lv:5,t:'Diksi · Makna halus',q:'"Kebijakan baru itu ___ penolakan dari sejumlah serikat pekerja."<br>Kata yang paling tepat adalah …',o:['menuai','memanen','memetik','mengambil','menerima-terima'],a:0,b:'Kolokasi baku dalam bahasa berita: <b>menuai penolakan/kritik</b>.'},
{s:'pbm',lv:5,t:'Konjungsi · Hubungan makna',q:'"Ia rajin belajar ___ dapat lulus dengan nilai terbaik."<br>Konjungsi yang menyatakan hubungan tujuan adalah …',o:['sehingga','agar','karena','meskipun','sedangkan'],a:1,b:'Hubungan <b>tujuan</b> dinyatakan dengan "agar/supaya". "Sehingga" menyatakan akibat, "karena" menyatakan sebab.'},
{s:'pbm',lv:5,t:'Paragraf · Simpulan berimbang',q:'"Kenaikan cukai rokok terbukti menurunkan jumlah perokok di beberapa negara. Namun, di sejumlah daerah, kenaikan harga resmi justru mendorong peredaran rokok ilegal yang lebih murah. Selain itu, petani tembakau mengeluhkan menurunnya permintaan."<br>Simpulan yang paling tepat adalah …',o:['Cukai rokok harus dihapus.','Kenaikan cukai rokok efektif menekan perokok, tetapi perlu disertai pengawasan dan kebijakan bagi pihak terdampak.','Rokok ilegal lebih sehat.','Petani tembakau mendukung kenaikan cukai.','Jumlah perokok tidak berubah.'],a:1,b:'Paragraf memuat satu manfaat dan dua dampak samping. Simpulan yang seimbang mengakui manfaat sekaligus kebutuhan pengawasan dan perhatian pada pihak terdampak.'},
{s:'pbm',lv:5,t:'Ejaan · Tanda pisah',q:'Penggunaan tanda pisah (—) yang tepat terdapat pada kalimat …',o:['Kemerdekaan bangsa itu — saya yakin — akan tercapai.','Kami — membaca buku setiap pagi.','Jakarta — adalah ibu kota.','Ia membeli — buku, pena, dan tas.','Rapat — dimulai pukul sembilan.'],a:0,b:'Tanda pisah dipakai untuk mengapit keterangan sisipan di luar bangun kalimat utama: <b>Kemerdekaan bangsa itu — saya yakin — akan tercapai.</b>'},
{s:'pbm',lv:5,t:'Penalaran paragraf',q:'"Survei menunjukkan siswa yang sarapan memiliki nilai rata-rata lebih tinggi. Karena itu, sarapan pasti membuat siswa lebih pintar."<br>Kelemahan penalaran pada teks tersebut adalah …',o:['Data survei terlalu banyak.','Menyimpulkan hubungan sebab-akibat hanya dari adanya hubungan (korelasi).','Sarapan tidak sehat.','Nilai rata-rata tidak bisa dihitung.','Kalimatnya terlalu pendek.'],a:1,b:'Hubungan antara sarapan dan nilai belum membuktikan sarapan <i>menyebabkan</i> nilai tinggi. Bisa saja faktor lain (misalnya keluarga yang lebih memperhatikan anak) memengaruhi keduanya.'},
{s:'pbm',lv:5,t:'Kalimat efektif · Pilihan kata',q:'Kalimat yang efektif dan baku adalah …',o:['Kita harus saling bahu-membahu untuk membangun desa.','Kita harus bahu-membahu membangun desa.','Kita harus saling membahu-bahu untuk membangun desa.','Kita harus bahu-membahu saling untuk membangun desa.','Kita semua harus saling bahu-membahu bersama.'],a:1,b:'"Bahu-membahu" sudah bermakna saling, jadi "saling" dan "bersama" mubazir. Efektif: <b>Kita harus bahu-membahu membangun desa.</b>'},
{s:'pbm',lv:5,t:'Urutan paragraf',q:'(1) Namun, cara itu ternyata menimbulkan masalah baru. (2) Untuk mengusir hama, petani dulu menyemprotkan pestisida dalam jumlah besar. (3) Hama justru menjadi kebal, sementara serangga penyerbuk ikut mati. (4) Kini petani mulai beralih ke pengendalian hayati dengan memanfaatkan predator alami hama.<br>Urutan yang padu adalah …',o:['2-1-3-4','1-2-3-4','2-3-1-4','4-2-1-3','2-1-4-3'],a:0,b:'Cara lama (2) → "Namun" ada masalah (1) → rincian masalah (3) → solusi kini (4): <b>2-1-3-4</b>.'},
{s:'pbm',lv:5,t:'Kata rujukan',q:'"Pemerintah menyiapkan dua skema bantuan: subsidi tunai dan potongan tarif listrik. Skema <b>pertama</b> ditujukan untuk keluarga tanpa penghasilan tetap."<br>Frasa "skema pertama" merujuk pada …',o:['potongan tarif listrik','subsidi tunai','keluarga tanpa penghasilan','pemerintah','dua skema bantuan'],a:1,b:'Skema yang disebut pertama adalah <b>subsidi tunai</b>.'},
{s:'pbm',lv:5,t:'Ejaan · Kata depan & partikel',q:'Kalimat yang penulisannya tepat adalah …',o:['Sekalipun lelah, ia tetap datang ke rapat.','Sekali pun lelah, ia tetap datang ke rapat.','Sekalipun lelah ia tetap datang kerapat.','Sekali-pun lelah, ia tetap datang ke rapat.','Sekalipun lelah, ia tetap datang ke-rapat.'],a:0,b:'"Sekalipun" bermakna "meskipun" ditulis serangkai, koma setelah anak kalimat, dan "ke rapat" (kata depan) ditulis terpisah.'},
/* LBI (25) */
{s:'lbi',lv:5,p:'a1i1',t:'Definisi',q:'Berdasarkan teks, overtourism terjadi ketika …',o:['wisatawan asing lebih banyak dari wisatawan lokal','jumlah wisatawan melebihi daya dukung lingkungan dan sosial setempat','harga tiket wisata terlalu murah','destinasi wisata ditutup','penginapan terlalu sedikit'],a:1,b:'Teks mendefinisikannya secara langsung.'},
{s:'lbi',lv:5,p:'a1i1',t:'Inferensi',q:'Hubungan antara overtourism dan naiknya harga sewa rumah dalam teks adalah …',o:['wisatawan membeli semua rumah','banyak hunian dialihkan menjadi penginapan sehingga pasokan rumah untuk warga berkurang','pemerintah menaikkan pajak rumah','warga lokal pindah ke luar negeri','rumah dibangun di objek wisata'],a:1,b:'Teks menyebut hunian dialihkan menjadi penginapan. Inferensinya: rumah untuk warga berkurang, harga naik.'},
{s:'lbi',lv:5,p:'a1i1',t:'Perbandingan pandangan',q:'Perbedaan pandangan pelaku usaha kecil dan pegiat lingkungan terletak pada …',o:['mereka sepakat semua','pelaku usaha menekankan dampak ekonomi jangka pendek, pegiat lingkungan menekankan keberlanjutan jangka panjang','pegiat lingkungan ingin wisatawan lebih banyak','pelaku usaha ingin kuota diperketat','keduanya menolak pemesanan daring'],a:1,b:'Pelaku usaha khawatir pendapatan turun (jangka pendek); pegiat lingkungan menilai pembatasan menjaga destinasi dalam jangka panjang.'},
{s:'lbi',lv:5,p:'a1i1',t:'Solusi',q:'Jalan tengah yang diusulkan peneliti bertujuan …',o:['menutup destinasi populer','menyebarkan manfaat ekonomi tanpa membebani satu destinasi','menaikkan tarif setinggi-tingginya','melarang wisatawan asing','menambah penginapan di pusat kota'],a:1,b:'Menyebar kunjungan ke destinasi alternatif dan musim sepi agar manfaat tetap mengalir tanpa membebani satu titik.'},
{s:'lbi',lv:5,p:'a1i1',t:'Memperkuat',q:'Temuan berikut yang paling MEMPERKUAT usulan peneliti adalah …',o:['Destinasi populer selalu penuh sepanjang tahun.','Destinasi alternatif yang dipromosikan mengalami kenaikan pengunjung tanpa menurunkan pendapatan total daerah.','Wisatawan tidak suka destinasi baru.','Harga tiket pesawat naik.','Warga lokal menyukai wisatawan.'],a:1,b:'Bukti bahwa pengalihan ke destinasi lain tidak mengurangi pendapatan total langsung mendukung usulan "manfaat tetap mengalir tanpa membebani satu titik".'},
{s:'lbi',lv:5,p:'a1i2',t:'Masalah',q:'Menurut teks, risiko kebijakan pangan yang bertumpu pada beras adalah …',o:['beras menjadi terlalu murah','pasokan rentan saat panen gagal atau harga beras naik','petani beralih ke sagu','sawah terlalu luas','impor sagu meningkat'],a:1,b:'Ketergantungan pada satu komoditas membuat pasokan rentan.'},
{s:'lbi',lv:5,p:'a1i2',t:'Detail',q:'Keunggulan sagu yang disebut dalam teks adalah, KECUALI …',o:['tumbuh alami di lahan rawa','tidak memerlukan pupuk','satu batang menghasilkan ratusan kilogram pati','dapat dipanen setiap minggu','alternatif bagi beras'],a:3,b:'Teks tidak menyebut sagu <b>dapat dipanen setiap minggu</b>.'},
{s:'lbi',lv:5,p:'a1i2',t:'Kendala',q:'Kendala pengembangan sagu menurut teks terletak pada …',o:['lahan yang tidak tersedia','citra sebagai makanan kelas dua dan produk olahan yang belum beragam','harga pupuk','kurangnya hujan','larangan pemerintah'],a:1,b:'Teks: kendalanya ada pada citra dan pengolahan.'},
{s:'lbi',lv:5,p:'a1i2',t:'Makna istilah',q:'Istilah <b>diversifikasi pangan</b> dalam teks bermakna …',o:['menghentikan konsumsi beras','menganekaragamkan sumber makanan pokok','mengimpor pangan','menanam padi di rawa','menaikkan harga sagu'],a:1,b:'Diversifikasi = <b>penganekaragaman</b>: tidak bergantung pada satu jenis pangan.'},
{s:'lbi',lv:5,p:'a1i2',t:'Simpulan',q:'Pendapat peneliti pangan dalam teks dapat disimpulkan sebagai …',o:['imbauan saja sudah cukup','diversifikasi memerlukan inovasi produk dan perubahan kebijakan pengadaan','sagu tidak layak dikembangkan','beras harus dilarang','masyarakat harus kembali ke sawah'],a:1,b:'Mereka menilai imbauan saja tidak cukup; perlu inovasi produk dan kebijakan pengadaan.'},
{s:'lbi',lv:5,p:'a1i3',t:'Pola hoaks',q:'Ciri hoaks kesehatan yang disebut dalam teks adalah, KECUALI …',o:['judul memancing emosi','klaim dokter terkenal tanpa nama jelas','ajakan segera menyebarkan','mencantumkan tautan jurnal ilmiah yang dapat dicek','dikirim berantai'],a:3,b:'Mencantumkan jurnal yang bisa dicek justru ciri informasi tepercaya, dan tidak disebut sebagai ciri hoaks.'},
{s:'lbi',lv:5,p:'a1i3',t:'Inferensi',q:'Mengapa peneliti menyarankan klarifikasi tidak disampaikan dengan nada menyalahkan?',o:['karena penyebar hoaks berniat jahat','karena penyebar umumnya berniat baik, sehingga nada menyalahkan dapat membuat mereka menolak koreksi','karena hoaks tidak berbahaya','karena lembaga resmi melarangnya','karena keluarga tidak membaca pesan'],a:1,b:'Penyebar umumnya peduli dan ingin melindungi. Nada menyalahkan bisa membuat mereka defensif.'},
{s:'lbi',lv:5,p:'a1i3',t:'Detail penting',q:'Temuan yang menarik tentang siapa yang paling dipercaya saat mengoreksi hoaks adalah …',o:['lembaga resmi','anggota keluarga sendiri','dokter terkenal','pembawa berita','orang asing di media sosial'],a:1,b:'Kalimat terakhir: koreksi dari <b>anggota keluarga sendiri</b> lebih dipercaya.'},
{s:'lbi',lv:5,p:'a1i3',t:'Penerapan',q:'Berdasarkan saran dalam teks, tanggapan paling efektif untuk pesan hoaks dari seorang paman di grup keluarga adalah …',o:['"Om, ini hoaks! Jangan asal sebar!"','"Terima kasih sudah peduli, Om. Aku cek di situs Kementerian Kesehatan, ternyata ada penjelasan berbeda, ini tautannya."','Mengeluarkan paman dari grup.','Mendiamkan saja.','Melaporkan ke polisi.'],a:1,b:'Sesuai saran: hargai niat baik, lalu berikan sumber tepercaya sebagai pembanding, dan datang dari keluarga sendiri.'},
{s:'lbi',lv:5,p:'a1i3',t:'Tujuan penulis',q:'Tujuan utama teks tersebut adalah …',o:['menyalahkan penyebar hoaks','menjelaskan pola penyebaran hoaks kesehatan dan cara menanggapinya secara efektif','mempromosikan grup percakapan','menolak lembaga resmi','menjelaskan cara membuat hoaks'],a:1,b:'Paragraf 1 menjelaskan pola, paragraf 2 menjelaskan pendekatan klarifikasi yang efektif.'},
{s:'lbi',lv:5,p:'a1i4',t:'Keunggulan',q:'Keunggulan panas bumi dibandingkan tenaga surya dan angin menurut teks adalah …',o:['lebih murah dibangun','dapat menghasilkan listrik sepanjang waktu tanpa bergantung pada cuaca','tidak memerlukan turbin','tidak ada risiko eksplorasi','bisa dibangun di mana saja'],a:1,b:'Teks menyebut panas bumi bisa beroperasi sepanjang waktu tanpa bergantung cuaca.'},
{s:'lbi',lv:5,p:'a1i4',t:'Kendala',q:'Mengapa eksplorasi panas bumi disebut berisiko?',o:['karena bisa menyebabkan gempa besar','karena pengeboran sumur uji belum tentu menemukan cadangan yang cukup','karena uap terlalu panas','karena turbin mudah rusak','karena listriknya terlalu mahal dijual'],a:1,b:'Teks: pengeboran sumur uji belum tentu menemukan cadangan cukup, padahal biayanya tinggi.'},
{s:'lbi',lv:5,p:'a1i4',t:'Hubungan sebab-akibat',q:'Penolakan warga terhadap proyek panas bumi terutama disebabkan oleh …',o:['harga listrik yang naik','kekhawatiran terhadap dampak lingkungan dan sumber air','kurangnya lapangan kerja','proyek terlalu kecil','listriknya tidak cukup'],a:1,b:'Teks menyebut kekhawatiran warga terhadap dampak lingkungan dan sumber air.'},

a2i1:{judul:'Paradoks Pilihan', isi:`<p>Kita sering beranggapan bahwa semakin banyak pilihan, semakin bahagia kita. Namun, sejumlah penelitian psikologi menunjukkan hal yang berlawanan. Dalam sebuah percobaan, pengunjung toko yang disuguhi enam varian selai lebih mungkin membeli dibandingkan pengunjung yang disuguhi 24 varian, meskipun meja dengan 24 varian menarik lebih banyak orang untuk mampir.</p><p>Para peneliti menyebut gejala ini paradoks pilihan: terlalu banyak alternatif membuat orang ragu, menunda keputusan, dan setelah memilih pun cenderung menyesal karena membayangkan pilihan lain yang mungkin lebih baik. Meski begitu, penelitian lanjutan menunjukkan efeknya tidak selalu muncul. Ketika seseorang sudah tahu persis apa yang diinginkan, atau ketika pilihan disusun dalam kategori yang jelas, jumlah pilihan yang banyak tidak lagi membebani.</p>`},
a2i2:{judul:'Desa yang Ditinggalkan, Kota yang Sesak', isi:`<p>Arus urbanisasi kerap dijelaskan dengan dua kata: daya tarik kota dan daya dorong desa. Kota menjanjikan upah lebih tinggi dan layanan yang lebih lengkap, sementara desa dianggap minim lapangan kerja. Penjelasan ini benar, tetapi tidak lengkap.</p><p>Studi terbaru menunjukkan bahwa keputusan merantau sering kali bukan keputusan individu, melainkan strategi keluarga. Satu anggota keluarga merantau dan mengirim uang ke kampung, sementara anggota lain tetap mengelola lahan. Dengan cara ini, keluarga menyebar risiko: jika panen gagal, kiriman uang dari kota menjadi penyangga. Implikasinya, kebijakan yang hanya berupaya "menahan" orang di desa dengan membangun infrastruktur bisa kurang efektif bila tidak menyentuh kebutuhan keluarga akan pendapatan yang stabil dan beragam.</p>`},
a2i3:{judul:'Harga untuk Karbon', isi:`<p>Pajak karbon adalah pungutan atas setiap ton emisi karbon dioksida yang dihasilkan. Logikanya sederhana: jika polusi diberi harga, pelaku usaha terdorong mencari cara produksi yang lebih bersih. Para ekonom menyukai instrumen ini karena pasar sendiri yang menentukan cara paling murah untuk mengurangi emisi, alih-alih pemerintah mengatur setiap teknologi.</p><p>Tantangannya terletak pada keadilan. Pajak karbon dapat menaikkan harga energi dan barang kebutuhan, yang dampaknya terasa lebih berat bagi rumah tangga berpenghasilan rendah karena porsi pengeluaran mereka untuk energi lebih besar. Beberapa negara mengatasinya dengan mengembalikan penerimaan pajak kepada masyarakat dalam bentuk transfer tunai. Di sisi lain, jika tarif pajak ditetapkan terlalu rendah, insentif untuk beralih ke energi bersih menjadi lemah, sehingga kebijakan itu hanya menjadi sumber penerimaan negara.</p>`},
a2i4:{judul:'Bahasa yang Terus Bergerak', isi:`<p>Setiap generasi melahirkan kosakata baru, dan setiap generasi pula ada yang mengeluhkan "rusaknya" bahasa. Kata-kata gaul yang lahir di media sosial dianggap merusak bahasa Indonesia yang baik dan benar. Kekhawatiran itu dapat dipahami, tetapi para linguis mengingatkan bahwa perubahan bahasa adalah hal alamiah.</p><p>Banyak kata yang kini baku dulunya dianggap tidak resmi atau pinjaman asing. Yang lebih penting daripada menolak kata baru, menurut mereka, adalah kemampuan berganti ragam bahasa sesuai situasi. Seseorang yang fasih berbahasa gaul dengan teman, tetapi mampu menulis surat lamaran dengan bahasa baku, justru menunjukkan kecakapan berbahasa yang tinggi. Masalah baru muncul jika penutur hanya menguasai satu ragam dan tidak mampu menyesuaikan diri dengan konteks formal.</p>`},
a2i5:{judul:'Bangunan yang Tahan Gempa', isi:`<p>Gempa bumi jarang membunuh secara langsung. Yang paling banyak menelan korban adalah bangunan yang runtuh. Karena itu, para ahli kegempaan sering mengatakan bahwa yang berbahaya bukan gempanya, melainkan bangunannya.</p><p>Bangunan tahan gempa tidak harus mahal. Prinsip utamanya adalah sambungan yang kuat antara fondasi, kolom, balok, dan atap, sehingga bangunan bergerak sebagai satu kesatuan saat diguncang. Banyak rumah tembok runtuh bukan karena bahannya lemah, tetapi karena tulangan besi tidak terhubung dengan benar. Ironisnya, sebagian rumah tradisional berbahan kayu justru lebih tahan karena strukturnya lentur. Pemerintah telah menerbitkan pedoman rumah tahan gempa, tetapi penerapannya di lapangan masih rendah karena pengawasan pembangunan rumah pribadi nyaris tidak ada.</p>`},
a2i6:{judul:'Belajar dari Kegagalan', isi:`<p>Di banyak sekolah, kesalahan diperlakukan sebagai sesuatu yang harus dihindari: jawaban salah mengurangi nilai, dan siswa yang salah di depan kelas kerap menjadi bahan tertawaan. Akibatnya, siswa cenderung memilih tugas yang aman dan enggan mencoba hal yang menantang.</p><p>Penelitian tentang belajar justru menunjukkan bahwa kesalahan, jika diikuti umpan balik yang tepat, memperkuat ingatan. Ketika seseorang menebak lalu mengetahui jawaban yang benar, ia cenderung mengingat jawaban itu lebih baik daripada jika langsung diberi tahu. Namun, manfaat ini hilang jika kesalahan tidak pernah dikoreksi atau jika siswa terlalu cemas untuk memperhatikan umpan balik. Karena itu, yang perlu diubah bukan sekadar sikap terhadap kesalahan, melainkan juga cara guru memberikan umpan balik.</p>`},
a2e1:{judul:'Confirmation Bias', isi:`<p>Confirmation bias is the tendency to search for, interpret, and remember information in a way that supports what we already believe. A person who thinks a certain diet works will notice success stories and ignore failures. This bias is not a sign of low intelligence; in fact, highly educated people can be especially skilled at finding arguments for their existing views.</p><p>Researchers suggest a few strategies to reduce its effect. One is to actively look for evidence that could prove you wrong. Another is to discuss ideas with people who disagree with you. However, simply knowing that the bias exists does not seem to be enough; people tend to recognize it in others far more easily than in themselves.</p>`},
a2e2:{judul:'Mining the Deep Sea', isi:`<p>On the deep ocean floor lie potato-sized rocks called nodules, which contain metals such as nickel, cobalt, and manganese. These metals are essential for electric-vehicle batteries, and some companies argue that mining the seabed would cause less harm than mining on land, where forests must be cleared and communities displaced.</p><p>Scientists, however, warn that we know very little about deep-sea ecosystems. Many species living there have not even been described, and the nodules themselves take millions of years to form. Mining machines would stir up clouds of sediment that could spread for kilometers. Several countries have called for a pause until more research is done, while others want to move forward to secure the metals needed for clean energy.</p>`},
a2e3:{judul:'The Value of Boredom', isi:`<p>In an age of constant entertainment, boredom has become rare. Whenever we have a free moment, we reach for our phones. Yet some psychologists argue that boredom is not simply an unpleasant state to be avoided; it may serve a purpose.</p><p>Boredom signals that our current activity is not satisfying, pushing us to look for something more meaningful. In one study, participants who first completed a dull task, such as copying phone numbers, later came up with more creative ideas than those who had not been bored. Still, researchers caution that chronic boredom is different: when people feel bored most of the time, it is linked to stress and poor well-being rather than creativity.</p>`},
a2e4:{judul:'When Antibiotics Stop Working', isi:`<p>Antibiotics have saved millions of lives, but their effectiveness is declining. Every time antibiotics are used, bacteria that happen to resist the drug survive and multiply. Over time, these resistant bacteria become more common, making infections harder to treat.</p><p>Misuse speeds up this process. Antibiotics are often taken for viral infections such as the common cold, against which they have no effect. Patients also stop taking the medicine as soon as they feel better, allowing the toughest bacteria to survive. Experts warn that without new drugs and better habits, simple surgeries could once again become dangerous. Developing new antibiotics, however, is expensive and offers drug companies little profit, since the medicines are meant to be used sparingly.</p>`}
});

{s:'pu',lv:6,t:'Deduktif · Negasi berkuantor',q:'Negasi dari "Ada siswa yang tidak mengerjakan tugas dan tidak membawa buku" adalah …',o:['Semua siswa mengerjakan tugas dan membawa buku.','Semua siswa mengerjakan tugas atau membawa buku.','Ada siswa yang mengerjakan tugas atau membawa buku.','Tidak ada siswa yang mengerjakan tugas.','Semua siswa tidak mengerjakan tugas atau tidak membawa buku.'],a:1,b:'Negasi "ada x yang (¬p ∧ ¬q)" adalah "semua x memenuhi ¬(¬p ∧ ¬q)" = "semua x (p ∨ q)". Jadi: <b>semua siswa mengerjakan tugas atau membawa buku</b>.'},
{s:'pu',lv:6,t:'Deduktif · Kesetaraan disjungsi',q:'Pernyataan "Rina tidak datang atau rapat ditunda" setara dengan …',o:['Jika Rina datang, rapat ditunda.','Jika rapat ditunda, Rina tidak datang.','Jika Rina tidak datang, rapat ditunda.','Rina datang dan rapat tidak ditunda.','Jika rapat tidak ditunda, Rina datang.'],a:0,b:'¬p ∨ q setara dengan p → q. Di sini p = "Rina datang", q = "rapat ditunda". Jadi: <b>jika Rina datang, rapat ditunda</b>.'},
{s:'pu',lv:6,t:'Analitik · Penugasan',q:'Empat guru (Ali, Bima, Citra, Dewi) masing-masing mengajar satu mata pelajaran berbeda: Biologi, Kimia, Fisika, Matematika. Ali tidak mengajar sains (Biologi, Kimia, Fisika). Bima tidak mengajar Kimia maupun Fisika. Citra tidak mengajar Fisika.<br>Dewi mengajar …',o:['Biologi','Kimia','Fisika','Matematika','Tidak dapat ditentukan'],a:2,b:'Ali bukan sains → Ali Matematika. Bima bukan Kimia/Fisika (dan Matematika sudah diambil) → Bima Biologi. Citra bukan Fisika → Citra Kimia. Sisa untuk Dewi: <b>Fisika</b>.'},
{s:'pu',lv:6,t:'Analitik · Kombinasi syarat',q:'Panitia memilih 3 dari 6 kandidat (K, L, M, N, O, P). Jika K dipilih, L tidak dipilih. M dipilih hanya jika N dipilih. O dan P tidak boleh dipilih bersama.<br>Susunan panitia yang MEMENUHI semua syarat adalah …',o:['K, L, O','K, M, P','M, N, O','M, O, P','K, M, N, L'],a:2,b:'Cek satu per satu: (K, L, O) melanggar syarat K-L. (K, M, P) melanggar karena M butuh N. (M, O, P) melanggar karena M tanpa N dan O-P bersama. Opsi terakhir berisi 4 orang. <b>M, N, O</b> memenuhi semua syarat.'},
{s:'pu',lv:6,t:'Deduktif · Penarikan simpulan',q:'Setiap kota yang memiliki pelabuhan besar menjadi pusat perdagangan. Tidak ada pusat perdagangan yang sepi penduduk. Kota X sepi penduduk.<br>Simpulan yang tepat adalah …',o:['Kota X memiliki pelabuhan besar.','Kota X bukan pusat perdagangan dan tidak memiliki pelabuhan besar.','Kota X pusat perdagangan.','Kota X mungkin memiliki pelabuhan besar.','Semua kota sepi tidak memiliki pelabuhan.'],a:1,b:'X sepi → bukan pusat perdagangan (premis 2). Bukan pusat perdagangan → tidak memiliki pelabuhan besar (kontraposisi premis 1). Simpulan: <b>X bukan pusat perdagangan dan tidak memiliki pelabuhan besar</b>. Opsi "semua kota sepi…" benar menurut premis, tetapi menyebut "pelabuhan" (bukan "pelabuhan besar"), sehingga terlalu luas.'},
{s:'pu',lv:6,t:'Analitik · Urutan bersyarat',q:'Lima pelari (P, Q, R, S, T) finis berurutan tanpa seri. Q finis tepat sebelum T. P finis lebih awal dari S tetapi lebih lambat dari R. T tidak finis terakhir. R tidak finis pertama.<br>Siapa yang finis pertama?',o:['P','Q','R','S','T'],a:1,b:'Urutan R &lt; P &lt; S dan Q tepat sebelum T. Karena R bukan pertama, yang pertama harus Q (T selalu tepat setelah Q, jadi T bukan pertama). Maka Q = 1, T = 2, lalu R, P, S. T tidak terakhir ✓. Pertama: <b>Q</b>.'},
{s:'pu',lv:6,t:'Deduktif · Pernyataan yang tidak dapat disimpulkan',q:'Semua mahasiswa kedokteran pernah praktik di laboratorium. Sebagian yang pernah praktik di laboratorium adalah mahasiswa farmasi. Tidak ada mahasiswa farmasi yang mengambil kelas seni.<br>Pernyataan yang TIDAK DAPAT dipastikan kebenarannya adalah …',o:['Sebagian yang pernah praktik di laboratorium tidak mengambil kelas seni.','Ada mahasiswa kedokteran yang mengambil kelas seni.','Semua mahasiswa kedokteran pernah praktik di laboratorium.','Tidak ada mahasiswa farmasi yang mengambil kelas seni.','Sebagian yang pernah praktik di laboratorium adalah mahasiswa farmasi.'],a:1,b:'Premis tidak menyebut hubungan mahasiswa kedokteran dengan kelas seni, jadi <b>"ada mahasiswa kedokteran yang mengambil kelas seni"</b> tidak dapat dipastikan. Opsi pertama pasti benar (yang farmasi tidak ambil seni); opsi lain adalah premis itu sendiri.'},
{s:'pu',lv:6,t:'Analitik · Lantai gedung',q:'Lima kantor (A, B, C, D, E) menempati lantai 1–5 sebuah gedung, satu kantor per lantai. Kantor C berada tepat di atas kantor A. Kantor E berada di lantai lebih tinggi daripada kantor B. Kantor D berada di lantai 2. Kantor A tidak berada di lantai 1. Kantor E tidak berada di lantai teratas.<br>Kantor yang berada di lantai 5 adalah …',o:['A','B','C','D','E'],a:2,b:'D = 2. A bukan lantai 1, dan C tepat di atas A, jadi (A, C) = (3, 4) atau (4, 5). Kalau (3, 4), sisa lantai 1 dan 5: B = 1, E = 5, padahal E tidak boleh di lantai teratas. Jadi (A, C) = (4, 5), lalu B = 1, E = 3. Lantai 5: <b>C</b>.'},
{s:'pu',lv:6,t:'Deduktif · Silogisme hipotetis',q:'Jika seseorang rajin membaca, wawasannya luas. Jika wawasannya luas, ia mudah beradaptasi. Ternyata Ardi tidak mudah beradaptasi.<br>Simpulan yang paling tepat adalah …',o:['Ardi rajin membaca.','Wawasan Ardi luas.','Ardi tidak rajin membaca.','Ardi mudah beradaptasi.','Ardi mungkin rajin membaca.'],a:2,b:'Silogisme: rajin membaca → mudah beradaptasi. Modus tollens: tidak mudah beradaptasi → <b>tidak rajin membaca</b>.'},
{s:'pu',lv:6,t:'Analitik · Kode rahasia',q:'Sebuah kode terdiri atas tiga angka berbeda dari 1–9. Angka pertama genap. Angka kedua adalah jumlah angka pertama dan ketiga. Angka ketiga adalah 3.<br>Banyak kode yang mungkin adalah …',o:['1','2','3','4','5'],a:2,b:'Angka ketiga 3. Angka pertama genap dan angka kedua = pertama + 3 harus ≤ 9 dan berbeda: pertama 2 → kedua 5 ✓; 4 → 7 ✓; 6 → 9 ✓; 8 → 11 ✗. Ada <b>3</b> kode: 253, 473, 693.'},
/* PPU (20) */
{s:'ppu',lv:6,t:'Sinonim',q:'Sinonim kata <b>apatis</b> adalah …',o:['bersemangat','acuh tak acuh','peduli','marah','cemas'],a:1,b:'Apatis = tidak peduli, <b>acuh tak acuh</b>.'},
{s:'ppu',lv:6,t:'Sinonim',q:'Sinonim kata <b>dikotomi</b> adalah …',o:['penyatuan','pembagian atas dua kelompok yang bertentangan','perdamaian','penggandaan','pengulangan'],a:1,b:'Dikotomi = <b>pembagian atas dua kelompok yang saling bertentangan</b>, misalnya "kota vs desa".'},
{s:'ppu',lv:6,t:'Antonim',q:'Antonim kata <b>sentralisasi</b> adalah …',o:['pemusatan','desentralisasi','normalisasi','sosialisasi','konsolidasi'],a:1,b:'Sentralisasi = pemusatan wewenang. Lawannya <b>desentralisasi</b> = penyebaran wewenang ke daerah.'},
{s:'ppu',lv:6,t:'Antonim',q:'Antonim kata <b>implisit</b> adalah …',o:['tersirat','samar','eksplisit','rumit','tersembunyi'],a:2,b:'Implisit = tersirat. Lawannya <b>eksplisit</b> = tersurat.'},
{s:'ppu',lv:6,t:'Analogi',q:'PRAJURIT : PELETON = PEMAIN : …',o:['pelatih','tim','stadion','bola','penonton'],a:1,b:'Prajurit adalah anggota peleton; pemain adalah anggota <b>tim</b>. Hubungannya "anggota : kelompok".'},
{s:'ppu',lv:6,t:'Analogi',q:'KATALIS : REAKSI = INSENTIF : …',o:['uang','motivasi/tindakan','kimia','perusahaan','pajak'],a:1,b:'Katalis mempercepat reaksi; insentif mendorong <b>tindakan/motivasi</b>. Hubungannya "pemicu : hal yang dipercepat".'},
{s:'ppu',lv:6,t:'Makna istilah',q:'"Argumen penulis bersifat <b>retoris</b>."<br>Kata bercetak tebal dalam konteks ini paling mungkin bermakna …',o:['berdasarkan data statistik','mengandalkan gaya bahasa untuk membujuk, bukan bukti kuat','sangat ilmiah','bertele-tele tanpa maksud','tidak memihak'],a:1,b:'Retoris (dalam kritik argumen) = <b>lebih mengandalkan kepiawaian bahasa untuk meyakinkan</b> daripada bukti.'},
{s:'ppu',lv:6,t:'Makna istilah',q:'Dalam ilmu sosial, istilah <b>stratifikasi</b> berarti …',o:['perpindahan penduduk','pelapisan masyarakat berdasarkan kedudukan','perubahan budaya','penyatuan suku','pembangunan desa'],a:1,b:'Stratifikasi sosial = <b>pelapisan masyarakat</b> berdasarkan kekayaan, pendidikan, kekuasaan, dan sebagainya.'},
{s:'ppu',lv:6,t:'Makna kontekstual',q:'"Laporan itu hanya <b>menyentuh permukaan</b> persoalan."<br>Makna ungkapan bercetak tebal adalah …',o:['membahas secara mendalam','membahas secara dangkal','menyentuh benda fisik','menyelesaikan persoalan','mengabaikan persoalan sama sekali'],a:1,b:'Menyentuh permukaan = <b>membahas secara dangkal</b>, tidak sampai ke akar masalah.'},
{s:'ppu',lv:6,t:'Hubungan kata',q:'Kata yang TIDAK memiliki hubungan sejenis dengan kata lainnya adalah …',o:['inflasi','deflasi','resesi','stagflasi','fotosintesis'],a:4,b:'Inflasi, deflasi, resesi, dan stagflasi adalah istilah ekonomi. <b>Fotosintesis</b> istilah biologi.'},
{s:'ppu',lv:6,t:'Kata baku',q:'Kalimat yang menggunakan kata baku seluruhnya adalah …',o:['Kami mempunyai sertifikat dan ijazah asli.','Kami mempunyai sertipikat dan ijasah asli.','Kami mempunyai sertifikat dan ijasah asli.','Kami mempunyai sertipikat dan ijazah asli.','Kami mempunyai sertefikat dan ijazah asli.'],a:0,b:'Bentuk baku: <b>sertifikat</b> dan <b>ijazah</b>.'},
{s:'ppu',lv:6,t:'Konjungsi',q:'"Ia bukan tidak mampu, ___ tidak mau berusaha."<br>Kata penghubung yang tepat adalah …',o:['tetapi','melainkan','sedangkan','sehingga','padahal'],a:1,b:'Pola "bukan …, <b>melainkan</b> …" dipakai untuk mengoreksi/mengganti pernyataan sebelumnya.'},
{s:'ppu',lv:6,t:'Peribahasa',q:'Peribahasa yang maknanya paling dekat dengan "usaha yang sia-sia" adalah …',o:['Bagai menegakkan benang basah','Ada udang di balik batu','Bersatu kita teguh','Di mana bumi dipijak, di situ langit dijunjung','Tak ada gading yang tak retak'],a:0,b:'Menegakkan benang basah = <b>pekerjaan yang mustahil berhasil</b>, sia-sia.'},
{s:'ppu',lv:6,t:'English vocabulary',q:'"The minister\'s statement was deliberately <b>vague</b>."<br>The word in bold is closest in meaning to …',o:['clear','unclear','long','angry','honest'],a:1,b:'Vague = samar, <b>unclear</b>.'},
{s:'ppu',lv:6,t:'English vocabulary',q:'"The two theories are not <b>mutually exclusive</b>."<br>This phrase means the theories …',o:['cannot both be true','can both be true at the same time','are identical','are both wrong','are very old'],a:1,b:'Not mutually exclusive = tidak saling meniadakan; <b>keduanya bisa benar sekaligus</b>.'},
{s:'ppu',lv:6,t:'English vocabulary',q:'"Her argument was <b>compelling</b>, and most of the audience agreed."<br>The word in bold means …',o:['boring','convincing','confusing','short','rude'],a:1,b:'Compelling = sangat meyakinkan, <b>convincing</b>.'},
{s:'ppu',lv:6,t:'English vocabulary',q:'"The new policy will <b>exacerbate</b> the housing shortage."<br>The word in bold is closest in meaning to …',o:['solve','worsen','measure','ignore','explain'],a:1,b:'Exacerbate = memperparah, <b>worsen</b>.'},
{s:'ppu',lv:6,t:'Makna afiks',q:'Kata <b>perekonomian</b> bermakna …',o:['orang yang ahli ekonomi','hal-hal yang berkaitan dengan ekonomi secara keseluruhan','tindakan berhemat','ilmu tentang uang','tempat jual beli'],a:1,b:'Per-an pada kata ini bermakna <b>hal-hal yang berkaitan dengan</b> (ekonomi secara keseluruhan). Ahli ekonomi disebut ekonom.'},
{s:'ppu',lv:6,t:'Kalimat efektif',q:'Kalimat yang paling efektif adalah …',o:['Hasil daripada penelitian tersebut menunjukkan bahwa adanya peningkatan.','Hasil penelitian tersebut menunjukkan adanya peningkatan.','Hasil penelitian tersebut menunjukkan bahwa adanya suatu peningkatan.','Daripada hasil penelitian itu menunjukkan peningkatan.','Hasil penelitian tersebut adalah merupakan peningkatan.'],a:1,b:'"Daripada" salah tempat, "bahwa adanya" mubazir, "adalah merupakan" ganda. Efektif: <b>Hasil penelitian tersebut menunjukkan adanya peningkatan.</b>'},
{s:'ppu',lv:6,t:'Makna denotatif',q:'Kata "tangan" yang bermakna denotatif terdapat pada kalimat …',o:['Ia menjadi tangan kanan direktur.','Pencuri itu akhirnya jatuh ke tangan polisi.','Tangan kirinya terluka saat memasak.','Perusahaan itu berpindah tangan.','Ia ringan tangan membantu tetangga.'],a:2,b:'Hanya pada kalimat itu "tangan" bermakna sebenarnya, yaitu <b>anggota tubuh</b>. Kalimat lain memakai makna kiasan.'},
/* PBM (20) */
{s:'pbm',lv:6,t:'Penyuntingan · Kalimat efektif',q:'"Bagi siswa-siswa yang belum melunasi biaya kegiatan diharapkan untuk segera menghubungi bendahara."<br>Perbaikan kalimat yang paling tepat adalah …',o:['Bagi siswa yang belum melunasi biaya kegiatan diharapkan segera menghubungi bendahara.','Siswa yang belum melunasi biaya kegiatan diharapkan segera menghubungi bendahara.','Siswa-siswa yang belum melunasi biaya kegiatan diharapkan untuk segera menghubungi bendahara.','Bagi para siswa yang belum melunasi diharapkan segera menghubungi bendahara.','Kepada siswa yang belum melunasi biaya kegiatan segera menghubungi bendahara.'],a:1,b:'Hapus "bagi" agar ada subjek, hapus bentuk ulang yang tidak perlu, dan hapus "untuk" yang mubazir.'},
{s:'pbm',lv:6,t:'Ambiguitas',q:'"Mahasiswa yang baru mengikuti seminar dan lokakarya diwajibkan menulis laporan."<br>Kalimat tersebut bermakna ganda: "baru" bisa berarti mahasiswa angkatan baru, bisa juga berarti baru saja selesai mengikuti. Perbaikan yang menegaskan makna <b>baru saja selesai mengikuti</b> adalah …',o:['Mahasiswa baru yang mengikuti seminar dan lokakarya diwajibkan menulis laporan.','Mahasiswa yang baru, mengikuti seminar dan lokakarya, diwajibkan menulis laporan.','Mahasiswa yang baru saja mengikuti seminar dan lokakarya diwajibkan menulis laporan.','Mahasiswa angkatan baru diwajibkan menulis laporan seminar dan lokakarya.','Mahasiswa yang mengikuti seminar dan lokakarya baru diwajibkan menulis laporan.'],a:2,b:'Kata <b>saja</b> menegaskan makna waktu ("baru saja mengikuti"). Opsi "mahasiswa baru" dan "angkatan baru" justru menegaskan makna yang lain, dan opsi terakhir mengubah maksud kalimat.'},
{s:'pbm',lv:6,t:'Ejaan · Komprehensif',q:'Kalimat yang penulisannya sepenuhnya benar adalah …',o:['Pada abad ke-21, teknologi informasi berkembang pesat di seluruh Asia-Tenggara.','Pada abad ke-21, teknologi informasi berkembang pesat di seluruh Asia Tenggara.','Pada abad ke 21, teknologi informasi berkembang pesat di seluruh Asia Tenggara.','Pada Abad ke-21 teknologi informasi berkembang pesat di seluruh asia tenggara.','Pada abad ke-21 teknologi-informasi berkembang pesat di seluruh Asia Tenggara.'],a:1,b:'"Abad ke-21" memakai tanda hubung, koma setelah keterangan pembuka, dan nama geografi <b>Asia Tenggara</b> tanpa tanda hubung.'},
{s:'pbm',lv:6,t:'Kalimat rumpang · Logika',q:'"Kebijakan pembatasan kendaraan ganjil-genap berhasil mengurangi kemacetan pada bulan-bulan awal. ___ Banyak warga membeli kendaraan kedua dengan pelat nomor berbeda, sehingga jumlah kendaraan di jalan kembali meningkat."<br>Kalimat yang paling tepat untuk mengisi bagian rumpang adalah …',o:['Karena itu, kebijakan ini harus diperluas ke seluruh kota.','Namun, efek tersebut tidak bertahan lama.','Selain itu, polusi udara juga berkurang.','Kendaraan pribadi memang sangat dibutuhkan.','Warga sangat mendukung kebijakan itu.'],a:1,b:'Kalimat sesudahnya menjelaskan mengapa efek awal memudar. Jembatan yang tepat: <b>Namun, efek tersebut tidak bertahan lama.</b>'},
{s:'pbm',lv:6,t:'Penalaran · Kesalahan logika',q:'"Setelah kepala desa baru dilantik, angka pencurian menurun. Jadi, kepala desa baru itulah yang membuat desa lebih aman."<br>Kelemahan utama penalaran tersebut adalah …',o:['Tidak menyebut nama kepala desa.','Menganggap peristiwa yang terjadi sesudahnya pasti disebabkan oleh peristiwa sebelumnya.','Angka pencurian tidak boleh dihitung.','Kalimatnya tidak efektif.','Kepala desa tidak berwenang mengurus keamanan.'],a:1,b:'Ini kesalahan "post hoc": karena B terjadi setelah A, A dianggap penyebab B. Padahal bisa ada faktor lain, misalnya musim panen atau patroli polisi.'},
{s:'pbm',lv:6,t:'Kohesi · Kata rujukan',q:'"Dua metode diuji: metode hafalan dan metode latihan soal. Siswa yang memakai metode kedua mendapat nilai lebih tinggi. Namun, keunggulan <b>itu</b> hanya terlihat pada tes yang diadakan seminggu kemudian."<br>Kata "itu" merujuk pada …',o:['metode hafalan','keunggulan nilai siswa yang memakai metode latihan soal','tes seminggu kemudian','dua metode','siswa'],a:1,b:'"Keunggulan itu" merujuk pada hasil di kalimat sebelumnya: siswa dengan metode latihan soal mendapat nilai lebih tinggi.'},
{s:'pbm',lv:6,t:'Urutan paragraf',q:'(1) Hasilnya mengejutkan: kelompok yang tidur memiliki ingatan 40% lebih baik. (2) Peneliti meminta dua kelompok menghafal daftar kata. (3) Temuan ini mendukung dugaan bahwa tidur membantu otak menyimpan ingatan. (4) Satu kelompok kemudian tidur, sedangkan kelompok lain tetap terjaga, sebelum diuji kembali.<br>Urutan yang padu adalah …',o:['2-4-1-3','2-1-4-3','4-2-1-3','2-4-3-1','1-2-4-3'],a:0,b:'Prosedur (2) → perlakuan (4) → hasil (1) → simpulan (3): <b>2-4-1-3</b>.'},
{s:'pbm',lv:6,t:'Diksi · Kata bersinonim',q:'"Pemerintah berupaya ___ kesenjangan antara desa dan kota."<br>Kata yang paling tepat adalah …',o:['memperkecil','mengecilkan diri','meminimkan','menyempitkan diri','mengurang'],a:0,b:'Kolokasi yang lazim: <b>memperkecil/mempersempit kesenjangan</b>. "Meminimkan" kurang tepat bentuknya (bentuk baku: meminimalkan).'},
{s:'pbm',lv:6,t:'Ejaan · Kata serapan',q:'Kelompok kata serapan yang penulisannya benar adalah …',o:['praktik, sistem, analisis, risiko','praktek, sistim, analisa, resiko','praktik, sistim, analisis, risiko','praktek, sistem, analisis, risiko','praktik, sistem, analisa, resiko'],a:0,b:'Bentuk baku: <b>praktik, sistem, analisis, risiko</b>.'},
{s:'pbm',lv:6,t:'Kalimat efektif · Penghilangan subjek',q:'"Setelah membaca surat itu, wajah Ibu langsung pucat."<br>Masalah utama kalimat tersebut adalah …',o:['tanda baca salah','pelaku anak kalimat (yang membaca) tidak sama dengan subjek induk kalimat (wajah Ibu)','kata "langsung" tidak baku','tidak memiliki predikat','terlalu pendek'],a:1,b:'Yang membaca surat adalah Ibu, tetapi subjek induk kalimatnya "wajah Ibu". Seolah-olah wajahlah yang membaca. Perbaikan: "Setelah membaca surat itu, Ibu langsung pucat."'},
{s:'pbm',lv:6,t:'Simpulan',q:'"Kota A menambah jalur sepeda sepanjang 50 km dalam dua tahun. Selama periode itu, jumlah pesepeda naik tiga kali lipat. Namun, angka kecelakaan sepeda juga naik, terutama di persimpangan yang belum dilengkapi lampu khusus sepeda."<br>Simpulan yang paling tepat adalah …',o:['Jalur sepeda berbahaya dan harus dihapus.','Penambahan jalur sepeda meningkatkan minat bersepeda, tetapi keselamatan di persimpangan perlu diperbaiki.','Pesepeda tidak menaati aturan.','Lampu lalu lintas tidak berguna.','Kecelakaan sepeda turun drastis.'],a:1,b:'Paragraf memuat dampak positif (pesepeda naik) dan masalah spesifik (kecelakaan di persimpangan tanpa lampu khusus). Simpulan harus mencakup keduanya.'},
{s:'pbm',lv:6,t:'Konjungsi · Hubungan makna',q:'"Ia tetap tersenyum ___ hatinya sedang sedih."<br>Konjungsi yang tepat adalah …',o:['karena','padahal','sehingga','agar','lalu'],a:1,b:'Kenyataan (sedih) bertentangan dengan yang tampak (tersenyum). Konjungsi yang tepat: <b>padahal</b>.'},
{s:'pbm',lv:6,t:'Ejaan · Huruf kapital',q:'Kalimat yang penggunaan huruf kapitalnya tepat adalah …',o:['Kami menyanyikan lagu Indonesia raya.','Ia membaca buku <i>Laskar Pelangi</i> karya andrea hirata.','Kakek berasal dari suku Jawa dan fasih berbahasa Jawa.','Ia lulusan Sekolah Menengah Atas.','Kami merayakan hari Kemerdekaan.'],a:2,b:'Nama suku dan bahasa ditulis kapital: <b>suku Jawa</b>, <b>bahasa Jawa</b> (kata "suku" dan "bahasa" tetap kecil). Opsi lain: Indonesia Raya, Andrea Hirata, sekolah menengah atas (bukan nama diri), Hari Kemerdekaan.'},
{s:'pbm',lv:6,t:'Kalimat efektif · Penalaran',q:'Kalimat yang TIDAK mengandung kesalahan nalar adalah …',o:['Semua orang yang memakai kacamata pasti pintar.','Karena tidak sarapan, ia pasti gagal ujian.','Jumlah penonton menurun setelah harga tiket naik, sehingga harga tiket kemungkinan berpengaruh terhadap jumlah penonton.','Ia orang kaya, jadi pasti tidak pernah berutang.','Semua politikus pembohong.'],a:2,b:'Kalimat itu memakai kata "kemungkinan", jadi tidak menyimpulkan secara mutlak. Opsi lain menggeneralisasi berlebihan.'},
{s:'pbm',lv:6,t:'Paragraf · Kalimat utama',q:'"(1) Petani di lereng gunung beralih menanam kopi. (2) Harga sayur yang mereka tanam sebelumnya sering anjlok saat panen raya. (3) Kopi juga lebih tahan disimpan sehingga petani bisa menjual saat harga bagus. (4) Selain itu, akar pohon kopi membantu menahan tanah dari longsor."<br>Kalimat utama paragraf tersebut adalah …',o:['(1)','(2)','(3)','(4)','(2) dan (3)'],a:0,b:'Kalimat (1) menyatakan peristiwa umum; kalimat (2)–(4) menjelaskan alasan peralihan itu. Kalimat utamanya <b>(1)</b>.'},
{s:'pbm',lv:6,t:'Ejaan · Tanda baca',q:'Kalimat yang penggunaan tanda bacanya tepat adalah …',o:['"Apakah kamu sudah makan?" tanya Ibu.','"Apakah kamu sudah makan?", tanya Ibu.','"Apakah kamu sudah makan", tanya Ibu?','"Apakah kamu sudah makan." tanya Ibu.','Apakah kamu sudah makan? "tanya Ibu."'],a:0,b:'Tanda tanya diletakkan di dalam tanda petik dan tidak diikuti koma: <b>"Apakah kamu sudah makan?" tanya Ibu.</b>'},
{s:'pbm',lv:6,t:'Kalimat rumpang · Kohesi',q:'"Banyak orang mengira kelelawar buta. ___ Sebagian besar kelelawar dapat melihat, dan beberapa jenis bahkan memiliki penglihatan yang tajam. Mereka menggunakan ekolokasi sebagai tambahan, terutama saat berburu di kegelapan."<br>Kalimat yang tepat untuk mengisi bagian rumpang adalah …',o:['Kelelawar memang tidak bisa melihat.','Anggapan ini keliru.','Kelelawar adalah mamalia.','Kelelawar hanya aktif di siang hari.','Oleh karena itu, kelelawar tidak berbahaya.'],a:1,b:'Kalimat sesudahnya membantah anggapan awal. Jembatannya: <b>Anggapan ini keliru.</b>'},
{s:'pbm',lv:6,t:'Diksi · Bentuk kata',q:'Kalimat yang menggunakan bentuk kata yang tepat adalah …',o:['Panitia mengkoordinir acara dengan rapi.','Ia menyolok perhatian dengan bajunya.','Kami mengubah jadwal karena hujan.','Pemerintah merubah aturan pajak.','Ia mempesona penonton.'],a:2,b:'Bentuk baku: <b>mengubah</b> (bukan merubah), mengoordinasi, mencolok, memesona.'},
{s:'pbm',lv:6,t:'Penyuntingan · Kalimat sumbang',q:'(1) Ekonomi sirkular bertujuan menjaga nilai barang selama mungkin. (2) Barang dirancang agar mudah diperbaiki dan didaur ulang. (3) Limbah satu industri dapat menjadi bahan baku industri lain. (4) Indonesia memiliki ribuan pulau dengan potensi wisata bahari. (5) Dengan begitu, kebutuhan bahan baku baru dapat ditekan.<br>Kalimat yang tidak padu adalah …',o:['(1)','(2)','(3)','(4)','(5)'],a:3,b:'Semua kalimat membahas ekonomi sirkular, kecuali <b>(4)</b> tentang potensi wisata bahari.'},
{s:'pbm',lv:6,t:'Kalimat efektif · Kehematan',q:'"Ia memasuki ke dalam ruangan dengan tergesa-gesa."<br>Perbaikan yang tepat adalah …',o:['Ia memasuki ruangan dengan tergesa-gesa.','Ia masuk ke dalam ruangan dengan tergesa-gesa sekali.','Ia memasuki ke ruangan dengan tergesa-gesa.','Ia dengan tergesa-gesa memasuki ke dalam ruangan.','Ia memasukkan ruangan dengan tergesa-gesa.'],a:0,b:'"Memasuki" sudah transitif dan langsung diikuti objek. "Ke dalam" mubazir: <b>Ia memasuki ruangan dengan tergesa-gesa.</b> Alternatif lain yang benar: "Ia masuk ke ruangan…"'},

{s:'lbi',lv:6,p:'a2i1',t:'Gagasan utama',q:'Gagasan utama teks tersebut adalah …',o:['Toko sebaiknya hanya menjual enam varian produk.','Terlalu banyak pilihan dapat menghambat keputusan dan kepuasan, meski efeknya bergantung pada kondisi tertentu.','Orang selalu lebih bahagia dengan pilihan sedikit.','Selai adalah produk yang sulit dijual.','Penelitian psikologi tidak dapat dipercaya.'],a:1,b:'Paragraf 1–2 menjelaskan paradoks pilihan; kalimat terakhir menambahkan batasannya. Gagasan utama harus mencakup keduanya.'},
{s:'lbi',lv:6,p:'a2i1',t:'Data & logika',q:'Informasi bahwa meja dengan 24 varian menarik lebih banyak orang untuk mampir berfungsi untuk …',o:['membuktikan bahwa banyak pilihan selalu buruk','menunjukkan bahwa daya tarik awal pilihan banyak tidak berujung pada keputusan membeli','menunjukkan bahwa enam varian tidak menarik','mengkritik percobaan itu','membuktikan bahwa orang suka mencicipi gratis'],a:1,b:'Informasi itu memperjelas kontras: banyak pilihan menarik perhatian, tetapi lebih sedikit yang akhirnya membeli.'},
{s:'lbi',lv:6,p:'a2i1',t:'Inferensi',q:'Berdasarkan teks, seseorang yang ingin membeli laptop dengan spesifikasi yang sudah ia tentukan secara rinci kemungkinan besar …',o:['akan sangat terbebani oleh banyaknya pilihan laptop','tidak terlalu terbebani oleh banyaknya pilihan','tidak akan membeli','akan menyesal apa pun pilihannya','akan memilih secara acak'],a:1,b:'Teks: ketika seseorang sudah tahu persis yang diinginkan, banyaknya pilihan tidak lagi membebani.'},
{s:'lbi',lv:6,p:'a2i1',t:'Penerapan',q:'Toko daring ingin mengurangi efek paradoks pilihan tanpa mengurangi jumlah produk. Saran yang paling sesuai dengan teks adalah …',o:['menghapus separuh produk','mengelompokkan produk dalam kategori yang jelas','menaikkan harga semua produk','menampilkan semua produk dalam satu halaman acak','menyembunyikan ulasan pembeli'],a:1,b:'Teks: ketika pilihan disusun dalam kategori yang jelas, jumlah yang banyak tidak lagi membebani.'},
{s:'lbi',lv:6,p:'a2i1',t:'Makna kata',q:'Kata <b>paradoks</b> dalam teks paling dekat maknanya dengan …',o:['kebiasaan umum','hal yang tampak bertentangan dengan dugaan umum','penelitian lanjutan','kesalahan perhitungan','hukum ekonomi'],a:1,b:'Paradoks = pernyataan atau kenyataan yang tampak <b>bertentangan dengan anggapan umum</b>. Di sini, lebih banyak pilihan justru tidak membuat bahagia.'},
{s:'lbi',lv:6,p:'a2i2',t:'Argumen utama',q:'Argumen utama penulis adalah …',o:['Kota lebih baik daripada desa.','Urbanisasi sering merupakan strategi keluarga untuk menyebar risiko, sehingga kebijakan perlu menyentuh kebutuhan pendapatan keluarga.','Infrastruktur desa tidak perlu dibangun.','Semua penduduk desa ingin pindah ke kota.','Upah di kota terlalu tinggi.'],a:1,b:'Penulis menambahkan sudut pandang "strategi keluarga" dan menarik implikasi kebijakan dari situ.'},
{s:'lbi',lv:6,p:'a2i2',t:'Sikap penulis',q:'Sikap penulis terhadap penjelasan "daya tarik kota dan daya dorong desa" adalah …',o:['menolak sepenuhnya','menganggapnya benar, tetapi belum lengkap','menganggapnya satu-satunya penjelasan','tidak peduli','mengejeknya'],a:1,b:'Kalimat kunci: "Penjelasan ini benar, tetapi tidak lengkap."'},
{s:'lbi',lv:6,p:'a2i2',t:'Makna istilah',q:'Kata <b>penyangga</b> dalam teks bermakna …',o:['tiang bangunan','sumber cadangan yang menahan dampak buruk','pajak tambahan','pinjaman bank','hasil panen'],a:1,b:'Kiriman uang berfungsi sebagai <b>penahan dampak</b> saat panen gagal.'},
{s:'lbi',lv:6,p:'a2i2',t:'Implikasi',q:'Menurut teks, mengapa kebijakan yang hanya membangun infrastruktur desa bisa kurang efektif?',o:['karena infrastruktur selalu rusak','karena tidak menyentuh kebutuhan keluarga akan pendapatan yang stabil dan beragam','karena warga desa tidak memakai jalan','karena biaya terlalu murah','karena kota menolak'],a:1,b:'Kalimat terakhir menyebut alasan itu secara langsung.'},
{s:'lbi',lv:6,p:'a2i2',t:'Memperkuat',q:'Data berikut yang paling MEMPERKUAT argumen penulis adalah …',o:['Upah di kota rata-rata dua kali upah di desa.','Keluarga yang memiliki anggota perantau lebih jarang menjual lahan ketika panen gagal.','Jalan desa banyak yang rusak.','Banyak perantau tinggal di rumah kontrakan.','Jumlah penduduk kota bertambah setiap tahun.'],a:1,b:'Data itu menunjukkan kiriman perantau benar-benar menjadi "penyangga" risiko keluarga, sesuai argumen strategi keluarga.'},
{s:'lbi',lv:6,p:'a2i3',t:'Alasan ekonom',q:'Menurut teks, ekonom menyukai pajak karbon karena …',o:['menghasilkan penerimaan negara terbesar','pasar dapat menemukan cara termurah mengurangi emisi tanpa pemerintah mengatur setiap teknologi','langsung menghapus emisi','tidak berdampak pada harga','hanya dikenakan pada rumah tangga'],a:1,b:'Teks menyebut alasan itu di akhir paragraf pertama.'},
{s:'lbi',lv:6,p:'a2i3',t:'Inferensi',q:'Mengapa pajak karbon terasa lebih berat bagi rumah tangga berpenghasilan rendah?',o:['karena mereka membayar tarif pajak lebih tinggi','karena porsi pengeluaran mereka untuk energi lebih besar dibandingkan penghasilannya','karena mereka tidak memakai energi','karena mereka tinggal di kota','karena mereka memiliki mobil lebih banyak'],a:1,b:'Teks menyebut porsi pengeluaran energi mereka lebih besar, sehingga kenaikan harga lebih terasa.'},
{s:'lbi',lv:6,p:'a2i3',t:'Solusi',q:'Cara beberapa negara mengatasi masalah keadilan dari pajak karbon adalah …',o:['membebaskan industri dari pajak','mengembalikan penerimaan pajak kepada masyarakat dalam bentuk transfer tunai','menurunkan tarif hingga nol','melarang energi fosil','menaikkan harga listrik'],a:1,b:'Teks menyebut pengembalian penerimaan pajak melalui transfer tunai.'},
{s:'lbi',lv:6,p:'a2i3',t:'Dilema',q:'Dilema penetapan tarif pajak karbon yang tersirat dalam teks adalah …',o:['tarif tinggi tidak mungkin diterapkan','tarif terlalu tinggi membebani rumah tangga miskin, tetapi tarif terlalu rendah melemahkan insentif beralih ke energi bersih','tarif rendah merugikan negara','tarif tidak berpengaruh apa pun','tarif harus sama di semua negara'],a:1,b:'Paragraf kedua menyebut dua sisi: dampak berat bagi warga miskin dan insentif lemah bila tarif terlalu rendah.'},
{s:'lbi',lv:6,p:'a2i3',t:'Makna frasa',q:'Frasa "hanya menjadi sumber penerimaan negara" mengandung makna bahwa kebijakan itu …',o:['sangat berhasil','kehilangan tujuan utamanya menurunkan emisi','harus dihapus','mengurangi utang negara','menguntungkan rakyat miskin'],a:1,b:'Kata "hanya" menunjukkan kebijakan gagal mencapai tujuan utama (mengurangi emisi) dan sekadar menambah pemasukan.'},
{s:'lbi',lv:6,p:'a2i4',t:'Tesis',q:'Pendapat utama para linguis dalam teks adalah …',o:['bahasa gaul harus dilarang','perubahan bahasa itu alami, dan yang penting adalah kemampuan menyesuaikan ragam bahasa dengan situasi','bahasa baku tidak diperlukan lagi','semua kata baru otomatis menjadi baku','bahasa Indonesia sedang rusak'],a:1,b:'Linguis menyebut perubahan alamiah dan menekankan kemampuan berganti ragam.'},
{s:'lbi',lv:6,p:'a2i4',t:'Fungsi kalimat',q:'Kalimat "Banyak kata yang kini baku dulunya dianggap tidak resmi atau pinjaman asing" berfungsi untuk …',o:['menolak semua kata asing','memberi bukti bahwa perubahan bahasa adalah hal yang wajar','mengkritik kamus','menunjukkan bahasa Indonesia miskin kosakata','menyarankan kembali ke bahasa lama'],a:1,b:'Kalimat itu adalah contoh historis yang mendukung klaim bahwa perubahan bahasa alamiah.'},
{s:'lbi',lv:6,p:'a2i4',t:'Inferensi',q:'Menurut teks, siapa yang menunjukkan kecakapan berbahasa paling tinggi?',o:['orang yang hanya memakai bahasa baku di semua situasi','orang yang hanya memakai bahasa gaul','orang yang mampu memakai bahasa gaul dengan teman dan bahasa baku dalam surat lamaran','orang yang menolak kata baru','orang yang menguasai banyak bahasa asing'],a:2,b:'Teks memberi contoh itu secara langsung sebagai "kecakapan berbahasa yang tinggi".'},
{s:'lbi',lv:6,p:'a2i4',t:'Masalah',q:'Menurut teks, masalah baru muncul jika …',o:['ada kata gaul baru','penutur hanya menguasai satu ragam dan tidak mampu menyesuaikan dengan konteks formal','bahasa baku berubah','media sosial ditutup','linguis tidak setuju'],a:1,b:'Kalimat terakhir menyebut masalah itu.'},
{s:'lbi',lv:6,p:'a2i4',t:'Makna istilah',q:'Istilah <b>ragam bahasa</b> dalam teks bermakna …',o:['jumlah bahasa daerah','variasi pemakaian bahasa sesuai situasi, misalnya resmi dan santai','bahasa asing','tata bahasa','kamus'],a:1,b:'Ragam bahasa = <b>variasi bahasa</b> berdasarkan situasi pemakaian, seperti ragam baku dan ragam santai.'},
{s:'lbi',lv:6,p:'a2i5',t:'Gagasan utama',q:'Pernyataan "yang berbahaya bukan gempanya, melainkan bangunannya" bermakna …',o:['gempa tidak pernah berbahaya','korban gempa sebagian besar disebabkan oleh bangunan yang runtuh','bangunan menyebabkan gempa','gempa hanya terjadi di kota','semua bangunan pasti runtuh'],a:1,b:'Kalimat sebelumnya menjelaskan bahwa korban terbanyak berasal dari bangunan runtuh.'},
{s:'lbi',lv:6,p:'a2i5',t:'Prinsip',q:'Prinsip utama bangunan tahan gempa menurut teks adalah …',o:['bahan bangunan yang mahal','sambungan kuat antara fondasi, kolom, balok, dan atap sehingga bangunan bergerak sebagai satu kesatuan','tembok yang tebal','bangunan bertingkat rendah','atap dari genteng'],a:1,b:'Teks menyebut prinsip itu secara langsung.'},
{s:'lbi',lv:6,p:'a2i5',t:'Makna kata',q:'Kata <b>ironisnya</b> dalam teks digunakan untuk menunjukkan bahwa …',o:['rumah kayu lebih mahal','kenyataan berlawanan dengan dugaan: rumah tradisional kayu justru lebih tahan daripada sebagian rumah tembok','rumah kayu mudah terbakar','semua rumah tembok runtuh','penulis tidak suka rumah kayu'],a:1,b:'Orang umumnya mengira tembok lebih kuat. Kenyataannya, sebagian rumah kayu lebih tahan karena lentur.'},
{s:'lbi',lv:6,p:'a2i5',t:'Sebab',q:'Penyebab rendahnya penerapan pedoman rumah tahan gempa menurut teks adalah …',o:['pedoman belum diterbitkan','hampir tidak ada pengawasan pembangunan rumah pribadi','bahan bangunan langka','warga menolak gempa','tukang tidak mau bekerja'],a:1,b:'Kalimat terakhir menyebut alasannya.'},
{s:'lbi',lv:6,p:'a2i5',t:'Inferensi',q:'Dari teks dapat disimpulkan bahwa banyak rumah tembok yang runtuh saat gempa sebenarnya dapat diselamatkan dengan …',o:['mengganti semua tembok dengan kayu','memastikan tulangan besi terhubung dengan benar','membangun di lokasi lain','menambah jumlah lantai','memakai cat tahan air'],a:1,b:'Teks: banyak rumah runtuh bukan karena bahannya lemah, tetapi karena tulangan besi tidak terhubung dengan benar.'},
{s:'lbi',lv:6,p:'a2i6',t:'Masalah',q:'Menurut teks, akibat sikap sekolah yang menghindari kesalahan adalah …',o:['siswa menjadi lebih kreatif','siswa memilih tugas aman dan enggan mencoba hal menantang','nilai siswa naik','guru lebih sabar','siswa lebih sering bertanya'],a:1,b:'Paragraf pertama menyebut akibat itu.'},
{s:'lbi',lv:6,p:'a2i6',t:'Temuan',q:'Menurut penelitian dalam teks, kapan kesalahan dapat memperkuat ingatan?',o:['selalu, dalam kondisi apa pun','jika diikuti umpan balik yang tepat','jika siswa ditertawakan','jika siswa tidak diberi tahu jawabannya','jika dilakukan berulang kali tanpa koreksi'],a:1,b:'Teks: kesalahan memperkuat ingatan jika diikuti umpan balik yang tepat.'},

{s:'lbe',lv:6,p:'a2e1',t:'Definition',q:'Confirmation bias is the tendency to …',o:['change our beliefs easily','favor information that supports what we already believe','forget information quickly','trust experts completely','avoid making decisions'],a:1,b:'Kalimat pertama mendefinisikannya.'},
